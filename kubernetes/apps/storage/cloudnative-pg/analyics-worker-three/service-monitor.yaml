---
# ServiceMonitor for PostgreSQL Instances
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: cloudnative-pg-analytics-worker-three
  namespace: storage
  labels:
    citus-cluster: cloudnative-pg-analytics-worker-three
    app.kubernetes.io/name: cloudnative-pg-analytics-worker-three
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: cloudnative-pg-analytics-worker-three
    monitoring: prometheus
    environment: production
  annotations:
    prometheus.io/scrape: "true"
    monitoring.cnpg.io/cluster: "cloudnative-pg-analytics-worker-three"
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: cloudnative-pg-analytics-worker-three
      
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
      path: /metrics
      scheme: http
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
          targetLabel: cluster
        - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_instanceRole]
          targetLabel: role
        - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_podRole]
          targetLabel: pod_role
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
        - sourceLabels: [__meta_kubernetes_pod_ip]
          targetLabel: pod_ip
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: 'pg_.*|postgres_.*|cnpg_.*'
          action: keep
        - targetLabel: environment
          replacement: production
        - targetLabel: tier
          replacement: database
  namespaceSelector:
    matchNames:
      - storage