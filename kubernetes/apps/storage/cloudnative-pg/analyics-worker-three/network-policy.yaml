---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-network-policy
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: network-security
    app.kubernetes.io/part-of: postgresql
    environment: production
    security-level: strict
  annotations:
    network-policy.kubernetes.io/type: "zero-trust"
    security.cnpg.io/policy-version: "v1.2"
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgres
  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/allowed-postgres-access: "true"
        - podSelector:
            matchLabels:
              app.kubernetes.io/database-client: "true"
      ports:
        - protocol: TCP
          port: 5432

    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9187  
        - protocol: TCP
          port: 8000  

    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgres
      ports:
        - protocol: TCP
          port: 5432

    - from: []
      ports:
        - protocol: TCP
          port: 8000  

    - from:
        - namespaceSelector:
            matchLabels:
              name: backup
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backup
      ports:
        - protocol: TCP
          port: 5432

  egress:
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    - to: []
      ports:
        - protocol: UDP
          port: 123

    - to: []
      ports:
        - protocol: TCP
          port: 443  
        - protocol: TCP
          port: 80   
      namespaceSelector: {}

    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgres
      ports:
        - protocol: TCP
          port: 5432

    - to: []
      ports:
        - protocol: TCP
          port: 6443  
        - protocol: TCP
          port: 443   

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cloudnative-pg-operator-network-policy
  namespace: storage
  labels:
    app.kubernetes.io/name: cloudnative-pg
    app.kubernetes.io/component: operator-security
    app.kubernetes.io/part-of: postgresql
    environment: production
    security-level: strict
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cloudnative-pg
  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from: []
      ports:
        - protocol: TCP
          port: 9443  

    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 8080  

    - from: []
      ports:
        - protocol: TCP
          port: 8081  

  egress:
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    - to: []
      ports:
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 443

    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgres
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8000

    - to: []
      ports:
        - protocol: TCP
          port: 443

---
