        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgres
      ports:
        - protocol: TCP
          port: 5432

    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
