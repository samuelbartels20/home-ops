---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: storage
  labels:
    app.kubernetes.io/name: security-baseline
    app.kubernetes.io/component: network-security
    security-policy: default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-client-access-policy
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql-client-access
    app.kubernetes.io/component: client-security
    app.kubernetes.io/part-of: postgresql
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/database-client: "true"
  policyTypes:
    - Egress

  egress:
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    - to:
        - namespaceSelector:
            matchLabels:
              name: storage
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgres
      ports:
        - protocol: TCP
          port: 5432

    - to: []
      ports:
        - protocol: TCP
          port: 443

