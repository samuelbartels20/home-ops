---
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: postgres-vector-pooler
  namespace: storage
  labels:
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/component: connection-pooler
    app.kubernetes.io/part-of: postgresql
    environment: production
    tier: database
  annotations:
    pooler.cnpg.io/type: "pgbouncer"
    pooler.cnpg.io/mode: "transaction"
    pooler.cnpg.io/pool-size: "performance"
spec:
  cluster:
    name: postgres-vector
  instances: 3
  type: rw

  pgbouncer:
    poolMode: transaction
    maxClientConn: 1000
    defaultPoolSize: 25
    minPoolSize: 5
    reservePoolSize: 5
    maxDbConnections: 100
    maxUserConnections: 100

    serverResetQuery: "DISCARD ALL"
    serverCheckDelay: 30
    serverCheckQuery: "SELECT 1"
    serverLifetime: 3600
    serverIdleTimeout: 600
    clientLoginTimeout: 60

    authType: scram-sha-256
    authHbaFile: |
      # TYPE  DATABASE    USER        ADDRESS         METHOD
      host    all         all         0.0.0.0/0       scram-sha-256
      host    all         all         ::/0            scram-sha-256

    authUser: pgbouncer
    authQuery: "SELECT usename, passwd FROM pg_shadow WHERE usename=$1"

    tcpKeepalive: true
    tcpKeepaliveIdle: 600
    tcpKeepaliveInterval: 30
    tcpKeepaliveCount: 3
    tcpUserTimeout: 30000

    queryTimeout: 0
    queryWaitTimeout: 120
    cancelDelay: 10

    logConnections: true
    logDisconnections: true
    logPoolerErrors: true

    adminUsers: "pgbouncer,postgres"
    statsUsers: "pgbouncer,postgres"

    databases:
      postgres:
        host: postgres-vector-rw.storage.svc.cluster.local
        port: 5432
        dbname: postgres
        pool_size: 25
        reserve_pool: 5
        max_db_connections: 50

      application_db:
        host: postgres-vector-rw.storage.svc.cluster.local
        port: 5432
        dbname: postgres
        pool_size: 30
        reserve_pool: 5
        max_db_connections: 60

  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgbouncer
        app.kubernetes.io/component: connection-pooler
        monitoring: enabled
        backup: not-required
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9127"
        prometheus.io/path: "/metrics"
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: pgbouncer
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: 2000m
              memory: 2Gi
              ephemeral-storage: 2Gi

      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: pgbouncer
                  cnpg.io/pooler: postgres-vector-pooler
              topologyKey: kubernetes.io/hostname

      priorityClassName: system-cluster-critical

  serviceTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: pgbouncer
        app.kubernetes.io/component: connection-pooler
        service-type: database-pooler
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9127"
        prometheus.io/path: "/metrics"
    spec:
      type: LoadBalancer
      sessionAffinity: ClientIP
      sessionAffinityConfig:
        clientIP:
          timeoutSeconds: 10800
      ports:
        - name: postgresql
          port: 5432
          targetPort: 5432
          protocol: TCP
        - name: metrics
          port: 9127
          targetPort: 9127
          protocol: TCP