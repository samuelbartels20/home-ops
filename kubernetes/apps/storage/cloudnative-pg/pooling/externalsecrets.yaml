---
# PgBouncer Secrets
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pgbouncer-secrets
  labels:
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/component: connection-pooler
    app.kubernetes.io/part-of: postgresql
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: pgbouncer-secrets
    creationPolicy: Owner
  data:
    - secretKey: POSTGRES_USER
      remoteRef:
        key: pgbouncer-secrets
        property: POSTGRES_USER
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: pgbouncer-secrets
        property: POSTGRES_PASSWORD
    - secretKey: PGBOUNCER_AUTH_PASSWORD
      remoteRef:
        key: pgbouncer-secrets
        property: PGBOUNCER_AUTH_PASSWORD
    - secretKey: PGBOUNCER_ADMIN_PASSWORD
      remoteRef:
        key: pgbouncer-secrets
        property: PGBOUNCER_ADMIN_PASSWORD
    - secretKey: PGBOUNCER_STATS_PASSWORD
      remoteRef:
        key: pgbouncer-secrets
        property: PGBOUNCER_STATS_PASSWORD

---
# PgBouncer Admin Secret
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pgbouncer-admin-secret
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: postgresql
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: pgbouncer-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: PGBOUNCER_ADMIN_PASSWORD
      remoteRef:
        key: pgbouncer-admin-secret
        property: PGBOUNCER_ADMIN_PASSWORD