---
# Connection pooling configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-pooling-config
  namespace: storage
data:
  pgbouncer.ini: |
    [databases]
    * = host=pg-cluster-rw port=5432

    [pgbouncer]
    pool_mode = transaction
    max_client_conn = 500
    default_pool_size = 20
    min_pool_size = 10
    reserve_pool_size = 5
    max_db_connections = 50
    max_user_connections = 100

    # TCP settings
    tcp_keepalive = 1
    tcp_keepidle = 60
    tcp_keepintvl = 30

    # Logging
    log_connections = 1
    log_disconnections = 1
    log_pooler_errors = 1

    # Stats
    stats_period = 60

# Multi-tenant configuration for performance isolation
tenant-config.ini: |
  # High priority tenants
  [tenant:priority-high]
  pool_size = 50
  max_db_connections = 200
  reserve_pool_size = 10
  query_timeout = 30000

  # Standard tenants
  [tenant:priority-standard]
  pool_size = 25
  max_db_connections = 100
  reserve_pool_size = 5
  query_timeout = 60000

  # Low priority tenants
  [tenant:priority-low]
  pool_size = 10
  max_db_connections = 50
  reserve_pool_size = 2
  query_timeout = 120000