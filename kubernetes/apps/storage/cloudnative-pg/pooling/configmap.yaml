---
# PgBouncer Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: storage
  labels:
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: postgresql
data:
  pgbouncer.ini: |
    [databases]
    postgres = host=192.168.8.101 port=5432 dbname=postgres pool_size=25 reserve_pool=5
    application_db = host=192.168.8.101 port=5432 dbname=postgres pool_size=30 reserve_pool=5 max_db_connections=50
    * = host=192.168.8.101 port=5432

    [pgbouncer]
    # Network settings
    listen_addr = 0.0.0.0
    listen_port = 5432
    unix_socket_dir = /var/run/postgresql

    # Authentication
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/secrets/userlist.txt
    auth_user = authenticator
    auth_query = SELECT username, password FROM pgbouncer.get_auth($1)

    # Connection limits
    max_client_conn = 10000
    default_pool_size = 25
    min_pool_size = 10
    reserve_pool_size = 5
    reserve_pool_timeout = 5
    max_db_connections = 100
    max_user_connections = 100

    # Pool configuration
    pool_mode = transaction
    server_reset_query = DISCARD ALL
    server_reset_query_always = 0
    server_check_delay = 30
    server_check_query = select 1
    server_lifetime = 3600
    server_idle_timeout = 600
    server_connect_timeout = 15
    server_login_retry = 15

    # Client configuration
    client_login_timeout = 60
    autodb_idle_timeout = 3600
    client_idle_timeout = 0

    # TCP settings for high performance
    tcp_defer_accept = 1
    tcp_socket_buffer = 0
    tcp_keepalive = 1
    tcp_keepcnt = 3
    tcp_keepidle = 600
    tcp_keepintvl = 30
    tcp_user_timeout = 30000

    # DNS settings
    dns_max_ttl = 15
    dns_nxdomain_ttl = 15
    dns_zone_check_period = 0

    # Logging
    log_connections = 1
    log_disconnections = 1
    log_pooler_errors = 1
    log_stats = 1
    stats_period = 60

    # Performance optimization
    so_reuseport = 1
    server_round_robin = 1
    query_timeout = 0
    query_wait_timeout = 120
    cancel_wait_timeout = 10
    idle_transaction_timeout = 0

    # Admin interface
    admin_users = pgbouncer,postgres,pgbouncer_admin
    stats_users = pgbouncer,postgres,pgbouncer_stats

    # Application name tracking
    ignore_startup_parameters = extra_float_digits,geqo,search_path
    application_name_add_host = 1

    # Extra from File One
    pkt_buf = 4096
    listen_backlog = 128
    sbuf_loopcnt = 5
    suspend_timeout = 10
    max_packet_size = 2147483647

  # Multi-tenant configuration for performance isolation
  tenant-config.ini: |
    # High priority tenants
    [tenant:priority-high]
    pool_size = 50
    max_db_connections = 200
    reserve_pool_size = 10
    query_timeout = 30000

    # Standard tenants
    [tenant:priority-standard]
    pool_size = 25
    max_db_connections = 100
    reserve_pool_size = 5
    query_timeout = 60000

    # Low priority tenants
    [tenant:priority-low]
    pool_size = 10
    max_db_connections = 50
    reserve_pool_size = 2
    query_timeout = 120000
