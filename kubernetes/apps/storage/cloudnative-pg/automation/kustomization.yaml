---
# Deployment automation configuration
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: storage
resources:
  - helmrelease.yaml
  - configmap.yaml
  - rbac.yaml
  - service.yaml
  - cronjob.yaml
commonLabels:
  app.kubernetes.io/name: postgresql
  app.kubernetes.io/part-of: postgresql
  automation-tier: standard
commonAnnotations:
  app.kubernetes.io/managed-by: kustomize

labels:
- pairs:
    app.kubernetes.io/name: pg-deployment
    app.kubernetes.io/instance: pg-deployment
    app.kubernetes.io/component: automation
    app.kubernetes.io/part-of: storage
- includeSelectors: true
  pairs:
    app.kubernetes.io/name: postgres-automation
    app.kubernetes.io/component: blue-green-automation
    app.kubernetes.io/part-of: postgresql
    automation-tier: standard