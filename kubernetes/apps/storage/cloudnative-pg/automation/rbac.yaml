---
# Service Account for Blue-Green Controller
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-blue-green-controller
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: postgresql
automountServiceAccountToken: true

---
# ClusterRole for Blue-Green Operations
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: postgres-blue-green-operator
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: postgresql
rules:
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups", "poolers", "scheduledbackups"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "endpoints", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create"]

---
# ClusterRoleBinding for Blue-Green Controller
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: postgres-blue-green-controller-binding
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: postgresql
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: postgres-blue-green-operator
subjects:
  - kind: ServiceAccount
    name: postgres-blue-green-controller
    namespace: storage

---
# Service Account for Migration Jobs
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-migration
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: postgresql
automountServiceAccountToken: true