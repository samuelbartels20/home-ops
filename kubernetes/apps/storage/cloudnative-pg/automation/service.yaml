---
# Service for PostgreSQL Database Access (Blue-Green Automation)
apiVersion: v1
kind: Service
metadata:
  name: postgres-automation
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: postgresql
    automation: blue-green
    environment: production
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    automation.cnpg.io/enabled: "true"
    automation.cnpg.io/strategy: "blue-green"
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    cnpg.io/cluster: "postgres"  # Initially points to main cluster