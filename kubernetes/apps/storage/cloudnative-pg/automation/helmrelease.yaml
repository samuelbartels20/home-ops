---
apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: pg-deployment
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: automation
    app.kubernetes.io/part-of: postgresql
    environment: production
    tier: automation
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 2.6.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    deployment:
      enabled: true
      replicas: 2
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxSurge: 1
          maxUnavailable: 0
    controllers:
      main:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          main:
            image:
              repository: bitnami/kubectl
              tag: "latest"
              pullPolicy: IfNotPresent

            command: ["/bin/bash", "-c"]
            args:
              - |
                apt-get update && apt-get install -y postgresql-client jq

                cp /scripts/blue-green-deploy.sh /usr/local/bin/
                chmod +x /usr/local/bin/blue-green-deploy.sh

                # Start controller service
                while true; do
                  echo "Blue-Green deployment controller running..."
                  echo "Use: kubectl exec deployment/postgres-blue-green-controller -- blue-green-deploy.sh [command]"
                  sleep 300
                done

            env:
              NAMESPACE: "storage"

            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              runAsNonRoot: true
              runAsUser: 1001
              runAsGroup: 1001
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault

        pod:
          labels:
            app.kubernetes.io/name: blue-green-controller
            app.kubernetes.io/component: automation
            monitoring: "true"

          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            fsGroup: 1001
            seccompProfile:
              type: RuntimeDefault

    serviceAccount:
      create: false
      name: postgres-blue-green-controller

    service:
      main:
        enabled: false

    persistence:
      deployment-scripts:
        type: configMap
        name: postgres-blue-green-config
        defaultMode: 0755
        globalMounts:
          - path: /scripts
            readOnly: true

    # Health checks
    probes:
      liveness:
        enabled: true
        custom: true
        spec:
          exec:
            command: ["kubectl", "version", "--client"]
          initialDelaySeconds: 30
          periodSeconds: 60

      readiness:
        enabled: true
        custom: true
        spec:
          exec:
            command: ["kubectl", "version", "--client"]
          initialDelaySeconds: 10
          periodSeconds: 30