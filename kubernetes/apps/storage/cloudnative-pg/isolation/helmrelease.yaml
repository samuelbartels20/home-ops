---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres-tenant-monitor
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: isolation
    app.kubernetes.io/part-of: postgresql
    environment: production
    tier: monitoring
spec:
  interval: 15m
  timeout: 10m
  chart:
    spec:
      chart: app-template
      version: 3.5.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
      interval: 15m
  install:
    createNamespace: false
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    timeout: 10m
    remediation:
      strategy: rollback
      retries: 3

  values:
    controllers:
      main:
        replicas: 2
        strategy: RollingUpdate

        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          main:
            image:
              repository: python
              tag: 3.11-slim
              pullPolicy: IfNotPresent

            command: ["python", "/app/tenant_monitor.py"]

            env:
              POSTGRES_HOST: "192.168.8.101"
              POSTGRES_PORT: "5432"
              POSTGRES_DB: "postgres"
              MONITOR_INTERVAL: "30"
              LOG_LEVEL: "INFO"

            envFrom:
              - secretRef:
                  name: cloudnative-pg-secret

            probes:
              liveness:
                enabled: true
                type: exec
                spec:
                  command: ["python", "-c", "import sys; sys.exit(0)"]
                  initialDelaySeconds: 30
                  periodSeconds: 60

              readiness:
                enabled: true
                type: exec
                spec:
                  command: ["python", "-c", "import sys; sys.exit(0)"]
                  initialDelaySeconds: 10
                  periodSeconds: 30

            resources:
              requests:
                cpu: 100m
                memory: 128Mi
              limits:
                cpu: 500m
                memory: 512Mi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              capabilities:
                drop:
                  - ALL
              seccompProfile:
                type: RuntimeDefault

        pod:
          labels:
            app.kubernetes.io/name: tenant-monitor
            app.kubernetes.io/component: isolation
            monitoring: "true"

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault

    persistence:
      monitor-script:
        enabled: true
        type: configMap
        name: tenant-monitor-script
        defaultMode: 0755
        globalMounts:
          - path: /app
            readOnly: true

    serviceAccount:
      create: false
      name: postgres-tenant-monitor