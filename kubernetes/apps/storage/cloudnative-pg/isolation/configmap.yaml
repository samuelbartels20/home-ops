---
# Multi-Tenant Resource Isolation for PostgreSQL
# Query priority queuing and tenant throttling system

apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-isolation
  namespace: storage
  labels:
    app.kubernetes.io/name: postgres-isolation
    app.kubernetes.io/component: resource-isolation
    app.kubernetes.io/part-of: postgresql
data:
  # PostgreSQL configuration for multi-tenant isolation
  postgresql-isolation.conf: |
    # Multi-tenant resource isolation settings

    # Connection management per tenant
    max_connections = 500
    superuser_reserved_connections = 10

    # Query execution isolation
    statement_timeout = '300s'  # Default timeout for all queries
    lock_timeout = '30s'        # Lock acquisition timeout
    idle_in_transaction_session_timeout = '60s'

    # Memory management per session
    work_mem = '16MB'           # Base memory per operation
    maintenance_work_mem = '256MB'
    temp_buffers = '32MB'

    # I/O throttling
    effective_io_concurrency = 200
    max_worker_processes = 16
    max_parallel_workers = 8
    max_parallel_workers_per_gather = 4
    max_parallel_maintenance_workers = 4

    # Query planner settings for isolation
    random_page_cost = 1.1
    effective_cache_size = '8GB'

    # Logging for monitoring tenant usage
    log_statement = 'mod'
    log_duration = on
    log_min_duration_statement = 1000  # Log queries > 1s
    log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

    # Track tenant resource usage
    track_activities = on
    track_counts = on
    track_io_timing = on
    track_functions = 'all'

    # Custom settings for tenant classification
    shared_preload_libraries = 'pg_stat_statements,auto_explain,pg_partman_bgw'
    pg_stat_statements.max = 10000
    pg_stat_statements.track = 'all'
    pg_stat_statements.track_utility = on
    pg_stat_statements.save = on

    # Auto explain for heavy queries
    auto_explain.log_min_duration = '5s'
    auto_explain.log_analyze = on
    auto_explain.log_buffers = on
    auto_explain.log_verbose = on
    auto_explain.log_format = 'json'

  # Tenant-specific resource limits
  tenant-limits.sql: |
    -- Multi-tenant resource management schema
    CREATE SCHEMA IF NOT EXISTS tenant_isolation;

    -- Tenant registry table
    CREATE TABLE IF NOT EXISTS tenant_isolation.tenants (
        tenant_id SERIAL PRIMARY KEY,
        tenant_name VARCHAR(100) UNIQUE NOT NULL,
        priority_level INTEGER DEFAULT 2, -- 1=high, 2=standard, 3=low
        max_connections INTEGER DEFAULT 50,
        max_cpu_percent NUMERIC(5,2) DEFAULT 25.0,
        max_memory_mb INTEGER DEFAULT 1024,
        max_io_ops_per_sec INTEGER DEFAULT 1000,
        query_timeout_seconds INTEGER DEFAULT 300,
        daily_query_limit INTEGER DEFAULT 100000,
        created_at TIMESTAMP DEFAULT NOW(),
        updated_at TIMESTAMP DEFAULT NOW()
    );

    -- Active sessions tracking
    CREATE TABLE IF NOT EXISTS tenant_isolation.active_sessions (
        session_id VARCHAR(50) PRIMARY KEY,
        tenant_name VARCHAR(100) REFERENCES tenant_isolation.tenants(tenant_name),
        user_name VARCHAR(100),
        application_name VARCHAR(100),
        client_addr INET,
        backend_start TIMESTAMP,
        query_start TIMESTAMP,
        state VARCHAR(20),
        query_text TEXT,
        cpu_usage_percent NUMERIC(5,2),
        memory_usage_mb INTEGER,
        io_operations INTEGER,
        priority_level INTEGER,
        created_at TIMESTAMP DEFAULT NOW()
    );

    -- Query execution history for monitoring
    CREATE TABLE IF NOT EXISTS tenant_isolation.query_history (
        query_id SERIAL PRIMARY KEY,
        tenant_name VARCHAR(100),
        user_name VARCHAR(100),
        query_hash VARCHAR(64),
        query_text TEXT,
        execution_time_ms INTEGER,
        rows_examined INTEGER,
        rows_returned INTEGER,
        cpu_time_ms INTEGER,
        io_operations INTEGER,
        memory_peak_mb INTEGER,
        priority_level INTEGER,
        was_throttled BOOLEAN DEFAULT FALSE,
        executed_at TIMESTAMP DEFAULT NOW()
    );

    -- Resource usage aggregation
    CREATE TABLE IF NOT EXISTS tenant_isolation.resource_usage_daily (
        usage_date DATE,
        tenant_name VARCHAR(100),
        total_queries INTEGER DEFAULT 0,
        total_execution_time_ms BIGINT DEFAULT 0,
        avg_execution_time_ms NUMERIC(10,2),
        max_execution_time_ms INTEGER DEFAULT 0,
        total_cpu_time_ms BIGINT DEFAULT 0,
        total_io_operations BIGINT DEFAULT 0,
        peak_memory_mb INTEGER DEFAULT 0,
        throttled_queries INTEGER DEFAULT 0,
        PRIMARY KEY (usage_date, tenant_name)
    );

    -- Insert default tenant configurations
    INSERT INTO tenant_isolation.tenants (tenant_name, priority_level, max_connections, max_cpu_percent, max_memory_mb, max_io_ops_per_sec, query_timeout_seconds, daily_query_limit)
    VALUES
        ('high-priority', 1, 100, 50.0, 2048, 5000, 600, 1000000),
        ('standard', 2, 50, 25.0, 1024, 1000, 300, 100000),
        ('low-priority', 3, 25, 10.0, 512, 500, 120, 50000),
        ('analytics', 2, 30, 40.0, 4096, 2000, 1800, 10000),
        ('admin', 1, 20, 80.0, 1024, 10000, 3600, 1000000)
    ON CONFLICT (tenant_name) DO NOTHING;

  # Resource monitoring and throttling functions
  tenant-functions.sql: |
    -- Function to get tenant configuration
    CREATE OR REPLACE FUNCTION tenant_isolation.get_tenant_config(p_tenant_name VARCHAR(100))
    RETURNS TABLE (
        priority_level INTEGER,
        max_connections INTEGER,
        max_cpu_percent NUMERIC,
        max_memory_mb INTEGER,
        max_io_ops_per_sec INTEGER,
        query_timeout_seconds INTEGER,
        daily_query_limit INTEGER
    ) LANGUAGE plpgsql AS $$
    BEGIN
        RETURN QUERY
        SELECT t.priority_level, t.max_connections, t.max_cpu_percent,
               t.max_memory_mb, t.max_io_ops_per_sec, t.query_timeout_seconds,
               t.daily_query_limit
        FROM tenant_isolation.tenants t
        WHERE t.tenant_name = p_tenant_name;
    END;
    $$;

    -- Function to check if tenant is within resource limits
    CREATE OR REPLACE FUNCTION tenant_isolation.check_resource_limits(p_tenant_name VARCHAR(100))
    RETURNS BOOLEAN LANGUAGE plpgsql AS $$
    DECLARE
        v_current_sessions INTEGER;
        v_daily_queries INTEGER;
        v_max_connections INTEGER;
        v_daily_limit INTEGER;
    BEGIN
        -- Get current session count
        SELECT COUNT(*)
        INTO v_current_sessions
        FROM tenant_isolation.active_sessions
        WHERE tenant_name = p_tenant_name
        AND backend_start > NOW() - INTERVAL '1 hour';

        -- Get daily query count
        SELECT COALESCE(total_queries, 0)
        INTO v_daily_queries
        FROM tenant_isolation.resource_usage_daily
        WHERE tenant_name = p_tenant_name
        AND usage_date = CURRENT_DATE;

        -- Get tenant limits
        SELECT max_connections, daily_query_limit
        INTO v_max_connections, v_daily_limit
        FROM tenant_isolation.tenants
        WHERE tenant_name = p_tenant_name;

        -- Check limits
        IF v_current_sessions > v_max_connections OR v_daily_queries > v_daily_limit THEN
            RETURN FALSE;
        END IF;

        RETURN TRUE;
    END;
    $$;

    -- Function to log query execution
    CREATE OR REPLACE FUNCTION tenant_isolation.log_query_execution(
        p_tenant_name VARCHAR(100),
        p_user_name VARCHAR(100),
        p_query_text TEXT,
        p_execution_time_ms INTEGER,
        p_rows_examined INTEGER DEFAULT 0,
        p_rows_returned INTEGER DEFAULT 0,
        p_cpu_time_ms INTEGER DEFAULT 0,
        p_io_operations INTEGER DEFAULT 0,
        p_memory_peak_mb INTEGER DEFAULT 0,
        p_priority_level INTEGER DEFAULT 2,
        p_was_throttled BOOLEAN DEFAULT FALSE
    ) RETURNS VOID LANGUAGE plpgsql AS $$
    DECLARE
        v_query_hash VARCHAR(64);
    BEGIN
        -- Generate query hash
        v_query_hash := MD5(p_query_text);

        -- Insert query history
        INSERT INTO tenant_isolation.query_history (
            tenant_name, user_name, query_hash, query_text, execution_time_ms,
            rows_examined, rows_returned, cpu_time_ms, io_operations,
            memory_peak_mb, priority_level, was_throttled
        ) VALUES (
            p_tenant_name, p_user_name, v_query_hash, p_query_text, p_execution_time_ms,
            p_rows_examined, p_rows_returned, p_cpu_time_ms, p_io_operations,
            p_memory_peak_mb, p_priority_level, p_was_throttled
        );

        -- Update daily aggregation
        INSERT INTO tenant_isolation.resource_usage_daily (
            usage_date, tenant_name, total_queries, total_execution_time_ms,
            total_cpu_time_ms, total_io_operations, peak_memory_mb, throttled_queries
        ) VALUES (
            CURRENT_DATE, p_tenant_name, 1, p_execution_time_ms,
            p_cpu_time_ms, p_io_operations, p_memory_peak_mb,
            CASE WHEN p_was_throttled THEN 1 ELSE 0 END
        )
        ON CONFLICT (usage_date, tenant_name) DO UPDATE SET
            total_queries = resource_usage_daily.total_queries + 1,
            total_execution_time_ms = resource_usage_daily.total_execution_time_ms + p_execution_time_ms,
            avg_execution_time_ms = (resource_usage_daily.total_execution_time_ms + p_execution_time_ms) / (resource_usage_daily.total_queries + 1),
            max_execution_time_ms = GREATEST(resource_usage_daily.max_execution_time_ms, p_execution_time_ms),
            total_cpu_time_ms = resource_usage_daily.total_cpu_time_ms + p_cpu_time_ms,
            total_io_operations = resource_usage_daily.total_io_operations + p_io_operations,
            peak_memory_mb = GREATEST(resource_usage_daily.peak_memory_mb, p_memory_peak_mb),
            throttled_queries = resource_usage_daily.throttled_queries + CASE WHEN p_was_throttled THEN 1 ELSE 0 END;
    END;
    $$;

    -- Function to get tenant priority queue position
    CREATE OR REPLACE FUNCTION tenant_isolation.get_queue_position(p_tenant_name VARCHAR(100))
    RETURNS INTEGER LANGUAGE plpgsql AS $$
    DECLARE
        v_priority INTEGER;
        v_position INTEGER;
    BEGIN
        -- Get tenant priority
        SELECT priority_level INTO v_priority
        FROM tenant_isolation.tenants
        WHERE tenant_name = p_tenant_name;

        -- Calculate position based on priority and current load
        SELECT COUNT(*) + 1
        INTO v_position
        FROM tenant_isolation.active_sessions a
        JOIN tenant_isolation.tenants t ON a.tenant_name = t.tenant_name
        WHERE t.priority_level <= v_priority
        AND a.state IN ('active', 'idle in transaction');

        RETURN v_position;
    END;
    $$;