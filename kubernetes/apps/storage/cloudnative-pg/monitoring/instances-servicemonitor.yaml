---
# ServiceMonitor for PostgreSQL Instances
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-instances
  namespace: storage
  labels:
    app.kubernetes.io/name: postgres-monitoring
    app.kubernetes.io/component: service-monitor
    app.kubernetes.io/part-of: postgresql
    monitoring: prometheus
    environment: production
  annotations:
    prometheus.io/scrape: "true"
    monitoring.cnpg.io/cluster: "postgres"
spec:
  selector:
    matchLabels:
      monitoring.cnpg.io/cluster: "postgres"
  endpoints:
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
      path: /metrics
      scheme: http
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_cluster]
          targetLabel: cluster
        - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_instanceRole]
          targetLabel: role
        - sourceLabels: [__meta_kubernetes_pod_label_cnpg_io_podRole]
          targetLabel: pod_role
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
        - sourceLabels: [__meta_kubernetes_pod_ip]
          targetLabel: pod_ip
      metricRelabelings:
        # PostgreSQL metrics
        - sourceLabels: [__name__]
          regex: 'pg_.*|postgres_.*|cnpg_.*'
          action: keep
        # Add environment label
        - targetLabel: environment
          replacement: production
        # Add tier label
        - targetLabel: tier
          replacement: database
  namespaceSelector:
    matchNames:
      - storage