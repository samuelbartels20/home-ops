---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app cloudnative-pg-operator
  namespace: flux-system
spec:
  targetNamespace: storage
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
      app.kubernetes.io/component: postgresql-operator
      app.kubernetes.io/part-of: postgresql
  path: ./kubernetes/apps/storage/cloudnative-pg/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: external-secrets
      namespace: security
    - name: onepassword
      namespace: security

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg-cluster
  namespace: storage
spec:
  dependsOn:
    - name: cloudnative-pg-operator
      namespace: storage
    - name: external-secrets
      namespace: security
    - name: onepassword
      namespace: security
  interval: 30m
  path: ./kubernetes/apps/storage/cloudnative-pg/cluster
  prune: true
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: storage
  timeout: 3m
  wait: false

---
# PostgreSQL Backup System
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg-backup
  namespace: flux-system
spec:
  targetNamespace: storage
  commonMetadata:
    labels:
      app.kubernetes.io/name: postgres-backup
      app.kubernetes.io/component: backup-system
      app.kubernetes.io/part-of: postgresql
  path: ./kubernetes/apps/storage/cloudnative-pg/backup
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  dependsOn:
    - name: cloudnative-pg-operator
      namespace: storage
    - name: external-secrets
      namespace: security
    - name: onepassword
      namespace: security
