---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: haproxy-postgres
  namespace: storage
  labels:
    app.kubernetes.io/name: haproxy
    app.kubernetes.io/component: load-balancer
    app.kubernetes.io/part-of: postgresql
    app.kubernetes.io/version: "2.8"
    environment: production
    tier: middleware
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        replicas: 3
        strategy: RollingUpdate
        annotations:
          deployment.kubernetes.io/revision: "1"
          loadbalancer.cnpg.io/enabled: "true"
          performance.cnpg.io/splice-enabled: "true"
          reloader.stakater.com/auto: "true"

        containers:
          main:
            image:
              repository: haproxytech/haproxy-alpine
              tag: "2.8"
              pullPolicy: IfNotPresent

            env:
              HAPROXY_USER: "haproxy"
              HAPROXY_GROUP: "haproxy"

            resources:
              requests:
                cpu: 1000m
                memory: 512Mi
                ephemeral-storage: 1Gi
              limits:
                cpu: 4000m
                memory: 2Gi
                ephemeral-storage: 2Gi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 1000
              runAsGroup: 1000
              capabilities:
                drop:
                  - ALL
                add:
                  - NET_BIND_SERVICE
              seccompProfile:
                type: RuntimeDefault

          # HAProxy Exporter sidecar
          exporter:
            image:
              repository: prom/haproxy-exporter
              tag: "v0.15.0"
              pullPolicy: IfNotPresent

            args:
              - --haproxy.scrape-uri=http://127.0.0.1:8404/stats?stats;csv
              - --web.listen-address=:9101
              - --web.telemetry-path=/metrics

            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 128Mi

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              runAsNonRoot: true
              runAsUser: 1000
              capabilities:
                drop:
                  - ALL

        pod:
          labels:
            app.kubernetes.io/name: haproxy
            app.kubernetes.io/component: load-balancer
            monitoring: "true"
            security-scan: "required"

          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "8404"
            prometheus.io/path: "/metrics"
            cluster-autoscaler.kubernetes.io/safe-to-evict: "false"

          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault

          # Anti-affinity for high availability
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: haproxy
                  topologyKey: kubernetes.io/hostname
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: haproxy
                    topologyKey: topology.kubernetes.io/zone

    serviceAccount:
      create: false
      name: haproxy

    service:
      main:
        enabled: false

    persistence:
      haproxy-config:
        type: configMap
        name: haproxy-config
        defaultMode: 0644
        globalMounts:
          - path: /etc/haproxy
            readOnly: true

      haproxy-sockets:
        type: emptyDir
        sizeLimit: 100Mi
        globalMounts:
          - path: /var/run/haproxy

      tmp:
        type: emptyDir
        sizeLimit: 100Mi
        globalMounts:
          - path: /tmp

    # Health checks
    probes:
      liveness:
        enabled: true
        custom: true
        spec:
          httpGet:
            path: /health
            port: 8888
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

      readiness:
        enabled: true
        custom: true
        spec:
          httpGet:
            path: /ready
            port: 8888
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3