# HAProxy configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: pg-haproxy-config
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: loadbalancer
    app.kubernetes.io/part-of: postgresql
  annotations:
    haproxy.io/version: "2.8"
    haproxy.io/production-grade: "true"
data:
  haproxy.cfg: |
    global
      maxconn 20000
      log stdout format raw local0 info
      stats socket /var/run/haproxy.sock mode 600 level admin
      tune.ssl.default-dh-param 2048
      tune.bufsize 32768
      tune.maxrewrite 8192
      nbproc 2
      nbthread 4
      cpu-map auto:1/1-4 0-3
      
      # Security settings
      ssl-default-bind-ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384
      ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11
      ssl-default-server-ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384
      ssl-default-server-options no-sslv3 no-tlsv10 no-tlsv11

    # Default settings for all proxies
    defaults
      log global
      mode tcp
      retries 3
      timeout client 30m
      timeout connect 5s
      timeout server 30m
      timeout check 10s
      option redispatch
      option log-health-checks
      option dontlognull
      option tcplog
      
      # Connection limits
      maxconn 5000
      
      # Error handling
      option abortonclose
      option accept-invalid-http-request

    # Rate limiting and security frontend
    frontend pg_frontend_ssl
      bind *:5432 ssl crt /etc/haproxy/certs/postgres.pem ca-file /etc/haproxy/certs/ca.crt verify required
      mode tcp
      
      # Rate limiting per IP
      stick-table type ip size 100k expire 30s store http_req_rate(10s),conn_rate(10s)
      tcp-request track-sc0 src
      tcp-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }
      tcp-request deny deny_status 429 if { sc_conn_rate(0) gt 50 }
      
      # Connection limiting
      tcp-request connection reject if { src_conn_rate gt 100 }
      
      default_backend pg_backend_ssl

    # Non-SSL fallback (for monitoring)
    frontend pg_frontend_plain
      bind *:5433
      mode tcp
      
      # Rate limiting
      stick-table type ip size 100k expire 30s store http_req_rate(10s),conn_rate(10s)
      tcp-request track-sc0 src
      tcp-request deny deny_status 429 if { sc_http_req_rate(0) gt 50 }
      tcp-request deny deny_status 429 if { sc_conn_rate(0) gt 25 }
      
      default_backend pg_backend_plain

    # SSL backend with connection pooling
    backend pg_backend_ssl
      mode tcp
      balance leastconn
      option httpchk
      http-check expect status 200
      default-server inter 5s fall 3 rise 2 on-marked-down shutdown-sessions
      
      # Connection limits per server
      server pg1 pg-cluster-1:5432 check port 8008 maxconn 5000 weight 100
      server pg2 pg-cluster-2:5432 check port 8008 maxconn 5000 weight 100
      server pg3 pg-cluster-3:5432 check port 8008 maxconn 5000 weight 100
      
      # Backup servers (read replicas)
      server pg-read1 pg-cluster-read-1:5432 check port 8008 maxconn 2000 weight 50 backup
      server pg-read2 pg-cluster-read-2:5432 check port 8008 maxconn 2000 weight 50 backup

    # Plain backend
    backend pg_backend_plain
      mode tcp
      balance leastconn
      option httpchk
      http-check expect status 200
      default-server inter 5s fall 3 rise 2 on-marked-down shutdown-sessions
      
      server pg1 pg-cluster-1:5432 check port 8008 maxconn 2000 weight 100
      server pg2 pg-cluster-2:5432 check port 8008 maxconn 2000 weight 100
      server pg3 pg-cluster-3:5432 check port 8008 maxconn 2000 weight 100

    # Stats page for monitoring
    listen stats
      bind *:8404
      mode http
      stats enable
      stats uri /stats
      stats refresh 30s
      stats auth admin:${HAPROXY_STATS_PASSWORD}
      stats admin if TRUE
      stats show-legends
      stats show-node
      
      # Security headers
      http-response set-header X-Frame-Options DENY
      http-response set-header X-Content-Type-Options nosniff
      http-response set-header X-XSS-Protection "1; mode=block"

    # Health check endpoint
    listen health
      bind *:8405
      mode http
      http-request deny deny_status 200
      http-response set-header Content-Type text/plain
      http-response set-body "healthy\n"
