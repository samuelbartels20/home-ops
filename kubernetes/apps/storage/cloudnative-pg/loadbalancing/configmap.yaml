---
apiVersion: v1
kind: ConfigMap
metadata:
  name: haproxy-config
  namespace: storage
  labels:
    app.kubernetes.io/name: haproxy
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: postgresql
data:
  haproxy.cfg: |
    global
        # Process management
        daemon
        user haproxy
        group haproxy
        pidfile /var/run/haproxy/haproxy.pid

        maxconn 100000
        nbthread 4
        cpu-map auto:1/1-4 0-3

        # Socket configuration
        stats socket /var/run/haproxy/admin.sock mode 660 level admin
        stats socket /var/run/haproxy/stats.sock mode 660 level operator

        # Memory management
        tune.bufsize 32768
        tune.maxrewrite 8192
        tune.rcvbuf.client 262144
        tune.rcvbuf.server 262144
        tune.sndbuf.client 262144
        tune.sndbuf.server 262144

        # Connection tuning
        tune.maxaccept 1000
        tune.maxpollevents 200

        # SSL/TLS configuration
        ssl-default-bind-ciphers ECDHE+aRSA+AES256+GCM+SHA384:ECDHE+aRSA+AES128+GCM+SHA256:ECDHE+aRSA+AES256+SHA384:ECDHE+aRSA+AES128+SHA256
        ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
        ssl-default-server-ciphers ECDHE+aRSA+AES256+GCM+SHA384:ECDHE+aRSA+AES128+GCM+SHA256:ECDHE+aRSA+AES256+SHA384:ECDHE+aRSA+AES128+SHA256
        ssl-default-server-options ssl-min-ver TLSv1.2 no-tls-tickets

        # Logging
        log 127.0.0.1:514 local0 info
        log-tag haproxy-postgres

    defaults
        mode tcp
        log global
        option tcplog
        option dontlognull
        option log-health-checks
        option log-separate-errors

        # Timeouts optimized for database connections
        timeout connect 5s
        timeout client 1h
        timeout server 1h
        timeout tunnel 1h
        timeout client-fin 30s
        timeout server-fin 30s

        # Connection management
        option tcp-check
        option splice-auto
        option splice-request
        option splice-response

        # Retry configuration
        retry-on all-retryable-errors
        retries 3

        # Health check defaults
        default-server inter 5s downinter 10s rise 3 fall 2 slowstart 30s maxconn 1000 maxqueue 256 weight 100

    # Statistics and monitoring interface
    listen stats
        bind *:8404
        mode http
        stats enable
        stats uri /stats
        stats refresh 30s
        stats show-legends
        stats show-desc PostgreSQL Load Balancer
        stats admin if TRUE
        http-request use-service prometheus-exporter if { path /metrics }

        # Health check endpoint
        monitor-uri /health

    # Health check service
    listen health
        bind *:8888
        mode http
        monitor-uri /health
        monitor-uri /ready
        http-request return status 200 content-type text/plain string "OK\n" if { path /health }
        http-request return status 200 content-type text/plain string "READY\n" if { path /ready }

    # PostgreSQL Primary (Read/Write) Backend
    backend postgres-primary
        mode tcp
        balance roundrobin
        option tcp-check
        tcp-check connect
        tcp-check send-binary 00000020 # packet length
        tcp-check send-binary 00030000 # protocol version
        tcp-check send-binary 7573657200 # "user"
        tcp-check send-binary 706f737467726573 # "postgres"
        tcp-check send-binary 0064617461626173650000 # "database"
        tcp-check send-binary 00 # null terminator
        tcp-check expect binary 52 # Authentication OK

        # Primary server detection
        server postgres-primary postgres-rw.storage.svc.cluster.local:5432 check port 5432 maxconn 1000 weight 100

    # PostgreSQL Read-Only Backend
    backend postgres-readonly
        mode tcp
        balance leastconn
        option tcp-check
        tcp-check connect
        tcp-check send-binary 00000020
        tcp-check send-binary 00030000
        tcp-check send-binary 7573657200
        tcp-check send-binary 706f737467726573
        tcp-check send-binary 0064617461626173650000
        tcp-check send-binary 00
        tcp-check expect binary 52

        # Read-only replicas
        server postgres-r postgres-ro.storage.svc.cluster.local:5432 check port 5432 maxconn 1000 weight 100
        server postgres-ro postgres-ro.storage.svc.cluster.local:5432 check port 5432 maxconn 1000 weight 100 backup

    # # PgBouncer Backend
    backend pgbouncer-pool
        mode tcp
        balance roundrobin
        option tcp-check
        tcp-check connect

        # PgBouncer instances
        server pgbouncer-1 postgres-pgbouncer-rw.storage.svc.cluster.local:5432 check port 5432 maxconn 2000 weight 100
        server pgbouncer-2 postgres-pgbouncer-rw.storage.svc.cluster.local:5432 check port 5432 maxconn 2000 weight 100
        server pgbouncer-3 postgres-pgbouncer-rw.storage.svc.cluster.local:5432 check port 5432 maxconn 2000 weight 100
        server pgbouncer-4 postgres-vector-pgbouncer-rw.storage.svc.cluster.local:5432 check port 5432 maxconn 2000 weight 100
        server pgbouncer-5 postgres-vector-pgbouncer-rw.storage.svc.cluster.local:5432 check port 5432 maxconn 2000 weight 100
        server pgbouncer-6 postgres-vector-pgbouncer-rw.storage.svc.cluster.local:5432 check port 5432 maxconn 2000 weight 100

    # Frontend for PostgreSQL Read/Write (Primary)
    frontend postgres-readwrite
        bind *:5432
        mode tcp

        # Connection limits
        maxconn 50000

        # Rate limiting (connections per second)
        stick-table type ip size 100k expire 30s store conn_rate(10s),conn_cur
        tcp-request connection track-sc0 src
        tcp-request connection reject if { sc_conn_rate(0) gt 100 }
        tcp-request connection reject if { sc_conn_cur(0) gt 50 }

        # Intelligent routing based on query patterns
        tcp-request inspect-delay 100ms
        tcp-request content accept if WAIT_END

        # Route to PgBouncer for connection pooling by default
        default_backend pgbouncer-pool

        # Direct routing for specific cases
        use_backend postgres-primary if { src 10.0.0.0/8 }  # Internal admin traffic

    # Frontend for PostgreSQL Read-Only
    frontend postgres-readonly-frontend
        bind *:5433
        mode tcp

        # Connection limits for read-only
        maxconn 75000

        # Rate limiting for read queries
        stick-table type ip size 100k expire 30s store conn_rate(10s),conn_cur
        tcp-request connection track-sc0 src
        tcp-request connection reject if { sc_conn_rate(0) gt 200 }
        tcp-request connection reject if { sc_conn_cur(0) gt 100 }

        # Always route to read-only replicas
        default_backend postgres-readonly

    # Frontend for PgBouncer Admin
    frontend pgbouncer-admin
        bind *:6432
        mode tcp

        # Admin connection limits
        maxconn 100

        # Route to PgBouncer admin interface
        default_backend pgbouncer-pool

  # Query-based routing rules
  advanced-routing.cfg: |
    lua-load /etc/haproxy/query-router.lua

  query-router.lua: |
    -- Intelligent query routing for PostgreSQL
    -- Routes queries based on content analysis

    function route_query(txn)
        local query = txn:get_var("req.payload")

        if query then
            -- Convert to uppercase for pattern matching
            local upper_query = string.upper(query)

            -- Route SELECT queries to read-only replicas
            if string.match(upper_query, "^%s*SELECT") and
               not string.match(upper_query, "FOR%s+UPDATE") and
               not string.match(upper_query, "FOR%s+SHARE") then
                txn:set_var("req.backend", "postgres-readonly")
                return
            end

            -- Route write operations to primary
            if string.match(upper_query, "^%s*INSERT") or
               string.match(upper_query, "^%s*UPDATE") or
               string.match(upper_query, "^%s*DELETE") or
               string.match(upper_query, "^%s*CREATE") or
               string.match(upper_query, "^%s*ALTER") or
               string.match(upper_query, "^%s*DROP") then
                txn:set_var("req.backend", "postgres-primary")
                return
            end

            -- Route transactions to primary
            if string.match(upper_query, "^%s*BEGIN") or
               string.match(upper_query, "^%s*START") or
               string.match(upper_query, "^%s*COMMIT") or
               string.match(upper_query, "^%s*ROLLBACK") then
                txn:set_var("req.backend", "postgres-primary")
                return
            end
        end

        -- Default to connection pooler
        txn:set_var("req.backend", "pgbouncer-pool")
    end

    core.register_action("route_query", {"http-req", "tcp-req"}, route_query)