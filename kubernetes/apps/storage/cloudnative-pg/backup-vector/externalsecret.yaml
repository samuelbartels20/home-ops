
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cnpg-vector-backup
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cnpg-vector-backup
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        POSTGRES_HOST: "postgres-vector-rw.database.svc.cluster.local"
        POSTGRES_USER: "{{ .POSTGRES_SUPER_USER }}"
        POSTGRES_PASSWORD: "{{ .POSTGRES_SUPER_PASS }}"
        POSTGRES_PORT: "5432"
  dataFrom:
    - extract:
        key: cnpg-vector-backup