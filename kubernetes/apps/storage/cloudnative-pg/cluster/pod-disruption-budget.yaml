---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres17-pdb
  namespace: storage
spec:
  minAvailable: 2
  selector:
    matchLabels:
      cnpg.io/cluster: postgres17
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: postgres17-primary-pdb
  namespace: storage
spec:
  minAvailable: 1
  selector:
    matchLabels:
      cnpg.io/cluster: postgres17
      cnpg.io/instanceRole: primary 