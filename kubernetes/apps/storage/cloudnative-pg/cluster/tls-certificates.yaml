---
# Certificate for PostgreSQL server
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgres-server-cert
  namespace: storage
  labels:
    app.kubernetes.io/name: pg-cluster
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: storage
spec:
  secretName: postgres-server-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - postgres.samcloud.online
  - 192.168.8.101
  - postgres-rw.storage.svc
  - postgres-rw.storage.svc.cluster.local
  - postgres-ro.storage.svc
  - postgres-ro.storage.svc.cluster.local
  - "*.postgres.storage.svc"
  - "*.postgres.storage.svc.cluster.local"
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 4096
---
# Certificate for PostgreSQL client authentication
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgres-client-cert
  namespace: storage
  labels:
    app.kubernetes.io/name: pg-cluster
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: storage
spec:
  secretName: postgres-client-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - postgres-client.samcloud.online
  - 192.168.8.101
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
---
# Certificate for backup operations
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: postgres-backup-cert
  namespace: storage
  labels:
    app.kubernetes.io/name: pg-cluster
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: storage
spec:
  secretName: postgres-backup-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - postgres-backup.samcloud.online
  - 192.168.8.101
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048 