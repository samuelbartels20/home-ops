---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: postgres-backup
  namespace: storage
spec:
  cluster:
    name: postgres
  schedule: "0 0 * * *"
  backupOwnerReference: self
  immediate: true
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: immich-backup
  namespace: storage
spec:
  schedule: "@daily"
  immediate: true
  backupOwnerReference: self
  cluster:
    name: immich
