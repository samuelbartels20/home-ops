apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres17-config
  namespace: storage
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: storage
data:
  postgresql.conf: |
    listen_addresses = '*'
    port = 5432
    max_connections = 20
    
    shared_buffers = 128MB
    effective_cache_size = 512MB
    work_mem = 2MB
    
    wal_level = replica
    max_wal_size = 1GB
    min_wal_size = 256MB
    
    log_min_duration_statement = 5000
    log_statement = 'ddl'

    shared_preload_libraries = 'pg_stat_statements'
    pg_stat_statements.max = 1000
    pg_stat_statements.track = top
    pg_stat_statements.save = on
    password_encryption = 'scram-sha-256'
    timezone = 'UTC'
    log_timezone = 'UTC'

  pg_hba.conf: |
    # TYPE  DATABASE        USER            ADDRESS                 METHOD
    local   all             all                                     trust
    host    all             all             127.0.0.1/32            scram-sha-256
    host    all             all             ::1/128                 scram-sha-256
    host    all             all             10.0.0.0/8              scram-sha-256
    host    all             all             192.168.8.0/24          scram-sha-256

  audit.conf: |
    # PostgreSQL Audit Configuration
    audit_enabled = on
    audit_event = 'DDL,ROLE,GRANT,CONNECTION,LOGIN,LOGOUT'
    audit_log_format = 'json'
    audit_log_destination = 'syslog'
    audit_log_facility = 'LOCAL0'
    audit_log_level = 'INFO'
    audit_log_rotation_age = '1d'
    audit_log_rotation_size = '100MB'
    audit_log_retention_days = '90'
    audit_log_masking = on
    audit_log_masking_patterns = 'password,credit_card,ssn'
    audit_log_compliance = 'SOX,PCI-DSS,GDPR'
    audit_log_alert_on_failure = on
    audit_log_alert_threshold = '5'
  
  compliance.conf: |
    # Compliance Configuration
    data_classification = 'PII,PHI,PCI'
    encryption_at_rest = 'required'
    encryption_in_transit = 'required'
    encryption_algorithm = 'AES-256'
    access_control_model = 'RBAC'
    least_privilege_principle = 'enforced'
    data_retention_policy = '7_years'
    data_deletion_policy = 'secure_wipe'
    backup_encryption = 'required'
    backup_retention = '90_days'
    continuous_monitoring = 'enabled'
    anomaly_detection = 'enabled'
    real_time_alerting = 'enabled'
    incident_response_time = '15_minutes'
    breach_notification_time = '72_hours'
    audit_trail_retention = '7_years'
    audit_trail_integrity = 'cryptographic' 