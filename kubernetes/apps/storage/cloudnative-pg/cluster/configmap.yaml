apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres17-config
  namespace: storage
data:
  postgresql.conf: |
    listen_addresses = '*'
    port = 5432
    max_connections = 20
    
    shared_buffers = 128MB
    effective_cache_size = 512MB
    work_mem = 2MB
    
    wal_level = replica
    max_wal_size = 1GB
    min_wal_size = 256MB
    
    log_min_duration_statement = 5000
    log_statement = 'ddl'

    shared_preload_libraries = 'pg_stat_statements'
    pg_stat_statements.max = 1000
    pg_stat_statements.track = top
    pg_stat_statements.save = on
    password_encryption = 'scram-sha-256'
    timezone = 'UTC'
    log_timezone = 'UTC'

  pg_hba.conf: |
    # TYPE  DATABASE        USER            ADDRESS                 METHOD
    local   all             all                                     trust
    host    all             all             127.0.0.1/32            scram-sha-256
    host    all             all             ::1/128                 scram-sha-256
    host    all             all             10.0.0.0/8              scram-sha-256
    host    all             all             192.168.8.0/24          scram-sha-256

  audit.conf: |
    audit_enabled = on
    audit_event = 'DDL,ROLE,CONNECTION'
    audit_log_format = 'text'
    audit_log_destination = 'file'
    audit_log_rotation_age = '7d'
    audit_log_retention_days = '30'
  
  security.conf: |
    encryption_at_rest = 'enabled'
    encryption_in_transit = 'enabled'
    access_control_model = 'RBAC'
    backup_encryption = 'enabled'
    backup_retention = '7_days'
    backup_retention_policy = '7_days'
    backup_retention_policy = '7_days'