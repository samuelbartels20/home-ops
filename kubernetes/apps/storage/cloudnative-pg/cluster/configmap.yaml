apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: storage
data:
  postgresql.conf: |
    listen_addresses = '*'
    port = 5432
    max_connections = 20
    
    shared_buffers = 128MB
    effective_cache_size = 512MB
    work_mem = 2MB
    
    wal_level = replica
    max_wal_size = 1GB
    min_wal_size = 256MB
    checkpoint_timeout = 15min
    synchronous_commit = on
    
    log_min_duration_statement = 5000
    log_statement = 'ddl'
    effective_io_concurrency = 200
    max_parallel_workers_per_gather = 4
    max_worker_processes = 8 

    shared_preload_libraries = 'pg_stat_statements, pg_prewarm'
    pg_prewarm.autoprewarm = on
    pg_stat_statements.max = 1000
    pg_stat_statements.track = top
    pg_stat_statements.save = on
    password_encryption = 'scram-sha-256'
    timezone = 'UTC'
    log_timezone = 'UTC'

  pg_hba.conf: |
    # TYPE  DATABASE        USER            ADDRESS                 METHOD
    local   all             all                                     trust
    host    all             all             127.0.0.1/32            scram-sha-256
    host    all             all             ::1/128                 scram-sha-256
    host    all             all             10.0.0.0/8              scram-sha-256
    host    all             all             192.168.8.0/24          scram-sha-256

  audit.conf: |
    audit_enabled = on
    audit_event = 'DDL,ROLE,CONNECTION'
    audit_log_format = 'text'
    audit_log_destination = 'file'
    audit_log_rotation_age = '7d'
    audit_log_retention_days = '30'
  
  security.conf: |
    encryption_at_rest = 'enabled'
    encryption_in_transit = 'enabled'
    access_control_model = 'RBAC'
    backup_encryption = 'enabled'
    backup_retention = '7_days'
    backup_retention_policy = '7_days'
    backup_retention_policy = '7_days'

  tenant-config.ini: |
    [tenant:priority-high]
    pool_size = 50
    max_db_connections = 200
    reserve_pool_size = 10
    query_timeout = 30000

    [tenant:priority-standard]
    pool_size = 25
    max_db_connections = 100
    reserve_pool_size = 5
    query_timeout = 60000

    [tenant:priority-low]
    pool_size = 10
    max_db_connections = 50
    reserve_pool_size = 2
    query_timeout = 120000

  custom-queries.yaml: |
    pg_custom_database_size:
      query: "SELECT datname as database, pg_database_size(datname) as size_bytes FROM pg_database WHERE datistemplate = false"
      metrics:
        - database:
            usage: "LABEL"
            description: "Database name"
        - size_bytes:
            usage: "GAUGE"
            description: "Database size in bytes"

    pg_custom_table_sizes:
      query: |
        SELECT schemaname, tablename,
               pg_total_relation_size(schemaname||'.'||tablename) as total_bytes,
               pg_relation_size(schemaname||'.'||tablename) as size_bytes,
               pg_indexes_size(schemaname||'.'||tablename) as index_bytes
        FROM pg_tables
        WHERE schemaname NOT IN ('information_schema', 'pg_catalog')
      metrics:
        - schemaname:
            usage: "LABEL"
            description: "Schema name"
        - tablename:
            usage: "LABEL"
            description: "Table name"
        - total_bytes:
            usage: "GAUGE"
            description: "Total size in bytes"
        - size_bytes:
            usage: "GAUGE"
            description: "Table size in bytes"
        - index_bytes:
            usage: "GAUGE"
            description: "Index size in bytes"

    pg_custom_table_sizes_vector:
      query: |
        SELECT schemaname, tablename,
               pg_total_relation_size(schemaname||'.'||tablename) as total_bytes,
               pg_relation_size(schemaname||'.'||tablename) as size_bytes,
               pg_indexes_size(schemaname||'.'||tablename) as index_bytes
        FROM pg_tables
        WHERE schemaname NOT IN ('information_schema', 'pg_catalog')
      metrics:
        - schemaname:
            usage: "LABEL"
            description: "Schema name"
        - tablename:
            usage: "LABEL"
            description: "Table name"
        - total_bytes:
            usage: "GAUGE"
            description: "Total size in bytes"
        - size_bytes:
            usage: "GAUGE"
            description: "Table size in bytes"
        - index_bytes:
            usage: "GAUGE"
            description: "Index size in bytes"