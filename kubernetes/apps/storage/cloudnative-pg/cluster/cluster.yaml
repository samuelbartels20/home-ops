apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres17
  namespace: storage
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: postgresql
    app.kubernetes.io/version: "17.2"
    environment: production
    tier: data
    backup-policy: comprehensive
  annotations:
    cnpg.io/cluster-size: "3"
    cnpg.io/hibernation: "off"
    backup.cnpg.io/retention-policy: "30d"
    security.cnpg.io/fips-enabled: "true"
    monitoring.cnpg.io/enabled: "true"
spec:
  instances: 3

  imageName: "ghcr.io/cloudnative-pg/postgresql:17.2"

  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover

  enablePDB: true

  enableSuperuserAccess: true
  superuserSecret:
    name: cloudnative-pg

  bootstrap:
    initdb:
      database: postgres
      owner: postgres
      secret:
        name: cloudnative-pg

  replicationSlots:
    highAvailability:
      enabled: true


  storage:
    size: 10Gi
    storageClass: openebs-hostpath
    resizeInUseVolumes: true

  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://pgbackup
      endpointURL: http://192.168.8.102:9000
      s3Credentials:
        accessKeyId:
          name: cloudnative-pg
          key: minio_access_key_id
        secretAccessKey:
          name: cloudnative-pg
          key: minio_secret_access_key
      wal:
        compression: bzip2
        maxParallel: 8
      data:
        compression: bzip2
        jobs: 2
      serverName: postgres17-003

  externalClusters:
    - name: clusterBackup
      barmanObjectStore:
        destinationPath: s3://pgbackup
        endpointURL: http://192.168.8.102:9000
        serverName: postgres17-002
        s3Credentials:
          accessKeyId:
            name: cloudnative-pg
            key: minio_access_key_id
          secretAccessKey:
            name: cloudnative-pg
            key: minio_secret_access_key


  monitoring:
    enablePodMonitor: true

  postgresql:
    synchronous:
      method: any
      number: 1
    parameters:
      max_connections: "100"
      shared_buffers: 128MB

  resources:
    requests:
      cpu: "15m"
      memory: "256Mi"
    limits:
      cpu: "100m"
      memory: "256Mi"

