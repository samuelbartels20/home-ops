# yaml-language-server: $schema=
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres17
  namespace: storage
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: postgresql
    app.kubernetes.io/version: "17.2"
    environment: production
    tier: data
    backup-policy: comprehensive
  annotations:
    cnpg.io/cluster-size: "3"
    cnpg.io/primary-update-strategy: supervised
    cnpg.io/hibernation: "off"
    backup.cnpg.io/retention-policy: "30d"
    security.cnpg.io/fips-enabled: "true"
    monitoring.cnpg.io/enabled: "true"
    kubectl.kubernetes.io/last-applied-configuration: |
      Applied by: samuelbartels20
      Date: 2025-07-19T10:00:00Z
spec:
  instances: 3
  minSyncReplicas: 2
  maxSyncReplicas: 2

  # PostgreSQL container image
  imageName: "ghcr.io/cloudnative-pg/postgresql:17.2"
  
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover


  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true

  superuserSecret:
    name: cloudnative-pg
  enableSuperuserAccess: true

  storage:
    size: 10Gi
    storageClass: openebs-hostpath
    resizeInUseVolumes: true

  walStorage:
    size: 10Gi
    storageClass: openebs-hostpath
    resizeInUseVolumes: true

  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://pgbackup
      endpointURL: http://192.168.8.161:9000
      s3Credentials:
        accessKeyId:
          name: cloudnative-pg
          key: minio_access_key_id
        secretAccessKey:
          name: cloudnative-pg
          key: minio_secret_access_key
      wal:
        compression: bzip2
        maxParallel: 8
      data:
        compression: bzip2
        jobs: 2
      serverName: &currentCluster postgres17-v1
      tags:
        environment: production
        cluster: postgres17
        backup-type: comprehensive

  bootstrap:
    initdb:
      database: postgres
      owner: postgres
      secret:
        name: cloudnative-pg
      options:
        - "--encoding=UTF8"
        - "--locale=en_US.UTF-8"
        - "--data-checksums"
      postInitSQL:
        - 'CREATE EXTENSION IF NOT EXISTS pg_stat_statements;'
        - 'CREATE EXTENSION IF NOT EXISTS pg_buffercache;'
        - 'CREATE EXTENSION IF NOT EXISTS pgcrypto;'
        - 'CREATE EXTENSION IF NOT EXISTS "uuid-ossp";'
        - 'CREATE EXTENSION IF NOT EXISTS ltree;'
        - 'CREATE EXTENSION IF NOT EXISTS hstore;'
        - 'CREATE EXTENSION IF NOT EXISTS pg_trgm;'
        - 'CREATE EXTENSION IF NOT EXISTS btree_gin;'
        - 'CREATE EXTENSION IF NOT EXISTS btree_gist;'
        - 'ALTER SYSTEM SET log_statement = ''all'';'
        - 'ALTER SYSTEM SET log_min_duration_statement = 1000;'
        - 'SELECT pg_reload_conf();'



  externalClusters:
    - name: clusterBackup
      barmanObjectStore:
        destinationPath: s3://pgbackup
        endpointURL: http://192.168.8.161:9000
        serverName: postgres17-production
        s3Credentials:
          accessKeyId:
            name: cloudnative-pg
            key: minio_access_key_id
          secretAccessKey:
            name: cloudnative-pg
            key: minio_secret_access_key
  postgresql:
    parameters:
      max_connections: "200"
      superuser_reserved_connections: "5"
      
      shared_buffers: "1GB"
      effective_cache_size: "3GB"
      work_mem: "8MB"
      maintenance_work_mem: "256MB"
      wal_buffers: "64MB"
      
      effective_io_concurrency: "200"
      random_page_cost: "1.1"
      seq_page_cost: "1.0"
      cpu_tuple_cost: "0.01"
      cpu_index_tuple_cost: "0.005"
      cpu_operator_cost: "0.0025"
      
      max_parallel_workers: "4"
      max_parallel_workers_per_gather: "2"
      max_parallel_maintenance_workers: "2"
      parallel_tuple_cost: "0.1"
      parallel_setup_cost: "1000.0"
      max_worker_processes: "8"
      
      wal_level: "replica"
      max_wal_senders: "10"
      max_replication_slots: "10"
      wal_keep_size: "4GB"
      checkpoint_timeout: "10min"
      checkpoint_completion_target: "0.9"
      max_wal_size: "8GB"
      min_wal_size: "2GB"
      archive_mode: "on"
      archive_timeout: "300s"
      synchronous_commit: "on"
      hot_standby_feedback: "on"
      # SSL parameters managed by CloudNative-PG operator
      ssl_ciphers: "ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384"
      ssl_min_protocol_version: "TLSv1.2"
      ssl_max_protocol_version: "TLSv1.3"
      password_encryption: "scram-sha-256"
      row_security: "on"
      deadlock_timeout: "1s"
      lock_timeout: "60s"
      statement_timeout: "300s"
      idle_in_transaction_session_timeout: "30min"
      bgwriter_delay: "200ms"
      bgwriter_lru_maxpages: "1000"
      bgwriter_lru_multiplier: "2.0"
      bgwriter_flush_after: "512kB"
      autovacuum: "on"
      autovacuum_max_workers: "6"
      autovacuum_naptime: "30s"
      autovacuum_vacuum_threshold: "50"
      autovacuum_vacuum_scale_factor: "0.05"
      autovacuum_analyze_threshold: "50"
      autovacuum_analyze_scale_factor: "0.02"
      autovacuum_vacuum_cost_delay: "2ms"
      autovacuum_vacuum_cost_limit: "2000"
      autovacuum_vacuum_insert_threshold: "1000"
      autovacuum_vacuum_insert_scale_factor: "0.2"
      # Logging parameters managed by CloudNative-PG operator
      logging_collector: "on"
      log_directory: "/controller/log"
      log_min_duration_statement: "1000"
      log_checkpoints: "on"
      log_connections: "on"
      log_disconnections: "on"
      log_lock_waits: "on"
      log_temp_files: "0"
      log_autovacuum_min_duration: "0"
      log_error_verbosity: "default"
      log_line_prefix: "%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h "
      log_statement: "all"  
      log_replication_commands: "on"
      log_recovery_conflict_waits: "on"
      track_activities: "on"
      track_counts: "on"
      track_functions: "all"
      track_io_timing: "on"
      track_wal_io_timing: "on"
      compute_query_id: "on"
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: "all"
      pg_stat_statements.track_utility: "on"
      pg_stat_statements.track_planning: "on"
      pg_stat_statements.save: "on"
      default_text_search_config: "pg_catalog.english"
      timezone: "UTC"
      log_timezone: "UTC"
      huge_pages: "try"
      # shared_preload_libraries and synchronous_standby_names managed by CloudNative-PG operator
      vacuum_cost_delay: "2ms"
      vacuum_cost_limit: "2000"
      gin_pending_list_limit: "4MB"
      