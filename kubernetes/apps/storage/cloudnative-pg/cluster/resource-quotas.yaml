---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: postgres-cluster-quota
  namespace: storage
  labels:
    app.kubernetes.io/name: pg-cluster
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: storage
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    requests.storage: 200Gi
    persistentvolumeclaims: "10"
    services: "5"
    services.loadbalancers: "2"
    pods: "10"
    replicationcontrollers: "5"
    resourcequotas: "1"
    services.nodeports: "0"
    count/persistentvolumeclaims: "10"
    count/services.loadbalancers: "2"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: postgres-cluster-limits
  namespace: storage
  labels:
    app.kubernetes.io/name: pg-cluster
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: storage
spec:
  limits:
  - type: Pod
    min:
      cpu: 100m
      memory: 128Mi
    max:
      cpu: 4Gi
      memory: 8Gi
    default:
      cpu: 500m
      memory: 1Gi
    defaultRequest:
      cpu: 250m
      memory: 512Mi
  - type: Container
    min:
      cpu: 100m
      memory: 128Mi
    max:
      cpu: 2Gi
      memory: 4Gi
    default:
      cpu: 500m
      memory: 1Gi
    defaultRequest:
      cpu: 250m
      memory: 512Mi
  - type: PersistentVolumeClaim
    min:
      storage: 1Gi
    max:
      storage: 100Gi 