apiVersion: v1
kind: Service
metadata:
  name: postgres17-lb
  namespace: storage
  annotations:
    lbipam.cilium.io/ips: 192.168.8.101
    external-dns.alpha.kubernetes.io/hostname: postgres.samcloud.online
spec:
  type: LoadBalancer
  selector:
    cnpg.io/cluster: postgres17
    cnpg.io/instanceRole: primary
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
      targetPort: 5432
  sessionAffinity: ClientIP

---
apiVersion: v1
kind: Service
metadata:
  name: postgres17-ro
  namespace: storage
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
      targetPort: 5432
  selector:
    cnpg.io/cluster: postgres17
    cnpg.io/instanceRole: replica
---
apiVersion: v1
kind: Service
metadata:
  name: postgres17-rw
  namespace: storage
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      protocol: TCP
      targetPort: 5432
  selector:
    cnpg.io/cluster: postgres17
    cnpg.io/instanceRole: primary
  sessionAffinity: None