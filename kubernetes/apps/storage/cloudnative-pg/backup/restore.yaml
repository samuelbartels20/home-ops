apiVersion: batch/v1
kind: Job
metadata:
  name: pg-postgres-restore
  namespace: storage
spec:
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      automountServiceAccountToken: true
      restartPolicy: OnFailure
      volumes:
        - name: backup
          nfs:
            server: 192.168.8.102
            path: /mnt/homelab/applications/volumes

      securityContext:
        fsGroup: 1022
        runAsGroup: 1022
        runAsUser: 1022

      containers:
        - name: postgres
          image: ghcr.io/cloudnative-pg/postgresql:17.2
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -euo pipefail
              DUMP="/backup/postgres-cluster.dump.gz"
              DB="${PGDATABASE:-postgres}"
              if [ ! -f "$DUMP" ]; then
                echo "Dump not found: $DUMP" >&2
                exit 1
              fi
              # Choose decompressor
              if gzip -t "$DUMP" >/dev/null 2>&1; then
                DECOMP="zcat"
              else
                DECOMP="cat"
              fi
              # Detect custom-format dump (starts with PGDMP)
              MAGIC="$($DECOMP "$DUMP" | head -c 5 || true)"
              if [ "$MAGIC" = "PGDMP" ]; then
                echo "Detected custom-format dump -> using pg_restore --clean --if-exists"
                $DECOMP "$DUMP" \
                  | pg_restore \
                      --clean --if-exists \
                      --no-owner --no-privileges \
                      -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$DB"
              else
                echo "Detected plain SQL -> using psql -v ON_ERROR_STOP=1"
                $DECOMP "$DUMP" \
                  | psql -v ON_ERROR_STOP=1 \
                      -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$DB" -f -
              fi
          env:
            - name: PGHOST
              value: "192.168.8.101"
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              value: "postgres"
            # Optional: set a target database explicitly (defaults to 'postgres' if unset)
            # - name: PGDATABASE
            #   value: "your_db_name"
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudnative-pg
                  key: password
            - name: TZ
              value: "Etc/UTC"
          volumeMounts:
            - name: backup
              mountPath: /backup
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - "amd64"

---
# Backup Validation CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup-validation
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql-backup
    app.kubernetes.io/component: validation
    app.kubernetes.io/part-of: postgresql
spec:
  schedule: "0 4 * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgresql-backup
            cnpg.io/backup-validation: "true"
        spec:
          restartPolicy: OnFailure
          serviceAccountName: postgres-backup
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
          containers:
            - name: backup-validator
              image: ghcr.io/cloudnative-pg/postgresql:17.2
              env:
                - name: minio_access_key_id
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backup
                      key: minio_access_key_id
                - name: minio_secret_access_key
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backup
                      key: minio_secret_access_key
                - name: s3_bucket_name
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backup
                      key: s3_bucket_name
              command:
                - /bin/bash
                - -c
                - |
                  echo "Validating PostgreSQL backups..."

                  # Check if latest backup exists
                  latest_backup=$(barman-cloud-backup-list s3://pgbackup/ | head -1)
                  if [ -z "$latest_backup" ]; then
                    echo "ERROR: No backups found"
                    exit 1
                  fi

                  echo "Latest backup: $latest_backup"
                  server_name=http://192.168.8.102:9000
                  # Validate backup integrity
                  backup_info=$(barman-cloud-backup-show s3://pgbackup/ $latest_backup)
                  if echo "$backup_info" | grep -q "Status: DONE"; then
                    echo "SUCCESS: Backup validation passed"
                    exit 0
                  else
                    echo "ERROR: Backup validation failed"
                    exit 1
                  fi
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi

---
# Backup Cleanup CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup-cleanup
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql-backup
    app.kubernetes.io/component: cleanup
    app.kubernetes.io/part-of: postgresql
spec:
  # Run cleanup weekly on Saturday at 3 AM UTC
  schedule: "0 3 * * 6"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgresql-backup
            cnpg.io/backup-cleanup: "true"
        spec:
          restartPolicy: OnFailure
          serviceAccountName: postgres-backup
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
          containers:
            - name: backup-cleaner
              image: ghcr.io/cloudnative-pg/postgresql:17.2
              env:
                - name: minio_access_key_id
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backup
                      key: minio_access_key_id
                - name: minio_secret_access_key
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backup
                      key: minio_secret_access_key
                - name: s3_bucket_name
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backup
                      key: s3_bucket_name
                - name: barman_cloud_retention_policy
                  value: "90d"
              command:
                - /bin/bash
                - -c
                - |
                  echo "Cleaning up old PostgreSQL backups..."

                  # Apply retention policy
                  barman-cloud-backup-delete \
                    --retention-policy "$barman_cloud_retention_policy" \
                    s3://pgbackup/ \
                    postgres-v2

                  echo "Backup cleanup completed"
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi