---
# Backup Validation CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup-validation
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql-backup
    app.kubernetes.io/component: validation
    app.kubernetes.io/part-of: postgresql-enterprise
spec:
  schedule: "0 4 * * *"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgresql-backup
            cnpg.io/backup-validation: "true"
        spec:
          restartPolicy: OnFailure
          serviceAccountName: postgres-enterprise-backup
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
          containers:
            - name: backup-validator
              image: ghcr.io/cloudnative-pg/postgresql:17.2
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backup-secret
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backup-secret
                      key: AWS_SECRET_ACCESS_KEY
                - name: S3_BUCKET_NAME
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backup-secret
                      key: S3_BUCKET_NAME
              command:
                - /bin/bash
                - -c
                - |
                  echo "Validating PostgreSQL backups..."

                  # Check if latest backup exists
                  latest_backup=$(barman-cloud-backup-list s3://$S3_BUCKET_NAME/pgbackup/ | head -1)
                  if [ -z "$latest_backup" ]; then
                    echo "ERROR: No backups found"
                    exit 1
                  fi

                  echo "Latest backup: $latest_backup"

                  # Validate backup integrity
                  backup_info=$(barman-cloud-backup-show s3://$S3_BUCKET_NAME/pgbackup/ $latest_backup)
                  if echo "$backup_info" | grep -q "Status: DONE"; then
                    echo "SUCCESS: Backup validation passed"
                    exit 0
                  else
                    echo "ERROR: Backup validation failed"
                    exit 1
                  fi
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi

---
# Backup Cleanup CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup-cleanup
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql-backup
    app.kubernetes.io/component: cleanup
    app.kubernetes.io/part-of: postgresql-enterprise
spec:
  # Run cleanup weekly on Saturday at 3 AM UTC
  schedule: "0 3 * * 6"
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgresql-backup
            cnpg.io/backup-cleanup: "true"
        spec:
          restartPolicy: OnFailure
          serviceAccountName: postgres-enterprise-backup
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
          containers:
            - name: backup-cleaner
              image: ghcr.io/cloudnative-pg/postgresql:17.2
              env:
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backup-secret
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backup-secret
                      key: AWS_SECRET_ACCESS_KEY
                - name: S3_BUCKET_NAME
                  valueFrom:
                    secretKeyRef:
                      name: postgres-backup-secret
                      key: S3_BUCKET_NAME
                - name: RETENTION_POLICY
                  value: "90d"
              command:
                - /bin/bash
                - -c
                - |
                  echo "Cleaning up old PostgreSQL backups..."

                  # Apply retention policy
                  barman-cloud-backup-delete \
                    --retention-policy "$RETENTION_POLICY" \
                    s3://$S3_BUCKET_NAME/pgbackup/ \
                    postgres-v2

                  echo "Backup cleanup completed"
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi