---
# Backup Secret for S3 Configuration
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-backup-credentials
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql-backup
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: postgresql-enterprise
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: postgres-backup-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
          backup.cnpg.io/credentials: "true"
      data:
        minio_access_key_id: "{{ .AWS_ACCESS_KEY_ID }}"
        minio_secret_access_key: "{{ .AWS_SECRET_ACCESS_KEY }}"
        minio_region: "{{ .AWS_REGION }}"
        minio_session_token: "{{ .AWS_SESSION_TOKEN }}"
        backup_encryption_key: "{{ .BACKUP_ENCRYPTION_KEY }}"
        backup_signing_key: "{{ .BACKUP_SIGNING_KEY }}"
        s3_endpoint_url: "{{ .S3_ENDPOINT_URL }}"
        s3_bucket_name: "{{ .S3_BUCKET_NAME }}"
        s3_prefix: "{{ .S3_PREFIX }}"
        barman_cloud_retention_policy: "{{ .BARMAN_CLOUD_RETENTION_POLICY }}"
        barman_cloud_compression: "{{ .BARMAN_CLOUD_COMPRESSION }}"
  dataFrom:
    - extract:
        key: postgres-backup