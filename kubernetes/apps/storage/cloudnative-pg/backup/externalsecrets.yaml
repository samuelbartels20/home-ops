---
# Backup Secret for S3 Configuration
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-backup
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: postgresql
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: postgres-backup
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
          backup.cnpg.io/credentials: "true"
      data:
        # S3 credentials for backup storage
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"
        AWS_REGION: "{{ .AWS_REGION }}"
        AWS_SESSION_TOKEN: "{{ .AWS_SESSION_TOKEN }}"

        # Backup encryption keys
        BACKUP_ENCRYPTION_KEY: "{{ .BACKUP_ENCRYPTION_KEY }}"
        BACKUP_SIGNING_KEY: "{{ .BACKUP_SIGNING_KEY }}"

        # Additional S3 configuration
        S3_ENDPOINT_URL: "{{ .S3_ENDPOINT_URL }}"
        S3_BUCKET_NAME: "{{ .S3_BUCKET_NAME }}"
        S3_PREFIX: "{{ .S3_PREFIX }}"

        # Barman configuration
        BARMAN_CLOUD_RETENTION_POLICY: "{{ .BARMAN_CLOUD_RETENTION_POLICY }}"
        BARMAN_CLOUD_COMPRESSION: "{{ .BARMAN_CLOUD_COMPRESSION }}"
  dataFrom:
    - extract:
        key: postgres-backup