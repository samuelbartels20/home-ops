---
# Backup Secret for S3 Configuration
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres-backup
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql-backup
    app.kubernetes.io/component: credentials
    app.kubernetes.io/part-of: postgresql
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: postgres-backup
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
          backup.cnpg.io/credentials: "true"
      data:
        minio_access_key_id: "{{ .minio_access_key_id }}"
        minio_secret_access_key: "{{ .minio_secret_access_key }}"
        minio_region: "{{ .minio_region }}"
        minio_session_token: "{{ .minio_session_token }}"
        backup_encryption_key: "{{ .backup_encryption_key }}"
        backup_signing_key: "{{ .backup_signing_key }}"
        s3_endpoint_url: "{{ .s3_endpoint_url }}"
        s3_bucket_name: "{{ .s3_bucket_name }}"
        s3_prefix: "{{ .s3_prefix }}"
        barman_cloud_retention_policy: "{{ .barman_cloud_retention_policy }}"
        barman_cloud_compression: "{{ .barman_cloud_compression }}"
  dataFrom:
    - extract:
        key: postgres-backup