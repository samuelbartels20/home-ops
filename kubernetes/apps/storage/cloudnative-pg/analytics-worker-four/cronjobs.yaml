---

apiVersion: batch/v1
kind: CronJob
metadata:
  name: analytics-optimization
  namespace: storage
  labels:
    app.kubernetes.io/name: analytics-optimization
    app.kubernetes.io/component: maintenance
    app.kubernetes.io/part-of: postgresql
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: postgres-query-accelerator
          containers:
            - name: optimization
              image: postgres:17.2
              command: ["/bin/bash", "-c"]
              args:
                - |
                  export PGPASSWORD=$POSTGRES_PASSWORD

                  psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB <<EOF

                  SELECT analytics.optimize_columnar_table('analytics.transactions_fact');

                  SELECT analytics.refresh_materialized_views();

                  ANALYZE analytics.transactions_fact;
                  ANALYZE analytics.customers_dim;
                  ANALYZE analytics.products_dim;

                  VACUUM ANALYZE analytics.metrics_timeseries;

                  SELECT 'Analytics optimization completed at ' || NOW();

                  EOF

              env:
                - name: POSTGRES_HOST
                  value: "postgres-analytics-engine-rw.storage.svc.cluster.local"
                - name: POSTGRES_PORT
                  value: "5432"
                - name: POSTGRES_DB
                  value: "analytics"
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-analytics
                      key: username
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-analytics
                      key: password

              resources:
                requests:
                  cpu: "500m"
                  memory: "512Mi"
                limits:
                  cpu: "1000m"
                  memory: "1Gi"

          restartPolicy: OnFailure