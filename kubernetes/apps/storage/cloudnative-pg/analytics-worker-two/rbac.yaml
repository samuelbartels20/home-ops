---
# ServiceAccount for PostgreSQL cluster operations
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudnative-pg-analytics-worker-two-sa
  namespace: storage

---
# ServiceAccount for PostgreSQL instance operations
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudnative-pg-analytics-worker-two
  namespace: storage
  labels:
    app.kubernetes.io/name: cloudnative-pg-analytics-worker-two
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: cloudnative-pg-analytics-worker-two
  annotations:
    kubernetes.io/service-account.name: cloudnative-pg-analytics-worker-two
automountServiceAccountToken: true

---
# Role for PostgreSQL cluster management
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudnative-pg-analytics-worker-two
  namespace: storage
rules:
  # Pod management
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Service management
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ConfigMap and Secret management
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # PersistentVolumeClaim management
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Events
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]

  # Jobs for backup/restore operations
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # CronJobs for scheduled operations
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # StatefulSet management
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Deployment management
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # ReplicaSet management
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Monitoring resources
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "prometheusrules", "podmonitors"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Network policies
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Ingress management
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # HorizontalPodAutoscaler
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # PodDisruptionBudget
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
# ClusterRole for cross-namespace operations
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudnative-pg-analytics-worker-two
rules:
  # Node access for monitoring
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]

  # Namespace access
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]

  # PersistentVolume access
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # StorageClass access
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]

  # PriorityClass access
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list", "watch"]

  # Custom Resource Definitions
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]

  # CloudNativePG CRDs
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups", "scheduledbackups", "poolers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
# RoleBinding for namespace-scoped permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudnative-pg-analytics-worker-two
  namespace: storage
subjects:
  - kind: ServiceAccount
    name: cloudnative-pg-analytics-worker-two
    namespace: storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudnative-pg-analytics-worker-two

---
# ClusterRoleBinding for cluster-scoped permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudnative-pg-analytics-worker-two
subjects:
  - kind: ServiceAccount
    name: cloudnative-pg-analytics-worker-two
    namespace: storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloudnative-pg-analytics-worker-two

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudnative-pg-analytics-worker-two
  namespace: storage
  labels:
    app.kubernetes.io/name: cloudnative-pg-analytics-worker-two
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: cloudnative-pg-analytics-worker-two
  annotations:
    kubernetes.io/service-account.name: cloudnative-pg-analytics-worker-two
automountServiceAccountToken: true

---
# ClusterRole for CloudNative PostgreSQL Operator
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudnative-pg-analytics-worker-two
  labels:
    app.kubernetes.io/name: cloudnative-pg-analytics-worker-two
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: cloudnative-pg-analytics-worker-two
rules:
  # Core Kubernetes API permissions
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services", "persistentvolumeclaims", "pods", "events"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

  - apiGroups: [""]
    resources: ["pods/exec", "pods/log"]
    verbs: ["create", "get", "list", "watch"]

  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]

  # Apps API permissions
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

  # Policy API permissions
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

  # RBAC permissions for service accounts
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

  # CloudNative PostgreSQL CRD permissions
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "poolers", "backups", "scheduledbackups"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters/status", "poolers/status", "backups/status", "scheduledbackups/status"]
    verbs: ["get", "patch", "update"]

  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters/finalizers", "poolers/finalizers", "backups/finalizers", "scheduledbackups/finalizers"]
    verbs: ["update"]

  # Monitoring permissions
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["podmonitors", "servicemonitors"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

  # Storage permissions
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]

  # Volume snapshot permissions
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots", "volumesnapshotcontents", "volumesnapshotclasses"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

  # Metrics and coordination
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

  # Admission controller permissions
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

---
# ClusterRoleBinding for CloudNative PostgreSQL Operator
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudnative-pg-analytics-worker-two
  labels:
    app.kubernetes.io/name: cloudnative-pg
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: cloudnative-pg-analytics-worker-two
roleRef:
  apiGroup: rbac.authorization.k8s.io
