---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudnative-pg-analytics-coordinator
  namespace: storage
  labels:
    app.kubernetes.io/name: cloudnative-pg-analytics-coordinator
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: postgresql
  annotations:
    kubernetes.io/service-account.name: cloudnative-pg-analytics-coordinator
automountServiceAccountToken: true

---
# Role: Instance (namespaced)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudnative-pg-analytics-coordinator-instance
  namespace: storage
  labels:
    app.kubernetes.io/name: cloudnative-pg-analytics-coordinator
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: postgresql
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "pods", "services", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

---
# RoleBinding: Instance
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudnative-pg-analytics-coordinator-instance
  namespace: storage
  labels:
    app.kubernetes.io/name: cloudnative-pg-analytics-coordinator
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: postgresql
subjects:
  - kind: ServiceAccount
    name: cloudnative-pg-analytics-coordinator
    namespace: storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudnative-pg-analytics-coordinator-instance

---
# Role: Backup (namespaced)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudnative-pg-analytics-coordinator-backup
  namespace: storage
  labels:
    app.kubernetes.io/name: cloudnative-pg-analytics-coordinator
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: postgresql
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

---
# RoleBinding: Backup
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudnative-pg-analytics-coordinator-backup
  namespace: storage
  labels:
    app.kubernetes.io/name: cloudnative-pg-analytics-coordinator
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: postgresql
subjects:
  - kind: ServiceAccount
    name: cloudnative-pg-analytics-coordinator
    namespace: storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudnative-pg-analytics-coordinator-backup

---
# Role: Monitoring (namespaced)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudnative-pg-analytics-coordinator-monitoring
  namespace: storage
  labels:
    app.kubernetes.io/name: cloudnative-pg-analytics-coordinator
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: postgresql
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]

---
# RoleBinding: Monitoring
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudnative-pg-analytics-coordinator-monitoring
  namespace: storage
  labels:
    app.kubernetes.io/name: cloudnative-pg-analytics-coordinator
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: postgresql
subjects:
  - kind: ServiceAccount
    name: cloudnative-pg-analytics-coordinator
    namespace: storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudnative-pg-analytics-coordinator-monitoring

---
# ClusterRole: Instance (cross-namespace basics and CNPG CRDs)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudnative-pg-analytics-coordinator-instance
  labels:
    app.kubernetes.io/name: cloudnative-pg-analytics-coordinator
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: postgresql
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "poolers", "backups", "scheduledbackups"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters/status", "poolers/status", "backups/status", "scheduledbackups/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters/finalizers", "poolers/finalizers", "backups/finalizers", "scheduledbackups/finalizers"]
    verbs: ["update"]

---
# ClusterRoleBinding: Instance
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudnative-pg-analytics-coordinator-instance
  labels:
    app.kubernetes.io/name: cloudnative-pg-analytics-coordinator
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: postgresql
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloudnative-pg-analytics-coordinator-instance
subjects:
  - kind: ServiceAccount
    name: cloudnative-pg-analytics-coordinator
    namespace: storage

---
# ClusterRole: Backup (snapshot classes and PV visibility)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudnative-pg-analytics-coordinator-backup
  labels:
    app.kubernetes.io/name: cloudnative-pg-analytics-coordinator
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: postgresql
rules:
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshotclasses", "volumesnapshotcontents"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch"]

---
# ClusterRoleBinding: Backup
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudnative-pg-analytics-coordinator-backup
  labels:
    app.kubernetes.io/name: cloudnative-pg-analytics-coordinator
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: postgresql
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloudnative-pg-analytics-coordinator-backup
subjects:
  - kind: ServiceAccount
    name: cloudnative-pg-analytics-coordinator
    namespace: storage

---
# ClusterRole: Monitoring (cross-namespace read + optional monitor management)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudnative-pg-analytics-coordinator-monitoring
  labels:
    app.kubernetes.io/name: cloudnative-pg-analytics-coordinator
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: postgresql
rules:
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["podmonitors", "servicemonitors"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

---
# ClusterRoleBinding: Monitoring
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudnative-pg-analytics-coordinator-monitoring
  labels:
    app.kubernetes.io/name: cloudnative-pg-analytics-coordinator
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: postgresql
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloudnative-pg-analytics-coordinator-monitoring
subjects:
  - kind: ServiceAccount
    name: cloudnative-pg-analytics-coordinator
    namespace: storage