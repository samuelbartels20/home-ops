---
# PgBouncer Configuration ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: postgresql
data:
  pgbouncer.ini: |
    [databases]
    postgres = host=192.168.8.161 port=5432 dbname=postgres pool_size=25 reserve_pool=5
    application_db = host=192.168.8.161 port=5432 dbname=application_db pool_size=30 reserve_pool=5
    * = host=192.168.8.161 port=5432

    [pgbouncer]
    # Network settings
    listen_addr = 0.0.0.0
    listen_port = 5432
    unix_socket_dir = /tmp
    unix_socket_mode = 0777

    # Authentication
    auth_type = scram-sha-256
    auth_file = /etc/pgbouncer/auth/userlist.txt
    auth_user = pgbouncer
    auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename=$1

    # Pool settings
    pool_mode = transaction
    max_client_conn = 1000
    default_pool_size = 25
    min_pool_size = 5
    reserve_pool_size = 5
    reserve_pool_timeout = 5
    max_db_connections = 100
    max_user_connections = 100

    # Connection settings
    server_reset_query = DISCARD ALL
    server_check_delay = 30
    server_check_query = SELECT 1
    server_lifetime = 3600
    server_idle_timeout = 600

    # Client settings
    client_idle_timeout = 0
    client_login_timeout = 60

    # Query settings
    query_timeout = 0
    query_wait_timeout = 120
    cancel_delay = 10

    # Network timeouts
    tcp_defer_accept = 0
    tcp_keepalive = 1
    tcp_keepcnt = 3
    tcp_keepidle = 600
    tcp_keepintvl = 30
    tcp_user_timeout = 30000

    # Buffer settings
    pkt_buf = 4096
    max_packet_size = 2147483647
    listen_backlog = 128

    # Logging
    syslog = 0
    syslog_facility = daemon
    syslog_ident = pgbouncer
    log_connections = 1
    log_disconnections = 1
    log_pooler_errors = 1
    log_stats = 1
    stats_period = 60

    # Administration
    admin_users = pgbouncer,postgres
    stats_users = pgbouncer,postgres

    # DNS
    dns_max_ttl = 15
    dns_nxdomain_ttl = 15

    # Application name support
    application_name_add_host = 1

    # Ignore startup parameters
    ignore_startup_parameters = extra_float_digits,geqo,search_path

  userlist.txt: |
    # PgBouncer user authentication
    "pgbouncer" "SCRAM-SHA-256$4096:..."
    "postgres" "SCRAM-SHA-256$4096:..."