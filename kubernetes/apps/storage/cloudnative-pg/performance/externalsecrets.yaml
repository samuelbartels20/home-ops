---
# PgBouncer Authentication Secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pgbouncer-auth
  namespace: storage
  labels:
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/component: authentication
    app.kubernetes.io/part-of: postgresql-enterprise
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: pgbouncer-auth-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        userlist.txt: |
          "pgbouncer" "{{ .PGBOUNCER_PASSWORD }}"
          "postgres" "{{ .POSTGRES_PASSWORD }}"
  data:
    - secretKey: PGBOUNCER_PASSWORD
      remoteRef:
        key: postgres-credentials
        property: PGBOUNCER_PASSWORD
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: postgres-credentials
        property: POSTGRES_PASSWORD

---
# PgBouncer Exporter Secret
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pgbouncer-exporter
  namespace: storage
  labels:
    app.kubernetes.io/name: pgbouncer-exporter
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: postgresql-enterprise
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: pgbouncer-exporter-secret
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: postgres-credentials
        property: PGBOUNCER_PASSWORD