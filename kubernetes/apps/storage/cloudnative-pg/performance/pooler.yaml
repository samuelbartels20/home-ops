---
# PgBouncer Connection Pooler
# High-performance connection pooling for PostgreSQL
apiVersion: postgresql.cnpg.io/v1
kind: Pooler
metadata:
  name: pgbouncer-pooler
  namespace: storage
  labels:
    app.kubernetes.io/name: pgbouncer-pooler
    app.kubernetes.io/component: connection-pooler
    app.kubernetes.io/part-of: postgresql
    environment: production
    tier: database
  annotations:
    pooler.cnpg.io/type: "pgbouncer"
    pooler.cnpg.io/mode: "transaction"
    pooler.cnpg.io/pool-size: "large"
    pooler.cnpg.io/max-db-connections: "1000"
spec:
  cluster:
    name: postgres

  # High availability configuration
  instances: 3

  # PgBouncer configuration
  type: rw

  # Pooling configuration
  pgbouncer:
    # Connection pooling settings
    poolMode: transaction
    parameters:
      max_client_conn: "1000"
      default_pool_size: "20"
      reserve_pool_size: "5"
      max_db_connections: "100"
      max_user_connections: "100"
      server_reset_query: "DISCARD ALL"
      server_check_query: "select 1"
      application_name_add_host: "1"

    # Performance tuning
    serverCheckDelay: 30
    serverLifetime: 3600
    serverIdleTimeout: 600
    clientIdleTimeout: 0
    clientLoginTimeout: 60

    # Authentication and security
    authType: scram-sha-256
    authHbaFile: |
      # TYPE  DATABASE    USER        ADDRESS         METHOD
      host    all         all         0.0.0.0/0       scram-sha-256
      host    all         all         ::/0            scram-sha-256

    authUser: pgbouncer
    authQuery: "SELECT usename, passwd FROM pg_shadow WHERE usename=$1"

    # Connection management
    tcpKeepalive: true
    tcpKeepaliveIdle: 600
    tcpKeepaliveInterval: 30
    tcpKeepaliveCount: 3
    tcpUserTimeout: 30000

    # Query settings
    queryTimeout: 0
    queryWaitTimeout: 120
    cancelDelay: 10
    pktBuf: 4096

    # Logging and monitoring
    logConnections: true
    logDisconnections: true
    logPoolerErrors: true

    # Administrative settings
    adminUsers: "pgbouncer,postgres"
    statsUsers: "pgbouncer,postgres"

    # Database-specific settings
    databases:
      postgres:
        host: 192.168.8.101
        port: 5432
        dbname: postgres
        pool_size: 25
        reserve_pool: 5
        max_db_connections: 50

      application_db:
        host: 192.168.8.101
        port: 5432
        dbname: application_db
        pool_size: 30
        reserve_pool: 5
        max_db_connections: 60

  # Template for PgBouncer pods
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgbouncer-pooler
        app.kubernetes.io/component: connection-pooler
        app.kubernetes.io/part-of: postgresql
        monitoring: enabled
        backup: not-required
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9127"
        prometheus.io/path: "/metrics"
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"

    spec:
      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault

      # Resource allocation for pooler containers
      containers:
        - name: pgbouncer
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

      # Affinity and anti-affinity
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: pgbouncer-pooler
                  cnpg.io/pooler: pgbouncer-pooler
              topologyKey: kubernetes.io/hostname

      # Priority class
      priorityClassName: system-cluster-critical

  # Service template
  serviceTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: pgbouncer-pooler
        app.kubernetes.io/component: connection-pooler
        service-type: database-pooler
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
        service.beta.kubernetes.io/aws-load-balancer-internal: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port: "9127"
        prometheus.io/path: "/metrics"
    spec:
      type: LoadBalancer
      sessionAffinity: ClientIP
      sessionAffinityConfig:
        clientIP:
          timeoutSeconds: 10800
      ports:
        - name: postgresql
          port: 5432
          targetPort: 5432
          protocol: TCP
        - name: metrics
          port: 9127
          targetPort: 9127
          protocol: TCP