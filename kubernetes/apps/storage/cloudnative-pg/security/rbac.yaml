---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-operator
  namespace: storage
  labels:
    app.kubernetes.io/name: cloudnative-pg
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: postgresql
  annotations:
    kubernetes.io/service-account.name: postgres-operator
automountServiceAccountToken: true

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-instance
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: postgresql
  annotations:
    kubernetes.io/service-account.name: postgres-instance
automountServiceAccountToken: true

---
# ClusterRole for CloudNative PostgreSQL Operator
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: postgres-operator
  labels:
    app.kubernetes.io/name: cloudnative-pg
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: postgresql
rules:
  # Core Kubernetes API permissions
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services", "persistentvolumeclaims", "pods", "events"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

  - apiGroups: [""]
    resources: ["pods/exec", "pods/log"]
    verbs: ["create", "get", "list", "watch"]

  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]

  # Apps API permissions
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

  # Policy API permissions
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

  # RBAC permissions for service accounts
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["rolebindings"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

  # CloudNative PostgreSQL CRD permissions
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "poolers", "backups", "scheduledbackups"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters/status", "poolers/status", "backups/status", "scheduledbackups/status"]
    verbs: ["get", "patch", "update"]

  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters/finalizers", "poolers/finalizers", "backups/finalizers", "scheduledbackups/finalizers"]
    verbs: ["update"]

  # Monitoring permissions
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["podmonitors", "servicemonitors"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

  # Storage permissions
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]

  # Volume snapshot permissions
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots", "volumesnapshotcontents", "volumesnapshotclasses"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

  # Metrics and coordination
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

  # Admission controller permissions
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["mutatingwebhookconfigurations", "validatingwebhookconfigurations"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

---
# ClusterRoleBinding for CloudNative PostgreSQL Operator
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: postgres-operator
  labels:
    app.kubernetes.io/name: cloudnative-pg
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: postgresql
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: postgres-operator
subjects:
  - kind: ServiceAccount
    name: postgres-operator
    namespace: storage

---
# Role for PostgreSQL Instance Management
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-instance
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: postgresql
rules:
  # ConfigMap permissions for PostgreSQL configuration
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]

  # Secret permissions for credentials
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]

  # Pod permissions for instance management
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  # Service permissions for networking
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]

  # Event permissions for logging
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

  # Lease permissions for leader election
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

---
# RoleBinding for PostgreSQL Instance
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-instance
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: postgresql
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: postgres-instance
subjects:
  - kind: ServiceAccount
    name: postgres-instance
    namespace: storage

---
# Role for Backup Operations
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-backup
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql-backup
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: postgresql
rules:
  # Secret permissions for backup credentials
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]

  # ConfigMap permissions for backup configuration
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]

  # Pod permissions for backup jobs
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]

  # Job permissions for backup scheduling
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

  # Event permissions for backup logging
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]

  # Volume snapshot permissions
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

---
# ServiceAccount for Backup Operations
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-backup
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql-backup
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: postgresql
  annotations:
    kubernetes.io/service-account.name: postgres-backup
automountServiceAccountToken: true

---
# RoleBinding for Backup Operations
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-backup
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql-backup
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: postgresql
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: postgres-backup
subjects:
  - kind: ServiceAccount
    name: postgres-backup
    namespace: storage

---
# Role for Monitoring Integration
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: postgres-monitoring
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql-monitoring
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: postgresql
rules:
  # Pod permissions for metrics collection
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  # Service permissions for service discovery
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    verbs: ["get", "list", "watch"]

  # ConfigMap permissions for monitoring configuration
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]

---
# ServiceAccount for Monitoring
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-monitoring
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql-monitoring
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: postgresql
  annotations:
    kubernetes.io/service-account.name: postgres-monitoring
automountServiceAccountToken: true

---
# RoleBinding for Monitoring
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: postgres-monitoring
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql-monitoring
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: postgresql
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: postgres-monitoring
subjects:
  - kind: ServiceAccount
    name: postgres-monitoring
    namespace: storage

---
# ClusterRole for cross-namespace monitoring (if needed)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: postgres-monitoring-cluster
  labels:
    app.kubernetes.io/name: postgresql-monitoring
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: postgresql
rules:
  # Read-only access to nodes for monitoring
  - apiGroups: [""]
    resources: ["nodes", "nodes/metrics"]
    verbs: ["get", "list", "watch"]

---
# ClusterRoleBinding for cross-namespace monitoring
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: postgres-monitoring-cluster
  labels:
    app.kubernetes.io/name: postgresql-monitoring
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: postgresql
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: postgres-monitoring-cluster
subjects:
  - kind: ServiceAccount
    name: postgres-monitoring
    namespace: storage