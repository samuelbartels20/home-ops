---
# Pod Security Standards for PostgreSQL
apiVersion: v1
kind: Namespace
metadata:
  name: storage
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/part-of: postgresql
  annotations:
    seccomp.security.alpha.kubernetes.io/defaultProfileName: runtime/default
    seccomp.security.alpha.kubernetes.io/allowedProfileNames: runtime/default
    apparmor.security.beta.kubernetes.io/defaultProfileName: runtime/default
    apparmor.security.beta.kubernetes.io/allowedProfileNames: runtime/default

---
# Security Context Constraints
apiVersion: v1
kind: Pod
metadata:
  name: postgres-security-template
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: security-template
    app.kubernetes.io/part-of: postgresql
    security.kubernetes.io/policy: restricted
    security.cnpg.io/hardened: "true"
  annotations:
    # Pod Security Standards
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

    # Security scanning
    security.alpha.kubernetes.io/sysctls: "net.core.somaxconn=65535"
    security.alpha.kubernetes.io/seccomp: runtime/default

    # Compliance annotations
    compliance.cnpg.io/sox: "required"
    compliance.cnpg.io/pci-dss: "applicable"
    compliance.cnpg.io/gdpr: "required"
    compliance.cnpg.io/hipaa: "applicable"

    # Security hardening
    hardening.cnpg.io/version: "v1.0"
    hardening.cnpg.io/profile: "standard"
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 999
    fsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: postgres
      image: ghcr.io/cloudnative-pg/postgresql:17.2
      imagePullPolicy: IfNotPresent
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true

      # Resource Management
      resources:
        requests:
          cpu: "2000m"
          memory: "8Gi"
          ephemeral-storage: "10Gi"
        limits:
          cpu: "8000m"
          memory: "16Gi"
          ephemeral-storage: "20Gi"

      # Environment Variables (secure)
      env:
        - name: PGUSER
          value: "postgres"
        - name: POSTGRES_DB
          value: "postgres"
        - name: PGTZ
          value: "UTC"
        - name: TZ
          value: "UTC"

        # Security-related environment variables
        - name: POSTGRES_INITDB_ARGS
          value: "--data-checksums --encoding=UTF8 --locale=C"
        - name: POSTGRES_HOST_AUTH_METHOD
          value: "scram-sha-256"

      # Volume Mounts with security constraints
      volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
          readOnly: false
        - name: pgwal
          mountPath: /var/lib/postgresql/wal
          readOnly: false
        - name: tmp
          mountPath: /tmp
          readOnly: false
        - name: run
          mountPath: /var/run/postgresql
          readOnly: false
        - name: config
          mountPath: /etc/postgresql
          readOnly: true
        - name: tls-certs
          mountPath: /etc/ssl/certs/postgresql
          readOnly: true

      # Health Probes
      livenessProbe:
        httpGet:
          path: /readyz
          port: 8000
          scheme: HTTP
        initialDelaySeconds: 30
        periodSeconds: 30
        timeoutSeconds: 10
        failureThreshold: 3
        successThreshold: 1

      readinessProbe:
        httpGet:
          path: /readyz
          port: 8000
          scheme: HTTP
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
        successThreshold: 1

      startupProbe:
        httpGet:
          path: /readyz
          port: 8000
          scheme: HTTP
        initialDelaySeconds: 10
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 30
        successThreshold: 1

  # Init Containers for setup
  initContainers:
    - name: setup-permissions
      image: busybox:1.36
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
          add:
            - CHOWN
            - FOWNER
        seccompProfile:
          type: RuntimeDefault
      command:
        - sh
        - -c
        - |
          echo "Setting up PostgreSQL data directory permissions..."
          chown -R 999:999 /var/lib/postgresql/data
          chmod 750 /var/lib/postgresql/data
          chown -R 999:999 /var/lib/postgresql/wal
          chmod 750 /var/lib/postgresql/wal
          chown -R 999:999 /var/run/postgresql
          chmod 755 /var/run/postgresql
          echo "Permission setup completed"
      volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/data
        - name: pgwal
          mountPath: /var/lib/postgresql/wal
        - name: run
          mountPath: /var/run/postgresql
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 128Mi

  # Volumes with security constraints
  volumes:
    # PostgreSQL data storage
    - name: pgdata
      persistentVolumeClaim:
        claimName: pgdata-postgres-1

    # PostgreSQL WAL storage
    - name: pgwal
      persistentVolumeClaim:
        claimName: pgwal-postgres-1

    # Temporary directory
    - name: tmp
      emptyDir:
        sizeLimit: 1Gi

    # Runtime directory
    - name: run
      emptyDir:
        medium: Memory
        sizeLimit: 100Mi

    # Configuration from ConfigMap
    - name: config
      configMap:
        name: postgres-config
        defaultMode: 0444

    # TLS certificates
    - name: tls-certs
      secret:
        secretName: postgres-tls-certs
        defaultMode: 0400
        items:
          - key: tls.crt
            path: server.crt
          - key: tls.key
            path: server.key
          - key: ca.crt
            path: ca.crt

  # DNS Configuration
  dnsPolicy: ClusterFirst
  dnsConfig:
    options:
      - name: ndots
        value: "2"
      - name: edns0

  # Host settings
  hostNetwork: false
  hostPID: false
  hostIPC: false

  # Restart policy
  restartPolicy: Always

  # Termination settings
  terminationGracePeriodSeconds: 180

  # Image pull settings
  imagePullSecrets:
    - name: postgres-registry-secret

---
# Security Configuration ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-security-config
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: security-config
    app.kubernetes.io/part-of: postgresql
data:
  # PostgreSQL security settings
  postgresql.conf: |
    # Security Settings
    ssl = on
    ssl_prefer_server_ciphers = on
    ssl_min_protocol_version = 'TLSv1.2'
    ssl_max_protocol_version = 'TLSv1.3'
    ssl_cert_file = '/etc/ssl/certs/postgresql/server.crt'
    ssl_key_file = '/etc/ssl/certs/postgresql/server.key'
    ssl_ca_file = '/etc/ssl/certs/postgresql/ca.crt'

    # Authentication
    password_encryption = scram-sha-256

    # Connection security
    tcp_keepalives_idle = 600
    tcp_keepalives_interval = 30
    tcp_keepalives_count = 3

    # Logging for security
    log_connections = on
    log_disconnections = on
    log_hostname = on
    log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
    log_statement = 'ddl'
    log_min_duration_statement = 1000

    # Security parameters
    shared_preload_libraries = 'pg_stat_statements'

  # Host-based authentication
  pg_hba.conf: |
    # TYPE  DATABASE        USER            ADDRESS                 METHOD

    # Local connections
    local   all             all                                     scram-sha-256

    # IPv4 local connections with SSL
    hostssl all             all             127.0.0.1/32            scram-sha-256

    # IPv6 local connections with SSL
    hostssl all             all             ::1/128                 scram-sha-256

    # Replication connections with SSL and certificates
    hostssl replication     streaming_replica 0.0.0.0/0            cert map=replication

    # Application connections with SSL
    hostssl all             all             0.0.0.0/0               scram-sha-256

    # Deny all other connections
    host    all             all             0.0.0.0/0               reject

  # User name mapping
  pg_ident.conf: |
    # MAPNAME       SYSTEM-USERNAME         PG-USERNAME
    replication     postgres                streaming_replica

  # Security audit configuration
  security-audit.conf: |
    # Audit configuration for compliance
    audit.log_catalog = on
    audit.log_client = on
    audit.log_level = log
    audit.log_parameter = on
    audit.log_relation = on
    audit.log_statement_once = off
    audit.role = 'auditor'

---
# Network Security Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-security-policy
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: network-security
    app.kubernetes.io/part-of: postgresql
    security-level: strict
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: postgres
  policyTypes:
    - Ingress
    - Egress

  ingress:
    # PostgreSQL connections from authorized clients only
    - from:
        - namespaceSelector:
            matchLabels:
              postgres-access: "allowed"
        - podSelector:
            matchLabels:
              postgres-client: "true"
      ports:
        - protocol: TCP
          port: 5432

    # Monitoring access
    - from:
        - namespaceSelector:
            matchLabels:
              name: observability
      ports:
        - protocol: TCP
          port: 9187  # Metrics
        - protocol: TCP
          port: 8000  # Health checks

    # Replication between PostgreSQL instances
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgres
      ports:
        - protocol: TCP
          port: 5432

  egress:
    # DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Replication to other PostgreSQL instances
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: postgres
      ports:
        - protocol: TCP
          port: 5432

    # Backup storage access (S3)
    - to: []
      ports:
        - protocol: TCP
          port: 443

    # Kubernetes API access
    - to: []
      ports:
        - protocol: TCP
          port: 6443