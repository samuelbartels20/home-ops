---
apiVersion: helm.toolkit.fluxcd.io/v2beta2
kind: HelmRelease
metadata:
  name: cloudnative-pg
  namespace: storage
spec:
  interval: 30m
  chart:
    spec:
      chart: cloudnative-pg
      version: 1.25.2
      sourceRef:
        kind: HelmRepository
        name: cloudnative-pg
        namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    crds:
      create: true
    config:
      data:
        INHERITED_ANNOTATIONS: "cnpg.io/*"
        BACKUP_OWNER_USER_ID: "999"
        BACKUP_OWNER_GROUP_ID: "999"
        BACKUP_COMPRESSION_TYPE: "gzip"
        BACKUP_COMPRESSION_LEVEL: "6"
        BACKUP_RETENTION_POLICY: "30d"
        BACKUP_DATA_PATH: "/var/lib/postgresql/data"
        BACKUP_WAL_PATH: "/var/lib/postgresql/wal"
        BACKUP_CONCURRENT_WORKERS: "4"
        BACKUP_CONCURRENT_COMPRESSION_WORKERS: "2"
        BACKUP_JOBS_RETENTION_POLICY: "24h"
        BACKUP_TARGET_PRIMARY: "false"
        BACKUP_TARGET_STANDBY: "true"
        BACKUP_JOBS_CLEANUP_TIME: "01:00"
        BACKUP_JOBS_CLEANUP_TTL: "24h"
        BACKUP_CONCURRENT_REQUEST_LIMIT: "10"
        BACKUP_CONCURRENT_UPLOAD_LIMIT: "10"
        BACKUP_CONCURRENT_DOWNLOAD_LIMIT: "10"
        BACKUP_CONCURRENT_RESTORE_JOBS_LIMIT: "2"
        BACKUP_CONCURRENT_RESTORE_WORKERS: "4"
        BACKUP_CONCURRENT_RESTORE_COMPRESSION_WORKERS: "2"
        BACKUP_RESTORE_JOBS_RETENTION_POLICY: "24h"
        BACKUP_RESTORE_JOBS_CLEANUP_TIME: "01:00"
        BACKUP_RESTORE_JOBS_CLEANUP_TTL: "24h"
        BACKUP_RESTORE_TARGET_TIME: ""
        BACKUP_RESTORE_TARGET_INCLUSIVE: "true"
        BACKUP_RESTORE_TARGET_TIMELINE: "current"
        BACKUP_RESTORE_TARGET_NAME: ""
        BACKUP_RESTORE_TARGET_LSN: ""
        BACKUP_RESTORE_TARGET_XID: ""
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION: "promote"
        BACKUP_RESTORE_RECOVERY_TARGET_TIMELINE: "latest"
        BACKUP_RESTORE_RECOVERY_TARGET_NAME: ""
        BACKUP_RESTORE_RECOVERY_TARGET_TIME: ""
        BACKUP_RESTORE_RECOVERY_TARGET_XID: ""
        BACKUP_RESTORE_RECOVERY_TARGET_LSN: ""
        BACKUP_RESTORE_RECOVERY_TARGET_INCLUSIVE: "true"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_TIMEOUT: "300"
        BACKUP_RESTORE_RECOVERY_TARGET_TIMELINE_LATEST: "true"
        BACKUP_RESTORE_RECOVERY_TARGET_IMMEDIATE: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_IMMEDIATE: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_PAUSE: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_SHUTDOWN: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_PROMOTE: "true"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_FOLLOW: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_STANDBY: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_TIMELINE: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_XLOG: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_TIME: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_NAME: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_LSN: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_XID: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_DELAY: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_FAST: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_IMMEDIATE_CHECKPOINT: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_EXCLUSIVE: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_INCLUSIVE: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_TIMELINE_HISTORY: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_TIMELINE_CONTROL: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_TIMELINE_CLEANUP: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_TIMELINE_SWITCH: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_TIMELINE_HISTORY_FILE: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_TIMELINE_CONTROL_FILE: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_TIMELINE_CLEANUP_FILE: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_TIMELINE_SWITCH_FILE: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_TIMELINE_HISTORY_DIR: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_TIMELINE_CONTROL_DIR: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_TIMELINE_CLEANUP_DIR: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_TIMELINE_SWITCH_DIR: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_TIMELINE_HISTORY_PATH: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_TIMELINE_CONTROL_PATH: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_TIMELINE_CLEANUP_PATH: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_TIMELINE_SWITCH_PATH: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_TIMELINE_HISTORY_FILE_PATH: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_TIMELINE_CONTROL_FILE_PATH: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_TIMELINE_CLEANUP_FILE_PATH: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_TIMELINE_SWITCH_FILE_PATH: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_TIMELINE_HISTORY_DIR_PATH: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_TIMELINE_CONTROL_DIR_PATH: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_TIMELINE_CLEANUP_DIR_PATH: "false"
        BACKUP_RESTORE_RECOVERY_TARGET_ACTION_TIMELINE_SWITCH_DIR_PATH: "false"