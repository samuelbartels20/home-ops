apiVersion: v1
kind: Service
metadata:
  name: cloudnative-pg
  namespace: storage
  labels:
    app.kubernetes.io/name: cloudnative-pg
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: storage
  annotations:
    description: "Primary service endpoint for CloudNativePG cluster."
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app.kubernetes.io/name: cloudnative-pg
    app.kubernetes.io/component: database
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600 