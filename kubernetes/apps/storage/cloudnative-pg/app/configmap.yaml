apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudnative-pg-config
  namespace: storage
  labels:
    app.kubernetes.io/name: cloudnative-pg
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: storage
  annotations:
    description: "Production PostgreSQL configuration for CloudNativePG cluster."
data:
  postgresql.conf: |
    log_statement = 'ddl'
    log_min_duration_statement = 500
    log_checkpoints = on
    log_connections = on
    log_disconnections = on
    log_lock_waits = on
    log_temp_files = 0
    log_autovacuum_min_duration = 0
    log_timezone = 'UTC'
    log_line_prefix = '%m [%p] %q%u@%d '
    log_error_verbosity = default
    log_directory = 'pg_log'
    log_filename = 'postgresql-%a.log'
    log_rotation_age = 1d
    log_rotation_size = 100MB

    shared_buffers = 4GB
    work_mem = 256MB
    maintenance_work_mem = 1GB
    effective_cache_size = 12GB
    temp_buffers = 64MB
    max_connections = 1000
    max_worker_processes = 16
    max_parallel_workers = 16
    max_parallel_workers_per_gather = 8
    max_parallel_maintenance_workers = 8
    parallel_tuple_cost = 0.1
    parallel_setup_cost = 1000.0

    wal_level = replica
    archive_mode = on
    archive_timeout = 60
    archive_command = 'test ! -f /archive/%f && cp %p /archive/%f'
    max_wal_senders = 20
    max_replication_slots = 20
    hot_standby = on
    synchronous_commit = remote_apply
    synchronous_standby_names = '*'
    wal_compression = on
    wal_buffers = 64MB
    checkpoint_completion_target = 0.9
    checkpoint_timeout = 15min

    password_encryption = scram-sha-256
    ssl = on
    ssl_ciphers = 'HIGH:!aNULL:!MD5'
    ssl_prefer_server_ciphers = on
    ssl_cert_file = '/etc/ssl/certs/tls.crt'
    ssl_key_file = '/etc/ssl/private/tls.key'
    ssl_ca_file = '/etc/ssl/certs/ca.crt'

    track_io_timing = on
    track_functions = all
    log_min_duration_statement = 500
    log_checkpoints = on
    log_autovacuum_min_duration = 0
    shared_preload_libraries = 'pg_stat_statements,auto_explain,pgaudit'
    pgaudit.log = 'all'
    pg_stat_statements.max = 10000
    pg_stat_statements.track = all
    auto_explain.log_min_duration = 500
    auto_explain.log_analyze = on
    auto_explain.log_buffers = on
    auto_explain.log_timing = on
    auto_explain.log_triggers = on
    auto_explain.log_verbose = on
    auto_explain.log_nested_statements = on

    statement_timeout = 30min
    lock_timeout = 2min
    idle_in_transaction_session_timeout = 10min
    deadlock_timeout = 5s


    effective_io_concurrency = 200
    maintenance_io_concurrency = 100
    random_page_cost = 1.1
    seq_page_cost = 1.0
    cpu_tuple_cost = 0.01
    cpu_index_tuple_cost = 0.005
    cpu_operator_cost = 0.0025
    jit = on
    jit_above_cost = 100000
    jit_inline_above_cost = 500000
    jit_optimize_above_cost = 500000 