# Complete deployment with advanced features
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: storage
resources:
  - helmrelease.yaml
  - configmap.yaml
  - rbac.yaml
  - service.yaml
  - prometheus-rules.yaml
commonLabels:
