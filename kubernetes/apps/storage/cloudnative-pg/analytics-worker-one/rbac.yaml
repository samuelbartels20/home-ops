---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudnative-pg-analytics-worker-one
  namespace: storage
automountServiceAccountToken: true

---
# Role: instance-level permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudnative-pg-analytics-worker-one-instance
  namespace: storage
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "services", "endpoints", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/exec"]
    verbs: ["get", "list", "watch", "create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

---
# Role: backup permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudnative-pg-analytics-worker-one-backup
  namespace: storage
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["snapshot.storage.k8s.io"]
    resources: ["volumesnapshots"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

---
# Role: monitoring permissions
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudnative-pg-analytics-worker-one-monitoring
  namespace: storage
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "configmaps"]
    verbs: ["get", "list", "watch"]

---
# RoleBinding: instance
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudnative-pg-analytics-worker-one-instance-rb
  namespace: storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudnative-pg-analytics-worker-one-instance
subjects:
  - kind: ServiceAccount
    name: cloudnative-pg-analytics-worker-one
    namespace: storage

---
# RoleBinding: backup
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudnative-pg-analytics-worker-one-backup-rb
  namespace: storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudnative-pg-analytics-worker-one-backup
subjects:
  - kind: ServiceAccount
    name: cloudnative-pg-analytics-worker-one
    namespace: storage

---
# RoleBinding: monitoring
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudnative-pg-analytics-worker-one-monitoring-rb
  namespace: storage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudnative-pg-analytics-worker-one-monitoring
subjects:
  - kind: ServiceAccount
    name: cloudnative-pg-analytics-worker-one
    namespace: storage

---
# ClusterRole: cluster-scoped read and CNPG CRDs
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudnative-pg-analytics-worker-one-cluster
rules:
  - apiGroups: [""]
    resources: ["nodes", "namespaces", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["scheduling.k8s.io"]
    resources: ["priorityclasses"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters", "backups", "scheduledbackups", "poolers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["podmonitors", "servicemonitors"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
# ClusterRoleBinding: bind cluster role to the SA
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudnative-pg-analytics-worker-one-cluster-rb
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloudnative-pg-analytics-worker-one-cluster
subjects:
  - kind: ServiceAccount
    name: cloudnative-pg-analytics-worker-one
    namespace: storage