---
apiVersion: v1
kind: Service
metadata:
  name: postgres-analytics-engine
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: service
    app.kubernetes.io/part-of: postgresql
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9187"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    postgresql: postgres-analytics-engine