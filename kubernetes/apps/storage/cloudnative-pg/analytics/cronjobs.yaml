---
# Automated Analytics Jobs
apiVersion: batch/v1
kind: CronJob
metadata:
  name: analytics-optimization
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: maintenance
    app.kubernetes.io/part-of: postgresql
spec:
  schedule: "0 2 * * *"  
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: postgres-query-accelerator
          containers:
            - name: optimization
              image: postgres:16.1
              command: ["/bin/bash", "-c"]
              args:
                - |
                  export PGPASSWORD=$POSTGRES_PASSWORD

                  # Connect to analytics database
                  psql -h $POSTGRES_HOST -U $POSTGRES_USER -d $POSTGRES_DB <<EOF

                  -- Optimize columnar tables
                  SELECT analytics.optimize_columnar_table('analytics.transactions_fact');

                  -- Refresh materialized views
                  SELECT analytics.refresh_materialized_views();

                  -- Update table statistics
                  ANALYZE analytics.transactions_fact;
                  ANALYZE analytics.customers_dim;
                  ANALYZE analytics.products_dim;

                  -- Vacuum and reindex if needed
                  VACUUM ANALYZE analytics.metrics_timeseries;

                  -- Report completion
                  SELECT 'Analytics optimization completed at ' || NOW();

                  EOF

              env:
                - name: POSTGRES_HOST
                  value: "192.168.1.101"
                - name: POSTGRES_PORT
                  value: "5432"
                - name: POSTGRES_DB
                  value: "analytics"
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-analytics-credentials
                      key: username
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-analytics-credentials
                      key: password

              resources:
                requests:
                  cpu: "500m"
                  memory: "512Mi"
                limits:
                  cpu: "1000m"
                  memory: "1Gi"

          restartPolicy: OnFailure