# yaml-language-server: $schema=https://datreeio.github.io/CRDs-catalog/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-analytics
  namespace: storage
  labels:
    app.kubernetes.io/name: postgres-analytics
    app.kubernetes.io/component: analytics
    app.kubernetes.io/part-of: postgresql
spec:
  imageName: "ghcr.io/samuelbartels20/postgres-cnpg-citus:17.2-citus12.1"
  instances: 5
  primaryUpdateStrategy: unsupervised
  
  storage:
    size: 50Gi  
    storageClass: openebs-hostpath  
    resizeInUseVolumes: true
  
  walStorage:
    size: 50Gi
    storageClass: openebs-hostpath
  
  tablespaces:
    - name: hot_data
      storage:
        size: 50Gi
        storageClass: openebs-hostpath
    - name: warm_data
      storage:
        size: 100Gi
        storageClass: openebs-hostpath
    - name: cold_data
      storage:
        size: 50Gi
        storageClass: openebs-hostpath

  superuserSecret:
    name: cloudnative-pg
  enableSuperuserAccess: true
  
  postgresql:
    shared_preload_libraries:
      - citus
      - timescaledb
      - pg_stat_statements
      - pg_hint_plan
      - pg_cron
      - hypopg
      - postgres_fdw
      - citus_columnar
      - auto_explain
    synchronous:
      method: any
      number: 2  
    
    parameters:
      max_connections: "1000"
      shared_buffers: 256MB  

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 640Mi

  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true

  monitoring:
    enablePodMonitor: true
    podMonitorMetricRelabelings:
      - { sourceLabels: ["cluster"], targetLabel: cnpg_cluster, action: replace }
      - { regex: cluster, action: labeldrop }

  backup:
    retentionPolicy: 90d  
    barmanObjectStore:
      data:
        compression: bzip2  
        jobs: 8  
      wal:
        compression: bzip2
        maxParallel: 16
      destinationPath: s3://pgbackup
      endpointURL: http://192.168.8.102:9000
      serverName: postgres-analytics-prod
      s3Credentials:
        accessKeyId:
          name: cloudnative-pg
          key: minio_access_key_id
        secretAccessKey:
          name: cloudnative-pg
          key: minio_secret_access_key

  bootstrap:
    initdb:
      database: analytics
      owner: analytics
      secret:
        name: postgres-analytics
      
      postInitSQL:
        - "CREATE EXTENSION IF NOT EXISTS citus CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS pg_partman CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS pg_stat_statements CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS pg_hint_plan CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS pg_cron CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS hypopg CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS postgres_fdw CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS dblink CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS pg_prewarm CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS auto_explain CASCADE;"
        
        - "CREATE EXTENSION IF NOT EXISTS citus_columnar CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS bloom CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS btree_gin CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS btree_gist CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS pg_trgm CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS pgstattuple CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS pg_buffercache CASCADE;"
        
        - "SELECT citus_set_coordinator_host('postgres-analytics-rw', 5432);"
        - "SELECT citus_add_node('postgres-analytics-r', 5432);"
        
        - "CREATE TABLESPACE hot_data LOCATION '/var/lib/postgresql/tablespaces/hot_data';"
        - "CREATE TABLESPACE warm_data LOCATION '/var/lib/postgresql/tablespaces/warm_data';"
        - "CREATE TABLESPACE cold_data LOCATION '/var/lib/postgresql/tablespaces/cold_data';"
        
        - "CREATE TABLE IF NOT EXISTS query_performance_log (logged_at timestamp, query_text text, duration_ms bigint, rows_affected bigint);"
        - "SELECT cron.schedule('vacuum-analyze', '0 2 * * *', 'VACUUM ANALYZE;');"
        - "SELECT cron.schedule('update-stats', '0 3 * * *', 'SELECT pg_stat_reset();');"