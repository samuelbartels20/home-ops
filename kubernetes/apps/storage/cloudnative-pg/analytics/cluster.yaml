apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-analytics-coordinator
  namespace: storage
  labels:
    app.kubernetes.io/name: postgres-analytics
    app.kubernetes.io/component: coordinator
    app.kubernetes.io/part-of: postgresql
spec:
  imageName: "ghcr.io/samuelbartels20/postgres-cnpg-citus:17.2-citus12.1"
  instances: 1
  primaryUpdateStrategy: unsupervised

  storage:
    size: 50Gi
    storageClass: openebs-hostpath
    resizeInUseVolumes: true
  walStorage:
    size: 50Gi
    storageClass: openebs-hostpath

  tablespaces:
    - name: hot_data
      storage: { size: 50Gi, storageClass: openebs-hostpath }
    - name: warm_data
      storage: { size: 100Gi, storageClass: openebs-hostpath }
    - name: cold_data
      storage: { size: 50Gi, storageClass: openebs-hostpath }

  superuserSecret:
    name: cloudnative-pg
  enableSuperuserAccess: true

  postgresql:
    shared_preload_libraries:
      - citus
      - pg_stat_statements
      - pg_cron
      - auto_explain
    synchronous:
      method: any
      number: 0
    parameters:
      max_connections: "200"
      shared_buffers: "160MB"
      pg_stat_statements.max: "10000"
      pg_stat_statements.track: "top"
      auto_explain.log_min_duration: "3s"
      auto_explain.log_analyze: "on"
      auto_explain.log_buffers: "on"
      auto_explain.log_nested_statements: "on"
      auto_explain.sample_rate: "0.1"

  resources:
    requests: { cpu: 50m, memory: 256Mi }
    limits:   { memory: 640Mi }

  monitoring:
    enablePodMonitor: true

  backup:
    retentionPolicy: 90d
    barmanObjectStore:
      data: { compression: bzip2, jobs: 8 }
      wal:  { compression: bzip2, maxParallel: 16 }
      destinationPath: s3://pgbackup
      endpointURL: http://192.168.8.102:9000
      serverName: postgres-analytics-prod
      s3Credentials:
        accessKeyId:      { name: cloudnative-pg, key: minio_access_key_id }
        secretAccessKey:  { name: cloudnative-pg, key: minio_secret_access_key }

  bootstrap:
    initdb:
      database: analytics
      owner: analytics
      secret: { name: postgres-analytics }
      postInitSQL:
        # Required extensions
        - "CREATE EXTENSION IF NOT EXISTS citus;"
        - "CREATE EXTENSION IF NOT EXISTS pg_stat_statements;"

        - "CREATE EXTENSION IF NOT EXISTS pg_cron;"
        - "CREATE EXTENSION IF NOT EXISTS citus_columnar;"
        - "CREATE EXTENSION IF NOT EXISTS pg_trgm;"
        - "CREATE EXTENSION IF NOT EXISTS postgres_fdw;"
        # Tablespaces (paths are mounted by CNPG)
        - "CREATE TABLESPACE hot_data  LOCATION '/var/lib/postgresql/tablespaces/hot_data';"
        - "CREATE TABLESPACE warm_data LOCATION '/var/lib/postgresql/tablespaces/warm_data';"
        - "CREATE TABLESPACE cold_data LOCATION '/var/lib/postgresql/tablespaces/cold_data';"

        - "ALTER SYSTEM SET citus.shard_count = '64';"
        - "ALTER SYSTEM SET citus.replication_factor = '2';"

        - "SELECT citus_add_node('postgres-analytics-worker-1-rw', 5432);"
        - "SELECT citus_add_node('postgres-analytics-worker-2-rw', 5432);"
        - "SELECT citus_add_node('postgres-analytics-worker-3-rw', 5432);"
        - "SELECT citus_add_node('postgres-analytics-worker-4-rw', 5432);"


        - "SELECT cron.schedule('vacuum-analyze-weekly', '0 3 * * 0', 'VACUUM ANALYZE;');"