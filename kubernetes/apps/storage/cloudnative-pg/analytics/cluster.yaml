---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-analytics
  namespace: storage
  labels:
    app.kubernetes.io/name: postgres-analytics
    app.kubernetes.io/component: analytics
    app.kubernetes.io/part-of: postgresql
  annotations:
    cnpg.io/analytics-engine: "enabled"
    cnpg.io/columnar-store: "citus"
    cnpg.io/query-acceleration: "enabled"
spec:
  instances: 5

  imageName: "ghcr.io/cloudnative-pg/postgresql:17.2"

  bootstrap:
    initdb:
      database: analytics
      owner: postgres
      secret:
        name: postgres-analytics
      postInitApplicationSQL:
        - "CREATE EXTENSION IF NOT EXISTS citus CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS columnar CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS pg_partman CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS pg_stat_statements CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS pg_hint_plan CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS hypopg CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS pg_cron CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS postgres_fdw CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS dblink CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS bloom CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS btree_gin CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS btree_gist CASCADE;"
        - "SELECT citus_set_coordinator_host('localhost', 5432);"

  postgresql:
    parameters:
      shared_buffers: "1GB"
      effective_cache_size: "1GB"
      work_mem: "128MB"
      maintenance_work_mem: "256MB"
      random_page_cost: "1.1"
      seq_page_cost: "1.0"
      cpu_tuple_cost: "0.01"
      cpu_index_tuple_cost: "0.005"
      cpu_operator_cost: "0.0025"
      max_worker_processes: "8"
      max_parallel_workers: "8"
      max_parallel_workers_per_gather: "4"
      max_parallel_maintenance_workers: "4"
      parallel_tuple_cost: "0.1"
      parallel_setup_cost: "1000.0"
      effective_io_concurrency: "100"
      maintenance_io_concurrency: "50"
      wal_buffers: "32MB"
      checkpoint_completion_target: "0.9"
      checkpoint_timeout: "15min"
      max_connections: "100"
      statement_timeout: "1h"
      lock_timeout: "1min"
      idle_in_transaction_session_timeout: "10min"
      columnar.compression: "pglz"
      columnar.compression_level: "7"
      columnar.chunk_group_row_limit: "50000"
      columnar.stripe_row_limit: "75000"
      citus.multi_shard_commit_protocol: "2pc"
      citus.enable_repartition_joins: "on"
      citus.enable_binary_protocol: "on"
      citus.max_adaptive_executor_pool_size: "8"
      citus.executor_slow_start_interval: "10ms"
      timescaledb.max_background_workers: "4"
      timescaledb.telemetry_level: "off"
      jit: "on"
      jit_above_cost: "100000"
      jit_inline_above_cost: "500000"
      jit_optimize_above_cost: "500000"
      track_io_timing: "on"
      track_functions: "all"
      log_min_duration_statement: "1000"
      log_checkpoints: "on"
      log_autovacuum_min_duration: "0"

  resources:
    requests:
      memory: "1Gi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  storage:
    size: "50Gi"
    storageClass: "openebs-hostpath"