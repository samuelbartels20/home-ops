---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-analytics-engine
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: columnar-engine
    app.kubernetes.io/part-of: postgresql
  annotations:
    cnpg.io/analytics-engine: "enabled"
    cnpg.io/columnar-store: "citus"
    cnpg.io/query-acceleration: "enabled"
spec:
  instances: 3

  imageName: postgres:16.1

  bootstrap:
    initdb:
      database: analytics
      owner: analytics_user
      secret:
        name: postgres-analytics-credentials
      postInitApplicationSQL:
        - "CREATE EXTENSION IF NOT EXISTS citus CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS columnar CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS pg_partman CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS timescaledb CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS pg_stat_statements CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS pg_hint_plan CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS hypopg CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS pg_cron CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS postgres_fdw CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS dblink CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS bloom CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS btree_gin CASCADE;"
        - "CREATE EXTENSION IF NOT EXISTS btree_gist CASCADE;"
        - "SELECT citus_set_coordinator_host('localhost', 5432);"

  postgresql:
    parameters:
      shared_buffers: "4GB"
      effective_cache_size: "12GB"
      work_mem: "256MB"
      maintenance_work_mem: "1GB"

    # Query planner optimization for analytics
      random_page_cost: "1.1"
      seq_page_cost: "1.0"
      cpu_tuple_cost: "0.01"
      cpu_index_tuple_cost: "0.005"
      cpu_operator_cost: "0.0025"

      # Parallel processing for analytics
      max_worker_processes: "16"
      max_parallel_workers: "16"
      max_parallel_workers_per_gather: "8"
      max_parallel_maintenance_workers: "8"
      parallel_tuple_cost: "0.1"
      parallel_setup_cost: "1000.0"

      # I/O optimization for large scans
      effective_io_concurrency: "200"
      maintenance_io_concurrency: "100"

      # WAL configuration for analytics loads
      wal_buffers: "64MB"
      checkpoint_completion_target: "0.9"
      checkpoint_timeout: "15min"

      # Connection and query management
      max_connections: "200"
      statement_timeout: "1h"
      lock_timeout: "1min"
      idle_in_transaction_session_timeout: "10min"

      # Columnar storage optimization
      columnar.compression: "pglz"
      columnar.compression_level: "9"
      columnar.chunk_group_row_limit: "100000"
      columnar.stripe_row_limit: "150000"

      # Citus distributed query optimization
      citus.multi_shard_commit_protocol: "2pc"
      citus.enable_repartition_joins: "on"
      citus.enable_binary_protocol: "on"
      citus.max_adaptive_executor_pool_size: "16"
      citus.executor_slow_start_interval: "10ms"

      # TimescaleDB configuration
      timescaledb.max_background_workers: "8"
      timescaledb.telemetry_level: "off"

      # Query optimization
      jit: "on"
      jit_above_cost: "100000"
      jit_inline_above_cost: "500000"
      jit_optimize_above_cost: "500000"

      # Statistics and monitoring
      track_io_timing: "on"
      track_functions: "all"
      log_min_duration_statement: "1000"
      log_checkpoints: "on"
      log_autovacuum_min_duration: "0"

      # Shared preload libraries
      shared_preload_libraries: "citus,columnar,timescaledb,pg_stat_statements,pg_hint_plan,pg_cron"

  # Resource allocation for analytics workloads
  resources:
    requests:
      memory: "8Gi"
      cpu: "4"
    limits:
      memory: "16Gi"
      cpu: "8"

  # High-performance storage for analytics
  storage:
    size: "1Ti"
    storageClass: "openebs-hostpath"

  # Monitoring for analytics workloads
  monitoring:
    enabled: true