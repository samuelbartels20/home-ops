---
# Analytics Engine Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-analytics-config
  namespace: storage
  labels:
    app.kubernetes.io/name: postgres-analytics
    app.kubernetes.io/component: configuration
data:
  # Analytics schema setup
  analytics-schema.sql: |
    -- Create analytics schema and tables
    CREATE SCHEMA IF NOT EXISTS analytics;

    -- Fact table for transaction analytics (columnar)
    CREATE TABLE analytics.transactions_fact (
        transaction_id BIGINT,
        user_id INTEGER,
        product_id INTEGER,
        timestamp TIMESTAMPTZ,
        amount DECIMAL(15,2),
        quantity INTEGER,
        category_id INTEGER,
        store_id INTEGER,
        payment_method VARCHAR(50),
        discount_amount DECIMAL(10,2),
        tax_amount DECIMAL(10,2),
        total_amount DECIMAL(15,2)
    ) USING columnar;

    -- Distribute the fact table across shards
    SELECT create_distributed_table('analytics.transactions_fact', 'user_id');

    -- Time-series table for metrics (TimescaleDB)
    CREATE TABLE analytics.metrics_timeseries (
        time TIMESTAMPTZ NOT NULL,
        metric_name VARCHAR(100) NOT NULL,
        value DOUBLE PRECISION,
        tags JSONB,
        tenant_id VARCHAR(50)
    );

    -- Convert to hypertable for time-series optimization
    SELECT create_hypertable('analytics.metrics_timeseries', 'time');

    -- Create continuous aggregates for real-time analytics
    CREATE MATERIALIZED VIEW analytics.hourly_metrics
    WITH (timescaledb.continuous) AS
    SELECT time_bucket('1 hour', time) AS hour,
           metric_name,
           tenant_id,
           avg(value) as avg_value,
           min(value) as min_value,
           max(value) as max_value,
           count(*) as count
    FROM analytics.metrics_timeseries
    GROUP BY hour, metric_name, tenant_id;

    -- Enable real-time aggregation
    SELECT add_continuous_aggregate_policy('analytics.hourly_metrics',
        start_offset => INTERVAL '3 hours',
        end_offset => INTERVAL '1 hour',
        schedule_interval => INTERVAL '1 hour');

    -- Customer dimension table (row-based for frequent updates)
    CREATE TABLE analytics.customers_dim (
        customer_id SERIAL PRIMARY KEY,
        customer_code VARCHAR(50) UNIQUE,
        first_name VARCHAR(100),
        last_name VARCHAR(100),
        email VARCHAR(255),
        phone VARCHAR(20),
        registration_date DATE,
        customer_tier VARCHAR(20),
        lifetime_value DECIMAL(15,2),
        last_purchase_date DATE,
        is_active BOOLEAN DEFAULT TRUE,
        created_at TIMESTAMPTZ DEFAULT NOW(),
        updated_at TIMESTAMPTZ DEFAULT NOW()
    );

    -- Distribute dimension table
    SELECT create_reference_table('analytics.customers_dim');

    -- Product dimension table (row-based)
    CREATE TABLE analytics.products_dim (
        product_id SERIAL PRIMARY KEY,
        product_code VARCHAR(50) UNIQUE,
        product_name VARCHAR(255),
        category_name VARCHAR(100),
        brand VARCHAR(100),
        unit_price DECIMAL(10,2),
        cost_price DECIMAL(10,2),
        is_active BOOLEAN DEFAULT TRUE,
        created_at TIMESTAMPTZ DEFAULT NOW(),
        updated_at TIMESTAMPTZ DEFAULT NOW()
    );

    -- Distribute product dimension
    SELECT create_reference_table('analytics.products_dim');

    -- Real-time analytics views
    CREATE VIEW analytics.real_time_sales AS
    SELECT
        DATE_TRUNC('hour', t.timestamp) as hour,
        COUNT(*) as transaction_count,
        SUM(t.total_amount) as total_revenue,
        AVG(t.total_amount) as avg_transaction_value,
        COUNT(DISTINCT t.user_id) as unique_customers,
        p.category_name,
        c.customer_tier
    FROM analytics.transactions_fact t
    JOIN analytics.products_dim p ON t.product_id = p.product_id
    JOIN analytics.customers_dim c ON t.user_id = c.customer_id
    WHERE t.timestamp >= NOW() - INTERVAL '24 hours'
    GROUP BY hour, p.category_name, c.customer_tier
    ORDER BY hour DESC;

    -- Customer analytics view
    CREATE VIEW analytics.customer_analytics AS
    SELECT
        c.customer_tier,
        COUNT(DISTINCT c.customer_id) as customer_count,
        AVG(c.lifetime_value) as avg_lifetime_value,
        SUM(CASE WHEN t.timestamp >= CURRENT_DATE - INTERVAL '30 days'
                 THEN t.total_amount ELSE 0 END) as revenue_30d,
        COUNT(CASE WHEN t.timestamp >= CURRENT_DATE - INTERVAL '30 days'
                   THEN t.transaction_id END) as transactions_30d
    FROM analytics.customers_dim c
    LEFT JOIN analytics.transactions_fact t ON c.customer_id = t.user_id
    GROUP BY c.customer_tier;

  # Performance optimization functions
  analytics-functions.sql: |
    -- Function to optimize table for analytics queries
    CREATE OR REPLACE FUNCTION analytics.optimize_columnar_table(table_name TEXT)
    RETURNS VOID LANGUAGE plpgsql AS $$
    BEGIN
        -- Compress columnar table
        EXECUTE format('SELECT columnar.alter_table_set_compression(%L, %L)',
                      table_name, 'pglz');

        -- Set optimal chunk size
        EXECUTE format('SELECT columnar.alter_table_set_chunk_group_row_limit(%L, %L)',
                      table_name, 100000);

        -- Analyze table for query planner
        EXECUTE format('ANALYZE %I', table_name);

        RAISE NOTICE 'Optimized columnar table: %', table_name;
    END;
    $$;

    -- Function to create analytics indexes
    CREATE OR REPLACE FUNCTION analytics.create_analytics_indexes()
    RETURNS VOID LANGUAGE plpgsql AS $$
    BEGIN
        -- Indexes for transaction fact table
        CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_transactions_timestamp
            ON analytics.transactions_fact (timestamp);
        CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_transactions_user_id
            ON analytics.transactions_fact (user_id);
        CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_transactions_product_id
            ON analytics.transactions_fact (product_id);
        CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_transactions_category_time
            ON analytics.transactions_fact (category_id, timestamp);

        -- Indexes for dimension tables
        CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_customers_tier
            ON analytics.customers_dim (customer_tier);
        CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_customers_active
            ON analytics.customers_dim (is_active) WHERE is_active = TRUE;
        CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_products_category
            ON analytics.products_dim (category_name);
        CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_products_active
            ON analytics.products_dim (is_active) WHERE is_active = TRUE;

        -- Partial indexes for recent data
        CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_transactions_recent
            ON analytics.transactions_fact (timestamp, total_amount)
            WHERE timestamp >= CURRENT_DATE - INTERVAL '90 days';

        -- GIN indexes for JSONB columns
        CREATE INDEX CONCURRENTLY IF NOT EXISTS idx_metrics_tags
            ON analytics.metrics_timeseries USING GIN (tags);

        RAISE NOTICE 'Created analytics indexes';
    END;
    $$;

    -- Function to manage table partitioning
    CREATE OR REPLACE FUNCTION analytics.setup_partitioning()
    RETURNS VOID LANGUAGE plpgsql AS $$
    BEGIN
        -- Create monthly partitions for large fact tables
        PERFORM partman.create_parent(
            p_parent_table => 'analytics.transactions_fact',
            p_control => 'timestamp',
            p_type => 'range',
            p_interval => 'monthly',
            p_premake => 3
        );

        -- Set partition retention (keep 2 years)
        UPDATE partman.part_config
        SET retention = '24 months',
            retention_keep_table = false,
            retention_keep_index = true
        WHERE parent_table = 'analytics.transactions_fact';

        RAISE NOTICE 'Setup table partitioning';
    END;
    $$;

    -- Function to refresh materialized views
    CREATE OR REPLACE FUNCTION analytics.refresh_materialized_views()
    RETURNS VOID LANGUAGE plpgsql AS $$
    BEGIN
        -- Refresh continuous aggregates
        CALL refresh_continuous_aggregate('analytics.hourly_metrics',
                                        CURRENT_TIMESTAMP - INTERVAL '3 hours',
                                        CURRENT_TIMESTAMP);

        RAISE NOTICE 'Refreshed materialized views';
    END;
    $$;

    -- Function to get query performance metrics
    CREATE OR REPLACE FUNCTION analytics.get_query_performance(
        time_period INTERVAL DEFAULT '1 day'
    )
    RETURNS TABLE (
        query_hash TEXT,
        calls BIGINT,
        total_time_ms DOUBLE PRECISION,
        avg_time_ms DOUBLE PRECISION,
        rows_avg BIGINT,
        query_text TEXT
    ) LANGUAGE sql AS $$
        SELECT
            queryid::TEXT as query_hash,
            calls,
            total_exec_time as total_time_ms,
            mean_exec_time as avg_time_ms,
            rows as rows_avg,
            LEFT(query, 200) as query_text
        FROM pg_stat_statements
        WHERE last_exec >= NOW() - time_period
        ORDER BY total_exec_time DESC
        LIMIT 100;
    $$;