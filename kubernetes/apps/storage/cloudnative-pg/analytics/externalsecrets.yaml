---
# Analytics Credentials
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-analytics-credentials
  namespace: storage
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: postgres-analytics-credentials
    app.kubernetes.io/part-of: postgresql
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: postgres-analytics-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        ANALYTICS_USER: "{{ .ANALYTICS_USER }}"
        ANALYTICS_PASSWORD: "{{ .ANALYTICS_PASSWORD }}"

  dataFrom:
    - extract:
        key: postgres-analytics-credentials
