---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pgbouncer-enterprise
  namespace: storage
  labels:
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/component: connection-pooler
    app.kubernetes.io/part-of: postgresql
    app.kubernetes.io/version: "1.23"
    environment: production
    tier: middleware
    criticality: high
  annotations:
    meta.helm.sh/release-name: pgbouncer-enterprise
    meta.helm.sh/release-namespace: storage
    deployment.kubernetes.io/revision: "1"
    monitoring.coreos.com/enabled: "true"
    backup.velero.io/backup-volumes: pgbouncer-config,pgbouncer-auth
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  maxHistory: 3
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    controllers:
      main:
        type: deployment
        replicas: 3
        strategy: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
          maxSurge: 1
        annotations:
          reloader.stakater.com/auto: "true"
          deployment.kubernetes.io/revision: "1"
          cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
          prometheus.io/scrape: "true"
          prometheus.io/port: "9127"
          prometheus.io/path: "/metrics"

        containers:
          main:
            image:
              repository: pgbouncer/pgbouncer
              tag: "1.23.1"
              pullPolicy: IfNotPresent

            env:
              # Database Configuration
              DATABASES_HOST: postgres17-rw.storage.svc.cluster.local
              DATABASES_PORT: "5432"
              DATABASES_USER: postgres
              DATABASES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: pgbouncer-auth
                    key: postgres_password
              DATABASES_DBNAME: postgres
              
              # Pool Configuration - Enterprise Grade
              POOL_MODE: transaction
              DEFAULT_POOL_SIZE: "50"
              MIN_POOL_SIZE: "10" 
              MAX_CLIENT_CONN: "1000"
              MAX_DB_CONNECTIONS: "200"
              RESERVE_POOL_SIZE: "10"
              RESERVE_POOL_TIMEOUT: "5"
              
              # Performance Tuning
              SERVER_RESET_QUERY: "DISCARD ALL"
              SERVER_CHECK_QUERY: "SELECT 1"
              SERVER_CHECK_DELAY: "30"
              SERVER_FAST_CLOSE: "1"
              QUERY_TIMEOUT: "300"
              QUERY_WAIT_TIMEOUT: "120"
              CLIENT_IDLE_TIMEOUT: "0"
              SERVER_IDLE_TIMEOUT: "600"
              SERVER_LIFETIME: "3600"
              SERVER_CONNECT_TIMEOUT: "15"
              
              # Security & Auth
              AUTH_TYPE: md5
              AUTH_HBA_FILE: /etc/pgbouncer/pg_hba.conf
              AUTH_QUERY: "SELECT usename, passwd FROM pg_shadow WHERE usename=$1"
              AUTH_USER: postgres
              
              # Monitoring & Logging
              LOG_CONNECTIONS: "1"
              LOG_DISCONNECTIONS: "1" 
              LOG_POOLER_ERRORS: "1"
              STATS_PERIOD: "60"
              VERBOSE: "1"
              
              # High Availability
              SO_REUSEPORT: "1"
              TCP_KEEPALIVE: "1"
              TCP_KEEPCNT: "3"
              TCP_KEEPIDLE: "600"
              TCP_KEEPINTVL: "30"

            ports:
              - name: pgbouncer
                containerPort: 5432
                protocol: TCP
              - name: metrics
                containerPort: 9127
                protocol: TCP
              - name: admin
                containerPort: 6432
                protocol: TCP

            resources:
              requests:
                cpu: 500m
                memory: 512Mi
                ephemeral-storage: 1Gi
              limits:
                cpu: 2000m
                memory: 2Gi
                ephemeral-storage: 5Gi

            securityContext:
              runAsNonRoot: true
              runAsUser: 999
              runAsGroup: 999
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
                add:
                  - NET_BIND_SERVICE

          # PgBouncer Exporter for Prometheus Metrics
          metrics:
            image:
              repository: spreaker/prometheus-pgbouncer-exporter
              tag: "3.0.1"
              pullPolicy: IfNotPresent

            env:
              PGBOUNCER_EXPORTER_HOST: "127.0.0.1"
              PGBOUNCER_EXPORTER_PORT: "6432"
              PGBOUNCER_EXPORTER_DATABASE: "pgbouncer"
              PGBOUNCER_EXPORTER_USER: "stats"
              WEB_LISTEN_ADDRESS: ":9127"
              WEB_TELEMETRY_PATH: "/metrics"

            ports:
              - name: metrics
                containerPort: 9127
                protocol: TCP

            resources:
              requests:
                cpu: 50m
                memory: 64Mi
              limits:
                cpu: 200m
                memory: 256Mi

            securityContext:
              runAsNonRoot: true
              runAsUser: 65534
              runAsGroup: 65534
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

        pod:
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "9127"
            prometheus.io/path: "/metrics"
            cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
            backup.velero.io/backup-volumes: pgbouncer-config,pgbouncer-auth

          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault

          # Anti-affinity for HA across nodes
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: pgbouncer
                  topologyKey: kubernetes.io/hostname
              preferredDuringSchedulingIgnoredDuringExecution:
                - weight: 100
                  podAffinityTerm:
                    labelSelector:
                      matchLabels:
                        app.kubernetes.io/name: pgbouncer
                    topologyKey: topology.kubernetes.io/zone

          # Topology spread for even distribution
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: pgbouncer

    serviceAccount:
      create: true
      name: pgbouncer
      annotations:
        eks.amazonaws.com/role-arn: ""

    service:
      main:
        controller: main
        enabled: true
        type: ClusterIP
        ports:
          pgbouncer:
            port: 5432
            targetPort: 5432
            protocol: TCP
          admin:
            port: 6432
            targetPort: 6432
            protocol: TCP
        sessionAffinity: ClientIP
        sessionAffinityConfig:
          clientIP:
            timeoutSeconds: 3600

      metrics:
        controller: main
        enabled: true
        type: ClusterIP
        ports:
          metrics:
            port: 9127
            targetPort: 9127
            protocol: TCP

    ingress:
      main:
        enabled: false

    persistence:
      pgbouncer-config:
        type: configMap
        name: pgbouncer-config
        defaultMode: 0644
        globalMounts:
          - path: /etc/pgbouncer
            readOnly: true

      pgbouncer-auth:
        type: secret
        name: pgbouncer-auth
        defaultMode: 0600
        globalMounts:
          - path: /etc/pgbouncer/auth
            readOnly: true

      tmp:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /tmp

      var-run:
        type: emptyDir
        sizeLimit: 100Mi
        globalMounts:
          - path: /var/run/pgbouncer

    # Health checks optimized for production
    probes:
      liveness:
        controller: main
        enabled: true
        custom: true
        spec:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
          successThreshold: 1

      readiness:
        controller: main
        enabled: true
        custom: true
        spec:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1

      startup:
        controller: main
        enabled: true
        custom: true
        spec:
          tcpSocket:
            port: 5432
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 12
          successThreshold: 1 