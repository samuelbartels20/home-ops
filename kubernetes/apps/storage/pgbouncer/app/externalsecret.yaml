---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pgbouncer-auth
  namespace: storage
  labels:
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/component: connection-pooler
    app.kubernetes.io/part-of: postgresql
    environment: production
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: pgbouncer-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: pgbouncer
          cnpg.io/reload: "true"
      data:
        # PostgreSQL connection credentials
        postgres_password: "{{ .pg_password }}"
        postgres_username: "{{ .pg_username }}"
        
        # PgBouncer admin credentials  
        pgbouncer_admin_password: "{{ .pgbouncer_admin_password }}"
        stats_password: "{{ .pgbouncer_stats_password }}"
        
        # User list file for PgBouncer authentication
        userlist.txt: |
          "postgres" "{{ .pg_password | b64enc }}"
          "pgbouncer_admin" "{{ .pgbouncer_admin_password | b64enc }}"
          "stats" "{{ .pgbouncer_stats_password | b64enc }}"
          "app_user" "{{ .app_user_password | b64enc }}"
          "readonly_user" "{{ .readonly_user_password | b64enc }}"
          "monitoring" "{{ .monitoring_password | b64enc }}"
        
        # Connection string for applications
        database_url: "postgresql://postgres:{{ .pg_password }}@pgbouncer-enterprise.storage.svc.cluster.local:5432/postgres?sslmode=prefer&pool_timeout=30"
        readonly_database_url: "postgresql://readonly_user:{{ .readonly_user_password }}@pgbouncer-enterprise.storage.svc.cluster.local:5432/postgres_ro?sslmode=prefer&pool_timeout=30"
        
  dataFrom:
    - extract:
        key: cloudnative-pg
    - extract:
        key: pgbouncer-auth 