---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pgbouncer-app
  namespace: flux-system
  labels:
    substitution.flux.sh/enabled: "false"
spec:
  interval: 10m
  path: "./kubernetes/apps/storage/pgbouncer/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  timeout: 5m
  dependsOn:
    - name: cluster-apps
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: pgbouncer-enterprise
      namespace: storage
    - apiVersion: v1
      kind: Service
      name: pgbouncer-enterprise
      namespace: storage
  postBuild:
    substitute:
      APP_VERSION: "1.23.1"
      PGBOUNCER_REPLICAS: "3"

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pgbouncer-monitoring
  namespace: flux-system
  labels:
    substitution.flux.sh/enabled: "false"
spec:
  interval: 10m
  path: "./kubernetes/apps/storage/pgbouncer/monitoring"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  timeout: 3m
  dependsOn:
    - name: pgbouncer-app
  healthChecks:
    - apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      name: pgbouncer-enterprise
      namespace: storage
    - apiVersion: monitoring.coreos.com/v1
      kind: PrometheusRule
      name: pgbouncer-enterprise-alerts
      namespace: storage 