---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  name: production-snapshot-class
  labels:
    app.kubernetes.io/name: snapshot-controller
    app.kubernetes.io/part-of: storage-system
  annotations:
    snapshot.storage.kubernetes.io/is-default-class: "true"
    storageclass.kubernetes.io/is-default-class: "true"
driver: zfs.csi.openebs.io
deletionPolicy: Retain
parameters:
  type: zfs
  incremental: "true"
  compression: "zstd-3"
  checksum: "sha512"
  encryption: "aes-256-gcm"
  iops: "10000"
  throughput: "500"
  
  retentionDuration: "2160h" 
  maxSnapshots: "180"
  retentionTiers: "hourly:24,daily:30,weekly:52,monthly:12"
  backupLocation: "s3" 
  backupEncryption: "true"
  backupCompression: "zstd"
  crossRegionReplication: "true"
  replicationRegions: "us-east-1,us-west-2"
  auditEnabled: "true"
  auditRetention: "8760h" 
  complianceRetention: "8760h" 
  dataClassification: "confidential"
  gdprCompliant: "true"
  hipaaCompliant: "true"
  recoveryPointObjective: "15m" 
  recoveryTimeObjective: "1h"   
  automatedRecoveryTesting: "true"
  testingSchedule: "0 0 * * 0"  
  failoverAutomation: "true"
  
  monitoringEnabled: "true"
  alertingThresholds: "snapshotFailure:true,backupFailure:true,replicationLag:30m,storageUsage:85"