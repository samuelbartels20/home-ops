---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
  namespace: storage
spec:
  interval: 30m
  chart:
    spec:
      chart: snapshot-controller
      version: 4.0.2
      sourceRef:
        kind: HelmRepository
        name: piraeus
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 5
      remediateLastFailure: true
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 5
      remediateLastFailure: true
    force: false
  rollback:
    timeout: 10m
    cleanupOnFail: true
  values:
    controller:
      replicas: 2
      strategy:
        type: RollingUpdate
        rollingUpdate:
          maxUnavailable: 1
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
      serviceMonitor:
        create: true
        interval: 30s
        scrapeTimeout: 10s
        labels:
          release: prometheus
      podMonitor:
        create: true
        interval: 30s
        scrapeTimeout: 10s
        labels:
          release: prometheus
      prometheusRule:
        create: true
        rules:
          - alert: SnapshotControllerDown
            expr: up{job="snapshot-controller"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: Snapshot Controller is down
              description: Snapshot Controller has been down for more than 5 minutes
          - alert: SnapshotCreationFailed
            expr: rate(snapshot_controller_snapshot_creation_failed_total[5m]) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Snapshot creation failures detected
              description: Volume snapshot creation is failing
          - alert: SnapshotDeletionFailed
            expr: rate(snapshot_controller_snapshot_deletion_failed_total[5m]) > 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: Snapshot deletion failures detected
              description: Volume snapshot deletion is failing
      podDisruptionBudget:
        enabled: true
        minAvailable: 1
      nodeSelector:
        kubernetes.io/os: linux
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values:
                      - snapshot-controller
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      priorityClassName: system-cluster-critical
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: snapshot-controller
      extraArgs:
        - --leader-election=true
        - --leader-election-namespace=storage
        - --metrics-bind-address=:8080
        - --http-endpoint=:8080
        - --v=2
        - --enable-distributed-snapshotting=true
        - --snapshot-timeout=30m
      extraEnv:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8080
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
      readinessProbe:
        httpGet:
          path: /readyz
          port: 8080
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 3
