apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: snapshot-controller-metrics-enhanced
  namespace: storage
  labels:
    app.kubernetes.io/name: snapshot-controller
    app.kubernetes.io/component: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: snapshot-controller
  endpoints:
    - port: metrics
      interval: 15s
      scrapeTimeout: 10s
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: 'snapshot_(latency|throughput|iops|queue_depth)_.*'
          action: keep
    - port: storage-metrics
      interval: 30s
      path: /storage/metrics
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: 'storage_(capacity|usage|iops|latency)_.*'
          action: keep
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: snapshot-controller-alerts-enhanced
  namespace: storage
  labels:
    app.kubernetes.io/name: snapshot-controller
    app.kubernetes.io/component: observability
spec:
  groups:
    - name: snapshot.performance.rules
      rules:
        - alert: SnapshotHighLatency
          expr: snapshot_operation_latency_seconds > 10
          for: 5m
          labels:
            severity: warning
            category: performance
          annotations:
            summary: "High snapshot operation latency"
            description: "Snapshot operations are taking longer than 10 seconds"
            runbook_url: "https://runbooks.samcloud.online/snapshot-latency"

        - alert: SnapshotLowIOPS
          expr: rate(snapshot_operations_total[5m]) < 10
          for: 5m
          labels:
            severity: warning
            category: performance
          annotations:
            summary: "Low snapshot IOPS"
            description: "Snapshot operations rate is below expected threshold"
            runbook_url: "https://runbooks.samcloud.online/snapshot-iops"

        - alert: SnapshotHighQueueDepth
          expr: snapshot_queue_depth > 100
          for: 5m
          labels:
            severity: warning
            category: performance
          annotations:
            summary: "High operation queue depth"
            description: "Too many snapshot operations are queued"
            runbook_url: "https://runbooks.samcloud.online/snapshot-queue"

    - name: snapshot.storage.rules
      rules:
        - alert: StorageNearCapacity
          expr: storage_usage_bytes / storage_capacity_bytes * 100 > 85
          for: 10m
          labels:
            severity: warning
            category: capacity
          annotations:
            summary: "Storage capacity nearly full"
            description: "Storage usage is above 85% of capacity"
            runbook_url: "https://runbooks.samcloud.online/storage-capacity"

        - alert: StorageHighLatency
          expr: storage_operation_latency_seconds > 1
          for: 5m
          labels:
            severity: warning
            category: performance
          annotations:
            summary: "High storage operation latency"
            description: "Storage operations are experiencing high latency"
            runbook_url: "https://runbooks.samcloud.online/storage-latency"

    - name: snapshot.reliability.rules
      rules:
        - alert: SnapshotFailureRate
          expr: rate(snapshot_operations_failed_total[1h]) / rate(snapshot_operations_total[1h]) * 100 > 5
          for: 15m
          labels:
            severity: critical
            category: reliability
          annotations:
            summary: "High snapshot failure rate"
            description: "Snapshot operation failure rate is above 5%"
            runbook_url: "https://runbooks.samcloud.online/snapshot-failures"

        - alert: SnapshotConsistencyCheckFailed
          expr: snapshot_consistency_check_failed > 0
          for: 5m
          labels:
            severity: critical
            category: reliability
          annotations:
            summary: "Snapshot consistency check failed"
            description: "Snapshot data consistency check has failed"
            runbook_url: "https://runbooks.samcloud.online/snapshot-consistency"

---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: snapshot-controller-pod-metrics
  namespace: storage
  labels:
    app.kubernetes.io/name: snapshot-controller
    app.kubernetes.io/component: observability
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: snapshot-controller
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: 'container_(memory|cpu|fs)_.*'
          action: keep
---
apiVersion: monitoring.coreos.com/v1
kind: GrafanaDashboard
metadata:
  name: snapshot-controller-dashboard
  namespace: storage
  labels:
    app.kubernetes.io/name: snapshot-controller
    app.kubernetes.io/component: observability
spec:
  json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "graphTooltip": 0,
      "links": [],
      "panels": [
        {
          "title": "Snapshot Operations",
          "type": "graph",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "rate(snapshot_operations_total[5m])",
              "legendFormat": "Operations Rate"
            }
          ]
        },
        {
          "title": "Operation Latency",
          "type": "graph",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "snapshot_operation_latency_seconds",
              "legendFormat": "Latency"
            }
          ]
        },
        {
          "title": "Queue Depth",
          "type": "graph",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "snapshot_queue_depth",
              "legendFormat": "Queue Depth"
            }
          ]
        },
        {
          "title": "Storage Usage",
          "type": "gauge",
          "datasource": "Prometheus",
          "targets": [
            {
              "expr": "storage_usage_bytes / storage_capacity_bytes * 100",
              "legendFormat": "Usage %"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 16,
      "style": "dark",
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "5s",
          "10s",
          "30s",
          "1m",
          "5m",
          "15m",
          "30m",
          "1h",
          "2h",
          "1d"
        ]
      },
      "timezone": "browser",
      "title": "Snapshot Controller Metrics",
      "version": 0
    }