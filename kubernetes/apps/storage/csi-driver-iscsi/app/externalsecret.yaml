---
# External Secret for TrueNAS iSCSI Configuration
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: truenas-iscsi
  namespace: storage
  labels:
    app.kubernetes.io/name: csi-driver-iscsi
    app.kubernetes.io/component: security
    app.kubernetes.io/part-of: storage
    production-grade: "true"
    security-hardened: "true"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: truenas-iscsi
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        API_KEY: "{{ .API_KEY }}"
        DECRYPTION_KEY: "{{ .DECRYPTION_KEY }}"
        host: "{{ .host }}"
        portal: "{{ .portal }}"
        dataset_parent: "{{ .dataset_parent }}"
        snapshot_parent: "{{ .snapshot_parent }}"
        chap_username: "{{ .chap_username }}"
        chap_password: "{{ .chap_password }}"
        username: "{{ .username }}"
        password: "{{ .password }}"
        ssh_username: "{{ .ssh_username }}"
        ssh_password: "{{ .ssh_password }}"

  dataFrom:
    - extract:
        key: truenas-iscsi
  refreshInterval: 15m