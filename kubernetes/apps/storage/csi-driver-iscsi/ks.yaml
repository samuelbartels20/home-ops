---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: csi-driver-iscsi
  namespace: storage
  labels:
    substitution.flux.sh/enabled: "true"
spec:
  targetNamespace: storage
  commonMetadata:
    labels:
      app.kubernetes.io/name: csi-driver-iscsi
      app.kubernetes.io/component: storage
      app.kubernetes.io/part-of: storage
      production-grade: "true"
      security-hardened: "true"
  dependsOn:
    - name: external-secrets
      namespace: security
    - name: onepassword
      namespace: security
  path: ./kubernetes/apps/storage/csi-driver-iscsi/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
