---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: volsync-ha
  namespace: storage
  labels:
    app.kubernetes.io/name: volsync
    app.kubernetes.io/component: backup
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: volsync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: volsync
    spec:
      serviceAccountName: volsync-sa
      containers:
        - name: volsync
          image: backube/volsync:0.12.1
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 2Gi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: volsync
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: volsync