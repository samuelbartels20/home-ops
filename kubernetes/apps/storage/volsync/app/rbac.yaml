---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: volsync-sa
  namespace: storage
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: volsync-role
  namespace: storage
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "persistentvolumeclaims", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["volsync.backube"]
    resources: ["replicationsources", "replicationdestinations"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: volsync-rolebinding
  namespace: storage
subjects:
  - kind: ServiceAccount
    name: volsync-sa
    namespace: storage
roleRef:
  kind: Role
  name: volsync-role
  apiGroup: rbac.authorization.k8s.io