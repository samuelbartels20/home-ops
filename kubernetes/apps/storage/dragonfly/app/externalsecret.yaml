---
# Dragonfly External Secret

apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: dragonfly-secrets
  namespace: storage
  labels:
    app.kubernetes.io/name: dragonfly
    app.kubernetes.io/component: cache-database
    app.kubernetes.io/part-of: dragonfly
    environment: production
    tier: storage
    security-level: standard
  annotations:
    # Security and compliance annotations
    secret-management.io/provider: "onepassword"
    secret-management.io/rotation-interval: "30d"
    secret-management.io/encryption: "aes-256-gcm"

    # Compliance Framework
    compliance.storage.io/sox: "required"
    compliance.storage.io/gdpr: "required"
    compliance.storage.io/nist: "required"
    compliance.storage.io/iso27001: "required"
    compliance.storage.io/pci-dss: "required"

    # Security scanning and monitoring
    trivy-scanner/scan: "true"
    falco-security/monitor: "true"

    # Operational metadata
    ops.storage.io/owner: "platform-team"
    ops.storage.io/contact: "platform@samcloud.online"
    ops.storage.io/escalation: "sre-oncall"
    ops.storage.io/runbook: "https://runbooks.samcloud.online/dragonfly-secrets"
spec:
  secretStoreRef:
    name: onepassword-connect
    kind: SecretStore
  target:
    name: dragonfly-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: dragonfly
          app.kubernetes.io/component: cache-database
          environment: production
          security-level: standard
        annotations:
          reloader.stakater.com/match: "true"
      data:
        # Core Dragonfly Configuration
        DRAGONFLY_PASSWORD: "{{ .DRAGONFLY_ADMIN_PASSWORD }}"
        DRAGONFLY_AUTH_USER: "{{ .DRAGONFLY_AUTH_USER }}"
        DRAGONFLY_REQUIREPASS: "{{ .DRAGONFLY_ADMIN_PASSWORD }}"

        # Cluster Configuration
        DRAGONFLY_CLUSTER_ENABLED: "true"
        DRAGONFLY_CLUSTER_NODE_TIMEOUT: "15000"
        DRAGONFLY_CLUSTER_ANNOUNCE_PORT: "6379"
        DRAGONFLY_CLUSTER_CONFIG_FILE: "/data/nodes.conf"

        # Security Configuration
        DRAGONFLY_TLS_ENABLED: "true"
        DRAGONFLY_TLS_CERT_FILE: "/etc/ssl/dragonfly/tls.crt"
        DRAGONFLY_TLS_KEY_FILE: "/etc/ssl/dragonfly/tls.key"
        DRAGONFLY_TLS_CA_CERT_FILE: "/etc/ssl/dragonfly/ca.crt"
        DRAGONFLY_TLS_VERIFY_PEER: "true"
        DRAGONFLY_TLS_PROTOCOLS: "TLSv1.2,TLSv1.3"
        DRAGONFLY_TLS_CIPHERS: "ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256"

        # Performance Configuration
        DRAGONFLY_MAXMEMORY_POLICY: "allkeys-lru"
        DRAGONFLY_TIMEOUT: "300"
        DRAGONFLY_TCP_KEEPALIVE: "300"
        DRAGONFLY_TCP_BACKLOG: "511"
        DRAGONFLY_DATABASES: "16"
        DRAGONFLY_SAVE: "900 1 300 10 60 10000"
        DRAGONFLY_STOP_WRITES_ON_BGSAVE_ERROR: "true"
        DRAGONFLY_RDBCOMPRESSION: "true"
        DRAGONFLY_RDBCHECKSUM: "true"

        # Monitoring and Logging
        DRAGONFLY_SYSLOG_ENABLED: "true"
        DRAGONFLY_SYSLOG_IDENT: "dragonfly"
        DRAGONFLY_SYSLOG_FACILITY: "local0"
        DRAGONFLY_LOGLEVEL: "notice"
        DRAGONFLY_LOGFILE: "/var/log/dragonfly/dragonfly.log"

        # Replication Configuration
        DRAGONFLY_REPL_TIMEOUT: "60"
        DRAGONFLY_REPL_PING_SLAVE_PERIOD: "10"
        DRAGONFLY_REPL_BACKLOG_SIZE: "1mb"
        DRAGONFLY_REPL_BACKLOG_TTL: "3600"

        # Slow Log Configuration
        DRAGONFLY_SLOWLOG_LOG_SLOWER_THAN: "10000"
        DRAGONFLY_SLOWLOG_MAX_LEN: "128"

        # Client Configuration
        DRAGONFLY_MAXCLIENTS: "10000"

        # S3/MinIO Integration for Persistence
        AWS_ACCESS_KEY_ID: "{{ .S3_ACCESS_KEY }}"
        AWS_SECRET_ACCESS_KEY: "{{ .S3_SECRET_KEY }}"
        AWS_DEFAULT_REGION: "us-east-1"
        S3_ENDPOINT: "http://192.168.8.102:9000"
        S3_BUCKET: "dragonfly-backups"
        S3_PREFIX: "dragonfly/cluster"

        # Backup Configuration
        BACKUP_ENCRYPTION_KEY: "{{ .BACKUP_ENCRYPTION_KEY }}"
        BACKUP_COMPRESSION: "gzip"
        BACKUP_RETENTION_DAYS: "90"
        BACKUP_SCHEDULE: "0 2 * * *"

        # PostgreSQL Metadata Store
        POSTGRES_HOST: "postgres-rw.storage.svc.cluster.local"
        POSTGRES_PORT: "5432"
        POSTGRES_DATABASE: "dragonfly_metadata"
        POSTGRES_USER: "{{ .POSTGRES_USER }}"
        POSTGRES_PASSWORD: "{{ .POSTGRES_PASSWORD }}"
        POSTGRES_SSL_MODE: "require"

        # LDAP/OAuth Integration
        LDAP_HOST: "lldap.security.svc.cluster.local"
        LDAP_PORT: "389"
        LDAP_BIND_DN: "uid=dragonfly,ou=people,dc=home,dc=arpa"
        LDAP_BIND_PASSWORD: "{{ .LDAP_BIND_PASSWORD }}"
        LDAP_SEARCH_BASE: "ou=people,dc=home,dc=arpa"
        LDAP_USER_FILTER: "uid={0}"
        LDAP_GROUP_FILTER: "cn=dragonfly-users,ou=groups,dc=home,dc=arpa"

        # OAuth2/OpenID Connect
        OAUTH_CLIENT_ID: "{{ .OAUTH_CLIENT_ID }}"
        OAUTH_CLIENT_SECRET: "{{ .OAUTH_CLIENT_SECRET }}"
        OAUTH_DISCOVERY_URL: "https://auth.samcloud.online/.well-known/openid_configuration"
        OAUTH_REDIRECT_URL: "https://dragonfly.samcloud.online/oauth/callback"

        # SMTP Configuration for Alerts
        SMTP_HOST: "smtp-relay.security.svc.cluster.local"
        SMTP_PORT: "25"
        SMTP_USER: ""
        SMTP_PASSWORD: ""
        SMTP_FROM: "dragonfly@samcloud.online"
        SMTP_TLS: "false"

        # Webhook Configuration for Notifications
        WEBHOOK_URL: "{{ .WEBHOOK_URL }}"
        WEBHOOK_SECRET: "{{ .WEBHOOK_SECRET }}"

        # TrueNAS Integration for Persistent Storage
        TRUENAS_HOST: "{{ .TRUENAS_HOST }}"
        TRUENAS_API_KEY: "{{ .TRUENAS_API_KEY }}"
        TRUENAS_DATASET: "dragonfly/data"
        TRUENAS_SNAPSHOT_SCHEDULE: "hourly"
        TRUENAS_REPLICATION_TARGET: "{{ .TRUENAS_REPLICATION_TARGET }}"

        # Encryption Keys for Data at Rest
        DATA_ENCRYPTION_KEY: "{{ .DATA_ENCRYPTION_KEY }}"
        TRANSIT_ENCRYPTION_KEY: "{{ .TRANSIT_ENCRYPTION_KEY }}"

        # Audit and Compliance
        AUDIT_LOG_ENABLED: "true"
        AUDIT_LOG_PATH: "/var/log/dragonfly/audit.log"
        AUDIT_LOG_MAX_SIZE: "100MB"
        AUDIT_LOG_MAX_FILES: "10"
        AUDIT_LOG_COMPRESS: "true"

        # Performance Monitoring Credentials
        DATADOG_API_KEY: "{{ .DATADOG_API_KEY }}"
        NEWRELIC_LICENSE_KEY: "{{ .NEWRELIC_LICENSE_KEY }}"
        SPLUNK_HEC_TOKEN: "{{ .SPLUNK_HEC_TOKEN }}"

        # Certificate Management
        CERT_MANAGER_ISSUER: "letsencrypt-prod"
        CERT_MANAGER_SOLVER: "dns01"
        CLOUDFLARE_API_TOKEN: "{{ .CLOUDFLARE_API_TOKEN }}"

        # Service Mesh Integration
        ISTIO_MTLS_MODE: "strict"
        LINKERD_IDENTITY_TRUST_DOMAIN: "cluster.local"

        # Network Policies
        NETWORK_POLICY_INGRESS_ALLOW: "observability,security,storage"
        NETWORK_POLICY_EGRESS_ALLOW: "storage,security,kube-system"

  dataFrom:
    - extract:
        key: dragonfly
    - extract:
        key: s3-credentials
    - extract:
        key: cloudnative-pg
    - extract:
        key: ldap-credentials
    - extract:
        key: oauth-credentials
    - extract:
        key: smtp-credentials
    - extract:
        key: webhook-credentials
    - extract:
        key: cloud-provider-credentials
    - extract:
        key: truenas-credentials
    - extract:
        key: encryption-keys
    - extract:
        key: monitoring-credentials
    - extract:
        key: certificate-credentials
    - extract:
        key: support-credentials