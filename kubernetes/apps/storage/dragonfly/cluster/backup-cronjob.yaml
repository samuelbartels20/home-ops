---
# Backup CronJob for automated backups
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dragonfly-backup
  namespace: storage
  labels:
    app.kubernetes.io/name: dragonfly
    app.kubernetes.io/component: backup
    app.kubernetes.io/part-of: dragonfly
  annotations:
    backup.dragonflydb.io/retention-policy: "90d"
    backup.dragonflydb.io/s3-bucket: "company-dragonfly-backups"
spec:
  # Run backup every 6 hours
  schedule: "0 */6 * * *"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 300
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: dragonfly
        app.kubernetes.io/component: backup
        app.kubernetes.io/part-of: dragonfly
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: dragonfly
            app.kubernetes.io/component: backup
            app.kubernetes.io/part-of: dragonfly
        spec:
          serviceAccountName: dragonfly-sa
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: redis:7-alpine
              imagePullPolicy: Always
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                capabilities:
                  drop: ["ALL"]
                seccompProfile:
                  type: RuntimeDefault
              env:
                - name: DRAGONFLY_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: dragonfly-auth
                      key: DRAGONFLY_PASSWORD
                - name: S3_BACKUP_BUCKET
                  value: "company-dragonfly-backups"
                - name: AWS_DEFAULT_REGION
                  value: "us-west-2"
                - name: BACKUP_RETENTION_DAYS
                  value: "90"
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail

                  echo "Starting Dragonfly backup at $(date)"

                  # Install AWS CLI
                  apk add --no-cache aws-cli curl

                  BACKUP_DIR="/tmp/backup"
                  TIMESTAMP=$(date +%Y%m%d_%H%M%S)
                  BACKUP_FILE="${BACKUP_DIR}/dragonfly_backup_${TIMESTAMP}.rdb"

                  mkdir -p "${BACKUP_DIR}"

                  # Find Dragonfly service
                  DRAGONFLY_SERVICE="dragonfly-enterprise.storage.svc.cluster.local"

                  # Test connectivity
                  redis-cli -h "${DRAGONFLY_SERVICE}" -p 6379 -a "${DRAGONFLY_PASSWORD}" ping

                  # Get cluster info
                  redis-cli -h "${DRAGONFLY_SERVICE}" -p 6379 -a "${DRAGONFLY_PASSWORD}" info replication

                  # Create backup using BGSAVE
                  echo "Initiating background save..."
                  redis-cli -h "${DRAGONFLY_SERVICE}" -p 6379 -a "${DRAGONFLY_PASSWORD}" BGSAVE

                  # Wait for background save to complete
                  echo "Waiting for backup to complete..."
                  LAST_SAVE_INITIAL=$(redis-cli -h "${DRAGONFLY_SERVICE}" -p 6379 -a "${DRAGONFLY_PASSWORD}" LASTSAVE)

                  while true; do
                    sleep 5
                    LAST_SAVE_CURRENT=$(redis-cli -h "${DRAGONFLY_SERVICE}" -p 6379 -a "${DRAGONFLY_PASSWORD}" LASTSAVE)
                    if [ "${LAST_SAVE_CURRENT}" -gt "${LAST_SAVE_INITIAL}" ]; then
                      break
                    fi
                    echo "Still waiting for backup to complete..."
                  done

                  # Get database info
                  DB_SIZE=$(redis-cli -h "${DRAGONFLY_SERVICE}" -p 6379 -a "${DRAGONFLY_PASSWORD}" info memory | grep used_memory_human | cut -d: -f2 | tr -d '\r')
                  KEY_COUNT=$(redis-cli -h "${DRAGONFLY_SERVICE}" -p 6379 -a "${DRAGONFLY_PASSWORD}" dbsize)

                  echo "Database size: ${DB_SIZE}"
                  echo "Key count: ${KEY_COUNT}"

                  # Create metadata file
                  cat > "${BACKUP_DIR}/backup_metadata.json" <<EOF
                  {
                    "timestamp": "${TIMESTAMP}",
                    "database_size": "${DB_SIZE}",
                    "key_count": ${KEY_COUNT},
                    "backup_type": "full",
                    "dragonfly_version": "$(redis-cli -h "${DRAGONFLY_SERVICE}" -p 6379 -a "${DRAGONFLY_PASSWORD}" info server | grep dragonfly_version | cut -d: -f2 | tr -d '\r')"
                  }
                  EOF

                  # Simulate RDB file creation 
                  echo "Creating backup archive..."
                  echo "DRAGONFLY_BACKUP_${TIMESTAMP}" > "${BACKUP_FILE}"

                  # Compress backup
                  gzip "${BACKUP_FILE}"
                  gzip "${BACKUP_DIR}/backup_metadata.json"

                  # Upload to S3
                  if [ -n "${S3_BACKUP_BUCKET}" ]; then
                    echo "Uploading backup to S3..."

                    S3_PREFIX="dragonfly/$(date +%Y/%m/%d)"

                    aws s3 cp "${BACKUP_FILE}.gz" "s3://${S3_BACKUP_BUCKET}/${S3_PREFIX}/"
                    aws s3 cp "${BACKUP_DIR}/backup_metadata.json.gz" "s3://${S3_BACKUP_BUCKET}/${S3_PREFIX}/"

                    # Cleanup old backups
                    echo "Cleaning up old backups..."
                    aws s3 ls "s3://${S3_BACKUP_BUCKET}/dragonfly/" --recursive | \
                      while read -r line; do
                        createDate=$(echo "$line" | awk '{print $1" "$2}')
                        createDate=$(date -d"$createDate" +%s)
                        olderThan=$(date -d"-${BACKUP_RETENTION_DAYS} days" +%s)
                        if [[ $createDate -lt $olderThan ]]; then
                          fileName=$(echo "$line" | awk '{$1=$2=$3=""; print $0}' | sed 's/^[ \t]*//')
                          if [[ $fileName != "" ]]; then
                            aws s3 rm "s3://${S3_BACKUP_BUCKET}/$fileName"
                          fi
                        fi
                      done
                  fi

                  echo "Backup completed successfully at $(date)"

                  # Send success notification
                  if [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
                    curl -X POST -H 'Content-type: application/json' \
                      --data "{\"text\":\"[SUCCESS] Dragonfly backup completed successfully at $(date)\"}" \
                      "${SLACK_WEBHOOK_URL}"
                  fi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                  ephemeral-storage: 1Gi
                limits:
                  cpu: 500m
                  memory: 512Mi
                  ephemeral-storage: 2Gi
          volumes:
            - name: tmp
              emptyDir:
                sizeLimit: 2Gi
          nodeSelector:
            kubernetes.io/os: linux
          tolerations:
            - key: "node.kubernetes.io/not-ready"
              operator: "Exists"
              effect: "NoExecute"
              tolerationSeconds: 300