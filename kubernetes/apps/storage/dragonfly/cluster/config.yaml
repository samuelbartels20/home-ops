---
# ConfigMap for Dragonfly configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: dragonfly-config
  namespace: storage
  labels:
    app.kubernetes.io/name: dragonfly
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: storage
  annotations:
    reloader.stakater.com/match: "true"
data:
  # Main Dragonfly configuration
  dragonfly.conf: |
    # Server Configuration
    bind 0.0.0.0
    port 6379
    requirepass "${REDIS_PASSWORD}"

    # Memory Management
    maxmemory 1gb
    maxmemory-policy allkeys-lru

    # Persistence
    appendonly yes
    appendfilename "appendonly.aof"
    appendfsync everysec

    # Replication
    repl-diskless-sync yes
    repl-diskless-sync-delay 5

    # Security
    tls-port 6380
    tls-cert-file /tls/tls.crt
    tls-key-file /tls/tls.key
    tls-auth-clients yes

    # Monitoring
    latency-monitor-threshold 100
    slowlog-log-slower-than 10000

  # Health check script
  health-check.sh: |
    #!/bin/bash
    set -euo pipefail

    # Basic connectivity check
    redis-cli -h localhost -p 6379 -a "${REDIS_PASSWORD}" ping

    # Memory usage check
    MEMORY_USAGE=$(redis-cli -h localhost -p 6379 -a "${REDIS_PASSWORD}" info memory | grep used_memory_human | cut -d: -f2 | tr -d '\r')
    echo "Memory usage: ${MEMORY_USAGE}"

    # Connection count check
    CONNECTIONS=$(redis-cli -h localhost -p 6379 -a "${REDIS_PASSWORD}" info clients | grep connected_clients | cut -d: -f2 | tr -d '\r')
    echo "Connected clients: ${CONNECTIONS}"

    echo "Health check passed"

  # Backup script
  backup.sh: |
    #!/bin/bash
    set -euo pipefail

    BACKUP_DIR="/backup"
    TIMESTAMP=$(date +%Y%m%d_%H%M%S)
    BACKUP_FILE="${BACKUP_DIR}/dragonfly_backup_${TIMESTAMP}.rdb"

    echo "Starting backup at $(date)"

    # Create backup directory
    mkdir -p "${BACKUP_DIR}"

    # Create backup using BGSAVE
    redis-cli -h localhost -p 6379 -a "${REDIS_PASSWORD}" BGSAVE

    # Wait for background save to complete
    while [ "$(redis-cli -h localhost -p 6379 -a "${REDIS_PASSWORD}" LASTSAVE)" -eq "$(redis-cli -h localhost -p 6379 -a "${REDIS_PASSWORD}" LASTSAVE)" ]; do
      sleep 1
    done

    # Copy the RDB file to backup location
    cp /data/dump.rdb "${BACKUP_FILE}"

    # Compress backup
    bzip2 "${BACKUP_FILE}"

    echo "Backup completed: ${BACKUP_FILE}.bz2"

    # Cleanup old backups (keep last 30 days)
    find "${BACKUP_DIR}" -name "dragonfly_backup_*.rdb.bz2" -mtime +30 -delete

    # Upload to S3 (if configured)
    if [ -n "${S3_BACKUP_BUCKET:-}" ]; then
      aws s3 cp "${BACKUP_FILE}.bz2" "s3://${S3_BACKUP_BUCKET}/dragonfly/$(date +%Y/%m/%d)/"
    fi

  # Monitoring script
  metrics-exporter.sh: |
    #!/bin/bash
    set -euo pipefail

    # Custom metrics collection for Dragonfly
    while true; do
      # Get Dragonfly info
      INFO_OUTPUT=$(redis-cli -h localhost -p 6379 -a "${REDIS_PASSWORD}" info all)

      # Parse and export custom metrics
      echo "$INFO_OUTPUT" | while IFS=: read -r key value; do
        case "$key" in
          used_memory)
            echo "dragonfly_memory_used_bytes $value" > /tmp/metrics.prom.$$
            ;;
          connected_clients)
            echo "dragonfly_connected_clients $value" >> /tmp/metrics.prom.$$
            ;;
          total_commands_processed)
            echo "dragonfly_commands_total $value" >> /tmp/metrics.prom.$$
            ;;
          keyspace_hits)
            echo "dragonfly_keyspace_hits_total $value" >> /tmp/metrics.prom.$$
            ;;
          keyspace_misses)
            echo "dragonfly_keyspace_misses_total $value" >> /tmp/metrics.prom.$$
            ;;
        esac
      done

      # Atomic move of metrics file
      mv /tmp/metrics.prom.$$ /tmp/metrics.prom

      sleep 30
    done

---
# TLS Certificate Secret (placeholder - should be managed by cert-manager)
apiVersion: v1
kind: Secret
metadata:
  name: dragonfly-tls-certs
  namespace: storage
  labels:
    app.kubernetes.io/name: dragonfly
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: storage
  annotations:
    cert-manager.io/issuer: "production-issuer"
    cert-manager.io/common-name: "dragonfly.storage.svc.cluster.local"
type: kubernetes.io/tls
data:
  # These should be generated by cert-manager
  tls.crt: |
    LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCk1JSUNDVENDQXp5Z0F3SUJBZ0lJQkF6V01B...
  tls.key: |
    LS0tLS1CRUdJTiBFTkNDU...
  ca.crt: |
    LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0tCk1JSUNDVENDQXp5Z0F3SUJBZ0lJQkF6V01B...