---
# ServiceMonitor for Prometheus scraping
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dragonfly-metrics
  namespace: storage
  labels:
    app.kubernetes.io/name: dragonfly
    app.kubernetes.io/component: cache-database
    app.kubernetes.io/part-of: dragonfly
    release: prometheus-operator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: dragonfly
      app.kubernetes.io/part-of: dragonfly
  endpoints:
    - port: dragonfly
      interval: 30s
      scrapeTimeout: 10s
      path: /metrics
      scheme: http
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: 'dragonfly_.*'
          action: keep
        - sourceLabels: [__name__]
          regex: 'go_.*'
          action: keep
        - sourceLabels: [__name__]
          regex: 'process_.*'
          action: keep
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_service_name]
          targetLabel: service
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
  namespaceSelector:
    matchNames:
      - storage

---
# PrometheusRule for alerting
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dragonfly-alerts
  namespace: storage
  labels:
    app.kubernetes.io/name: dragonfly
    app.kubernetes.io/component: cache-database
    app.kubernetes.io/part-of: dragonfly
    release: prometheus-operator
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: dragonfly.availability
      interval: 30s
      rules:
        - alert: DragonflyDown
          expr: up{job="dragonfly-metrics"} == 0
          for: 2m
          labels:
            severity: critical
            service: dragonfly
            tier: storage
          annotations:
            summary: "Dragonfly instance is down"
            description: "Dragonfly instance {{ $labels.pod }} in namespace {{ $labels.namespace }} has been down for more than 2 minutes"
            runbook_url: "https://runbooks.samcloud.online/dragonfly/instance-down"
            dashboard_url: "https://grafana.samcloud.online/d/dragonfly/dragonfly-overview"

        - alert: DragonflyClusterUnhealthy
          expr: count(up{job="dragonfly-metrics"} == 1) < 3
          for: 1m
          labels:
            severity: critical
            service: dragonfly
            tier: storage
          annotations:
            summary: "Dragonfly cluster is unhealthy"
            description: "Less than 3 Dragonfly instances are available. Current count: {{ $value }}"
            runbook_url: "https://runbooks.samcloud.online/dragonfly/cluster-unhealthy"

    - name: dragonfly.performance
      interval: 30s
      rules:
        - alert: DragonflyHighMemoryUsage
          expr: (dragonfly_memory_used_bytes / dragonfly_memory_max_bytes) * 100 > 85
          for: 5m
          labels:
            severity: warning
            service: dragonfly
            tier: storage
          annotations:
            summary: "Dragonfly high memory usage"
            description: "Dragonfly memory usage is {{ $value | humanizePercentage }} on {{ $labels.pod }}"
            runbook_url: "https://runbooks.samcloud.online/dragonfly/high-memory"

        - alert: DragonflyHighCPUUsage
          expr: rate(process_cpu_seconds_total{job="dragonfly-metrics"}[5m]) * 100 > 80
          for: 5m
          labels:
            severity: warning
            service: dragonfly
            tier: storage
          annotations:
            summary: "Dragonfly high CPU usage"
            description: "Dragonfly CPU usage is {{ $value | humanizePercentage }} on {{ $labels.pod }}"
            runbook_url: "https://runbooks.samcloud.online/dragonfly/high-cpu"

        - alert: DragonflySlowQueries
          expr: dragonfly_slow_queries_total > 100
          for: 5m
          labels:
            severity: warning
            service: dragonfly
            tier: storage
          annotations:
            summary: "Dragonfly has slow queries"
            description: "Dragonfly has {{ $value }} slow queries on {{ $labels.pod }}"
            runbook_url: "https://runbooks.samcloud.online/dragonfly/slow-queries"

        - alert: DragonflyConnectionLimit
          expr: (dragonfly_connected_clients / dragonfly_maxclients) * 100 > 80
          for: 5m
          labels:
            severity: warning
            service: dragonfly
            tier: storage
          annotations:
            summary: "Dragonfly approaching connection limit"
            description: "Dragonfly connection usage is {{ $value | humanizePercentage }} on {{ $labels.pod }}"
            runbook_url: "https://runbooks.samcloud.online/dragonfly/connection-limit"

    - name: dragonfly.persistence
      interval: 60s
      rules:
        - alert: DragonflyBackupFailed
          expr: increase(dragonfly_snapshot_errors_total[1h]) > 0
          for: 0m
          labels:
            severity: critical
            service: dragonfly
            tier: storage
          annotations:
            summary: "Dragonfly backup failed"
            description: "Dragonfly snapshot/backup failed on {{ $labels.pod }}. Error count: {{ $value }}"
            runbook_url: "https://runbooks.samcloud.online/dragonfly/backup-failed"

        - alert: DragonflyDiskSpaceHigh
          expr: (1 - (dragonfly_disk_free_bytes / dragonfly_disk_total_bytes)) * 100 > 85
          for: 10m
          labels:
            severity: warning
            service: dragonfly
            tier: storage
          annotations:
            summary: "Dragonfly disk space usage high"
            description: "Dragonfly disk usage is {{ $value | humanizePercentage }} on {{ $labels.pod }}"
            runbook_url: "https://runbooks.samcloud.online/dragonfly/disk-space"

    - name: dragonfly.replication
      interval: 30s
      rules:
        - alert: DragonflyReplicationLag
          expr: dragonfly_replication_lag_seconds > 30
          for: 2m
          labels:
            severity: warning
            service: dragonfly
            tier: storage
          annotations:
            summary: "Dragonfly replication lag is high"
            description: "Dragonfly replication lag is {{ $value }}s on {{ $labels.pod }}"
            runbook_url: "https://runbooks.samcloud.online/dragonfly/replication-lag"

        - alert: DragonflyReplicationBroken
          expr: dragonfly_replica_connected == 0
          for: 1m
          labels:
            severity: critical
            service: dragonfly
            tier: storage
          annotations:
            summary: "Dragonfly replication is broken"
            description: "Dragonfly replica is disconnected on {{ $labels.pod }}"
            runbook_url: "https://runbooks.samcloud.online/dragonfly/replication-broken"