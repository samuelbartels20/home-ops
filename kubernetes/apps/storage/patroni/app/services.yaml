---
# Primary Service (Read/Write)
apiVersion: v1
kind: Service
metadata:
  name: patroni-ha-cluster-primary
  namespace: storage
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/component: postgresql-ha
    app.kubernetes.io/part-of: postgresql
    service-type: primary
    environment: production
  annotations:
    # Cilium LoadBalancer IP from pool (192.168.8.1/24)
    io.cilium/lb-ipam-ips: "192.168.8.106"
    external-dns.alpha.kubernetes.io/hostname: postgres-primary.samcloud.online
    service.beta.kubernetes.io/topology-aware-hints: auto
spec:
  type: LoadBalancer
  loadBalancerClass: cilium
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
      protocol: TCP
    - name: patroni-api
      port: 8008
      targetPort: 8008
      protocol: TCP
  selector:
    app.kubernetes.io/name: patroni
    postgresql-role: master
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  externalTrafficPolicy: Local
  internalTrafficPolicy: Local

---
# Replica Service (Read-Only)
apiVersion: v1
kind: Service
metadata:
  name: patroni-ha-cluster-replica
  namespace: storage
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/component: postgresql-ha
    app.kubernetes.io/part-of: postgresql
    service-type: replica
    environment: production
  annotations:
    # Cilium LoadBalancer IP from pool (192.168.8.1/24)
    io.cilium/lb-ipam-ips: "192.168.8.107"
    external-dns.alpha.kubernetes.io/hostname: postgres-replica.samcloud.online
    service.beta.kubernetes.io/topology-aware-hints: auto
spec:
  type: LoadBalancer
  loadBalancerClass: cilium
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app.kubernetes.io/name: patroni
    postgresql-role: replica
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  externalTrafficPolicy: Local
  internalTrafficPolicy: Local

---
# Admin Service (Management)
apiVersion: v1
kind: Service
metadata:
  name: patroni-ha-cluster-admin
  namespace: storage
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/component: postgresql-ha
    app.kubernetes.io/part-of: postgresql
    service-type: admin
    environment: production
  annotations:
    # Internal only - no external IP
    service.beta.kubernetes.io/topology-aware-hints: auto
spec:
  type: ClusterIP
  ports:
    - name: patroni-api
      port: 8008
      targetPort: 8008
      protocol: TCP
    - name: metrics
      port: 9187
      targetPort: 9187
      protocol: TCP
  selector:
    app.kubernetes.io/name: patroni
  sessionAffinity: ClientIP 