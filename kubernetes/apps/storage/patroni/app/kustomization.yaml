---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: storage

metadata:
  name: patroni-ha-cluster
  annotations:
    description: "Enterprise-grade Patroni PostgreSQL HA cluster"
    version: "3.3.3"
    maintainer: "DevOps Team"

resources:
  - ./helmrelease.yaml
  - ./externalsecret.yaml
  - ./rbac.yaml
  - ./pdb.yaml
  - ./services.yaml
  - ./resource-quotas.yaml
  - ./chaos-testing.yaml
  - ./talos-requirements.yaml
  - ./cilium-network-optimization.yaml
  - ./production-validation.yaml
  - ../config/configmap.yaml

commonLabels:
  app.kubernetes.io/name: patroni
  app.kubernetes.io/instance: patroni-ha-cluster
  app.kubernetes.io/component: postgresql-ha
  app.kubernetes.io/part-of: postgresql
  app.kubernetes.io/version: "3.3.3"
  environment: production
  tier: database

commonAnnotations:
  config.kubernetes.io/origin: "kustomize"
  deployment.kubernetes.io/revision: "1"
  monitoring.coreos.com/enabled: "true"
  replication.postgresql.org/enabled: "true"

# Resource transformations
patches:
  - target:
      kind: HelmRelease
      name: patroni-ha-cluster
    patch: |-
      - op: add
        path: /metadata/annotations/kustomize.toolkit.fluxcd.io~1prune
        value: "true"
      - op: add
        path: /metadata/annotations/kustomize.toolkit.fluxcd.io~1ssa
        value: "merge"

# Resource ordering for proper dependency management
transformers:
  - |-
    apiVersion: builtin
    kind: AnnotationsTransformer
    metadata:
      name: add-build-metadata
    annotations:
      build.timestamp: "2024-01-01T00:00:00Z"
      build.version: "v3.3.3"

# ConfigMap generators for runtime settings
configMapGenerator:
  - name: patroni-runtime-settings
    literals:
      - "cluster_name=patroni-ha-cluster"
      - "postgresql_version=17"
      - "replication_slots=3"
      - "max_connections=200"
      - "shared_buffers=256MB"
    options:
      disableNameSuffixHash: true

# Secret generators for additional configurations
secretGenerator:
  - name: patroni-runtime-config
    literals:
      - "cluster_scope=patroni-ha-cluster"
      - "api_port=8008"
      - "postgresql_port=5432"
    options:
      disableNameSuffixHash: true

# Resource validation
validators:
  - |-
    apiVersion: builtin
    kind: ResourceQuotaValidator
    metadata:
      name: validate-resources 