---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: patroni-resource-quota
  namespace: storage
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/component: postgresql-ha
    app.kubernetes.io/part-of: postgresql
    environment: production
spec:
  hard:
    # Compute Resources
    requests.cpu: "20"
    requests.memory: 40Gi
    requests.ephemeral-storage: 100Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    limits.ephemeral-storage: 200Gi
    
    # Storage Resources
    requests.storage: 2Ti
    persistentvolumeclaims: "10"
    
    # Object Counts
    pods: "20"
    services: "10"
    secrets: "20"
    configmaps: "20"
    jobs.batch: "10"
    cronjobs.batch: "5"
    
    # Network Resources
    services.loadbalancers: "5"
    services.nodeports: "0"

---
apiVersion: v1
kind: LimitRange
metadata:
  name: patroni-limit-range
  namespace: storage
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/component: postgresql-ha
    app.kubernetes.io/part-of: postgresql
    environment: production
spec:
  limits:
    # Pod Limits
    - type: Pod
      max:
        cpu: "8"
        memory: 16Gi
        ephemeral-storage: 20Gi
      min:
        cpu: 100m
        memory: 128Mi
        ephemeral-storage: 1Gi
    
    # Container Limits
    - type: Container
      default:
        cpu: 1000m
        memory: 2Gi
        ephemeral-storage: 2Gi
      defaultRequest:
        cpu: 500m
        memory: 1Gi
        ephemeral-storage: 1Gi
      max:
        cpu: "4"
        memory: 8Gi
        ephemeral-storage: 10Gi
      min:
        cpu: 50m
        memory: 64Mi
        ephemeral-storage: 500Mi
    
    # PVC Limits
    - type: PersistentVolumeClaim
      max:
        storage: 1Ti
      min:
        storage: 10Gi

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: patroni-strict-netpol
  namespace: storage
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/component: postgresql-ha
    app.kubernetes.io/part-of: postgresql
    environment: production
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: patroni
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # PostgreSQL connections from applications
    - from:
        - namespaceSelector:
            matchLabels:
              name: default
        - namespaceSelector:
            matchLabels:
              name: applications
        - namespaceSelector:
            matchLabels:
              name: services
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: pgbouncer
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: haproxy
      ports:
        - protocol: TCP
          port: 5432
    
    # Patroni API for management
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
        - namespaceSelector:
            matchLabels:
              name: admin
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: patroni
      ports:
        - protocol: TCP
          port: 8008
    
    # Metrics scraping
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: prometheus
      ports:
        - protocol: TCP
          port: 9187
    
    # Inter-cluster replication
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: patroni
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8008
  
  egress:
    # Kubernetes API access
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
    
    # DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    
    # Inter-cluster communication
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: patroni
      ports:
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8008
    
    # External backup destinations (S3)
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 22 