# Talos Linux Machine Configuration Requirements for PostgreSQL Production
# 
# These parameters MUST be applied to your Talos machine configuration:
# 
# Required Talos Linux machine.sysctls configuration:

apiVersion: v1
kind: ConfigMap
metadata:
  name: talos-postgresql-requirements
  namespace: storage
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/component: talos-config
    app.kubernetes.io/part-of: postgresql
    environment: production
  annotations:
    documentation: "https://talos.dev/v1.8/kubernetes-guides/configuration/postgresql/"
data:
  talos-machine-config.yaml: |
    # Add these to your Talos machine configuration under machine.sysctls:
    
    # PostgreSQL Shared Memory Requirements
    kernel.shmmax: "134217728"      # 128MB max shared memory segment
    kernel.shmall: "2097152"        # 8GB total shared memory pages
    kernel.shmmni: "4096"           # Max shared memory segments
    
    # PostgreSQL Semaphore Requirements  
    kernel.sem: "250 32000 100 128" # SEMMSL SEMMNS SEMOPM SEMMNI
    
    # Network Tuning for High Connection Loads
    net.core.somaxconn: "65535"
    net.ipv4.tcp_max_syn_backlog: "65535"
    net.core.netdev_max_backlog: "30000"
    net.ipv4.tcp_fin_timeout: "15"
    net.ipv4.tcp_tw_reuse: "1"
    net.ipv4.tcp_keepalive_time: "300"
    net.ipv4.tcp_keepalive_intvl: "30"
    net.ipv4.tcp_keepalive_probes: "3"
    
    # Memory Management for Database Workloads
    vm.dirty_ratio: "10"
    vm.dirty_background_ratio: "5"
    vm.dirty_writeback_centisecs: "100"
    vm.dirty_expire_centisecs: "500"
    vm.swappiness: "1"              # Minimal swapping
    vm.overcommit_memory: "2"       # Strict memory accounting
    vm.overcommit_ratio: "80"
    
    # File System Tuning
    fs.file-max: "6815744"
    fs.aio-max-nr: "1048576"
    
    # Security for Production
    kernel.dmesg_restrict: "1"
    kernel.kptr_restrict: "2"
    net.ipv4.conf.all.log_martians: "1"
    net.ipv4.conf.default.log_martians: "1"

  apply-instructions.md: |
    # Applying Talos Linux Configuration for PostgreSQL
    
    ## 1. Update your talconfig.yaml or machine config:
    
    ```yaml
    machine:
      sysctls:
        # PostgreSQL Shared Memory Requirements
        kernel.shmmax: "134217728"
        kernel.shmall: "2097152" 
        kernel.shmmni: "4096"
        kernel.sem: "250 32000 100 128"
        
        # Network Tuning
        net.core.somaxconn: "65535"
        net.ipv4.tcp_max_syn_backlog: "65535"
        net.core.netdev_max_backlog: "30000"
        net.ipv4.tcp_fin_timeout: "15"
        net.ipv4.tcp_tw_reuse: "1"
        
        # Memory Management
        vm.dirty_ratio: "10"
        vm.dirty_background_ratio: "5"
        vm.swappiness: "1"
        vm.overcommit_memory: "2"
        vm.overcommit_ratio: "80"
        
        # File System
        fs.file-max: "6815744"
        fs.aio-max-nr: "1048576"
    ```
    
    ## 2. Apply the configuration:
    
    ```bash
    # Generate new machine configurations
    talosctl gen config
    
    # Apply to all nodes
    talosctl apply-config --nodes <node-ips> --file <config-file>
    
    # Verify sysctls are applied
    talosctl get extensions
    talosctl read /proc/sys/kernel/shmmax
    ```
    
    ## 3. Required Node Labels for PostgreSQL:
    
    ```bash
    kubectl label nodes <node-name> postgresql.cnpg.io/node-role=postgresql
    kubectl label nodes <node-name> storage.kubernetes.io/node-role=database
    ```

  validation-script.sh: |
    #!/bin/bash
    # Talos Linux PostgreSQL Validation Script
    
    echo "Validating Talos Linux PostgreSQL Requirements..."
    
    # Check sysctls
    echo "Checking kernel parameters..."
    talosctl read /proc/sys/kernel/shmmax
    talosctl read /proc/sys/kernel/shmall
    talosctl read /proc/sys/kernel/shmmni
    talosctl read /proc/sys/kernel/sem
    
    echo "Checking network parameters..."
    talosctl read /proc/sys/net/core/somaxconn
    talosctl read /proc/sys/net/ipv4/tcp_max_syn_backlog
    
    echo "Checking memory parameters..."
    talosctl read /proc/sys/vm/dirty_ratio
    talosctl read /proc/sys/vm/swappiness
    
    echo "Checking file system parameters..."
    talosctl read /proc/sys/fs/file-max
    
    echo "Validation complete!"

---
# InitContainer to validate Talos requirements
apiVersion: v1
kind: ConfigMap
metadata:
  name: talos-validation-init
  namespace: storage
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/component: talos-validation
    app.kubernetes.io/part-of: postgresql
    environment: production
data:
  validate.sh: |
    #!/bin/bash
    set -euo pipefail
    
    echo "Validating Talos Linux environment for PostgreSQL..."
    
    # Check if we're running on Talos
    if [ ! -f /proc/version ] || ! grep -q "talos" /proc/version; then
      echo "WARNING: Not running on Talos Linux - some optimizations may not be available"
    fi
    
    # Validate kernel parameters
    SHMMAX=$(cat /proc/sys/kernel/shmmax)
    if [ "$SHMMAX" -lt 134217728 ]; then
      echo "ERROR: kernel.shmmax too low: $SHMMAX (minimum: 134217728)"
      exit 1
    fi
    
    SOMAXCONN=$(cat /proc/sys/net/core/somaxconn)
    if [ "$SOMAXCONN" -lt 32768 ]; then
      echo "WARNING: net.core.somaxconn may be too low: $SOMAXCONN (recommended: 65535)"
    fi
    
    # Check available memory
    MEMORY_KB=$(grep MemTotal /proc/meminfo | awk '{print $2}')
    MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
    if [ "$MEMORY_GB" -lt 4 ]; then
      echo "WARNING: Low memory detected: ${MEMORY_GB}GB (minimum recommended: 4GB)"
    fi
    
    # Check storage performance
    echo "Testing storage performance..."
    dd if=/dev/zero of=/tmp/test bs=1M count=100 oflag=direct 2>/dev/null || true
    rm -f /tmp/test
    
    echo "Talos Linux validation completed successfully" 