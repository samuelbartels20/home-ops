---
apiVersion: batch/v1
kind: Job
metadata:
  name: patroni-production-validation
  namespace: storage
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/component: validation
    app.kubernetes.io/part-of: postgresql
    environment: production
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: patroni
        app.kubernetes.io/component: validation
        job-type: production-validation
    spec:
      restartPolicy: OnFailure
      serviceAccountName: patroni-chaos  # Reuse existing SA with cluster access
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
        - name: validation
          image: bitnami/kubectl:latest
          imagePullPolicy: IfNotPresent
          
          command:
            - "/bin/bash"
            - "-c"
            - |
              #!/bin/bash
              set -euo pipefail
              
              echo "🚀 Starting Talos Linux + Cilium + PostgreSQL Production Validation"
              echo "=================================================="
              
              VALIDATION_FAILED=0
              
              # Function to check and report
              check_requirement() {
                local name="$1"
                local command="$2"
                local expected="$3"
                
                echo -n "✓ Checking $name... "
                
                if result=$(eval "$command" 2>/dev/null); then
                  if [[ "$result" == *"$expected"* ]] || [[ -z "$expected" ]]; then
                    echo "✅ PASS"
                  else
                    echo "❌ FAIL (Expected: $expected, Got: $result)"
                    VALIDATION_FAILED=1
                  fi
                else
                  echo "❌ FAIL (Command failed)"
                  VALIDATION_FAILED=1
                fi
              }
              
              # 1. Talos Linux Environment Validation
              echo "🏗️  TALOS LINUX VALIDATION"
              echo "=========================="
              
              check_requirement "Talos nodes present" \
                "kubectl get nodes -l node.kubernetes.io/instance-type=talos --no-headers | wc -l" \
                ""
              
              check_requirement "Node kernel version" \
                "kubectl get nodes -o jsonpath='{.items[0].status.nodeInfo.kernelVersion}'" \
                ""
              
              # 2. Cilium Network Validation  
              echo ""
              echo "🌐 CILIUM NETWORK VALIDATION"
              echo "============================="
              
              check_requirement "Cilium pods running" \
                "kubectl get pods -n kube-system -l app.kubernetes.io/name=cilium --field-selector=status.phase=Running --no-headers | wc -l" \
                ""
              
              check_requirement "Cilium BGP enabled" \
                "kubectl get cm -n kube-system cilium-values -o jsonpath='{.data.values\.yaml}'" \
                "bgpControlPlane"
              
              check_requirement "L2 announcements enabled" \
                "kubectl get cm -n kube-system cilium-values -o jsonpath='{.data.values\.yaml}'" \
                "l2announcements"
              
              check_requirement "LoadBalancer IP pool exists" \
                "kubectl get ciliumloadbalancerippool -o name" \
                "pool"
              
              # 3. Storage Validation
              echo ""
              echo "💾 STORAGE VALIDATION"
              echo "===================="
              
              check_requirement "Premium storage class available" \
                "kubectl get storageclass premium-rwo --no-headers" \
                "premium-rwo"
              
              check_requirement "ZFS storage configured" \
                "kubectl get storageclass premium-rwo -o jsonpath='{.provisioner}'" \
                "zfs.csi.openebs.io"
              
              check_requirement "Snapshot controller running" \
                "kubectl get pods -n storage -l app.kubernetes.io/name=snapshot-controller --field-selector=status.phase=Running --no-headers | wc -l" \
                ""
              
              # 4. PostgreSQL Resources Validation
              echo ""
              echo "🐘 POSTGRESQL RESOURCES VALIDATION"
              echo "=================================="
              
              check_requirement "Patroni HelmRelease exists" \
                "kubectl get helmrelease -n storage patroni-ha-cluster --no-headers" \
                "patroni-ha-cluster"
              
              check_requirement "External secrets configured" \
                "kubectl get externalsecret -n storage patroni-auth --no-headers" \
                "patroni-auth"
              
              check_requirement "Service Monitor configured" \
                "kubectl get servicemonitor -n storage patroni-ha-cluster-metrics --no-headers" \
                "patroni-ha-cluster-metrics"
              
              check_requirement "PodDisruptionBudget configured" \
                "kubectl get pdb -n storage patroni-ha-cluster-pdb --no-headers" \
                "patroni-ha-cluster-pdb"
              
              # 5. Network Policies Validation
              echo ""
              echo "🔒 NETWORK SECURITY VALIDATION"
              echo "=============================="
              
              check_requirement "Cilium L7 policies exist" \
                "kubectl get ciliumnetworkpolicy -n storage patroni-l7-policy --no-headers" \
                "patroni-l7-policy"
              
              check_requirement "Resource quotas configured" \
                "kubectl get resourcequota -n storage patroni-resource-quota --no-headers" \
                "patroni-resource-quota"
              
              check_requirement "Limit ranges configured" \
                "kubectl get limitrange -n storage patroni-limit-range --no-headers" \
                "patroni-limit-range"
              
              # 6. LoadBalancer Services Validation
              echo ""
              echo "⚖️  LOADBALANCER VALIDATION"
              echo "=========================="
              
              check_requirement "Primary LoadBalancer service" \
                "kubectl get service -n storage patroni-ha-cluster-primary --no-headers" \
                "LoadBalancer"
              
              check_requirement "Replica LoadBalancer service" \
                "kubectl get service -n storage patroni-ha-cluster-replica --no-headers" \
                "LoadBalancer"
              
              # 7. Monitoring and Alerting
              echo ""
              echo "📊 MONITORING VALIDATION"
              echo "======================="
              
              check_requirement "Chaos testing CronJob" \
                "kubectl get cronjob -n storage patroni-chaos-testing --no-headers" \
                "patroni-chaos-testing"
              
              check_requirement "Health check CronJob" \
                "kubectl get cronjob -n storage patroni-health-check --no-headers" \
                "patroni-health-check"
              
              check_requirement "Backup CronJob" \
                "kubectl get cronjob -n storage patroni-backup-full --no-headers" \
                "patroni-backup-full"
              
              # 8. Security Validation
              echo ""
              echo "🔐 SECURITY VALIDATION"
              echo "====================="
              
              check_requirement "Service account exists" \
                "kubectl get serviceaccount -n storage patroni-ha-cluster --no-headers" \
                "patroni-ha-cluster"
              
              check_requirement "RBAC role exists" \
                "kubectl get role -n storage patroni-ha-cluster --no-headers" \
                "patroni-ha-cluster"
              
              check_requirement "Pod Security Policy" \
                "kubectl get networkpolicy -n storage patroni-strict-netpol --no-headers" \
                "patroni-strict-netpol"
              
              # 9. Final Production Readiness Check
              echo ""
              echo "🎯 PRODUCTION READINESS SUMMARY"
              echo "==============================="
              
              if [ $VALIDATION_FAILED -eq 0 ]; then
                echo "✅ ALL VALIDATION CHECKS PASSED!"
                echo "🚀 Patroni cluster is PRODUCTION READY for Talos Linux + Cilium!"
                echo ""
                echo "📋 Production Features Verified:"
                echo "   ✓ Talos Linux optimized environment"
                echo "   ✓ Cilium advanced networking with BGP"
                echo "   ✓ Premium ZFS storage with snapshots"
                echo "   ✓ LoadBalancer services with external IPs"
                echo "   ✓ PodDisruptionBudget for zero-downtime updates"
                echo "   ✓ Resource quotas and limit ranges"
                echo "   ✓ L7 network policies with PostgreSQL filtering"
                echo "   ✓ Chaos engineering and health monitoring"
                echo "   ✓ Comprehensive backup strategy"
                echo "   ✓ Security hardening and RBAC"
                echo ""
                echo "🎉 Ready for big tech production workloads!"
              else
                echo "❌ VALIDATION FAILED!"
                echo "🔧 Please fix the failed checks before production deployment."
                exit 1
              fi
          
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

---
# ConfigMap with production readiness checklist
apiVersion: v1
kind: ConfigMap
metadata:
  name: patroni-production-checklist
  namespace: storage
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/component: documentation
    app.kubernetes.io/part-of: postgresql
    environment: production
data:
  production-checklist.md: |
    # Talos Linux + Cilium + PostgreSQL Production Readiness Checklist
    
