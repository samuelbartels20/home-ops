---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: patroni-auth
  namespace: storage
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/component: postgresql-ha
    app.kubernetes.io/part-of: postgresql
    environment: production
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: patroni-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: patroni
          cnpg.io/reload: "true"
      data:
        # PostgreSQL Superuser Credentials
        postgres_password: "{{ .postgres_password }}"
        postgres_username: "postgres"
        
        # Replication User Credentials
        replication_password: "{{ .replication_password }}"
        replication_username: "replicator"
        
        # Monitoring User Credentials
        monitoring_password: "{{ .monitoring_password }}"
        monitoring_username: "monitoring"
        
        # Patroni API Credentials
        patroni_api_password: "{{ .patroni_api_password }}"
        patroni_api_username: "patroni"
        
        # SSL Certificates and Keys
        server_crt: "{{ .ssl_cert }}"
        server_key: "{{ .ssl_key }}"
        ca_crt: "{{ .ca_cert }}"
        server_crl: "{{ .ssl_crl }}"
        
        # Connection Strings for Applications
        primary_connection_string: "postgresql://postgres:{{ .postgres_password }}@patroni-ha-cluster.storage.svc.cluster.local:5432/postgres?sslmode=require"
        replica_connection_string: "postgresql://postgres:{{ .postgres_password }}@patroni-ha-cluster-replica.storage.svc.cluster.local:5432/postgres?sslmode=require&target_session_attrs=read-only"
        monitoring_connection_string: "postgresql://monitoring:{{ .monitoring_password }}@patroni-ha-cluster.storage.svc.cluster.local:5432/postgres?sslmode=require"
        
        # Patroni Control Connection
        patroni_ctl_config: |
          hosts:
            - patroni-ha-cluster-0.patroni-ha-cluster-headless.storage.svc.cluster.local:8008
            - patroni-ha-cluster-1.patroni-ha-cluster-headless.storage.svc.cluster.local:8008
            - patroni-ha-cluster-2.patroni-ha-cluster-headless.storage.svc.cluster.local:8008
          authentication:
            username: patroni
            password: {{ .patroni_api_password }}
          ssl:
            verify: true
            cert: /etc/ssl/certs/patroni.crt
            key: /etc/ssl/private/patroni.key
            ca: /etc/ssl/certs/ca.crt
            
        # Environment variables for containers
        POSTGRES_PASSWORD: "{{ .postgres_password }}"
        PATRONI_SUPERUSER_PASSWORD: "{{ .postgres_password }}"
        PATRONI_REPLICATION_PASSWORD: "{{ .replication_password }}"
        PATRONI_MONITORING_PASSWORD: "{{ .monitoring_password }}"
        PATRONI_API_PASSWORD: "{{ .patroni_api_password }}"
        
  dataFrom:
    - extract:
        key: patroni-cluster
    - extract:
        key: postgresql-ssl-certs 