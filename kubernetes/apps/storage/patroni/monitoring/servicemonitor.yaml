---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: patroni-ha-cluster
  namespace: storage
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/component: postgresql-ha
    app.kubernetes.io/part-of: postgresql
    environment: production
    monitoring: prometheus
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/name: patroni
  endpoints:
    # PostgreSQL metrics
    - port: metrics
      interval: 30s
      scrapeTimeout: 10s
      path: /metrics
      scheme: http
      honorLabels: true
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: 'pg_.*'
          targetLabel: __name__
          replacement: '${1}'
        - sourceLabels: [instance]
          targetLabel: instance
          replacement: 'patroni-${1}'
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_service_name]
          targetLabel: service
        - sourceLabels: [__meta_kubernetes_pod_label_postgresql_role]
          targetLabel: postgresql_role
          
    # Patroni API metrics
    - port: patroni-api
      interval: 30s
      scrapeTimeout: 10s
      path: /metrics
      scheme: http
      honorLabels: true
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: 'patroni_.*'
          targetLabel: __name__
          replacement: '${1}'
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_service_name]
          targetLabel: service
        - sourceLabels: [__meta_kubernetes_pod_label_postgresql_role]
          targetLabel: postgresql_role

---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: patroni-ha-cluster-alerts
  namespace: storage
  labels:
    app.kubernetes.io/name: patroni
    app.kubernetes.io/component: postgresql-ha
    app.kubernetes.io/part-of: postgresql
    environment: production
    prometheus: kube-prometheus
spec:
  groups:
    - name: patroni.cluster_health
      interval: 30s
      rules:
        # ==============================
        # CLUSTER HEALTH ALERTS
        # ==============================
        
        - alert: PatroniClusterHasNoLeader
          expr: |
            max(patroni_cluster_unlocked) by (cluster) > 0
          for: 1m
          labels:
            severity: critical
            service: patroni
            component: cluster-health
          annotations:
            summary: "Patroni cluster has no leader"
            description: "Patroni cluster {{ $labels.cluster }} has no leader for more than 1 minute"
            runbook_url: "https://docs.company.com/runbooks/patroni-no-leader"

        - alert: PatroniNodeDown
          expr: |
            up{job="patroni-ha-cluster"} == 0
          for: 2m
          labels:
            severity: critical
            service: patroni
            component: availability
          annotations:
            summary: "Patroni node is down"
            description: "Patroni node {{ $labels.instance }} is not responding for more than 2 minutes"
            runbook_url: "https://docs.company.com/runbooks/patroni-node-down"

        - alert: PatroniClusterDegraded
          expr: |
            count(up{job="patroni-ha-cluster"} == 1) < 2
          for: 5m
          labels:
            severity: warning
            service: patroni
            component: cluster-health
          annotations:
            summary: "Patroni cluster is degraded"
            description: "Patroni cluster has fewer than 2 healthy nodes"

        - alert: PatroniReplicationLag
          expr: |
            pg_replication_lag{type="replay_lag"} > 10
          for: 5m
          labels:
            severity: warning
            service: patroni
            component: replication
          annotations:
            summary: "High replication lag detected"
            description: "Replica {{ $labels.instance }} has replication lag of {{ $value }} seconds"

        - alert: PatroniReplicationBroken
          expr: |
            pg_stat_replication_clients == 0 and patroni_is_leader == 1
          for: 3m
          labels:
            severity: critical
            service: patroni
            component: replication
          annotations:
            summary: "PostgreSQL replication is broken"
            description: "Leader {{ $labels.instance }} has no active replicas"

    - name: patroni.performance
      interval: 30s
      rules:
        # ==============================
        # PERFORMANCE ALERTS
        # ==============================

        - alert: PatroniHighConnectionCount
          expr: |
            pg_stat_database_numbackends > 150
          for: 5m
          labels:
            severity: warning
            service: patroni
            component: performance
          annotations:
            summary: "High connection count"
            description: "Database {{ $labels.datname }} on {{ $labels.instance }} has {{ $value }} connections"

        - alert: PatroniSlowQueries
          expr: |
            pg_slow_queries > 10
          for: 5m
          labels:
            severity: warning
            service: patroni
            component: performance
          annotations:
            summary: "High number of slow queries"
            description: "{{ $value }} queries running longer than 5 seconds on {{ $labels.instance }}"

        - alert: PatroniLockContention
          expr: |
            sum(pg_locks{mode="AccessExclusiveLock"}) by (instance) > 5
          for: 2m
          labels:
            severity: warning
            service: patroni
            component: performance
          annotations:
            summary: "High lock contention detected"
            description: "{{ $value }} AccessExclusiveLocks detected on {{ $labels.instance }}"

        - alert: PatroniHighCPUUsage
          expr: |
            rate(container_cpu_usage_seconds_total{container="main"}[5m]) * 100 > 80
          for: 10m
          labels:
            severity: warning
            service: patroni
            component: resources
          annotations:
            summary: "High CPU usage"
            description: "Patroni container on {{ $labels.instance }} is using {{ $value }}% CPU"

        - alert: PatroniHighMemoryUsage
          expr: |
            (container_memory_working_set_bytes{container="main"} / container_spec_memory_limit_bytes{container="main"}) * 100 > 85
          for: 10m
          labels:
            severity: warning
            service: patroni
            component: resources
          annotations:
            summary: "High memory usage"
            description: "Patroni container on {{ $labels.instance }} is using {{ $value }}% memory"

    - name: patroni.storage
      interval: 60s
      rules:
        # ==============================
        # STORAGE ALERTS
        # ==============================

        - alert: PatroniDiskSpaceHigh
          expr: |
            (1 - (node_filesystem_avail_bytes{mountpoint="/var/lib/postgresql/data"} / node_filesystem_size_bytes{mountpoint="/var/lib/postgresql/data"})) * 100 > 85
          for: 5m
          labels:
            severity: warning
            service: patroni
            component: storage
          annotations:
            summary: "PostgreSQL disk space is running low"
            description: "Disk usage on {{ $labels.instance }} is {{ $value }}%"

        - alert: PatroniDiskSpaceCritical
          expr: |
            (1 - (node_filesystem_avail_bytes{mountpoint="/var/lib/postgresql/data"} / node_filesystem_size_bytes{mountpoint="/var/lib/postgresql/data"})) * 100 > 95
          for: 2m
          labels:
            severity: critical
            service: patroni
            component: storage
          annotations:
            summary: "PostgreSQL disk space is critically low"
            description: "Disk usage on {{ $labels.instance }} is {{ $value }}%"

        - alert: PatroniDatabaseSizeGrowth
          expr: |
            increase(pg_database_size_bytes[24h]) > 10737418240  # 10GB
          for: 1h
          labels:
            severity: info
            service: patroni
            component: storage
          annotations:
            summary: "Large database growth detected"
            description: "Database {{ $labels.datname }} grew by {{ $value | humanize }}B in the last 24 hours"

        - alert: PatroniWALSegmentCount
          expr: |
            pg_stat_archiver_archived_count - pg_stat_archiver_failed_count > 100
          for: 30m
          labels:
            severity: warning
            service: patroni
            component: wal
          annotations:
            summary: "High number of unarchived WAL segments"
            description: "{{ $value }} WAL segments are waiting to be archived on {{ $labels.instance }}"

    - name: patroni.backup
      interval: 300s
      rules:
        # ==============================
        # BACKUP & RECOVERY ALERTS
        # ==============================

        - alert: PatroniBackupFailed
          expr: |
            increase(pg_stat_archiver_failed_count[1h]) > 0
          for: 1m
          labels:
            severity: critical
            service: patroni
            component: backup
          annotations:
            summary: "PostgreSQL backup/archive failed"
            description: "{{ $value }} archive failures in the last hour on {{ $labels.instance }}"

        - alert: PatroniOldestBackup
          expr: |
            time() - pg_stat_archiver_last_archived_time > 86400  # 24 hours
          for: 1h
          labels:
            severity: warning
            service: patroni
            component: backup
          annotations:
            summary: "No recent backups found"
            description: "Last successful backup was more than 24 hours ago on {{ $labels.instance }}"

    - name: patroni.security
      interval: 60s
      rules:
        # ==============================
        # SECURITY ALERTS
        # ==============================

        - alert: PatroniFailedConnections
          expr: |
            increase(pg_stat_database_numbackends{datname="postgres"}[5m]) > 100
          for: 2m
          labels:
            severity: warning
            service: patroni
            component: security
          annotations:
            summary: "High number of failed connections"
            description: "{{ $value }} connection attempts in 5 minutes on {{ $labels.instance }}"

        - alert: PatroniUnauthorizedAccess
          expr: |
            increase(postgresql_log_messages_total{level="ERROR", message=~".*authentication failed.*"}[5m]) > 10
          for: 1m
          labels:
            severity: critical
            service: patroni
            component: security
          annotations:
            summary: "Multiple authentication failures detected"
            description: "{{ $value }} authentication failures in 5 minutes on {{ $labels.instance }}"

    - name: patroni.maintenance
      interval: 3600s
      rules:
        # ==============================
        # MAINTENANCE ALERTS
        # ==============================

        - alert: PatroniVacuumNotRunning
          expr: |
            time() - pg_stat_user_tables_last_autovacuum > 604800  # 7 days
          for: 1h
          labels:
            severity: warning
            service: patroni
            component: maintenance
          annotations:
            summary: "Table has not been vacuumed recently"
            description: "Table {{ $labels.relname }} has not been vacuumed for more than 7 days"

        - alert: PatroniAnalyzeNotRunning
          expr: |
            time() - pg_stat_user_tables_last_autoanalyze > 604800  # 7 days
          for: 1h
          labels:
            severity: info
            service: patroni
            component: maintenance
          annotations:
            summary: "Table has not been analyzed recently"
            description: "Table {{ $labels.relname }} has not been analyzed for more than 7 days"

        - alert: PatroniDeadTuples
          expr: |
            pg_stat_user_tables_n_dead_tup / (pg_stat_user_tables_n_live_tup + pg_stat_user_tables_n_dead_tup) > 0.2
          for: 2h
          labels:
            severity: warning
            service: patroni
            component: maintenance
          annotations:
            summary: "High percentage of dead tuples"
            description: "Table {{ $labels.relname }} has {{ $value | humanizePercentage }} dead tuples" 