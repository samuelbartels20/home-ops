---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: patroni-app
  namespace: flux-system
  labels:
    substitution.flux.sh/enabled: "false"
spec:
  interval: 10m
  path: "./kubernetes/apps/storage/patroni/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  timeout: 10m
  dependsOn:
    - name: cluster-apps
    - name: external-secrets
    - name: onepassword-connect
  healthChecks:
    - apiVersion: apps/v1
      kind: StatefulSet
      name: patroni-ha-cluster
      namespace: storage
    - apiVersion: v1
      kind: Service
      name: patroni-ha-cluster
      namespace: storage
    - apiVersion: external-secrets.io/v1beta1
      kind: ExternalSecret
      name: patroni-auth
      namespace: storage
  postBuild:
    substitute:
      APP_VERSION: "3.3.3"
      POSTGRESQL_VERSION: "17.2"
      PATRONI_REPLICAS: "3"

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: patroni-monitoring
  namespace: flux-system
  labels:
    substitution.flux.sh/enabled: "false"
spec:
  interval: 10m
  path: "./kubernetes/apps/storage/patroni/monitoring"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  timeout: 5m
  dependsOn:
    - name: patroni-app
  healthChecks:
    - apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      name: patroni-ha-cluster
      namespace: storage
    - apiVersion: monitoring.coreos.com/v1
      kind: PrometheusRule
      name: patroni-ha-cluster-alerts
      namespace: storage

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: patroni-backup
  namespace: flux-system
  labels:
    substitution.flux.sh/enabled: "false"
spec:
  interval: 30m
  path: "./kubernetes/apps/storage/patroni/backup"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  timeout: 5m
  dependsOn:
    - name: patroni-app
  healthChecks:
    - apiVersion: batch/v1
      kind: CronJob
      name: patroni-full-backup
      namespace: storage
    - apiVersion: batch/v1
      kind: CronJob
      name: patroni-backup-verification
      namespace: storage
    - apiVersion: v1
      kind: PersistentVolumeClaim
      name: patroni-backup-storage
      namespace: storage 