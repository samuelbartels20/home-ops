---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
  namespace: dbms
spec:
  interval: 1h
  chart:
    spec:
      chart: openebs
      version: 4.3.2
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: openebs
        namespace: flux-system
  values:
    # LocalPV Provisioner Configuration
    localpv-provisioner:
      rbac:
        create: true
        # Ensure proper RBAC permissions for API access
        pspEnabled: false

      localpv:
        image:
          registry: quay.io/

      helperPod:
        image:
          registry: quay.io/

      # Hostpath storage class configuration
      hostpathClass:
        enabled: true
        name: openebs-hostpath
        isDefaultClass: false
        basePath: /var/openebs/local
        reclaimPolicy: Delete

      # Critical fix: Host network and DNS configuration for API connectivity
      provisioner:
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        # Additional resource limits for stability
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"

    # CRD Configuration
    openebs-crds:
      csi:
        volumeSnapshots:
          enabled: false
          keep: false

    # Disable unused engines to reduce complexity
    zfs-localpv:
      enabled: false
      analytics:
        enabled: false

    lvm-localpv:
      enabled: false

    mayastor:
      enabled: false

    # Disable observability components that can cause issues
    loki:
      enabled: false

    alloy:
      enabled: false

    # Engine configuration - only enable what we need
    engines:
      local:
        lvm:
          enabled: false
        zfs:
          enabled: false
      replicated:
        mayastor:
          enabled: false

    # Global settings
    global:
      # Ensure consistent registry
      imageRegistry: "quay.io/"
      # Set resource cleanup policies
      cleanup:
        image:
          registry: quay.io/