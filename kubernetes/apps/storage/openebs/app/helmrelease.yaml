---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
spec:
  interval: 1h
  chart:
    spec:
      chart: openebs
      version: 4.3.2
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: openebs
        namespace: flux-system
  values:
    localpv-provisioner:
      rbac:
        create: true

      localpv:
        image:
          registry: quay.io/

      helperPod:
        image:
          registry: quay.io/

      hostpathClass:
        enabled: true
        name: openebs-hostpath
        isDefaultClass: false
        basePath: /var/openebs/local

    openebs-crds:
      csi:
        volumeSnapshots:
          enabled: false
          keep: false

    zfs-localpv:
      enabled: false
      zfsNode:
        encrKeysDir: "/var/zfs"
      analytics:
        enabled: false
      zfs:
        bin: /usr/local/sbin/zfs
      crds:
        csi:
          volumeSnapshots:
            enabled: false

    lvm-localpv:
      enabled: false

    mayastor:
      enabled: false

    loki:
      enabled: false

    alloy:
      enabled: false

    engines:
      local:
        lvm:
          enabled: false
        zfs:
          enabled: false
      replicated:
        mayastor:
          enabled: false
---
# Network policy to secure storage namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: storage-network-policy
  namespace: storage
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: storage
    - namespaceSelector:
        matchLabels:
          name: observability
    - namespaceSelector:
        matchLabels:
          name: services
  egress:
  - to: []
    ports:
    - protocol: UDP
      port: 53  
  - to: []
    ports:
    - protocol: UDP
      port: 123  
  - to:
    - namespaceSelector:
        matchLabels:
          name: storage