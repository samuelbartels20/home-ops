---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
  namespace: storage
  labels:
    app.kubernetes.io/name: openebs
    app.kubernetes.io/component: storage
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: openebs
      version: "4.1.1"
      sourceRef:
        kind: HelmRepository
        name: openebs
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
    timeout: 15m
    replace: true
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
    timeout: 15m
    force: false
  values:
    # Enable only Local PV Provisioner (simple configuration)
    localpv-provisioner:
      enabled: true
    
    # Disable all observability components
    openebs-loki:
      enabled: false
    
    openebs-minio:
      enabled: false
    
    # Disable advanced storage engines
    ndm:
      enabled: false
    
    webhook:
      enabled: false
    
    # Disable other engines
    cstor:
      enabled: false
    
    jiva:
      enabled: false
    
    mayastor:
      enabled: false

---
# Network policy to secure storage namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: storage-network-policy
  namespace: storage
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: storage
    - namespaceSelector:
        matchLabels:
          name: observability
    - namespaceSelector:
        matchLabels:
          name: services
  egress:
  - to: []
    ports:
    - protocol: UDP
      port: 53  
  - to: []
    ports:
    - protocol: UDP
      port: 123  
  - to:
    - namespaceSelector:
        matchLabels:
          name: storage