---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openebs
  namespace: storage
spec:
  interval: 5m
  chart:
    spec:
      chart: openebs
      version: 4.3.1
      sourceRef:
        kind: HelmRepository
        name: openebs
        namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Disable observability and backup components
    alloy:
      enabled: false

    minio:
      enabled: false

    # Disable engines using alloy or minio
    engines:
      alloy:
        enabled: false
      minio:
        enabled: false
      local:
        lvm:
          enabled: false
        zfs:
          enabled: false
      replicated:
        mayastor:
          enabled: false

    # Disable CSI snapshots
    openebs-crds:
      csi:
        volumeSnapshots:
          enabled: false

    # Configure hostpath provisioner
    localpv-provisioner:
      localpv:
        image:
          registry: quay.io
      helperPod:
        image:
          registry: quay.io
      hostpathClass:
        enabled: true
        name: openebs-hostpath
        isDefaultClass: false
        basePath: /var/openebs/local
