# VerneMQ Grafana Dashboard
apiVersion: v1
kind: ConfigMap
metadata:
  name: vernemq-dashboard
  namespace: storage
  labels:
    grafana_dashboard: "true"
data:
  vernemq.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "gnetId": null,
      "graphTooltip": 0,
      "hideControls": false,
      "links": [],
      "refresh": "10s",
      "rows": [],
      "schemaVersion": 16,
      "style": "dark",
      "tags": ["vernemq", "mqtt", "messaging"],
      "templating": {
        "list": [
          {
            "allValue": null,
            "current": {},
            "datasource": "Prometheus",
            "hide": 0,
            "includeAll": false,
            "label": "Pod",
            "multi": false,
            "name": "pod",
            "options": [],
            "query": "label_values(up{job=\"vernemq\"}, pod)",
            "refresh": 1,
            "regex": "",
            "sort": 1,
            "tagValuesQuery": "",
            "tags": [],
            "tagsQuery": "",
            "type": "query",
            "useTags": false
          }
        ]
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "5s",
          "10s",
          "30s",
          "1m",
          "5m",
          "15m",
          "30m",
          "1h",
          "2h",
          "1d"
        ],
        "time_options": [
          "5m",
          "15m",
          "1h",
          "6h",
          "12h",
          "24h",
          "2d",
          "7d",
          "30d"
        ]
      },
      "timezone": "browser",
      "title": "VerneMQ Dashboard",
      "uid": "vernemq",
      "version": 0
    }