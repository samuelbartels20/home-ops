---
# VerneMQ TLS Certificate for Secure MQTT Communication
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: vernemq-tls-certificate
  namespace: storage
  labels:
    app.kubernetes.io/name: vernemq
    app.kubernetes.io/component: mqtt-broker
    app.kubernetes.io/part-of: messaging-infrastructure
    environment: production
    tier: storage
spec:
  secretName: vernemq-tls-secret
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: mqtt.samcloud.online
  dnsNames:
    - mqtt.samcloud.online
    - vernemq.storage.svc.cluster.local
    - vernemq-0.vernemq.storage.svc.cluster.local
    - vernemq-1.vernemq.storage.svc.cluster.local
    - vernemq-2.vernemq.storage.svc.cluster.local
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days
  subject:
    organizations:
      - Home Ops
    organizationalUnits:
      - Storage Infrastructure
  privateKey:
    algorithm: RSA
    encoding: PKCS1
    size: 2048
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth