---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: influxdb
  namespace: storage
  labels:
    app.kubernetes.io/name: influxdb
    app.kubernetes.io/component: security

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: influxdb
  namespace: storage
  labels:
    app.kubernetes.io/name: influxdb
    app.kubernetes.io/component: security
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/log", "secrets", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["policy"]
    resources: ["podsecuritypolicies"]
    verbs: ["use"]
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "podmonitors"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: influxdb
  namespace: storage
  labels:
    app.kubernetes.io/name: influxdb
    app.kubernetes.io/component: security
subjects:
  - kind: ServiceAccount
    name: influxdb
    namespace: storage
roleRef:
  kind: Role
  name: influxdb
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: influxdb-metrics
  labels:
    app.kubernetes.io/name: influxdb
    app.kubernetes.io/component: security
rules:
  - apiGroups: [""]
    resources: ["nodes/metrics", "nodes/stats"]
    verbs: ["get"]
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: influxdb-metrics
  labels:
    app.kubernetes.io/name: influxdb
    app.kubernetes.io/component: security
subjects:
  - kind: ServiceAccount
    name: influxdb
    namespace: storage
roleRef:
  kind: ClusterRole
  name: influxdb-metrics
  apiGroup: rbac.authorization.k8s.io