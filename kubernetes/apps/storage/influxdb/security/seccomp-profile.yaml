---
apiVersion: security.k8s.io/v1
kind: SeccompProfile
metadata:
  name: influxdb-seccomp
  namespace: storage
  labels:
    app.kubernetes.io/name: influxdb
    app.kubernetes.io/component: security
spec:
  defaultAction: SCMP_ACT_ERRNO
  architectures:
    - SCMP_ARCH_X86_64
    - SCMP_ARCH_ARM64
  syscalls:
    - action: SCMP_ACT_ALLOW
      names:
        # Basic process operations
        - accept
        - accept4
        - access
        - arch_prctl
        - bind
        - brk
        - chdir
        - chmod
        - chown
        - clock_gettime
        - clone
        - close
        - connect
        - dup
        - dup2
        - epoll_create1
        - epoll_ctl
        - epoll_wait
        - exit
        - exit_group
        - faccessat
        - fchdir
        - fchmod
        - fchmodat
        - fchown
        - fchownat
        - fcntl
        - fdatasync
        - flock
        - fork
        - fstat
        - fstatfs
        - fsync
        - ftruncate
        - futex
        - getcwd
        - getdents
        - getdents64
        - getegid
        - geteuid
        - getgid
        - getpeername
        - getpgrp
        - getpid
        - getppid
        - getpriority
        - getrandom
        - getresgid
        - getresuid
        - getrlimit
        - getsockname
        - getsockopt
        - gettid
        - gettimeofday
        - getuid
        - ioctl
        - kill
        - lchown
        - link
        - linkat
        - listen
        - lseek
        - lstat
        - madvise
        - mkdir
        - mkdirat
        - mmap
        - mount
        - mprotect
        - munmap
        - nanosleep
        - newfstatat
        - open
        - openat
        - pause
        - pipe
        - pipe2
        - poll
        - prctl
        - pread64
        - prlimit64
        - pselect6
        - pwrite64
        - read
        - readlink
        - readlinkat
        - readv
        - recvfrom
        - recvmsg
        - rename
        - renameat
        - rmdir
        - rt_sigaction
        - rt_sigprocmask
        - rt_sigqueueinfo
        - rt_sigreturn
        - rt_sigsuspend
        - sched_getaffinity
        - sched_yield
        - seccomp
        - select
        - sendmsg
        - sendto
        - set_robust_list
        - set_tid_address
        - setgid
        - setgroups
        - setitimer
        - setpgid
        - setresgid
        - setresuid
        - setsid
        - setsockopt
        - setuid
        - shmat
        - shmctl
        - shmdt
        - shmget
        - shutdown
        - socket
        - socketpair
        - stat
        - statfs
        - symlink
        - symlinkat
        - sync
        - sysinfo
        - umask
        - uname
        - unlink
        - unlinkat
        - utime
        - utimensat
        - wait4
        - write
        - writev