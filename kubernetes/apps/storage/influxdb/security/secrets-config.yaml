---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: influxdb-secrets
  namespace: storage
  labels:
    app.kubernetes.io/name: influxdb
    app.kubernetes.io/component: security
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: influxdb-secrets
    template:
      metadata:
        labels:
          app.kubernetes.io/name: influxdb
          app.kubernetes.io/component: security
      engineVersion: v2
      data:
        INFLUXDB_ADMIN_USER: "{{ .admin_user }}"
        INFLUXDB_ADMIN_PASSWORD: "{{ .admin_password }}"
        INFLUXDB_TOKEN: "{{ .token }}"
        INFLUXDB_LICENSE: "{{ .license }}"
        OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
        LDAP_BIND_PASSWORD: "{{ .ldap_bind_password }}"
        TLS_KEY: "{{ .tls_key }}"
        TLS_CERT: "{{ .tls_cert }}"
        CA_CERT: "{{ .ca_cert }}"
        BACKUP_ENCRYPTION_KEY: "{{ .backup_encryption_key }}"
        KMS_KEY: "{{ .kms_key }}"
  data:
    - secretKey: admin_user
      remoteRef:
        key: influxdb/credentials
        property: admin_user
    - secretKey: admin_password
      remoteRef:
        key: influxdb/credentials
        property: admin_password
    - secretKey: token
      remoteRef:
        key: influxdb/credentials
        property: token
    - secretKey: license
      remoteRef:
        key: influxdb/license
        property: key
    - secretKey: oidc_client_secret
      remoteRef:
        key: influxdb/oidc
        property: client_secret
    - secretKey: ldap_bind_password
      remoteRef:
        key: influxdb/ldap
        property: bind_password
    - secretKey: tls_key
      remoteRef:
        key: influxdb/tls
        property: key
    - secretKey: tls_cert
      remoteRef:
        key: influxdb/tls
        property: cert
    - secretKey: ca_cert
      remoteRef:
        key: influxdb/tls
        property: ca
    - secretKey: backup_encryption_key
      remoteRef:
        key: influxdb/backup
        property: encryption_key
    - secretKey: kms_key
      remoteRef:
        key: influxdb/kms
        property: key

---
apiVersion: policy/v1
kind: PodSecurityPolicy
metadata:
  name: influxdb-secrets-policy
  namespace: storage
  labels:
    app.kubernetes.io/name: influxdb
    app.kubernetes.io/component: security
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - 'secret'
    - 'configMap'
  runAsUser:
    rule: 'MustRunAsNonRoot'
  seLinux:
    rule: 'RunAsAny'
  supplementalGroups:
    rule: 'MustRunAs'
    ranges:
      - min: 1
        max: 65535
  fsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 1
        max: 65535
  readOnlyRootFilesystem: true