---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: influxdb-pv
  namespace: storage
  labels:
    app.kubernetes.io/name: influxdb
    app.kubernetes.io/part-of: storage-infrastructure
spec:
  storageClassName: openebs-zfs-localpv
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  volumeMode: Filesystem
  local:
    path: /mnt/influxdb
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-storage-1
                - k8s-storage-2
                - k8s-storage-3
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: influxdb-pvc
  namespace: storage
  labels:
    app.kubernetes.io/name: influxdb
    app.kubernetes.io/part-of: storage-infrastructure
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: openebs-zfs-localpv
  resources:
    requests:
      storage: 100Gi