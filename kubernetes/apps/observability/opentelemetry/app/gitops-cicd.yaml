# Enterprise Production: GitOps & CI/CD for OpenTelemetry
---
# GitOps Repository Sync Configuration
apiVersion: source.toolkit.fluxcd.io/v1beta2
kind: GitRepository
metadata:
  name: opentelemetry-config
  namespace: observability
  labels:
    app.kubernetes.io/name: opentelemetry-gitops
    app.kubernetes.io/component: source
spec:
  interval: 30s
  url: https://github.com/samcloud-online/opentelemetry-config
  ref:
    branch: main
  secretRef:
    name: git-credentials
  ignore: |
    # Ignore non-production files
    *.md
    .git/
    .github/
    docs/
    examples/
  verification:
    mode: signature
    secretRef:
      name: git-signing-key
---
# Kustomization for GitOps Deployment
apiVersion: kustomize.toolkit.fluxcd.io/v1beta2
kind: Kustomization
metadata:
  name: opentelemetry-production
  namespace: observability
  labels:
    app.kubernetes.io/name: opentelemetry-gitops
    app.kubernetes.io/component: deployment
spec:
  interval: 5m
  timeout: 10m
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: opentelemetry-config
  path: "./production"
  prune: true
  wait: true
  validation: client

  # Health Checks
  healthChecks:
  - apiVersion: apps/v1
    kind: Deployment
    name: otel-enterprise-gateway
    namespace: observability
  - apiVersion: apps/v1
    kind: DaemonSet
    name: otel-enterprise-collector
    namespace: observability

  # Post-deployment Hooks
  postBuild:
    substitute:
      cluster_name: "production-cluster"
      environment: "production"
      version: "0.128.0"
    substituteFrom:
    - kind: ConfigMap
      name: cluster-config
    - kind: Secret
      name: deployment-secrets

  # Dependency Management
  dependsOn:
  - name: cert-manager
    namespace: cert-manager
  - name: prometheus-operator
    namespace: observability
---
# Automated Testing Pipeline
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-test-suite
  namespace: observability
  labels:
    app.kubernetes.io/name: opentelemetry-testing
    app.kubernetes.io/component: ci-cd
data:
  run-tests.sh: |
    #!/bin/bash
    set -e

    echo "Starting OpenTelemetry Enterprise Test Suite..."

    # Test Categories
    FUNCTIONAL_TESTS=true
    PERFORMANCE_TESTS=true
    SECURITY_TESTS=true
    COMPLIANCE_TESTS=true
    INTEGRATION_TESTS=true

    # Test Results Directory
    mkdir -p /test-results

    # 1. Functional Tests
    if [ "$FUNCTIONAL_TESTS" = true ]; then
      echo "Running functional tests..."

      # Test OTLP endpoints
      curl -f http://otel-enterprise-gateway:4317/health || exit 1
      curl -f http://otel-enterprise-gateway:4318/health || exit 1

      # Test metrics endpoint
      curl -f http://otel-enterprise-gateway:8888/metrics | grep otelcol || exit 1

      # Test trace ingestion
      python3 << 'EOF'
    import requests
    import json
    import time

    def test_trace_ingestion():
        endpoint = "http://otel-enterprise-gateway:4318/v1/traces"
        test_trace = {
            "resourceSpans": [{
                "resource": {
                    "attributes": [{
                        "key": "service.name",
                        "value": {"stringValue": "test-service"}
                    }]
                },
                "scopeSpans": [{
                    "spans": [{
                        "traceId": "12345678901234567890123456789012",
                        "spanId": "1234567890123456",
                        "name": "test-span",
                        "startTimeUnixNano": str(int(time.time() * 1e9)),
                        "endTimeUnixNano": str(int(time.time() * 1e9))
                    }]
                }]
            }]
        }

        response = requests.post(endpoint, json=test_trace)
        assert response.status_code == 200, f"Trace ingestion failed: {response.status_code}"
                            print("[PASS] Trace ingestion test passed")

    test_trace_ingestion()
    EOF

                          echo "[PASS] Functional tests passed"
    fi

    # 2. Performance Tests
    if [ "$PERFORMANCE_TESTS" = true ]; then
      echo "Running performance tests..."

      # Load test with wrk
      apk add --no-cache wrk

      # Test throughput
      wrk -t10 -c100 -d30s --latency \
        -s /test-scripts/post-trace.lua \
        http://otel-enterprise-gateway:4318/v1/traces \
        > /test-results/performance.txt

      # Verify minimum throughput (adjust threshold as needed)
      REQUESTS_PER_SEC=$(grep "Requests/sec" /test-results/performance.txt | awk '{print $2}')
      if (( $(echo "$REQUESTS_PER_SEC < 10000" | bc -l) )); then
                            echo "[FAIL] Performance test failed: $REQUESTS_PER_SEC req/sec < 10000"
        exit 1
      fi

                          echo "[PASS] Performance tests passed: $REQUESTS_PER_SEC req/sec"
    fi

    # 3. Security Tests
    if [ "$SECURITY_TESTS" = true ]; then
      echo "Running security tests..."

      # Test TLS configuration
      openssl s_client -connect otel-enterprise-gateway:4317 -verify_return_error || {
                            echo "[FAIL] TLS verification failed"
        exit 1
      }

      # Test authentication
      curl -f -H "Authorization: Bearer invalid-token" \
        http://otel-enterprise-gateway:4318/v1/traces && {
        echo "[FAIL] Authentication bypass detected"
        exit 1
      }

      # Test for sensitive data exposure
      curl -s http://otel-enterprise-gateway:8888/metrics | grep -i "password\|secret\|key" && {
        echo "[FAIL] Sensitive data exposure detected"
        exit 1
      }

      echo "[PASS] Security tests passed"
    fi

    # 4. Compliance Tests
    if [ "$COMPLIANCE_TESTS" = true ]; then
      echo "Running compliance tests..."

      # Test audit logging
      kubectl logs -n observability deployment/otel-audit-collector --tail=100 | \
        grep "audit" > /test-results/audit-logs.txt

      if [ ! -s /test-results/audit-logs.txt ]; then
        echo "[FAIL] Audit logging not working"
        exit 1
      fi

      # Test data retention compliance
      python3 << 'EOF'
    import requests
    import json

    def test_data_retention():
        # Check if data older than retention period is purged
        metrics_url = "http://prometheus:9090/api/v1/query"
        query = "otel_compliance_data_retention_violations_total"

        response = requests.get(metrics_url, params={"query": query})
        if response.status_code == 200:
            data = response.json()
            violations = float(data["data"]["result"][0]["value"][1]) if data["data"]["result"] else 0
            assert violations == 0, f"Data retention violations: {violations}"
            print("[PASS] Data retention compliance verified")
        else:
            print("[WARNING] Could not verify data retention (metrics unavailable)")

    test_data_retention()
    EOF

      echo "[PASS] Compliance tests passed"
    fi

    # 5. Integration Tests
    if [ "$INTEGRATION_TESTS" = true ]; then
      echo "Running integration tests..."

      # Test Prometheus integration
      curl -f http://prometheus:9090/api/v1/query?query=up{job=\"opentelemetry-collector\"} || {
        echo "[FAIL] Prometheus integration failed"
        exit 1
      }

      # Test Grafana dashboard
      curl -f http://grafana:3000/api/dashboards/uid/opentelemetry-enterprise || {
        echo "[WARNING] Grafana dashboard not accessible"
      }

      # Test alert manager
      curl -f http://alertmanager:9093/api/v1/alerts | jq . || {
        echo "[WARNING] AlertManager integration issue"
      }

      echo "[PASS] Integration tests passed"
    fi

    echo "[SUCCESS] All tests passed successfully!"

    # Generate test report
    cat > /test-results/summary.json << EOF
    {
      "timestamp": "$(date -Iseconds)",
      "status": "PASSED",
      "test_categories": {
        "functional": "PASSED",
        "performance": "PASSED",
        "security": "PASSED",
        "compliance": "PASSED",
        "integration": "PASSED"
      },
      "performance_metrics": {
        "requests_per_second": "$REQUESTS_PER_SEC",
        "p99_latency_ms": "$(grep 99.00% /test-results/performance.txt | awk '{print $2}' | sed 's/ms//')"
      }
    }
    EOF

  post-trace.lua: |
    -- wrk script for posting traces
    wrk.method = "POST"
    wrk.body = '{"resourceSpans":[{"resource":{"attributes":[{"key":"service.name","value":{"stringValue":"load-test"}}]},"scopeSpans":[{"spans":[{"traceId":"12345678901234567890123456789012","spanId":"1234567890123456","name":"load-test-span","startTimeUnixNano":"1640995200000000000","endTimeUnixNano":"1640995200100000000"}]}]}]}'
    wrk.headers["Content-Type"] = "application/json"
---
# CI/CD Pipeline Job
apiVersion: batch/v1
kind: Job
metadata:
  name: otel-cicd-pipeline
  namespace: observability
  labels:
    app.kubernetes.io/name: opentelemetry-cicd
    app.kubernetes.io/component: pipeline
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opentelemetry-cicd
    spec:
      restartPolicy: Never
      serviceAccountName: cicd-pipeline
      containers:
      - name: pipeline
        image: alpine/git:latest
        env:
        - name: TOKEN
          valueFrom:
            secretKeyRef:
              name: git-credentials
              key: token
        - name: SLACK_WEBHOOK
          valueFrom:
            secretKeyRef:
              name: notification-config
              key: slack-webhook
        command:
        - /bin/sh
        - -c
        - |
          set -e

          echo "Starting OpenTelemetry CI/CD Pipeline..."

          # Install dependencies
          apk add --no-cache curl jq python3 py3-pip bc wrk openssl
          pip3 install --no-cache-dir requests

          # Clone test scripts
          git clone https://github.com/company/otel-tests.git /test-scripts

          # Run comprehensive test suite
          source /test-suite/run-tests.sh

          # Deploy if tests pass
          echo "Tests passed - proceeding with deployment..."

          # Apply GitOps configuration
          kubectl apply -f /gitops-config/production/

          # Wait for rollout
          kubectl rollout status deployment/otel-enterprise-gateway -n observability --timeout=600s
          kubectl rollout status daemonset/otel-enterprise-collector -n observability --timeout=600s

          # Post-deployment validation
          sleep 30
          curl -f http://otel-enterprise-gateway:13133/health || {
            echo "Post-deployment health check failed"
            exit 1
          }

          # Send success notification
          curl -X POST "$SLACK_WEBHOOK" \
            -H 'Content-type: application/json' \
            --data '{
              "text": "[PASS] OpenTelemetry production deployment successful",
              "attachments": [{
                "color": "good",
                "fields": [{
                  "title": "Environment",
                  "value": "Production",
                  "short": true
                }, {
                  "title": "Version",
                  "value": "0.128.0",
                  "short": true
                }]
              }]
            }'

          echo "[SUCCESS] CI/CD Pipeline completed successfully!"
        volumeMounts:
        - name: test-suite
          mountPath: /test-suite
        - name: gitops-config
          mountPath: /gitops-config
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: "2"
            memory: 4Gi
      volumes:
      - name: test-suite
        configMap:
          name: otel-test-suite
          defaultMode: 0755
      - name: gitops-config
        configMap:
          name: gitops-production-config
---
# RBAC for CI/CD Pipeline
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cicd-pipeline
  namespace: observability
  labels:
    app.kubernetes.io/name: opentelemetry-cicd
    app.kubernetes.io/component: rbac
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cicd-pipeline
  labels:
    app.kubernetes.io/name: opentelemetry-cicd
    app.kubernetes.io/component: rbac
rules:
# Deployment management
- apiGroups: ["apps"]
  resources: ["deployments", "daemonsets", "replicasets"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
- apiGroups: [""]
  resources: ["services", "configmaps", "secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
# OpenTelemetry CRDs
- apiGroups: ["opentelemetry.io"]
  resources: ["opentelemetrycollectors", "instrumentations"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
# Monitoring resources
- apiGroups: ["monitoring.coreos.com"]
  resources: ["servicemonitors", "prometheusrules"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
# Status checking
- apiGroups: ["apps"]
  resources: ["deployments/status", "daemonsets/status"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cicd-pipeline
  labels:
    app.kubernetes.io/name: opentelemetry-cicd
    app.kubernetes.io/component: rbac
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cicd-pipeline
subjects:
- kind: ServiceAccount
  name: cicd-pipeline
  namespace: observability
---
# GitOps Production Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitops-production-config
  namespace: observability
  labels:
    app.kubernetes.io/name: opentelemetry-gitops
    app.kubernetes.io/component: config
data:
  production-config.yaml: |
    # Production OpenTelemetry Configuration
    apiVersion: opentelemetry.io/v1alpha1
    kind: OpenTelemetryCollector
    metadata:
      name: otel-production-gateway
      namespace: observability
    spec:
      mode: deployment
      replicas: 12
      image: otel/opentelemetry-collector-contrib:0.128.0

      # Production resource allocation
      resources:
        requests:
          cpu: 4
          memory: 16Gi
        limits:
          cpu: 16
          memory: 64Gi

      # Auto-scaling for production load
      autoscaler:
        minReplicas: 6
        maxReplicas: 50
        targetCPUUtilization: 70

      config:
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317
                max_recv_msg_size: 128MiB
              http:
                endpoint: 0.0.0.0:4318
                max_request_body_size: 128MiB

        processors:
          batch:
            send_batch_size: 32768
            timeout: 5s
          memory_limiter:
            limit_percentage: 75

        exporters:
          otlp/production:
            endpoint: "alloy-distributor:4317"
            compression: gzip

        service:
          pipelines:
            traces:
              receivers: [otlp]
              processors: [memory_limiter, batch]
              exporters: [otlp/production]
---
# Deployment Webhook for Notifications
apiVersion: v1
kind: ConfigMap
metadata:
  name: deployment-notifications
  namespace: observability
  labels:
    app.kubernetes.io/name: opentelemetry-notifications
    app.kubernetes.io/component: webhooks
data:
  webhook-handler.py: |
    #!/usr/bin/env python3
    import json
    import requests
    import os
    from datetime import datetime

    def send_slack_notification(webhook_url, message, color="good"):
        payload = {
            "text": message,
            "attachments": [{
                "color": color,
                "fields": [{
                    "title": "Timestamp",
                    "value": datetime.now().isoformat(),
                    "short": True
                }, {
                    "title": "Environment",
                    "value": "Production",
                    "short": True
                }]
            }]
        }

        response = requests.post(webhook_url, json=payload)
        return response.status_code == 200

    def send_pagerduty_alert(integration_key, summary, severity="info"):
        payload = {
            "routing_key": integration_key,
            "event_action": "trigger",
            "payload": {
                "summary": summary,
                "severity": severity,
                "source": "opentelemetry-k8s",
                "component": "deployment"
            }
        }

        response = requests.post(
            "https://events.pagerduty.com/v2/enqueue",
            json=payload
        )
        return response.status_code == 202

    def handle_deployment_event(event_type, details):
        slack_webhook = os.environ.get('SLACK_WEBHOOK')
        pagerduty_key = os.environ.get('PAGERDUTY_INTEGRATION_KEY')

        if event_type == "deployment_success":
            message = f"[PASS] OpenTelemetry deployment successful: {details}"
            color = "good"
            severity = "info"
        elif event_type == "deployment_failure":
            message = f"[FAIL] OpenTelemetry deployment failed: {details}"
            color = "danger"
            severity = "error"
        elif event_type == "test_failure":
            message = f"[WARNING] OpenTelemetry tests failed: {details}"
            color = "warning"
            severity = "warning"

        # Send notifications
        if slack_webhook:
            send_slack_notification(slack_webhook, message, color)

        if pagerduty_key and event_type == "deployment_failure":
            send_pagerduty_alert(pagerduty_key, message, severity)

    if __name__ == "__main__":
        # Example usage
        handle_deployment_event("deployment_success", "Version 0.128.0 deployed")
---
# Secrets Template for GitOps
apiVersion: v1
kind: Secret
metadata:
  name: git-credentials
  namespace: observability
  labels:
    app.kubernetes.io/name: opentelemetry-gitops
    app.kubernetes.io/component: auth
type: Opaque
stringData:
  username: "git-user"
  token: "CHANGE_ME_TOKEN"
  ssh-privatekey: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    CHANGE_ME_SSH_PRIVATE_KEY
    -----END OPENSSH PRIVATE KEY-----
---
apiVersion: v1
kind: Secret
metadata:
  name: notification-config
  namespace: observability
  labels:
    app.kubernetes.io/name: opentelemetry-notifications
    app.kubernetes.io/component: config
type: Opaque
stringData:
  slack-webhook: "https://hooks.slack.com/services/CHANGE_ME"
  pagerduty-integration-key: "CHANGE_ME_PAGERDUTY_KEY"
  email-smtp-host: "smtp.company.com"
  email-smtp-user: "notifications@company.com"
  email-smtp-password: "CHANGE_ME_SMTP_PASSWORD"

