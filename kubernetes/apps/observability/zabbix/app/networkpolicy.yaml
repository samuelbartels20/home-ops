---
# NetworkPolicy for Zabbix Server
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zabbix-server
  namespace: observability
  labels:
    app.kubernetes.io/name: zabbix
    app.kubernetes.io/component: server-network-policy
    app.kubernetes.io/part-of: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zabbix-server
      app.kubernetes.io/component: server

  policyTypes:
  - Ingress
  - Egress

  ingress:
  # Allow web frontend to connect to server
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: zabbix-web
    ports:
    - protocol: TCP
      port: 10051

  # Allow agents to connect to server
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: zabbix-agent
    ports:
    - protocol: TCP
      port: 10051

  # Allow proxies to connect to server
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: zabbix-proxy
    ports:
    - protocol: TCP
      port: 10051

  # Allow monitoring (Prometheus)
  - from:
    - namespaceSelector:
        matchLabels:
          name: observability
    ports:
    - protocol: TCP
      port: 9090  # metrics port

  egress:
  # Allow connection to database
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: zabbix-postgresql
    ports:
    - protocol: TCP
      port: 5432

  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

  # Allow external monitoring targets
  - to: []
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 443
    - protocol: TCP
      port: 22    # SSH monitoring
    - protocol: TCP
      port: 161   # SNMP
    - protocol: UDP
      port: 161   # SNMP
    - protocol: TCP
      port: 10050 # Zabbix agents

---
# NetworkPolicy for Zabbix Web
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zabbix-web
  namespace: observability
  labels:
    app.kubernetes.io/name: zabbix
    app.kubernetes.io/component: web-network-policy
    app.kubernetes.io/part-of: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zabbix-web
      app.kubernetes.io/component: web

  policyTypes:
  - Ingress
  - Egress

  ingress:
  # Allow ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: network
    ports:
    - protocol: TCP
      port: 80
    - protocol: TCP
      port: 8080

  # Allow monitoring (Prometheus)
  - from:
    - namespaceSelector:
        matchLabels:
          name: observability
    ports:
    - protocol: TCP
      port: 9090  # metrics port

  egress:
  # Allow connection to Zabbix server
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: zabbix-server
    ports:
    - protocol: TCP
      port: 10051

  # Allow connection to database
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: zabbix-postgresql
    ports:
    - protocol: TCP
      port: 5432

  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

---
# NetworkPolicy for Zabbix Agent
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zabbix-agent
  namespace: observability
  labels:
    app.kubernetes.io/name: zabbix
    app.kubernetes.io/component: agent-network-policy
    app.kubernetes.io/part-of: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zabbix-agent
      app.kubernetes.io/component: agent

  policyTypes:
  - Ingress
  - Egress

  ingress:
  # Allow server to connect to agent
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: zabbix-server
    ports:
    - protocol: TCP
      port: 10050

  # Allow monitoring (Prometheus)
  - from:
    - namespaceSelector:
        matchLabels:
          name: observability
    ports:
    - protocol: TCP
      port: 9090  # metrics port

  egress:
  # Allow connection to server (active checks)
  - to:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: zabbix-server
    ports:
    - protocol: TCP
      port: 10051

  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

  # Allow access to Kubernetes API for monitoring
  - to: []
    ports:
    - protocol: TCP
      port: 6443
    - protocol: TCP
      port: 443

---
# NetworkPolicy for PostgreSQL Database
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zabbix-postgresql
  namespace: observability
  labels:
    app.kubernetes.io/name: zabbix
    app.kubernetes.io/component: database-network-policy
    app.kubernetes.io/part-of: observability
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zabbix-postgresql
      app.kubernetes.io/component: database

  policyTypes:
  - Ingress
  - Egress

  ingress:
  # Allow Zabbix server to connect
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: zabbix-server
    ports:
    - protocol: TCP
      port: 5432

  # Allow Zabbix web to connect
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: zabbix-web
    ports:
    - protocol: TCP
      port: 5432

  # Allow monitoring (Prometheus postgres_exporter)
  - from:
    - namespaceSelector:
        matchLabels:
          name: observability
    ports:
    - protocol: TCP
      port: 9187  # postgres_exporter metrics

  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53