---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zabbix-secret
  namespace: observability
spec:
  secretStoreRef:
    kind: SecretStore
    name: onepassword-connect
  target:
    name: zabbix-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        # Database configuration
        ZBX_DB_HOST: "{{ .ZBX_DB_HOST }}"
        ZBX_DB_NAME: "{{ .ZBX_DB_NAME }}"
        ZBX_DB_USER: "{{ .ZBX_DB_USER }}"
        ZBX_DB_PASSWORD: "{{ .ZBX_DB_PASSWORD }}"

        # Admin credentials
        ZBX_ADMIN_USER: "{{ .ZBX_ADMIN_USER }}"
        ZBX_ADMIN_PASSWORD: "{{ .ZBX_ADMIN_PASSWORD }}"

        # SMTP configuration
        ZBX_SMTP_SERVER: "{{ .ZBX_SMTP_SERVER }}"
        ZBX_SMTP_USER: "{{ .ZBX_SMTP_USER }}"
        ZBX_SMTP_PASSWORD: "{{ .ZBX_SMTP_PASSWORD }}"
        ZBX_SMTP_FROM: "{{ .ZBX_SMTP_FROM }}"

        # External service integrations
        ZBX_SLACK_WEBHOOK: "{{ .ZBX_SLACK_WEBHOOK }}"
        ZBX_TEAMS_WEBHOOK: "{{ .ZBX_TEAMS_WEBHOOK }}"
        ZBX_TELEGRAM_TOKEN: "{{ .ZBX_TELEGRAM_TOKEN }}"
  dataFrom:
    - extract:
        key: zabbix
---
# Database unified secret (used by Helm chart)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: zabbix-db-secret
  namespace: observability
spec:
  secretStoreRef:
    kind: SecretStore
    name: onepassword-connect
  target:
    name: zabbix-db-secret
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        host: "{{ .ZBX_DB_HOST }}"
        port: "5432"
        dbname: "{{ .ZBX_DB_NAME }}"
        username: "{{ .ZBX_DB_USER }}"
        password: "{{ .ZBX_DB_PASSWORD }}"
        uri: "postgresql://{{ .ZBX_DB_USER }}:{{ .ZBX_DB_PASSWORD }}@{{ .ZBX_DB_HOST }}:5432/{{ .ZBX_DB_NAME }}"
  dataFrom:
    - extract:
        key: zabbix