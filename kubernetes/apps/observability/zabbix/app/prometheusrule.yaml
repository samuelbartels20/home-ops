---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: zabbix-alerts
  namespace: observability
  labels:
    app.kubernetes.io/name: zabbix
    app.kubernetes.io/component: observability
    app.kubernetes.io/part-of: observability
    release: kube-prometheus-stack
spec:
  groups:
    - name: zabbix.server.rules
      rules:
        - alert: ZabbixServerDown
          expr: |
            up{job="zabbix-server"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Zabbix Server is down"
            description: "Zabbix Server {{ $labels.instance }} has been down for more than 2 minutes"

        - alert: ZabbixServerHighMemoryUsage
          expr: |
            container_memory_usage_bytes{namespace="observability", pod=~"zabbix-.*server.*"} / container_spec_memory_limit_bytes > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage in Zabbix Server"
            description: "Zabbix Server {{ $labels.pod }} memory usage is above 90% for 5 minutes"

        - alert: ZabbixServerHighCPUUsage
          expr: |
            rate(container_cpu_usage_seconds_total{namespace="observability", pod=~"zabbix-.*server.*"}[5m]) * 100 > 90
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High CPU usage in Zabbix Server"
            description: "Zabbix Server {{ $labels.pod }} CPU usage is above 90% for 10 minutes"

        - alert: ZabbixServerDatabaseConnectionFailed
          expr: |
            zabbix_server_db_connection_failures_total > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Zabbix Server database connection failed"
            description: "Zabbix Server {{ $labels.instance }} failed to connect to database"

        - alert: ZabbixServerQueueHigh
          expr: |
            zabbix_server_queue_size > 1000
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Zabbix Server queue is high"
            description: "Zabbix Server {{ $labels.instance }} queue size is {{ $value }}, indicating potential performance issues"

        - alert: ZabbixServerTooManyRestarts
          expr: |
            kube_pod_container_status_restarts_total{namespace="observability", pod=~"zabbix-.*server.*"} > 5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Too many restarts for Zabbix Server"
            description: "Zabbix Server pod {{ $labels.pod }} has restarted more than 5 times"

    - name: zabbix.web.rules
      rules:
        - alert: ZabbixWebDown
          expr: |
            up{job="zabbix-web"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Zabbix Web interface is down"
            description: "Zabbix Web interface {{ $labels.instance }} has been down for more than 2 minutes"

        - alert: ZabbixWebHighResponseTime
          expr: |
            probe_duration_seconds{job="zabbix-web"} > 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High response time for Zabbix Web"
            description: "Zabbix Web interface {{ $labels.instance }} response time is {{ $value }}s"

        - alert: ZabbixWebSSLCertificateExpiry
          expr: |
            probe_ssl_earliest_cert_expiry{job="zabbix-web"} - time() < 7 * 24 * 3600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Zabbix Web SSL certificate expiring soon"
            description: "SSL certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}"

        - alert: ZabbixWebPodNotReady
          expr: |
            kube_pod_container_status_ready{namespace="observability", pod=~"zabbix-.*web.*"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Zabbix Web pod not ready"
            description: "Zabbix Web pod {{ $labels.pod }} has not been ready for 5 minutes"

    - name: zabbix.agent.rules
      rules:
        - alert: ZabbixAgentDown
          expr: |
            up{job="zabbix-agent"} == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Zabbix Agent is down"
            description: "Zabbix Agent {{ $labels.instance }} has been down for more than 5 minutes"

        - alert: ZabbixAgentHighMemoryUsage
          expr: |
            container_memory_usage_bytes{namespace="observability", pod=~"zabbix-.*agent.*"} / container_spec_memory_limit_bytes > 0.8
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High memory usage in Zabbix Agent"
            description: "Zabbix Agent {{ $labels.pod }} memory usage is above 80% for 10 minutes"

        - alert: ZabbixAgentConnectionFailed
          expr: |
            zabbix_agent_connection_failures_total > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "Zabbix Agent connection failed"
            description: "Zabbix Agent {{ $labels.instance }} failed to connect to server"

    - name: zabbix.database.rules
      rules:
        - alert: ZabbixDatabaseDown
          expr: |
            up{job="zabbix-postgresql"} == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Zabbix Database is down"
            description: "Zabbix PostgreSQL database {{ $labels.instance }} has been down for more than 2 minutes"

        - alert: ZabbixDatabaseHighConnections
          expr: |
            pg_stat_database_numbackends{datname="zabbix"} / pg_settings_max_connections * 100 > 80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "High database connections for Zabbix"
            description: "Zabbix database connection usage is {{ $value }}%"

        - alert: ZabbixDatabaseSlowQueries
          expr: |
            rate(pg_stat_database_tup_returned{datname="zabbix"}[5m]) / rate(pg_stat_database_tup_fetched{datname="zabbix"}[5m]) < 0.1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Slow queries detected in Zabbix database"
            description: "Database efficiency ratio is {{ $value }}, indicating slow queries"

        - alert: ZabbixDatabaseLockWaits
          expr: |
            pg_locks_count{datname="zabbix", mode="AccessExclusiveLock"} > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Database lock waits in Zabbix"
            description: "{{ $value }} lock waits detected in Zabbix database"

    - name: zabbix.performance.rules
      rules:
        - alert: ZabbixHistoryTableSize
          expr: |
            zabbix_table_size_bytes{table="history"} > 50 * 1024 * 1024 * 1024  # 50GB
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Large Zabbix history table"
            description: "Zabbix history table size is {{ $value | humanizeBytes }}, consider data maintenance"

        - alert: ZabbixTrendsTableSize
          expr: |
            zabbix_table_size_bytes{table="trends"} > 10 * 1024 * 1024 * 1024  # 10GB
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Large Zabbix trends table"
            description: "Zabbix trends table size is {{ $value | humanizeBytes }}, consider data maintenance"

        - alert: ZabbixMonitoringItemsHigh
          expr: |
            zabbix_items_total > 50000
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High number of monitoring items"
            description: "Zabbix is monitoring {{ $value }} items, which may impact performance"

        - alert: ZabbixUnreachableHosts
          expr: |
            zabbix_hosts_unreachable_count > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Multiple unreachable hosts in Zabbix"
            description: "{{ $value }} hosts are currently unreachable"

    - name: zabbix.security.rules
      rules:
        - alert: ZabbixFailedLoginAttempts
          expr: |
            increase(zabbix_failed_login_attempts_total[5m]) > 10
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Multiple failed login attempts to Zabbix"
            description: "{{ $value }} failed login attempts in the last 5 minutes"

        - alert: ZabbixConfigurationChanges
          expr: |
            increase(zabbix_config_changes_total[1h]) > 20
          for: 1m
          labels:
            severity: info
          annotations:
            summary: "Frequent configuration changes in Zabbix"
            description: "{{ $value }} configuration changes in the last hour"

        - alert: ZabbixUserSessionsHigh
          expr: |
            zabbix_active_sessions_count > 100
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High number of active Zabbix sessions"
            description: "{{ $value }} active user sessions, which may indicate unusual activity"

    - name: zabbix.maintenance.rules
      rules:
        - alert: ZabbixBackupFailed
          expr: |
            time() - zabbix_last_backup_timestamp > 24 * 3600  # 24 hours
          for: 1h
          labels:
            severity: critical
          annotations:
            summary: "Zabbix backup is overdue"
            description: "Last successful Zabbix backup was {{ $value | humanizeDuration }} ago"

        - alert: ZabbixHousekeepingDisabled
          expr: |
            zabbix_housekeeping_enabled == 0
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Zabbix housekeeping is disabled"
            description: "Automatic housekeeping is disabled, which may lead to database growth"

        - alert: ZabbixMaintenanceModeActive
          expr: |
            zabbix_maintenance_mode_active == 1
          for: 2h
          labels:
            severity: info
          annotations:
            summary: "Zabbix is in maintenance mode"
            description: "Zabbix has been in maintenance mode for {{ $value | humanizeDuration }}"