---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability

resources:
  - helmrelease.yaml
  - externalsecret.yaml
  # Commented out until Prometheus Operator is ready
  # - prometheusrule.yaml
  # - servicemonitor.yaml
  - networkpolicy.yaml

labels:
  - pairs:
      app.kubernetes.io/name: zabbix
      app.kubernetes.io/instance: zabbix
      app.kubernetes.io/component: monitoring
      app.kubernetes.io/part-of: observability
      app.kubernetes.io/managed-by: flux
    includeSelectors: true

commonLabels:
  app.kubernetes.io/name: zabbix
  app.kubernetes.io/part-of: observability-infrastructure
  production-grade: "true"

commonAnnotations:
  config.kubernetes.io/production: "true"
  monitoring.samcloud.online/tier: "production"
  documentation.link: "https://www.zabbix.com/documentation/current/en/"