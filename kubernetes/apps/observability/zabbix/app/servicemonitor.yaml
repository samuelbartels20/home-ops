---
# ServiceMonitor for PostgreSQL database
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: zabbix-postgresql
  namespace: observability
  labels:
    app.kubernetes.io/name: zabbix
    app.kubernetes.io/component: database-observability
    app.kubernetes.io/part-of: observability
    monitoring: prometheus
spec:
  jobLabel: app.kubernetes.io/name

  selector:
    matchLabels:
      app.kubernetes.io/name: zabbix-postgresql
      app.kubernetes.io/component: database

  namespaceSelector:
    matchNames:
    - observability

  endpoints:
  - port: metrics
    scheme: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 15s

    metricRelabelings:
    # Keep PostgreSQL specific metrics
    - sourceLabels: [__name__]
      regex: '^(pg_.*|postgres_.*|up)'
      action: keep

    # Add service-level labels
    - targetLabel: service
      replacement: zabbix-postgresql
    - targetLabel: component
      replacement: database

    # Filter to only Zabbix database
    - sourceLabels: [datname]
      regex: 'zabbix'
      action: keep