---
# ServiceMonitor for Zabbix Server
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: zabbix-server
  namespace: observability
  labels:
    app.kubernetes.io/name: zabbix
    app.kubernetes.io/component: server-observability
    app.kubernetes.io/part-of: observability
    monitoring: prometheus
spec:
  jobLabel: app.kubernetes.io/name

  selector:
    matchLabels:
      app.kubernetes.io/name: zabbix-server
      app.kubernetes.io/component: server

  namespaceSelector:
    matchNames:
    - observability

  endpoints:
  - port: metrics
    scheme: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 15s

    metricRelabelings:
    # Keep Zabbix server specific metrics
    - sourceLabels: [__name__]
      regex: '^(zabbix_server_.*|up|process_.*)'
      action: keep

    # Add service-level labels
    - targetLabel: service
      replacement: zabbix-server
    - targetLabel: component
      replacement: monitoring-backend

