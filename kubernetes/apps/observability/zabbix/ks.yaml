---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: zabbix
  namespace: observability
  labels:
    app.kubernetes.io/name: zabbix
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: observability
spec:
  interval: 30m
  retryInterval: 1m
  timeout: 15m
  path: "./kubernetes/apps/observability/zabbix/app"
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system

  # Health checks for Zabbix components
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: zabbix
      namespace: observability

  # Dependencies - wait for external-secrets and basic infrastructure
  dependsOn:
    - name: external-secrets
      namespace: security
    - name: cert-manager
      namespace: cert-manager

  # Substitute cluster variables
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
        optional: false
      - name: cluster-settings
        kind: ConfigMap
        optional: false