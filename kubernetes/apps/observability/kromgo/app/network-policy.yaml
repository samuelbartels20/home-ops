---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kromgo
  namespace: observability
  labels:
    app.kubernetes.io/name: kromgo
    app.kubernetes.io/component: network-security
    app.kubernetes.io/part-of: observability-infrastructure
    production-grade: "true"
  annotations:
    policy.kubernetes.io/description: "Zero-trust network policy for kromgo"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kromgo

  policyTypes:
  - Ingress
  - Egress

  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: gateway
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8081
    - protocol: TCP
      port: 8082

  - from:
    - namespaceSelector:
        matchLabels:
          name: observability
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 8082
    - protocol: TCP
      port: 8081

  - from:
    - namespaceSelector:
        matchLabels:
          name: observability
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: blackbox-exporter
    ports:
    - protocol: TCP
      port: 8080

  - from:
    - namespaceSelector:
        matchLabels:
          name: observability
    - podSelector:
        matchLabels:
          monitoring: prometheus
    ports:
    - protocol: TCP
      port: 8081
    - protocol: TCP
      port: 8082

  egress:
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

  - to:
    - namespaceSelector:
        matchLabels:
          name: observability
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 9090

  - to:
    - namespaceSelector:
        matchLabels:
          name: observability
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 9090

---

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kromgo-inter-pod
  namespace: observability
  labels:
    app.kubernetes.io/name: kromgo
    app.kubernetes.io/component: network-security-inter-pod
    production-grade: "true"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kromgo

  policyTypes:
  - Ingress

  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: kromgo
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8081
    - protocol: TCP
      port: 8082