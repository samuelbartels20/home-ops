---
# Production NetworkPolicy for Kromgo Metrics Badge Service
# Zero-trust network security for kromgo with granular access controls
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kromgo
  namespace: observability
  labels:
    app.kubernetes.io/name: kromgo
    app.kubernetes.io/component: network-security
    app.kubernetes.io/part-of: observability-infrastructure
    production-grade: "true"
  annotations:
    policy.kubernetes.io/description: "Zero-trust network policy for kromgo"
spec:
  # Apply to kromgo pods
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kromgo

  # Policy types
  policyTypes:
  - Ingress
  - Egress

  # Ingress rules - what can connect TO kromgo
  ingress:

  # Allow ingress controller (Gateway API) access
  - from:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: gateway
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8081
    - protocol: TCP
      port: 8082

  # Allow Prometheus scraping
  - from:
    - namespaceSelector:
        matchLabels:
          name: observability
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 8082  # metrics port
    - protocol: TCP
      port: 8081  # health port

  # Allow blackbox exporter for external monitoring
  - from:
    - namespaceSelector:
        matchLabels:
          name: observability
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: blackbox-exporter
    ports:
    - protocol: TCP
      port: 8080

  # Allow same-namespace monitoring tools
  - from:
    - namespaceSelector:
        matchLabels:
          name: observability
    - podSelector:
        matchLabels:
          monitoring: prometheus
    ports:
    - protocol: TCP
      port: 8081
    - protocol: TCP
      port: 8082

  # Egress rules - what kromgo can connect TO
  egress:

  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

  # Allow connection to Prometheus in same namespace
  - to:
    - namespaceSelector:
        matchLabels:
          name: observability
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: prometheus
    ports:
    - protocol: TCP
      port: 9090

  # Allow connection to alternative Prometheus instances
  - to:
    - namespaceSelector:
        matchLabels:
          name: observability
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 9090

---
# Additional NetworkPolicy for enhanced security between kromgo replicas
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kromgo-inter-pod
  namespace: observability
  labels:
    app.kubernetes.io/name: kromgo
    app.kubernetes.io/component: network-security-inter-pod
    production-grade: "true"
spec:
  # Apply to kromgo pods
  podSelector:
    matchLabels:
      app.kubernetes.io/name: kromgo

  policyTypes:
  - Ingress

  # Allow kromgo pods to communicate with each other (if needed for clustering)
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: kromgo
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8081
    - protocol: TCP
      port: 8082