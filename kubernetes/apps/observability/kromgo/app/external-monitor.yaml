---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: kromgo-external
  namespace: observability
  labels:
    app.kubernetes.io/name: kromgo
    app.kubernetes.io/component: external-monitoring
    app.kubernetes.io/part-of: observability-infrastructure
    production-grade: "true"
  annotations:
    monitoring.samcloud.online/description: "External probe for kromgo public endpoints"
spec:
  jobName: kromgo-external-probe

  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
    scheme: http
    path: /probe

  module: http_2xx

  targets:
    staticConfig:
      static:
      - "https://kromgo.samcloud.online/cluster_node_count"
      - "https://kromgo.samcloud.online/cluster_cpu_usage"
      - "https://kromgo.samcloud.online/cluster_memory_usage"
      - "https://kromgo.samcloud.online/cluster_alert_count"

      - "https://kromgo.samcloud.online/readyz"

      - "https://metrics.samcloud.online/cluster_node_count"
      - "https://badges.samcloud.online/cluster_node_count"

  interval: 60s
  scrapeTimeout: 30s

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kromgo-external-probe
  namespace: observability
  labels:
    app.kubernetes.io/name: kromgo
    app.kubernetes.io/component: external-monitoring
    production-grade: "true"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: blackbox-exporter
  endpoints:
  - port: http
    interval: 60s
    path: /probe
    params:
      module: [http_2xx]
      target:
      - "https://kromgo.samcloud.online/cluster_node_count"
    metricRelabelings:
    - sourceLabels: [__address__]
      targetLabel: __param_target
    - sourceLabels: [__param_target]
      targetLabel: instance
    - targetLabel: __address__
      replacement: blackbox-exporter.observability.svc.cluster.local:9115

---
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: kromgo-json-endpoints
  namespace: observability
  labels:
    app.kubernetes.io/name: kromgo
    app.kubernetes.io/component: external-monitoring
    production-grade: "true"
spec:
  jobName: kromgo-json-probe
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
    scheme: http
    path: /probe
  module: http_json
  targets:
    staticConfig:
      static:
      - "https://kromgo.samcloud.online/cluster_node_count?format=json"
      - "https://kromgo.samcloud.online/cluster_cpu_usage?format=json"
      - "https://kromgo.samcloud.online/cluster_memory_usage?format=json"
  interval: 300s
  scrapeTimeout: 30s