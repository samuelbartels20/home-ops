---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - helmrelease.yaml
  - configmap.yaml
  - rbac.yaml
  - service.yaml
  - pod-disruption-budget.yaml
  - prometheus-rules.yaml
commonLabels:
  app.kubernetes.io/name: kromgo
  app.kubernetes.io/instance: kromgo
  app.kubernetes.io/component: monitoring
  app.kubernetes.io/part-of: observability
commonAnnotations:
  config.kubernetes.io/production: "true"
  monitoring.samcloud.online/tier: "production"

configMapGenerator:
  - name: kromgo-config
    files:
      - config.yaml

generatorOptions:
  disableNameSuffixHash: true
  labels:
    config.kubernetes.io/managed-by: "kustomize"
    production-grade: "true"
