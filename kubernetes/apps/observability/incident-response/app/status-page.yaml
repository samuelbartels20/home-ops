---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-page
  namespace: observability
  labels:
    app.kubernetes.io/name: status-page
    app.kubernetes.io/component: public-status
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: status-page
  template:
    metadata:
      labels:
        app.kubernetes.io/name: status-page
        app.kubernetes.io/component: public-status
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
      - name: status-page
        image: ghcr.io/cachethq/cachet:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: APP_ENV
          value: "production"
        - name: APP_DEBUG
          value: "false"
        - name: APP_URL
          value: "https://status.samcloud.online"
        - name: APP_TIMEZONE
          value: "UTC"
        - name: DB_DRIVER
          value: "pgsql"
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              name: status-page-secrets
              key: db-host
        - name: DB_DATABASE
          valueFrom:
            secretKeyRef:
              name: status-page-secrets
              key: db-name
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: status-page-secrets
              key: db-username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: status-page-secrets
              key: db-password
        - name: CACHE_DRIVER
          value: "redis"
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              name: status-page-secrets
              key: redis-host
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: status-page-secrets
              key: redis-password
        - name: MAIL_DRIVER
          value: "smtp"
        - name: MAIL_HOST
          valueFrom:
            secretKeyRef:
              name: status-page-secrets
              key: smtp-host
        - name: MAIL_USERNAME
          valueFrom:
            secretKeyRef:
              name: status-page-secrets
              key: smtp-username
        - name: MAIL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: status-page-secrets
              key: smtp-password
        - name: MAIL_ADDRESS
          value: "status@samcloud.online"
        - name: MAIL_NAME
          value: "SamCloud Status"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: status-page
  namespace: observability
  labels:
    app.kubernetes.io/name: status-page
    app.kubernetes.io/component: public-status
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  selector:
    app.kubernetes.io/name: status-page

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: status-page
  namespace: observability
  labels:
    app.kubernetes.io/name: status-page
    app.kubernetes.io/component: public-status
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-production"
    external-dns.alpha.kubernetes.io/hostname: "status.samcloud.online"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - status.samcloud.online
    secretName: status-page-tls
  rules:
  - host: status.samcloud.online
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: status-page
            port:
              number: 80

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: status-page-secrets
  namespace: observability
  labels:
    app.kubernetes.io/name: status-page
    app.kubernetes.io/component: secrets
spec:
  refreshInterval: 1m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: status-page-secrets
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        db-host: "{{ .db_host }}"
        db-name: "{{ .db_name }}"
        db-username: "{{ .db_username }}"
        db-password: "{{ .db_password }}"
        redis-host: "{{ .redis_host }}"
        redis-password: "{{ .redis_password }}"
        smtp-host: "{{ .smtp_host }}"
        smtp-username: "{{ .smtp_username }}"
        smtp-password: "{{ .smtp_password }}"
        app-key: "{{ .app_key }}"
        webhook-secret: "{{ .webhook_secret }}"
  data:
  - secretKey: db_host
    remoteRef:
      key: status-page-database
      property: host
  - secretKey: db_name
    remoteRef:
      key: status-page-database
      property: database
  - secretKey: db_username
    remoteRef:
      key: status-page-database
      property: username
  - secretKey: db_password
    remoteRef:
      key: status-page-database
      property: password
  - secretKey: redis_host
    remoteRef:
      key: status-page-redis
      property: host
  - secretKey: redis_password
    remoteRef:
      key: status-page-redis
      property: password
  - secretKey: smtp_host
    remoteRef:
      key: status-page-smtp
      property: host
  - secretKey: smtp_username
    remoteRef:
      key: status-page-smtp
      property: username
  - secretKey: smtp_password
    remoteRef:
      key: status-page-smtp
      property: password
  - secretKey: app_key
    remoteRef:
      key: status-page-app
      property: key
  - secretKey: webhook_secret
    remoteRef:
      key: status-page-app
      property: webhook_secret

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: status-page
  namespace: observability
data:
  config.yaml: |
    services:
      - name: "Platform Services"
        description: "Core platform services"
        components:
          - name: "API Gateway"
            description: "API routing and management"
          - name: "Authentication"
            description: "User authentication service"
          - name: "Database"
            description: "Data storage service"
          - name: "Cache"
            description: "Data caching service"
          - name: "Monitoring"
            description: "System monitoring service"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: status-updater
  namespace: observability
  labels:
    app.kubernetes.io/name: status-updater
    app.kubernetes.io/component: automation
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: status-updater
  template:
    metadata:
      labels:
        app.kubernetes.io/name: status-updater
        app.kubernetes.io/component: automation
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
      containers:
      - name: status-updater
        image: python:3.11-slim
        command:
        - python
        - /app/status-updater.py
        env:
        - name: PROMETHEUS_URL
          value: "http://prometheus.observability:9090"
        - name: STATUS_PAGE_URL
          value: "http://status-page.observability"
        - name: STATUS_PAGE_TOKEN
          valueFrom:
            secretKeyRef:
              name: status-page-secrets
              key: webhook-secret
        volumeMounts:
        - name: config
          mountPath: /app
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: config
        configMap:
          name: status-page-config
          items:
          - key: status-updater.py
            path: status-updater.py
            mode: 0755
      restartPolicy: Always