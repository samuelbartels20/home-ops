---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-operator
  namespace: network
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: tailscale-operator-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        client_id: "{{ .TS_CLIENT_ID }}"
        client_secret: "{{ .TS_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: tailscale
