---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: network
spec:
  interval: 30m
  chart:
    spec:
      chart: tailscale-operator
      version: 1.88.3
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
  installCRDs: true
  values:
    operatorConfig:
      hostname: "tailscale-operator"
      defaultTags:
        - "tag:k8s"
        - "tag:k8s-operator"
    apiServerProxyConfig:
      mode: "false"
  valuesFrom:
    - kind: Secret
      name: tailscale-operator-secret
      valuesKey: client_id
      targetPath: oauth.clientId
    - kind: Secret
      name: tailscale-operator-secret
      valuesKey: client_secret
      targetPath: oauth.clientSecret
