---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hyperoptic
  namespace: network
  labels:
    substitution.flux.home.arpa/enabled: "true"
spec:
  path: ./kubernetes/apps/network/hyperoptic/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-kubernetes
  healthChecks:
    - apiVersion: networking.k8s.io/v1
      kind: Ingress
      name: hyperoptic
      namespace: network
    - apiVersion: v1
      kind: Endpoints
      name: hyperoptic
      namespace: network
    - apiVersion: v1
      kind: Service
      name: hyperoptic
      namespace: network
  interval: 30m
  retryInterval: 1m
  timeout: 3m
