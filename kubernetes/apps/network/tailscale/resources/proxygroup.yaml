---
# Tailscale Ingress Proxy Group - Production Configuration
apiVersion: tailscale.com/v1alpha1
kind: ProxyGroup
metadata:
  name: ingress-proxy
  namespace: network
  labels:
    app.kubernetes.io/name: tailscale
spec:
  type: ingress
  replicas: 2
  
  proxyConfig:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
        add:
          - NET_ADMIN
          - NET_RAW
      seccompProfile:
        type: RuntimeDefault
    
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9001"
    
    labels:
      app.kubernetes.io/name: tailscale