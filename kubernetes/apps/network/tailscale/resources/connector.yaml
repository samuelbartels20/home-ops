---
# Tailscale Subnet Router (Connector) - Production Configuration
apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: connector
  namespace: network
  labels:
    app.kubernetes.io/name: tailscale
spec:
  tags:
    - tag:k8s
    - tag:production
    - tag:subnet-router
  
  hostname: connector
  
  # Subnet routing configuration
  subnetRouter:
    advertiseRoutes:
      - "192.168.8.1/24"    # Local network
      - "10.42.0.0/16"       # Pod CIDR
      - "10.43.0.0/16"       # Service CIDR
      - "192.168.8.136/24"   # LoadBalancer CIDR
  
  exitNode: false
  
  # Production resource limits
  proxyConfig:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 1000m
        memory: 512Mi
    
    # Security context
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
        add:
          - NET_ADMIN  
          - NET_RAW    
      seccompProfile:
        type: RuntimeDefault
    
    # High availability
    replicas: 1  
    
    # Pod annotations
    annotations:
      reloader.stakater.com/auto: "true"
      prometheus.io/scrape: "true"
      prometheus.io/port: "9001"
    
    # Labels
    labels:
      app.kubernetes.io/name: tailscale