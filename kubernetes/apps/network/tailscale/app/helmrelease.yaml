
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: network
  labels:
    app.kubernetes.io/name: tailscale
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: tailscale-operator
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    crds: CreateReplace
    remediation:
      strategy: rollback
      retries: 3
  values:
    # Operator Configuration
    operatorConfig:
      image:
        repository: ghcr.io/tailscale/k8s-operator
        pullPolicy: IfNotPresent
        tag: "1.88.2"
      
      # Resource limits for operator
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
      
      # Security context for operator
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
      
      # Pod security context
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      
      # Health checks for operator
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8081
        initialDelaySeconds: 15
        periodSeconds: 20
        timeoutSeconds: 5
        failureThreshold: 3
      
      readinessProbe:
        httpGet:
          path: /readyz
          port: 8081
        initialDelaySeconds: 5
        periodSeconds: 10
        timeoutSeconds: 3
        failureThreshold: 3
      
      # High availability settings
      replicas: 2
      
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: ["tailscale-operator"]
                topologyKey: kubernetes.io/hostname
      
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tailscale-operator
      
      # Annotations for auto-reload on secret changes
      podAnnotations:
        reloader.stakater.com/auto: "true"
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
      
      # Node selector for x86 architecture
      nodeSelector:
        kubernetes.io/arch: amd64
      
      # Tolerations
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    
    # Proxy Configuration (for Tailscale proxies)
    proxyConfig:
      image:
        repository: ghcr.io/tailscale/tailscale
        pullPolicy: IfNotPresent
        tag: "v1.88.2"
      
      # Default resources for Tailscale proxies
      defaultResources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 200m
          memory: 256Mi
      
      # Security context for proxies
      defaultSecurityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
          add:
            - NET_ADMIN  
            - NET_RAW    
        seccompProfile:
          type: RuntimeDefault
      
      # Annotations for proxies
      defaultPodAnnotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9001"
      
      # High availability for critical proxies
      defaultReplicas: 2
      
      # Default affinity for proxies
      defaultAffinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: tailscale.com/managed
                      operator: In
                      values: ["true"]
                topologyKey: kubernetes.io/hostname
    
    # Metrics and monitoring
    metrics:
      enabled: true
      port: 8080
      serviceMonitor:
        enabled: true
        interval: 30s
        scrapeTimeout: 10s
    
    # RBAC
    rbac:
      create: true
    
    # Service Account
    serviceAccount:
      create: true
      name: tailscale-operator
      annotations:
        prometheus.io/service-monitor: "true"
    
    # Priority class for operator
    priorityClassName: system-cluster-critical
