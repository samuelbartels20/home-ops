---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2beta2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale
  namespace: network
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  driftDetection:
    mode: enabled

  values:
    controllers:
      tailscale:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/tailscale/tailscale
              tag: v1.88.3
            env:
              TZ: UTC
              PORT: &port 41641 
              SA_NAME: tailscale
              TS_USERSPACE: true  # This means no kernel TUN device needed
              TS_KUBE_SECRET: ""
              TS_EXTRA_ARGS: "--accept-routes --advertise-exit-node=true --advertise-connector=true --advertise-tags=tag:k8s,tag:talos"
              TS_TAILSCALED_EXTRA_ARGS: "--debug=0.0.0.0:58169"
              TS_STATE_DIR: /tmp
            envFrom:
              - secretRef:
                  name: tailscale-secret
            resources:
              requests:
                cpu: 5m
                memory: 128M
              limits:
                memory: 256M
                # NO squat.ai/tun here - userspace mode doesn't need it
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        pod:
          securityContext:
            runAsUser: 568
            runAsGroup: 568
            fsGroup: 568
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: true
    persistence:
      cache:
        type: emptyDir
        globalMounts:
          - path: /.cache
      tmp:
        type: emptyDir
    service:
      app:
        controller: tailscale
        ports:
          http:
            port: 2000
      tailnet:
        controller: tailscale
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 192.168.8.119
        labels:
          io.cilium/lb-ipam-layer2: "true"
        ports:
          tailnet-udp:
            enabled: true
            port: *port
            protocol: UDP
    serviceAccount:
      name: tailscale
    podDisruptionBudget:
      app:
        minAvailable: 1
    serviceMonitor:
      app:
        serviceName: tailscale
        endpoints:
          - port: http
            scheme: http
            path: /debug/metrics
            interval: 1m
            scrapeTimeout: 30s