---
# PrometheusRule for Tailscale Operator Alerting
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tailscale-operator-alerts
  namespace: network
  labels:
    app.kubernetes.io/name: tailscale
spec:
  groups:
    - name: tailscale-operator.rules
      interval: 30s
      rules:
        # Operator availability alerts
        - alert: TailscaleOperatorDown
          expr: |
            up{job="tailscale-operator"} == 0
          for: 5m
          labels:
            severity: critical
            component: tailscale-operator
            tier: production
          annotations:
            summary: "Tailscale operator is down"
            description: "Tailscale operator has been down for more than 5 minutes. Namespace: {{ $labels.namespace }}, Pod: {{ $labels.pod }}"
            runbook_url: "https://samcloud.online/docs/tailscale/troubleshooting"

        - alert: TailscaleOperatorRestarting
          expr: |
            rate(kube_pod_container_status_restarts_total{namespace="network",pod=~"tailscale-operator-.*"}[15m]) > 0
          for: 5m
          labels:
            severity: warning
            component: tailscale-operator
            tier: production
          annotations:
            summary: "Tailscale operator is restarting frequently"
            description: "Tailscale operator pod {{ $labels.pod }} is restarting frequently. This may indicate instability."

        - alert: TailscaleOperatorHighMemoryUsage
          expr: |
            (container_memory_working_set_bytes{namespace="network",pod=~"tailscale-operator-.*"} / container_spec_memory_limit_bytes{namespace="network",pod=~"tailscale-operator-.*"}) > 0.9
          for: 10m
          labels:
            severity: warning
            component: tailscale-operator
            tier: production
          annotations:
            summary: "Tailscale operator high memory usage"
            description: "Tailscale operator pod {{ $labels.pod }} is using {{ $value | humanizePercentage }} of its memory limit."

        - alert: TailscaleOperatorHighCPUUsage
          expr: |
            (rate(container_cpu_usage_seconds_total{namespace="network",pod=~"tailscale-operator-.*"}[5m]) / container_spec_cpu_quota{namespace="network",pod=~"tailscale-operator-.*"} * 100000) > 0.9
          for: 10m
          labels:
            severity: warning
            component: tailscale-operator
            tier: production
          annotations:
            summary: "Tailscale operator high CPU usage"
            description: "Tailscale operator pod {{ $labels.pod }} is using high CPU resources."

        # Reconciliation alerts
        - alert: TailscaleOperatorReconciliationErrors
          expr: |
            rate(controller_runtime_reconcile_errors_total{namespace="network"}[5m]) > 0.1
          for: 10m
          labels:
            severity: warning
            component: tailscale-operator
            tier: production
          annotations:
            summary: "Tailscale operator experiencing reconciliation errors"
            description: "Tailscale operator is experiencing reconciliation errors at a rate of {{ $value | humanize }} per second for controller {{ $labels.controller }}."

        - alert: TailscaleOperatorReconciliationSlow
          expr: |
            histogram_quantile(0.99, rate(controller_runtime_reconcile_time_seconds_bucket{namespace="network"}[5m])) > 60
          for: 10m
          labels:
            severity: warning
            component: tailscale-operator
            tier: production
          annotations:
            summary: "Tailscale operator reconciliation is slow"
            description: "99th percentile reconciliation time for controller {{ $labels.controller }} is {{ $value | humanizeDuration }}."

        # Workqueue alerts
        - alert: TailscaleOperatorWorkQueueDepthHigh
          expr: |
            workqueue_depth{namespace="network",name=~".*tailscale.*"} > 100
          for: 15m
          labels:
            severity: warning
            component: tailscale-operator
            tier: production
          annotations:
            summary: "Tailscale operator work queue depth is high"
            description: "Work queue {{ $labels.name }} has {{ $value }} items pending for more than 15 minutes."

        - alert: TailscaleOperatorWorkQueueStale
          expr: |
            (time() - workqueue_last_processed_timestamp_seconds{namespace="network",name=~".*tailscale.*"}) > 300
          for: 5m
          labels:
            severity: warning
            component: tailscale-operator
            tier: production
          annotations:
            summary: "Tailscale operator work queue appears stale"
            description: "Work queue {{ $labels.name }} hasn't processed items in {{ $value | humanizeDuration }}."

    - name: tailscale-proxies.rules
      interval: 30s
      rules:
        # Proxy availability alerts
        - alert: TailscaleProxyDown
          expr: |
            up{job="tailscale-proxies"} == 0
          for: 5m
          labels:
            severity: warning
            component: tailscale-proxy
            tier: production
          annotations:
            summary: "Tailscale proxy is down"
            description: "Tailscale proxy {{ $labels.pod }} in namespace {{ $labels.namespace }} has been down for more than 5 minutes."

        - alert: TailscaleProxyConnectionErrors
          expr: |
            rate(tailscale_proxy_connection_errors_total[5m]) > 0.1
          for: 10m
          labels:
            severity: warning
            component: tailscale-proxy
            tier: production
          annotations:
            summary: "Tailscale proxy experiencing connection errors"
            description: "Tailscale proxy {{ $labels.pod }} is experiencing connection errors at a rate of {{ $value | humanize }} per second."

        - alert: TailscaleProxyHighLatency
          expr: |
            histogram_quantile(0.95, rate(tailscale_proxy_request_duration_seconds_bucket[5m])) > 1
          for: 10m
          labels:
            severity: warning
            component: tailscale-proxy
            tier: production
          annotations:
            summary: "Tailscale proxy experiencing high latency"
            description: "95th percentile request latency for Tailscale proxy {{ $labels.pod }} is {{ $value | humanizeDuration }}."

    - name: tailscale-connector.rules
      interval: 30s
      rules:
        # Connector alerts
        - alert: TailscaleConnectorDown
          expr: |
            up{job="tailscale-connector"} == 0
          for: 5m
          labels:
            severity: critical
            component: tailscale-connector
            tier: production
          annotations:
            summary: "Tailscale subnet router (connector) is down"
            description: "Tailscale connector is down. This may affect subnet routing and remote access."

        - alert: TailscaleConnectorRouteAdvertisementFailed
          expr: |
            tailscale_connector_route_advertisement_status == 0
          for: 5m
          labels:
            severity: critical
            component: tailscale-connector
            tier: production
          annotations:
            summary: "Tailscale connector failed to advertise routes"
            description: "Tailscale connector failed to advertise subnet routes. Remote access may be impacted."

---
# PrometheusRule for Tailscale SLO Monitoring
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: tailscale-slo
  namespace: network
  labels:
    app.kubernetes.io/name: tailscale
spec:
  groups:
    - name: tailscale-slo.rules
      interval: 30s
      rules:
        # SLO: 99.9% availability
        - record: tailscale:availability:ratio
          expr: |
            avg_over_time(up{job=~"tailscale-.*"}[5m])

        - alert: TailscaleSLOViolation
          expr: |
            tailscale:availability:ratio < 0.999
          for: 10m
          labels:
            severity: critical
            component: tailscale
            tier: production
            slo: availability
          annotations:
            summary: "Tailscale SLO violation - availability below 99.9%"
            description: "Tailscale service availability is {{ $value | humanizePercentage }}, below the 99.9% SLO target."

        # SLO: 95th percentile latency < 500ms
        - record: tailscale:latency:p95
          expr: |
            histogram_quantile(0.95, rate(tailscale_proxy_request_duration_seconds_bucket[5m]))

        - alert: TailscaleLatencySLOViolation
          expr: |
            tailscale:latency:p95 > 0.5
          for: 10m
          labels:
            severity: warning
            component: tailscale
            tier: production
            slo: latency
          annotations:
            summary: "Tailscale SLO violation - latency above 500ms"
            description: "Tailscale 95th percentile latency is {{ $value | humanizeDuration }}, above the 500ms SLO target." 