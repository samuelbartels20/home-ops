apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tailscale-egress
  namespace: network
  labels:
    app.kubernetes.io/name: tailscale
    app.kubernetes.io/component: network
  annotations:
    network-policy.kubernetes.io/type: "zero-trust"
    security.tailscale.io/policy-version: "v1.0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tailscale
  policyTypes:
    - Egress
  egress:
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Allow HTTPS to Tailscale control servers
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80

    # Allow Tailscale DERP servers (global)
    - to: []
      ports:
        - protocol: UDP
          port: 3478   
        - protocol: UDP
          port: 41641  
        - protocol: TCP
          port: 41641  
        - protocol: UDP
          port: 443    

    # Allow communication with Kubernetes API server
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443

    # Allow communication with other pods in the same namespace (all ports)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network

    # Allow access to cluster services
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80

    # Allow access to local network ranges (for route advertising, all ports)
    - to:
        - ipBlock:
            cidr: 192.168.8.0/24  
        - ipBlock:
            cidr: 10.42.0.0/16    
        - ipBlock:
            cidr: 10.43.0.0/16    
