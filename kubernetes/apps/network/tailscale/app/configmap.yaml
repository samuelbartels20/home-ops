---
# Production Standards Configuration for Tailscale
apiVersion: v1
kind: ConfigMap
metadata:
  name: tailscale-production-standards
  namespace: network
  labels:
    app.kubernetes.io/name: tailscale
data:
  standards.yaml: |
    # Tailscale Production Standards v1.0.0
    security:
      # TLS Configuration
      tls:
        enabled: true
        minVersion: "TLSv1.2"
        preferServerCiphers: true
        cipherSuites:
          - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
          - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
      
      # Authentication
      authentication:
        required: true
        methods:
          - oauth2
          - api-key
        mfa:
          enabled: true
          required: false
      
      # Authorization
      authorization:
        enabled: true
        rbac: true
        networkPolicies: true
        podSecurityStandards: "restricted"
      
      # Secret Management
      secrets:
        provider: "external-secrets-operator"
        backend: "onepassword"
        rotation:
          enabled: true
          interval: "90d"
      
      # Network Security
      network:
        zeroTrust: true
        networkPolicies: true
        egressRestrictions: true
        ingressRestrictions: true
      
      # Pod Security
      podSecurity:
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        seccompProfile: "RuntimeDefault"
        capabilities:
          drop: ["ALL"]
          add: ["NET_ADMIN", "NET_RAW"]  
    availability:
      # SLO Targets
      slo:
        availability: 99.9  
        latency_p95: 500    
        latency_p99: 1000   
        errorRate: 0.1      
      
      # Replication
      operator:
        minReplicas: 2
        maxReplicas: 5
        targetCPUUtilization: 70
      
      proxies:
        minReplicas: 2
        maxReplicas: 10
        targetCPUUtilization: 75
      
      # Disruption Budget
      podDisruptionBudget:
        minAvailable: 1
        maxUnavailable: 1
      
      # Anti-affinity
      podAntiAffinity: true
      topologySpread: true
      
      # Health Checks
      healthChecks:
        liveness:
          enabled: true
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
        readiness:
          enabled: true
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        startup:
          enabled: true
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
    
    performance:
      # Resource Management
      resources:
        operator:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        proxies:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        connector:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
      
      # Autoscaling
      hpa:
        enabled: true
        minReplicas: 2
        maxReplicas: 10
        metrics:
          - type: Resource
            resource:
              name: cpu
              target: 70
          - type: Resource
            resource:
              name: memory
              target: 80
      
      # Network Performance
      network:
        maxConnections: 10000
        connectionTimeout: 30s
        keepAliveInterval: 60s
        mtu: 1280  
      
      # Caching
      caching:
        enabled: true
        ttl: 300s
    
    monitoring:
      # Metrics Collection
      metrics:
        enabled: true
        interval: 30s
        scrapeTimeout: 15s
        retention: 15d
        
      # Key Metrics
      keyMetrics:
        - up
        - tailscale_operator_reconcile_total
        - tailscale_operator_reconcile_errors_total
        - tailscale_proxy_connections_active
        - tailscale_proxy_bytes_sent_total
        - tailscale_proxy_bytes_received_total
        - tailscale_proxy_request_duration_seconds
        - controller_runtime_reconcile_time_seconds
        - workqueue_depth
        - workqueue_queue_duration_seconds
      
      # Alerting
      alerting:
        enabled: true
        channels:
          - prometheus-alertmanager
          - gotify
        severity:
          critical:
            - TailscaleOperatorDown
            - TailscaleConnectorDown
            - TailscaleSLOViolation
          warning:
            - TailscaleOperatorRestarting
            - TailscaleProxyDown
            - TailscaleHighMemoryUsage
      
      # Logging
      logging:
        enabled: true
        level: info
        format: json
        structured: true
        retention: 30d
        
      # Tracing
      tracing:
        enabled: false  
        provider: tempo
        samplingRate: 0.1
      
      # Dashboards
      dashboards:
        enabled: true
        provider: grafana
        refresh: 30s
    
    backup:
      # Configuration Backup
      configuration:
        enabled: true
        schedule: "0 2 * * *"  
        retention: 30d
        destination: s3
      
      # Secret Backup
      secrets:
        enabled: true
        encrypted: true
        schedule: "0 3 * * *"  
        retention: 90d
      
      # Disaster Recovery
      disasterRecovery:
        rto: 1h    
        rpo: 24h   
        testing:
          enabled: true
          schedule: monthly
    
    networking:
      # Service Mesh
      serviceMesh:
        enabled: false  
      
      # DNS
      dns:
        enabled: true
        provider: coredns
        magicDNS: true
      
      # Load Balancing
      loadBalancing:
        enabled: true
        type: ClusterIP
        sessionAffinity: ClientIP
      
      # Ingress
      ingress:
        enabled: true
        className: envoy-gateway
        tls: true
      
      # Egress
      egress:
        restricted: true
        allowedDestinations:
          - controlplane.tailscale.com
          - login.tailscale.com
          - derp-servers
      
      # Subnet Routing
      subnetRouting:
        enabled: true
        routes:
          - "192.168.8.1/24"    # Local network
          - "10.42.0.0/16"       # Pod CIDR
          - "10.43.0.0/16"       # Service CIDR
          - "192.168.8.136/24"   # LoadBalancer CIDR
    
    storage:
      # State Storage
      stateStorage:
        enabled: true
        type: kubernetes-secret
        encrypted: true
      
      # Persistence
      persistence:
        enabled: true
        storageClass: openebs-hostpath
        size: 1Gi
        accessMode: ReadWriteOnce
      
      # Volume Snapshots
      snapshots:
        enabled: false  
    
    compliance:
      # Standards
      standards:
        - name: "CIS Kubernetes Benchmark"
          version: "1.8"
          enabled: true
        - name: "Pod Security Standards"
          version: "restricted"
          enabled: true
      
      # Auditing
      auditing:
        enabled: true
        retention: 90d
        events:
          - authentication
          - authorization
          - configuration-changes
          - secret-access
      
      # Scanning
      scanning:
        vulnerability:
          enabled: true
          provider: trivy
          schedule: daily
        compliance:
          enabled: true
          provider: kyverno
          schedule: continuous
      
      # Policy Enforcement
      policies:
        podSecurity: restricted
        networkPolicy: required
        resourceQuotas: enforced
        limitRanges: enforced
    
    operations:
      # Change Management
      changeManagement:
        enabled: true
        approvalRequired: true
        rollbackPlan: required
      
      # Deployment Strategy
      deployment:
        strategy: RollingUpdate
        maxSurge: 1
        maxUnavailable: 0
      
      # Maintenance Windows
      maintenance:
        windows:
          - day: Sunday
            time: "02:00-06:00"
            timezone: UTC
      
      # Documentation
      documentation:
        required: true
        runbooks: true
        architecture: true
        troubleshooting: true
      
      # On-Call
      onCall:
        enabled: true
        escalation: true
        sla: 15m 