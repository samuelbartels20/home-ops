---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tailscale-config
  namespace: network
  labels:
    app.kubernetes.io/name: tailscale
    app.kubernetes.io/component: configuration
    app.kubernetes.io/part-of: network-infrastructure
    network.samcloud.online/tier: production
  annotations:
    reloader.stakater.com/match: "true"
data:
  # Tailscale daemon configuration
  tailscaled.conf: |
    # Network configuration
    accept-routes = true
    accept-dns = false
    
    # Security configuration
    netfilter-mode = off
    snat-subnet-routes = false
    
    # Logging configuration
    verbose = 1
    
    # Performance tuning
    derp-map-update-interval = 5m
    
  # Tailscale client configuration
  tailscale.conf: |
    # Tailscale client configuration
    # Routes to advertise to the tailnet
    advertise-routes = 192.168.8.0/24,10.42.0.0/16,10.43.0.0/16
    
    # Hostname for this node
    hostname = home-ops-k8s
    
    # Accept DNS settings from tailnet
    accept-dns = false
    
    # Accept routes from other nodes
    accept-routes = true
    
  # Health check script
  health-check.sh: |
    #!/bin/sh
    set -e
    
    # Check if tailscaled is running
    if ! pgrep -f tailscaled > /dev/null; then
        echo "ERROR: tailscaled process not found"
        exit 1
    fi
    
    # Check if we can get status
    if ! tailscale status --json > /dev/null 2>&1; then
        echo "ERROR: Cannot get tailscale status"
        exit 1
    fi
    
    # Check if we're connected
    STATE=$(tailscale status --json | jq -r '.BackendState')
    if [ "$STATE" != "Running" ]; then
        echo "ERROR: Tailscale not in Running state: $STATE"
        exit 1
    fi
    
    echo "OK: Tailscale is healthy"
    exit 0
    
  # Metrics configuration
  metrics.yaml: |
    # Prometheus metrics configuration
    metrics:
      enabled: true
      listen_addr: "0.0.0.0:9002"
      path: "/metrics"
      
    # Health check configuration
    health:
      enabled: true
      listen_addr: "0.0.0.0:9002"
      path: "/healthz"
      
    # Debug configuration
    debug:
      enabled: true
      listen_addr: "0.0.0.0:9003"
      path: "/debug" 