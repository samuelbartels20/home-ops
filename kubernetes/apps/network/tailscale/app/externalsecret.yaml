---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale
  namespace: network
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: tailscale
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      engineVersion: v2
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: tailscale
      data:
        # Tailscale OAuth credentials for API access
        client_id: "{{ .client_id }}"
        client_secret: "{{ .client_secret }}"
        # Tailscale auth key for node authentication
        ts_authkey: "{{ .ts_authkey }}"
        tailscale_api_key: "{{ .tailscale_api_key | default \"\" }}"
        tailscale_tailnet: "{{ .tailscale_tailnet | default \"\" }}"
  dataFrom:
    - extract:
        key: tailscale
  refreshInterval: 15m 