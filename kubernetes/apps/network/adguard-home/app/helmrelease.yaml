---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app adguard-home
  namespace: network
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      adguard-home:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: RollingUpdate

        containers:
          app:
            image:
              repository: docker.io/adguard/adguardhome
              tag: v0.107.61
              pullPolicy: IfNotPresent
            env:
              TZ: UTC

            command:
              - /opt/adguardhome/AdGuardHome
            args:
              - --config
              - /opt/adguardhome/conf/AdGuardHome.yaml
              - --work-dir
              - /opt/adguardhome/work
              - --no-check-update
              - --verbose
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &webPort 3000
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *webPort
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false  
              capabilities:
                add:
                  - NET_BIND_SERVICE  
                drop:
                  - ALL
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 500m
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false  
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        kubernetes.io/arch: amd64
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values: ["adguard-home"]
                topologyKey: kubernetes.io/hostname
    service:
      app:
        controller: adguard-home
        type: ClusterIP
        ports:
          http:
            port: *webPort
            protocol: HTTP
            appProtocol: http
      dns:
        controller: adguard-home
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 192.168.8.140  
          external-dns.alpha.kubernetes.io/hostname: adguard.samcloud.online
        externalTrafficPolicy: Local
        ports:
          dns-tcp:
            port: 53
            protocol: TCP
            targetPort: 53
          dns-udp:
            port: 53
            protocol: UDP
            targetPort: 53
          dns-over-tls:
            port: 853
            protocol: TCP
            targetPort: 853
          dns-over-quic:
            port: 853
            protocol: UDP
            targetPort: 853
    serviceMonitor:
      app:
        serviceName: adguard-home
        endpoints:
          - port: http
            scheme: http
            path: /control/stats
            interval: 30s
            scrapeTimeout: 10s
    route:
      app:
        enabled: true
        hostnames: 
          - &host adguard.samcloud.online
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: adguard-home-app
                port: *webPort
    persistence:
      config:
        enabled: true
        existingClaim: adguard-home-config
        globalMounts:
          - path: /opt/adguardhome/conf
      data:
        enabled: true
        existingClaim: adguard-home-data
        globalMounts:
          - path: /opt/adguardhome/work

      tmp:
        enabled: true
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /tmp 