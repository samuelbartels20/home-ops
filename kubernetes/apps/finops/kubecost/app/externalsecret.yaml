---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kubecost-secrets
  namespace: finops
  labels:
    app.kubernetes.io/name: kubecost
    app.kubernetes.io/component: cost-analytics
    app.kubernetes.io/part-of: finops-platform
  annotations:
    ops.finops.io/owner: "finops-team"
    ops.finops.io/contact: "finops@samcloud.online"
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kubecost-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      metadata:
        labels:
          app.kubernetes.io/name: kubecost
          app.kubernetes.io/component: cost-analytics
      data:
        token: "{{ .token }}"
        minio_endpoint: "{{ .MINIO_ENDPOINT }}"
        minio_access_key: "{{ .MINIO_ACCESS_KEY }}"
        minio_secret_key: "{{ .MINIO_SECRET_KEY }}"

        productkey.json: |
          {
            "key": "{{ .KUBECOST_PRODUCT_KEY }}",
            "email": "{{ .KUBECOST_EMAIL }}"
          }

        object-store.yaml: |
          provider: "minio"
          config:
            endpoint: "{{ .MINIO_ENDPOINT }}"
            region: "{{ .MINIO_REGION }}"
            bucket: "{{ .MINIO_KUBECOST_BUCKET }}"
            access_key_id: "{{ .MINIO_ACCESS_KEY_ID }}"
            secret_access_key: "{{ .MINIO_SECRET_ACCESS_KEY }}"
            force_path_style: true
            ssl: {{ .MINIO_SSL }}
            ca_bundle_path: "/etc/ssl/certs/ca-certificates.crt"

        backup-config.yaml: |
          type: "nfs"
          config:
            server: "{{ .TRUENAS_NFS_SERVER }}"
            path: "{{ .TRUENAS_NFS_PATH }}/kubecost-backups"
            mount_options: "nfsvers=4.1,rsize=1048576,wsize=1048576,hard,intr,timeo=600"
            retention_days: 90
            schedule: "0 2 * * *"  # Daily at 2 AM

        aws-billing.json: |
          {
            "aws_access_key_id": "{{ .AWS_CUR_ACCESS_KEY_ID }}",
            "aws_secret_access_key": "{{ .AWS_CUR_SECRET_ACCESS_KEY }}",
            "aws_region": "{{ .AWS_CUR_REGION }}",
            "athena_bucket": "{{ .AWS_CUR_ATHENA_BUCKET }}",
            "athena_region": "{{ .AWS_CUR_ATHENA_REGION }}",
            "athena_database": "{{ .AWS_CUR_ATHENA_DATABASE }}",
            "athena_table": "{{ .AWS_CUR_ATHENA_TABLE }}",
            "athena_workgroup": "{{ .AWS_CUR_ATHENA_WORKGROUP | default "primary" }}"
          }

        oidc-config.json: |
          {
            "client_id": "{{ .OIDC_CLIENT_ID }}",
            "client_secret": "{{ .OIDC_CLIENT_SECRET }}",
            "issuer_url": "{{ .OIDC_ISSUER_URL }}",
            "redirect_url": "https://kubecost.company.com/model/oidc/authorize",
            "scopes": ["openid", "email", "profile", "groups"]
          }

        prometheus-config.yaml: |
          url: "http://prometheus-operated.observability.svc.cluster.local:9090"
          timeout: "120s"
          step: "60s"
          concurrent_queries: 5
          auth:
            type: "bearer_token"
            bearer_token: "{{ .PROMETHEUS_BEARER_TOKEN | default "" }}"

  data:
    - secretKey: token
      remoteRef:
        key: kubecost
        property: token

    - secretKey: MINIO_ENDPOINT
      remoteRef:
        key: minio-cluster
        property: ENDPOINT

    - secretKey: MINIO_ACCESS_KEY
      remoteRef:
        key: minio
        property: access_key

    - secretKey: MINIO_SECRET_KEY
      remoteRef:
        key: minio
        property: secret_key

    - secretKey: MINIO_REGION
      remoteRef:
        key: minio-cluster
        property: REGION

    - secretKey: MINIO_KUBECOST_BUCKET
      remoteRef:
        key: minio-cluster
        property: KUBECOST_BUCKET

    - secretKey: MINIO_ACCESS_KEY_ID
      remoteRef:
        key: minio-cluster
        property: KUBECOST_ACCESS_KEY_ID

    - secretKey: MINIO_SECRET_ACCESS_KEY
      remoteRef:
        key: minio-cluster
        property: KUBECOST_SECRET_ACCESS_KEY

    - secretKey: MINIO_SSL
      remoteRef:
        key: minio-cluster
        property: SSL_ENABLED

    - secretKey: TRUENAS_NFS_SERVER
      remoteRef:
        key: truenas-storage
        property: NFS_SERVER_IP

    - secretKey: TRUENAS_NFS_PATH
      remoteRef:
        key: truenas-storage
        property: NFS_BACKUP_PATH

    - secretKey: AWS_CUR_ACCESS_KEY_ID
      remoteRef:
        key: aws-cost-reporting
        property: ACCESS_KEY_ID
      optional: true

    - secretKey: AWS_CUR_SECRET_ACCESS_KEY
      remoteRef:
        key: aws-cost-reporting
        property: SECRET_ACCESS_KEY
      optional: true

    - secretKey: AWS_CUR_REGION
      remoteRef:
        key: aws-cost-reporting
        property: REGION
      optional: true

    - secretKey: AWS_CUR_ATHENA_BUCKET
      remoteRef:
        key: aws-cost-reporting
        property: ATHENA_BUCKET
      optional: true

    - secretKey: AWS_CUR_ATHENA_REGION
      remoteRef:
        key: aws-cost-reporting
        property: ATHENA_REGION
      optional: true

    - secretKey: AWS_CUR_ATHENA_DATABASE
      remoteRef:
        key: aws-cost-reporting
        property: ATHENA_DATABASE
      optional: true

    - secretKey: AWS_CUR_ATHENA_TABLE
      remoteRef:
        key: aws-cost-reporting
        property: ATHENA_TABLE
      optional: true

    - secretKey: AWS_CUR_ATHENA_WORKGROUP
      remoteRef:
        key: aws-cost-reporting
        property: ATHENA_WORKGROUP
      optional: true

    - secretKey: OIDC_CLIENT_ID
      remoteRef:
        key: kubecost-oidc
        property: CLIENT_ID

    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: kubecost-oidc
        property: CLIENT_SECRET

    - secretKey: OIDC_ISSUER_URL
      remoteRef:
        key: kubecost-oidc
        property: ISSUER_URL


    - secretKey: PROMETHEUS_BEARER_TOKEN
      remoteRef:
        key: prometheus-auth
        property: BEARER_TOKEN
      optional: true