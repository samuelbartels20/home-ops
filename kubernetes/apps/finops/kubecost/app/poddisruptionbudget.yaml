---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kubecost-frontend
  namespace: finops
  labels:
    app.kubernetes.io/name: kubecost
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: finops-platform
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kubecost
      app.kubernetes.io/component: cost-analyzer-frontend

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kubecost-cost-model
  namespace: finops
  labels:
    app.kubernetes.io/name: kubecost
    app.kubernetes.io/component: cost-model
    app.kubernetes.io/part-of: finops-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubecost
      app.kubernetes.io/component: cost-model

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kubecost-prometheus
  namespace: finops
  labels:
    app.kubernetes.io/name: kubecost
    app.kubernetes.io/component: prometheus
    app.kubernetes.io/part-of: finops-platform
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus
      app.kubernetes.io/instance: kubecost