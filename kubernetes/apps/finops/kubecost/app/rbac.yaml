---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubecost-frontend
  namespace: finops
  labels:
    app.kubernetes.io/name: kubecost
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: finops-platform
    environment: production
    security-level: enterprise
  annotations:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted

    compliance.finops.io/sox: "required"
    compliance.finops.io/pci-dss: "applicable"
    compliance.finops.io/gdpr: "required"
    compliance.finops.io/hipaa: "applicable"
    compliance.finops.io/nist: "required"

    security.finops.io/policy-version: "v2.0"
    security.finops.io/last-audit: "${LAST_AUDIT_DATE}"
    security.finops.io/next-review: "${NEXT_REVIEW_DATE}"
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubecost-cost-model
  namespace: finops
  labels:
    app.kubernetes.io/name: kubecost
    app.kubernetes.io/component: cost-model
    app.kubernetes.io/part-of: finops-platform
    environment: production
    security-level: standard
  annotations:
    compliance.finops.io/sox: "required"
    compliance.finops.io/data-classification: "confidential"
automountServiceAccountToken: false

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubecost-cluster-controller
  namespace: finops
  labels:
    app.kubernetes.io/name: kubecost
    app.kubernetes.io/component: cluster-controller
    app.kubernetes.io/part-of: finops-platform
    environment: production
    security-level: standard
automountServiceAccountToken: false

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubecost
  labels:
    app.kubernetes.io/name: kubecost
    app.kubernetes.io/component: cost-analyzer
    app.kubernetes.io/part-of: finops
rules:
  - apiGroups: [""]
    resources: ["configmaps", "secrets", "nodes", "pods", "services", "resourcequotas", "replicationcontrollers", "limitranges", "persistentvolumeclaims", "persistentvolumes", "namespaces", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions"]
    resources: ["daemonsets", "deployments", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["statefulsets", "deployments", "daemonsets", "replicasets"]
    verbs: ["list", "watch"]
  - apiGroups: ["batch"]
    resources: ["cronjobs", "jobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubecost
  labels:
    app.kubernetes.io/name: kubecost
    app.kubernetes.io/component: cost-analyzer
    app.kubernetes.io/part-of: finops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubecost
subjects:
  - kind: ServiceAccount
    name: kubecost
    namespace: finops

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubecost-admin
  namespace: finops
  labels:
    app.kubernetes.io/name: kubecost
    app.kubernetes.io/component: cost-analytics
    app.kubernetes.io/part-of: finops-platform
    security-level: standard
  annotations:
    compliance.finops.io/admin-access: "justified"
    security.finops.io/escalation-path: "finops-sre-oncall"
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - secrets
      - services
      - persistentvolumeclaims
      - serviceaccounts
    verbs: ["*"]
    resourceNames: [] 

  - apiGroups: [""]
    resources:
      - pods
    verbs: ["get", "list", "watch", "delete", "deletecollection"]
    resourceNames: [] 

  - apiGroups: [""]
    resources:
      - events
    verbs: ["get", "list", "watch", "create", "patch"]

  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
    verbs: ["get", "list", "watch", "patch", "update"]
    resourceNames: ["kubecost-cost-analyzer", "kubecost-frontend"]

  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources:
      - helmreleases
    verbs: ["get", "list", "watch", "patch"]
    resourceNames: ["kubecost"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubecost-admin
  namespace: finops
  labels:
    app.kubernetes.io/name: kubecost
    app.kubernetes.io/component: cost-analytics
    app.kubernetes.io/part-of: finops-platform
    security-level: standard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubecost-admin
subjects:
  - kind: ServiceAccount
    name: kubecost-frontend
    namespace: finops
  - kind: ServiceAccount
    name: kubecost-cost-model
    namespace: finops

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubecost-prometheus-access
  namespace: observability
  labels:
    app.kubernetes.io/name: kubecost
    app.kubernetes.io/component: prometheus-integration
    app.kubernetes.io/part-of: finops-platform
    security-level: standard
  annotations:
    compliance.finops.io/cross-namespace-justified: "prometheus-metrics-collection"
    security.finops.io/data-classification: "internal"
rules:
  - apiGroups: [""]
    resources:
      - services
      - endpoints
    verbs: ["get", "list", "watch"]
    resourceNames:

      - "prometheus-operated"

  - apiGroups: [""]
    resources:
      - pods
    verbs: ["get", "list"]
    resourceNames: [] 

  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - servicemonitors
      - prometheusrules
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubecost-prometheus-access
  namespace: observability
  labels:
    app.kubernetes.io/name: kubecost
    app.kubernetes.io/component: prometheus-integration
    app.kubernetes.io/part-of: finops-platform
    security-level: standard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubecost-prometheus-access
subjects:
  - kind: ServiceAccount
    name: kubecost-cost-model
    namespace: finops

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubecost-cluster-controller
  labels:
    app.kubernetes.io/name: kubecost
    app.kubernetes.io/component: cluster-controller
    app.kubernetes.io/part-of: finops-platform
    security-level: standard
  annotations:
    compliance.finops.io/multi-cluster: "approved"
    security.finops.io/federation-access: "controlled"
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - namespaces
    verbs: ["get", "list", "watch"]

  - apiGroups: [""]
    resources:
      - componentstatuses
    verbs: ["get", "list"]

  - apiGroups: ["apiextensions.k8s.io"]
    resources:
      - customresourcedefinitions
    verbs: ["get", "list", "watch", "create", "update", "patch"]
    resourceNames:
      - "clusterconfigs.kubecost.com"
      - "federatedcosts.kubecost.com"

  - apiGroups: ["kubecost.com"]
    resources:
      - clusterconfigs
      - federatedcosts
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubecost-cluster-controller
  labels:
    app.kubernetes.io/name: kubecost
    app.kubernetes.io/component: cluster-controller
    app.kubernetes.io/part-of: finops-platform
    security-level: standard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubecost-cluster-controller
subjects:
  - kind: ServiceAccount
    name: kubecost-cluster-controller
    namespace: finops

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubecost-security-policy
  namespace: finops
  labels:
    app.kubernetes.io/name: kubecost
    app.kubernetes.io/component: security-policy
    app.kubernetes.io/part-of: finops-platform
    security-level: standard
  annotations:
    compliance.finops.io/policy-enforcement: "strict"
    security.finops.io/vulnerability-scanning: "enabled"
rules:
  - apiGroups: [""]
    resources:
      - events
    verbs: ["create", "patch"]
    resourceNames: [] 

  - apiGroups: ["policy"]
    resources:
      - podsecuritypolicies
    verbs: ["use"]
    resourceNames: ["kubecost-psp"]

  - apiGroups: ["networking.k8s.io"]
    resources:
      - networkpolicies
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubecost-security-policy
  namespace: finops
  labels:
    app.kubernetes.io/name: kubecost
    app.kubernetes.io/component: security-policy
    app.kubernetes.io/part-of: finops-platform
    security-level: standard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubecost-security-policy
subjects:
  - kind: ServiceAccount
    name: kubecost-frontend
    namespace: finops
  - kind: ServiceAccount
    name: kubecost-cost-model
    namespace: finops
  - kind: ServiceAccount
    name: kubecost-cluster-controller
    namespace: finops