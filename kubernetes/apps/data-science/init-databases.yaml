---
apiVersion: batch/v1
kind: Job
metadata:
  name: init-data-warehouse-databases
  namespace: data-science
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
      - name: postgres-init
        image: postgres:16-alpine
        env:
        - name: PGHOST
          value: "postgres-lb.storage.svc.cluster.local"
        - name: PGPORT
          value: "5432"
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: postgres-superuser
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-superuser
              key: password
        command:
        - /bin/sh
        - -c
        - |
          # Wait for PostgreSQL to be ready
          until pg_isready; do
            echo "Waiting for PostgreSQL..."
            sleep 2
          done

          # Create databases for data warehouse services
          psql -c "CREATE DATABASE IF NOT EXISTS superset;"
          psql -c "CREATE DATABASE IF NOT EXISTS druid;"

          # Create users (optional - can use default postgres user)
          psql -c "CREATE USER IF NOT EXISTS superset_user WITH ENCRYPTED PASSWORD 'changeme-superset';"
          psql -c "CREATE USER IF NOT EXISTS druid_user WITH ENCRYPTED PASSWORD 'changeme-druid';"

          # Grant permissions
          psql -c "GRANT ALL PRIVILEGES ON DATABASE superset TO superset_user;"
          psql -c "GRANT ALL PRIVILEGES ON DATABASE druid TO druid_user;"

          echo "Database initialization completed!"