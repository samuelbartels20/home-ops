---
# Optimizations for 5M Rows Daily Processing
apiVersion: v1
kind: ConfigMap
metadata:
  name: optimizations-5m-rows
  namespace: data-science
  labels:
    optimization.bigtech.io/type: tuning
data:
  clickhouse-optimizations.sql: |
    -- Table structure optimized for 5M rows/day
    CREATE TABLE events_optimized (
        timestamp DateTime64(3),
        user_id UInt64,
        event_type LowCardinality(String),
        page_path String,
        session_id FixedString(36),
        country_code FixedString(2),
        device_type LowCardinality(String),
        -- Optimize for common queries
        INDEX user_idx user_id TYPE bloom_filter GRANULARITY 1,
        INDEX event_type_idx event_type TYPE set(100) GRANULARITY 1,
        INDEX timestamp_idx timestamp TYPE minmax GRANULARITY 1
    ) ENGINE = MergeTree()
    PARTITION BY toYYYYMM(timestamp)  -- Monthly partitions optimal for 5M/day
    ORDER BY (timestamp, user_id, event_type)
    TTL timestamp + INTERVAL 2 YEAR TO DISK 'cold',
        timestamp + INTERVAL 7 YEAR DELETE
    SETTINGS
        index_granularity = 8192,  -- Default is optimal for this scale
        ttl_only_drop_parts = 1;   -- Efficient partition drops

    -- Pre-aggregated views for common analytics
    CREATE MATERIALIZED VIEW daily_metrics_mv TO daily_metrics AS
    SELECT
        toDate(timestamp) as date,
        event_type,
        country_code,
        device_type,
        count() as event_count,
        uniq(user_id) as unique_users,
        uniq(session_id) as unique_sessions
    FROM events_optimized
    GROUP BY date, event_type, country_code, device_type;

    -- Hourly rollups for real-time dashboards
    CREATE MATERIALIZED VIEW hourly_metrics_mv TO hourly_metrics AS
    SELECT
        toStartOfHour(timestamp) as hour,
        event_type,
        count() as event_count,
        uniq(user_id) as unique_users
    FROM events_optimized
    GROUP BY hour, event_type;

  druid-tuning.json: |
    {
      "tuningConfig": {
        "type": "kafka",
        "maxRowsInMemory": 100000,
        "maxBytesInMemory": 52428800,
        "skipEmptyBuckets": true,
        "maxRowsPerSegment": 5000000,
        "intermediateHandoffPeriod": "PT15M",
        "maxPendingPersists": 2,
        "reportParseExceptions": false
      },
      "granularitySpec": {
        "type": "uniform",
        "segmentGranularity": "HOUR",
        "queryGranularity": "MINUTE",
        "rollup": true
      },
      "metricsSpec": [
        {
          "type": "count",
          "name": "event_count"
        },
        {
          "type": "hyperUnique",
          "name": "unique_users",
          "fieldName": "user_id"
        },
        {
          "type": "longSum",
          "name": "total_session_time",
          "fieldName": "session_duration"
        }
      ],
      "dimensionsSpec": {
        "dimensions": [
          "event_type",
          "country_code",
          "device_type",
          {
            "type": "string",
            "name": "page_path",
            "multiValueHandling": "SORTED_ARRAY"
          }
        ]
      }
    }

  superset-config.py: |
    # Superset optimizations for 5M rows/day

    # Cache configuration optimized for dataset size
    CACHE_CONFIG = {
        'CACHE_TYPE': 'RedisCluster',
        'CACHE_DEFAULT_TIMEOUT': 3600,  # 1 hour default
        'CACHE_KEY_PREFIX': 'superset_',
        'CACHE_REDIS_URL': 'redis://redis-cluster.data-science.svc.cluster.local:6379/0'
    }

    # Results backend for async queries
    RESULTS_BACKEND = {
        'REDIS_HOST': 'redis-cluster.data-science.svc.cluster.local',
        'REDIS_PORT': 6379,
        'REDIS_DB': 2,
        'REDIS_RESULTS_TTL': 86400  # 24 hours
    }

    # Query optimization for 5M row datasets
    SQLLAB_DEFAULT_DBID = 1
    DEFAULT_FEATURE_FLAGS = {
        'ENABLE_TEMPLATE_PROCESSING': True,
        'DASHBOARD_NATIVE_FILTERS': True,
        'DASHBOARD_CROSS_FILTERS': True,
        'GLOBAL_ASYNC_QUERIES': True,
        'DASHBOARD_CACHE': True
    }

    # Optimized connection pooling
    SQLALCHEMY_ENGINE_OPTIONS = {
        'pool_size': 5,        # Conservative for 5M rows
        'max_overflow': 10,
        'pool_timeout': 30,
        'pool_recycle': 1800,  # 30 minutes
        'pool_pre_ping': True
    }

    # Query result limits optimized for dataset size
    DEFAULT_SQLLAB_LIMIT = 10000
    SQL_MAX_ROW = 100000
    SUPERSET_WEBSERVER_TIMEOUT = 300  # 5 minutes

    # Dashboard performance settings
    DASHBOARD_AUTO_REFRESH_INTERVALS = [
        [0, "Don't refresh"],
        [10, "10 seconds"],
        [30, "30 seconds"],
        [60, "1 minute"],
        [300, "5 minutes"]
    ]

  monitoring-thresholds.yaml: |
    # Monitoring thresholds optimized for 5M rows/day
    performance_thresholds:
      clickhouse:
        # Query performance alerts
        query_duration_p95: "2s"     # Alert if 95th percentile > 2s
        query_duration_p99: "10s"    # Alert if 99th percentile > 10s
        concurrent_queries: 50       # Alert if > 50 concurrent queries
        memory_usage: 80             # Alert if > 80% memory usage
        disk_usage: 85               # Alert if > 85% disk usage

        # Ingestion performance
        ingestion_rate: "1GB/hour"   # Alert if ingestion rate drops
        merge_operations: 10         # Alert if > 10 background merges

      druid:
        # Segment and query alerts
        query_time_p95: "3s"         # Alert if 95th percentile > 3s
        segment_count: 10000         # Alert if > 10k segments
        ingestion_lag: "5m"          # Alert if ingestion lag > 5 minutes
        broker_memory: 80            # Alert if broker memory > 80%

      superset:
        # User experience alerts
        dashboard_load_time: "5s"    # Alert if dashboard loads > 5s
        async_query_failures: 5      # Alert if > 5% async query failures
        cache_hit_ratio: 70          # Alert if cache hit ratio < 70%
        concurrent_users: 500        # Alert if > 500 concurrent users

  cost-optimization.yaml: |
    # Cost optimization recommendations for 5M rows/day
    resource_rightsizing:
      clickhouse:
        # Current allocation is generous - can optimize
        memory:
          current: "16Gi per node"
          optimal: "8Gi per node"
          savings: "50% memory cost reduction"

        cpu:
          current: "8 cores per node"
          optimal: "4 cores per node"
          savings: "50% CPU cost reduction"

        storage:
          current: "1.7TB total"
          optimal: "1TB total (sufficient for 3 years)"
          savings: "40% storage cost reduction"

      druid:
        # Already well-sized for the workload
        optimization: "Current sizing appropriate"
        recommendation: "Monitor and scale as needed"

      superset:
        # Can reduce worker count
        workers:
          current: "2 Celery workers"
          optimal: "1 Celery worker"
          savings: "50% worker cost reduction"

    estimated_monthly_savings: "$800-1000 (40-50% reduction)"
    optimized_monthly_cost: "$900-1100"

    scaling_strategy:
      phase_1: "5M-50M rows/day - Current setup with minor optimizations"
      phase_2: "50M-500M rows/day - Add 2-3 nodes per service"
      phase_3: "500M+ rows/day - Implement hyperscale architecture"