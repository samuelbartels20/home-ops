---
apiVersion: v1
kind: ConfigMap
metadata:
  name: druid-grafana-dashboard
  namespace: data-science
  labels:
    app.kubernetes.io/name: druid
    grafana_dashboard: "1"
data:
  druid-dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Druid Cluster Overview",
        "tags": ["druid", "data-science"],
        "style": "dark",
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Druid Component Status",
            "type": "stat",
            "targets": [
              {
                "expr": "up{job=~\"druid-.*\"}",
                "legendFormat": "{{job}}"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {
                  "mode": "thresholds"
                },
                "thresholds": {
                  "steps": [
                    {"color": "red", "value": 0},
                    {"color": "green", "value": 1}
                  ]
                }
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "Query Latency (95th percentile)",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(druid_query_time_bucket[5m]))",
                "legendFormat": "{{job}}"
              }
            ],
            "yAxes": [
              {
                "label": "Latency (seconds)",
                "unit": "s"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "id": 3,
            "title": "Query Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(druid_query_total[5m])",
                "legendFormat": "{{job}}"
              }
            ],
            "yAxes": [
              {
                "label": "Queries per second",
                "unit": "reqps"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
          },
          {
            "id": 4,
            "title": "Ingestion Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(druid_ingestion_total[5m])",
                "legendFormat": "{{job}}"
              }
            ],
            "yAxes": [
              {
                "label": "Ingestions per second",
                "unit": "reqps"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
          },
          {
            "id": 5,
            "title": "Memory Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "container_memory_usage_bytes{container=\"druid\"} / container_spec_memory_limit_bytes{container=\"druid\"} * 100",
                "legendFormat": "{{pod}}"
              }
            ],
            "yAxes": [
              {
                "label": "Memory Usage (%)",
                "unit": "percent"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 16}
          },
          {
            "id": 6,
            "title": "CPU Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(container_cpu_usage_seconds_total{container=\"druid\"}[5m]) * 100",
                "legendFormat": "{{pod}}"
              }
            ],
            "yAxes": [
              {
                "label": "CPU Usage (%)",
                "unit": "percent"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 16}
          },
          {
            "id": 7,
            "title": "Cache Hit Rate",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(druid_cache_hit_total[5m]) / (rate(druid_cache_hit_total[5m]) + rate(druid_cache_miss_total[5m])) * 100",
                "legendFormat": "{{job}}"
              }
            ],
            "yAxes": [
              {
                "label": "Cache Hit Rate (%)",
                "unit": "percent"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 24}
          },
          {
            "id": 8,
            "title": "Segment Load Failures",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(druid_segment_load_failed_total[5m])",
                "legendFormat": "{{job}}"
              }
            ],
            "yAxes": [
              {
                "label": "Failures per second",
                "unit": "reqps"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 24}
          },
          {
            "id": 9,
            "title": "JVM Memory Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "jvm_memory_used_bytes{job=~\"druid-.*\"} / jvm_memory_max_bytes{job=~\"druid-.*\"} * 100",
                "legendFormat": "{{job}}"
              }
            ],
            "yAxes": [
              {
                "label": "JVM Memory Usage (%)",
                "unit": "percent"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 32}
          },
          {
            "id": 10,
            "title": "Garbage Collection Time",
            "type": "graph",
            "targets": [
              {
                "expr": "rate(jvm_gc_collection_seconds_sum{job=~\"druid-.*\"}[5m]) * 100",
                "legendFormat": "{{job}}"
              }
            ],
            "yAxes": [
              {
                "label": "GC Time (%)",
                "unit": "percent"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 32}
          },
          {
            "id": 11,
            "title": "HTTP Connections",
            "type": "graph",
            "targets": [
              {
                "expr": "druid_http_connections",
                "legendFormat": "{{job}}"
              }
            ],
            "yAxes": [
              {
                "label": "Active Connections",
                "unit": "short"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 40}
          },
          {
            "id": 12,
            "title": "ZooKeeper Latency",
            "type": "graph",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(zk_request_latency_ms_bucket{job=\"druid-zookeeper\"}[5m]))",
                "legendFormat": "ZooKeeper"
              }
            ],
            "yAxes": [
              {
                "label": "Latency (ms)",
                "unit": "ms"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 40}
          }
        ],
        "time": {
          "from": "now-1h",
          "to": "now"
        },
        "refresh": "30s"
      }
    } 