---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: druid-secrets
  namespace: data-science
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: druid-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # PostgreSQL metadata store configuration
        druid_metadata_storage_type: "postgresql"
        druid_metadata_storage_connector_connectURI: "jdbc:postgresql://postgres-lb.storage.svc.cluster.local:5432/druid"
        druid_metadata_storage_connector_user: "{{ .POSTGRES_USER }}"
        druid_metadata_storage_connector_password: "{{ .POSTGRES_PASS }}"

        # Admin and service users
        druid_admin_password: "{{ .DRUID_ADMIN_PASSWORD }}"
        druid_coordinator_password: "{{ .DRUID_COORDINATOR_PASSWORD }}"
        druid_broker_password: "{{ .DRUID_BROKER_PASSWORD }}"
        druid_router_password: "{{ .DRUID_ROUTER_PASSWORD }}"
        druid_overlord_password: "{{ .DRUID_OVERLORD_PASSWORD }}"

        # TLS certificates
        druid_server_cert: "{{ .DRUID_SERVER_CERT }}"
        druid_server_key: "{{ .DRUID_SERVER_KEY }}"
        druid_ca_cert: "{{ .DRUID_CA_CERT }}"

        # Deep storage configuration (TrueNAS NFS)
        druid_storage_type: "s3"
        druid_storage_bucket: "druid-deep-storage"
        druid_s3_endpoint: "http://192.168.8.102:9000"
        druid_s3_access_key: "{{ .S3_ACCESS_KEY }}"
        druid_s3_secret_key: "{{ .S3_SECRET_KEY }}"

        # ZooKeeper configuration
        druid_zk_service_host: "druid-zookeeper.data-science.svc.cluster.local:2181"
        druid_zk_paths_base: "/druid"

        # Security settings
        druid_auth_authenticatorChain: '[{"type":"basic","name":"MyBasicMetadataAuthenticator"}]'
        druid_auth_authorizers: '[{"type":"basic","name":"MyBasicMetadataAuthorizer"}]'
        druid_escalator_type: "basic"
        druid_escalator_internalClientUsername: "druid_system"
        druid_escalator_internalClientPassword: "{{ .DRUID_SYSTEM_PASSWORD }}"

        # LDAP integration (optional)
        druid_ldap_url: "ldap://lldap.security.svc.cluster.local:389"
        druid_ldap_bindDn: "uid=druid,ou=people,dc=home,dc=arpa"
        druid_ldap_bindPassword: "{{ .LDAP_BIND_PASSWORD }}"
        druid_ldap_baseDn: "ou=people,dc=home,dc=arpa"

        # Processing and caching
        druid_processing_buffer_sizeBytes: "536870912"  # 512MB
        druid_processing_numMergeBuffers: "4"
        druid_processing_numThreads: "4"

        # Query cache (using Dragonfly Redis)
        druid_cache_type: "redis"
        druid_cache_host: "dragonfly.storage.svc.cluster.local"
        druid_cache_port: "6379"
        druid_cache_database: "2"
        druid_cache_timeout: "2000"
        druid_cache_maxTotalConnections: "16"
        druid_cache_maxIdleConnections: "8"

        # Server configuration
        druid_server_maxSize: "21474836480"  # 20GB
        druid_segmentCache_locations: '[{"path":"/opt/druid/var/druid/segments","maxSize":"21474836480"}]'

                # Extensions
        druid_extensions_loadList: '["druid-hdfs-storage","druid-kafka-indexing-service","druid-datasketches","postgresql-metadata-storage","druid-basic-security","druid-s3-extensions","druid-redis-cache","druid-histogram","druid-stats","druid-orc-extensions","druid-parquet-extensions","druid-avro-extensions"]'

  dataFrom:
    - extract:
        key: druid
    - extract:
        key: cloudnative-pg
    - extract:
        key: s3-credentials