---
apiVersion: v1
kind: ConfigMap
metadata:
  name: druid-config
  namespace: data-science
  labels:
    app.kubernetes.io/name: druid
data:
    druid_processing_buffer_sizeBytes: "536870912"
    druid_processing_numMergeBuffers: "4"
    druid_processing_numThreads: "4"
    
    
    druid_emitter: "http"
    druid_emitter_http_recipientBaseUrl: "http://vector.observability.svc.cluster.local:8686"
    
    druid_auth_authenticatorChain: '[{"type":"basic","name":"MyBasicMetadataAuthenticator"}]'
    druid_auth_authorizers: '[{"type":"basic","name":"MyBasicMetadataAuthorizer"}]'
    druid_escalator_type: "basic"
    druid_escalator_internalClientUsername: "druid_system"
    
    druid_server_http_numThreads: "10"
    druid_server_http_maxIdleTime: "PT5M"
    druid_server_http_defaultQueryTimeout: "PT300S"
    
    druid_monitoring_emissionPeriod: "PT1M"
    druid_monitoring_emitters: '["http"]'
    druid_monitoring_http_recipientBaseUrl: "http://vector.observability.svc.cluster.local:8686"
    
    druid_cache_type: "redis"
    druid_cache_host: "dragonfly.storage.svc.cluster.local"
    druid_cache_port: "6379"
    druid_cache_database: "2"
    druid_cache_timeout: "2000"
    druid_cache_maxTotalConnections: "16"
    druid_cache_maxIdleConnections: "8"
    
    druid_extensions_loadList: '["druid-hdfs-storage","druid-kafka-indexing-service","druid-datasketches","postgresql-metadata-storage","druid-basic-security","druid-s3-extensions","druid-redis-cache","druid-histogram","druid-stats","druid-orc-extensions","druid-parquet-extensions","druid-avro-extensions"]'
    
    druid_zk_service_host: "druid-zookeeper.data-science.svc.cluster.local:2181"
    druid_zk_paths_base: "/druid"
    druid_zk_compression: "true"
    druid_zk_sessionTimeoutMs: "30000"
    druid_zk_connectionTimeoutMs: "15000"
    
    druid_storage_type: "s3"
    druid_storage_bucket: "druid-deep-storage"
    druid_s3_endpoint: "http://192.168.8.102:9000"
    druid_s3_enablePathStyleAccess: "true"
    druid_s3_disableChunkedEncoding: "true"
    
    druid_metadata_storage_type: "postgresql"
    druid_metadata_storage_connector_connectURI: "jdbc:postgresql://postgres-lb.storage.svc.cluster.local:5432/druid"
    druid_metadata_storage_connector_user: "druid"
    druid_metadata_storage_connector_password: "druid_password"
    
    druid_segmentCache_locations: '[{"path":"/opt/druid/var/druid/segments","maxSize":"21474836480"}]'
    druid_server_maxSize: "21474836480"
    
    druid_query_cache_enable: "true"
    druid_query_cache_populateCache: "true"
    druid_query_cache_useCache: "true"
    druid_query_cache_unCacheable: '["groupBy","topN"]'
    
    # Processing Configuration
    druid_processing_tmpDir: "/tmp/druid"
    druid_processing_intermediate_storage_type: "local"
    druid_processing_intermediate_storage_local_dir: "/tmp/druid/intermediate"
    
    # HTTP Configuration
    druid_server_http_enableRequestLimit: "true"
    druid_server_http_maxRequestHeaderSize: "8192"
    druid_server_http_maxRequestLineLength: "4096"
    
    # Metrics Configuration
    druid_emitter_http_flushMillis: "60000"
    druid_emitter_http_flushCount: "100"
    druid_emitter_http_basicAuthentication_username: "druid"
    druid_emitter_http_basicAuthentication_password: "druid_metrics_password"
    
    # Health Check Configuration
    druid_server_http_healthCheckTimeout: "PT30S"
    druid_server_http_healthCheckInterval: "PT30S"
    
    # Graceful Shutdown Configuration
    druid_server_http_gracefulShutdownTimeout: "PT30S"
    druid_server_http_gracefulShutdownDelay: "PT5S" 