---
# NetworkPolicy for Druid Coordinator
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: druid-coordinator
  namespace: data-science
  labels:
    app.kubernetes.io/name: druid
    app.kubernetes.io/component: coordinator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: druid
      app.kubernetes.io/component: coordinator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow HTTP traffic from other Druid components
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: druid
        - namespaceSelector:
            matchLabels:
              name: data-science
      ports:
        - protocol: TCP
          port: 8081
    # Allow traffic from ingress controller
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8081
  egress:
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow HTTP/HTTPS for external services
    - to: []
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    # Allow communication with PostgreSQL metadata store
    - to:
        - namespaceSelector:
            matchLabels:
              name: storage
      ports:
        - protocol: TCP
          port: 5432
    # Allow communication with ZooKeeper
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: druid
              app.kubernetes.io/component: zookeeper
      ports:
        - protocol: TCP
          port: 2181
    # Allow communication with Redis cache
    - to:
        - namespaceSelector:
            matchLabels:
              name: storage
      ports:
        - protocol: TCP
          port: 6379
