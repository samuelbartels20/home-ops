---
# NetworkPolicy for Druid ZooKeeper
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: druid-zookeeper
  namespace: data-science
  labels:
    app.kubernetes.io/name: druid
    app.kubernetes.io/component: zookeeper
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: druid
      app.kubernetes.io/component: zookeeper
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow ZooKeeper client traffic from Druid components
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: druid
      ports:
        - protocol: TCP
          port: 2181
    # Allow ZooKeeper admin traffic
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: druid
        - namespaceSelector:
            matchLabels:
              name: data-science
      ports:
        - protocol: TCP
          port: 8080
    # Allow ZooKeeper peer communication
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: druid
              app.kubernetes.io/component: zookeeper
      ports:
        - protocol: TCP
          port: 2888
        - protocol: TCP
          port: 3888
  egress:
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow ZooKeeper peer communication
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: druid
              app.kubernetes.io/component: zookeeper
      ports:
        - protocol: TCP
          port: 2888
        - protocol: TCP
          port: 3888
