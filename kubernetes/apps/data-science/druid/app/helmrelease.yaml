---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: druid
  namespace: data-science
spec:
  interval: 15m
  chart:
    spec:
      chart: app-template
      version: 4.1.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    crds: CreateReplace
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      coordinator:
        type: deployment
        replicas: 2
        containers:
          druid:
            image:
              repository: apache/druid
              tag: 31.0.0
            env:
              - name: DRUID_SERVICE
                value: coordinator
              - name: DRUID_MAXDIRECTMEMORYSIZE
                value: 1g
              - name: DRUID_XMS
                value: 1g
              - name: DRUID_XMX
                value: 1g
            envFrom:
              - secretRef:
                  name: druid-secret
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                cpu: 1
                memory: 3Gi

      overlord:
        type: deployment
        replicas: 1
        containers:
          druid:
            image:
              repository: apache/druid
              tag: 31.0.0
            env:
              - name: DRUID_SERVICE
                value: overlord
              - name: DRUID_MAXDIRECTMEMORYSIZE
                value: 1g
              - name: DRUID_XMS
                value: 1g
              - name: DRUID_XMX
                value: 1g
            envFrom:
              - secretRef:
                  name: druid-secret
            resources:
              requests:
                cpu: 500m
                memory: 2Gi
              limits:
                cpu: 1
                memory: 3Gi

      broker:
        type: deployment
        replicas: 2
        containers:
          druid:
            image:
              repository: apache/druid
              tag: 31.0.0
            env:
              - name: DRUID_SERVICE
                value: broker
              - name: DRUID_MAXDIRECTMEMORYSIZE
                value: 2g
              - name: DRUID_XMS
                value: 1g
              - name: DRUID_XMX
                value: 1g
            envFrom:
              - secretRef:
                  name: druid-secret
            resources:
              requests:
                cpu: 1
                memory: 3Gi
              limits:
                cpu: 2
                memory: 4Gi

      historical:
        type: statefulset
        replicas: 2
        statefulset:
          volumeClaimTemplates:
            - name: segment-cache
              accessMode: ReadWriteOnce
              size: 100Gi
              storageClass: ceph-block
              globalMounts:
                - path: /opt/druid/var/druid/segments
        containers:
          druid:
            image:
              repository: apache/druid
              tag: 31.0.0
            env:
              - name: DRUID_SERVICE
                value: historical
              - name: DRUID_MAXDIRECTMEMORYSIZE
                value: 4g
              - name: DRUID_XMS
                value: 2g
              - name: DRUID_XMX
                value: 2g
            envFrom:
              - secretRef:
                  name: druid-secret
            resources:
              requests:
                cpu: 1
                memory: 6Gi
              limits:
                cpu: 2
                memory: 8Gi

      middlemanager:
        type: deployment
        replicas: 2
        containers:
          druid:
            image:
              repository: apache/druid
              tag: 31.0.0
            env:
              - name: DRUID_SERVICE
                value: middleManager
              - name: DRUID_MAXDIRECTMEMORYSIZE
                value: 2g
              - name: DRUID_XMS
                value: 1g
              - name: DRUID_XMX
                value: 1g
            envFrom:
              - secretRef:
                  name: druid-secret
            resources:
              requests:
                cpu: 1
                memory: 3Gi
              limits:
                cpu: 2
                memory: 4Gi

      router:
        type: deployment
        replicas: 1
        containers:
          druid:
            image:
              repository: apache/druid
              tag: 31.0.0
            env:
              - name: DRUID_SERVICE
                value: router
              - name: DRUID_MAXDIRECTMEMORYSIZE
                value: 512m
              - name: DRUID_XMS
                value: 512m
              - name: DRUID_XMX
                value: 512m
            envFrom:
              - secretRef:
                  name: druid-secret
            resources:
              requests:
                cpu: 200m
                memory: 1Gi
              limits:
                cpu: 500m
                memory: 1Gi

    service:
      coordinator:
        controller: coordinator
        ports:
          http:
            port: 8081
      broker:
        controller: broker
        ports:
          http:
            port: 8082
      overlord:
        controller: overlord
        ports:
          http:
            port: 8090
      historical:
        controller: historical
        ports:
          http:
            port: 8083
      middlemanager:
        controller: middlemanager
        ports:
          http:
            port: 8091
      router:
        controller: router
        primary: true
        ports:
          http:
            port: 8888

    ingress:
      druid:
        className: internal
        hosts:
          - host: &host "druid.samcloud.online"
            paths:
              - path: /
                service:
                  identifier: router
                  port: http
        tls:
          - hosts:
              - *host
            secretName: druid-production-tls

    persistence:
      # Shared configuration
      common:
        type: configMap
        name: druid-config
        globalMounts:
          - path: /opt/druid/conf/druid/single-server/nano-quickstart/_common
            subPath: _common

      # Deep storage for segments (using TrueNAS NFS)
      deepstorage:
        type: nfs
        server: 192.168.8.102  
        path: /mnt/pool0/druid-deepstorage
        globalMounts:
          - path: /opt/druid/var/druid/segments-deep