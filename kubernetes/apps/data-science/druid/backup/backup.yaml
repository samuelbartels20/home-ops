---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: druid-backup-schedule
  namespace: velero
  labels:
    app.kubernetes.io/name: druid
spec:
  schedule: "0 2 * * *"  # Daily at 2 AM
  template:
    includedNamespaces:
      - data-science
    includedResources:
      - persistentvolumeclaims
      - persistentvolumes
      - secrets
      - configmaps
      - deployments
      - statefulsets
      - services
      - networkpolicies
      - poddisruptionbudgets
      - horizontalpodautoscalers
      - servicemonitors
      - prometheusrules
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: druid
    storageLocation: default
    volumeSnapshotLocations:
      - default
    ttl: 720h  # 30 days
---
apiVersion: velero.io/v1
kind: Backup
metadata:
  name: druid-manual-backup
  namespace: velero
  labels:
    app.kubernetes.io/name: druid
spec:
  includedNamespaces:
    - data-science
  includedResources:
    - persistentvolumeclaims
    - persistentvolumes
    - secrets
    - configmaps
    - deployments
    - statefulsets
    - services
    - networkpolicies
    - poddisruptionbudgets
    - horizontalpodautoscalers
    - servicemonitors
    - prometheusrules
  labelSelector:
    matchLabels:
      app.kubernetes.io/name: druid
  storageLocation: default
  volumeSnapshotLocations:
    - default
  ttl: 720h  # 30 days
---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: druid-metadata-backup-schedule
  namespace: velero
  labels:
    app.kubernetes.io/name: druid
spec:
  schedule: "0 3 * * *"  # Daily at 3 AM
  template:
    includedNamespaces:
      - storage
    includedResources:
      - persistentvolumeclaims
      - persistentvolumes
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: cloudnative-pg
    storageLocation: default
    volumeSnapshotLocations:
      - default
    ttl: 1680h  # 70 days
---
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: druid-deepstorage-backup-schedule
  namespace: velero
  labels:
    app.kubernetes.io/name: druid
spec:
  schedule: "0 4 * * 0"  # Weekly on Sunday at 4 AM
  template:
    includedNamespaces:
      - storage
    includedResources:
      - persistentvolumeclaims
      - persistentvolumes
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: minio
    storageLocation: default
    volumeSnapshotLocations:
      - default
    ttl: 2160h  # 90 days 