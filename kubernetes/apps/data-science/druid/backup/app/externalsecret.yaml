---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: druid-backup-secrets
  namespace: data-science
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: druid-backup-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # S3 backup storage credentials
        S3_ENDPOINT: "http://minio.storage.svc.cluster.local:9000"
        S3_BUCKET: "druid-backups"
        S3_ACCESS_KEY: "{{ .S3_ACCESS_KEY }}"
        S3_SECRET_KEY: "{{ .S3_SECRET_KEY }}"
        S3_REGION: "us-east-1"

        # PostgreSQL metadata backup
        POSTGRES_HOST: "postgres-lb.storage.svc.cluster.local"
        POSTGRES_PORT: "5432"
        POSTGRES_DB: "druid"
        POSTGRES_USER: "{{ .POSTGRES_USER }}"
        POSTGRES_PASSWORD: "{{ .POSTGRES_PASS }}"

        # ZooKeeper backup credentials
        ZK_HOSTS: "druid-zookeeper-0.druid-zookeeper.data-science.svc.cluster.local:2181,druid-zookeeper-1.druid-zookeeper.data-science.svc.cluster.local:2181,druid-zookeeper-2.druid-zookeeper.data-science.svc.cluster.local:2181"

        # Backup encryption
        BACKUP_ENCRYPTION_KEY: "{{ .BACKUP_ENCRYPTION_KEY }}"

        # Notification settings
        SLACK_WEBHOOK_URL: "{{ .SLACK_WEBHOOK_URL }}"
        SMTP_HOST: "smtp-relay.security.svc.cluster.local"
        SMTP_PORT: "25"
        BACKUP_NOTIFICATION_EMAIL: "admin@samcloud.online"

  dataFrom:
    - extract:
        key: s3-credentials
    - extract:
        key: cloudnative-pg
    - extract:
        key: backup-credentials