---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: druid-backup
  namespace: flux-system
spec:
  interval: 10m
  path: ./kubernetes/apps/services/data-science/druid/backup/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: home-ops
  wait: false
  dependsOn:
    - name: druid
      namespace: flux-system
    - name: external-secrets-stores
      namespace: flux-system