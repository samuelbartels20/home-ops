---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickhouse-keeper
  namespace: data-science
spec:
  interval: 15m
  dependsOn:
    - name: clickhouse-operator
      namespace: data-science
  chart:
    spec:
      chart: app-template
      version: 4.1.2
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
      strategy: rollback
  values:
    controllers:
      clickhouse-keeper:
        type: statefulset
        replicas: 3
        strategy: RollingUpdate
        
        containers:
          app:
            image:
              repository: clickhouse/clickhouse-keeper
              tag: 25.5-alpine
              pullPolicy: IfNotPresent
            
            env:
              KEEPER_SERVER_ID:
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.annotations['apps.kubernetes.io/pod-index']
              LOG_LEVEL: "information"
              KEEPER_TCP_PORT: "9181"
              KEEPER_RAFT_PORT: "9234"
              KEEPER_PROMETHEUS_PORT: "7000"
            
            command:
              - /usr/bin/clickhouse-keeper
              - --config-file=/etc/clickhouse-keeper/keeper.xml
            
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &keeperPort 9181
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *keeperPort
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 30
            
            resources:
              requests:
                cpu: 200m
                memory: 512Mi
                ephemeral-storage: 1Gi
              limits:
                cpu: 1
                memory: 2Gi
                ephemeral-storage: 2Gi
            
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
              runAsNonRoot: true
              runAsUser: 101
              runAsGroup: 101

    service:
      app:
        controller: clickhouse-keeper
        type: ClusterIP
        ports:
          keeper:
            port: *keeperPort
            protocol: TCP
          raft:
            port: 9234
            protocol: TCP
          metrics:
            port: 7000
            protocol: TCP

    servicemonitor:
      app:
        serviceName: clickhouse-keeper
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics
            interval: 30s
            scrapeTimeout: 10s

    persistence:
      config:
        enabled: true
        type: configMap
        name: clickhouse-keeper-config
        globalMounts:
          - path: /etc/clickhouse-keeper
            readOnly: true
      
      data:
        enabled: true
        type: persistentVolumeClaim
        size: 10Gi
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /var/lib/clickhouse-keeper
      
      logs:
        enabled: true
        type: persistentVolumeClaim
        size: 5Gi
        storageClass: ceph-block
        accessMode: ReadWriteOnce
        globalMounts:
          - path: /var/log/clickhouse-keeper
      
      tmp:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /tmp

    # Pod security and scheduling
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app.kubernetes.io/name
                    operator: In
                    values: ["clickhouse-keeper"]
              topologyKey: kubernetes.io/hostname
      
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: clickhouse-keeper
      
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7000"
        prometheus.io/path: "/metrics" 