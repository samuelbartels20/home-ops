---
# Performance Tuning ConfigMap for ClickHouse Apps
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-apps-performance-config
  namespace: data-science
  labels:
    app.kubernetes.io/name: clickhouse-apps
    performance.samcloud.online/type: "tuning"
    performance.samcloud.online/level: "optimized"
data:
  # Kernel parameter tuning
  sysctl.conf: |
    # Network performance
    net.core.rmem_max = 134217728
    net.core.wmem_max = 134217728
    net.ipv4.tcp_rmem = 4096 87380 134217728
    net.ipv4.tcp_wmem = 4096 65536 134217728
    net.core.netdev_max_backlog = 5000
    net.ipv4.tcp_congestion_control = bbr
    
    # Memory management
    vm.swappiness = 1
    vm.dirty_ratio = 15
    vm.dirty_background_ratio = 5
    vm.overcommit_memory = 1
    
    # File system
    fs.file-max = 2097152
    fs.nr_open = 2097152
    
  # JVM tuning for Java-based components
  jvm-opts.conf: |
    -XX:+UseG1GC
    -XX:MaxGCPauseMillis=200
    -XX:+UseStringDeduplication
    -XX:+OptimizeStringConcat
    -XX:+UseCompressedOops
    -XX:+UseCompressedClassPointers
    -Xms2g
    -Xmx4g
    -XX:NewRatio=2
    -XX:SurvivorRatio=8
    -XX:+DisableExplicitGC
    -XX:+UseNUMA
    -XX:+AlwaysPreTouch
    
  # ClickHouse performance settings
  clickhouse-performance.xml: |
    <clickhouse>
      <performance>
        <!-- CPU and threading -->
        <max_threads>0</max_threads>
        <max_concurrent_queries>200</max_concurrent_queries>
        <max_concurrent_insert_queries>50</max_concurrent_insert_queries>
        <max_concurrent_select_queries>150</max_concurrent_select_queries>
        
        <!-- Memory management -->
        <max_memory_usage>0</max_memory_usage>
        <max_server_memory_usage>0.8</max_server_memory_usage>
        <max_bytes_before_external_group_by>64000000000</max_bytes_before_external_group_by>
        <max_bytes_before_external_sort>64000000000</max_bytes_before_external_sort>
        
        <!-- Query optimization -->
        <enable_optimize_predicate_expression>1</enable_optimize_predicate_expression>
        <optimize_move_to_prewhere>1</optimize_move_to_prewhere>
        <optimize_trivial_count_query>1</optimize_trivial_count_query>
        <optimize_duplicate_order_by_and_distinct>1</optimize_duplicate_order_by_and_distinct>
        
        <!-- Background operations -->
        <background_pool_size>32</background_pool_size>
        <background_merges_mutations_concurrency_ratio>2</background_merges_mutations_concurrency_ratio>
        <background_schedule_pool_size>128</background_schedule_pool_size>
        <background_fetches_pool_size>16</background_fetches_pool_size>
        <background_move_pool_size>8</background_move_pool_size>
        <background_common_pool_size>8</background_common_pool_size>
        
        <!-- Network and connections -->
        <max_connections>1024</max_connections>
        <keep_alive_timeout>3</keep_alive_timeout>
        <tcp_keep_alive_timeout>0</tcp_keep_alive_timeout>
        <http_receive_timeout>30</http_receive_timeout>
        <http_send_timeout>30</http_send_timeout>
        
        <!-- Compression -->
        <compression>
          <case>
            <method>zstd</method>
            <level>3</level>
          </case>
        </compression>
        
        <!-- Distributed queries -->
        <distributed_directory_monitor_batch_inserts>1</distributed_directory_monitor_batch_inserts>
        <distributed_directory_monitor_split_batch_on_failure>1</distributed_directory_monitor_split_batch_on_failure>
        <insert_distributed_sync>0</insert_distributed_sync>
        <distributed_replica_error_half_life>60</distributed_replica_error_half_life>
        <distributed_replica_max_ignored_errors>0</distributed_replica_max_ignored_errors>
        
        <!-- Merge tree settings -->
        <merge_tree>
          <max_suspicious_broken_parts>10</max_suspicious_broken_parts>
          <parts_to_throw_insert>300</parts_to_throw_insert>
          <parts_to_delay_insert>150</parts_to_delay_insert>
          <max_delay_to_insert>1</max_delay_to_insert>
          <replicated_deduplication_window>100</replicated_deduplication_window>
          <replicated_deduplication_window_seconds>604800</replicated_deduplication_window_seconds>
          <max_replicated_merges_in_queue>1000</max_replicated_merges_in_queue>
          <number_of_free_entries_in_pool_to_lower_max_size_of_merge>8</number_of_free_entries_in_pool_to_lower_max_size_of_merge>
          <max_bytes_to_merge_at_min_space_in_pool>1048576</max_bytes_to_merge_at_min_space_in_pool>
          <max_bytes_to_merge_at_max_space_in_pool>161061273600</max_bytes_to_merge_at_max_space_in_pool>
        </merge_tree>
      </performance>
    </clickhouse>
    
  # Resource limits and requests optimization
  resource-recommendations.yaml: |
    # CPU recommendations based on workload patterns
    cpu:
      operator:
        requests: 200m
        limits: 1000m
      keeper:
        requests: 200m
        limits: 1000m
      backup:
        requests: 100m
        limits: 500m
      monitoring:
        requests: 50m
        limits: 200m
    
    # Memory recommendations
    memory:
      operator:
        requests: 512Mi
        limits: 2Gi
      keeper:
        requests: 512Mi
        limits: 2Gi
      backup:
        requests: 256Mi
        limits: 1Gi
      monitoring:
        requests: 128Mi
        limits: 512Mi
    
    # Storage recommendations
    storage:
      keeper:
        data: 10Gi
        logs: 5Gi
      backup:
        cache: 50Gi
        temp: 20Gi
      monitoring:
        metrics: 100Gi
        logs: 50Gi
---
# Priority Class for ClickHouse Apps
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: clickhouse-apps-priority
  labels:
    app.kubernetes.io/name: clickhouse-apps
    scheduling.samcloud.online/tier: "high"
value: 1000000
globalDefault: false
description: "High priority class for ClickHouse apps ensuring critical data platform services"
---
# Node Affinity Rules
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-apps-affinity-rules
  namespace: data-science
  labels:
    app.kubernetes.io/name: clickhouse-apps
    scheduling.samcloud.online/type: "affinity-rules"
data:
  node-affinity.yaml: |
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: node-role.kubernetes.io/worker
                operator: Exists
              - key: kubernetes.io/arch
                operator: In
                values: ["amd64"]
              - key: node.kubernetes.io/instance-type
                operator: NotIn
                values: ["spot", "preemptible"]
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: node.samcloud.online/workload-type
                operator: In
                values: ["database", "data-intensive"]
        - weight: 50
          preference:
            matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values: ["us-west-2a", "us-west-2b", "us-west-2c"]
  
  pod-affinity.yaml: |
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/part-of
                  operator: In
                  values: ["data-platform"]
            topologyKey: kubernetes.io/hostname
    
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: ["clickhouse-operator", "clickhouse-keeper"]
          topologyKey: kubernetes.io/hostname 