---
# Disaster Recovery Plan ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-apps-disaster-recovery
  namespace: data-science
  labels:
    app.kubernetes.io/name: clickhouse-apps
    disaster-recovery.samcloud.online/type: "configuration"
    disaster-recovery.samcloud.online/rto: "4h"
    disaster-recovery.samcloud.online/rpo: "15m"
data:
  disaster-recovery-plan.yaml: |
    disaster_recovery:
      # Recovery Time Objective (RTO): 4 hours
      # Recovery Point Objective (RPO): 15 minutes
      
      backup_strategy:
        # Full backups
        full_backup:
          frequency: "daily"
          time: "02:00"
          retention: "30d"
          compression: "zstd"
          encryption: true
          
        # Incremental backups
        incremental_backup:
          frequency: "15m"
          retention: "7d"
          compression: "zstd"
          encryption: true
          
        # Transaction log backups
        log_backup:
          frequency: "5m"
          retention: "3d"
          encryption: true
      
      recovery_procedures:
        # Point-in-time recovery
        point_in_time:
          max_recovery_window: "72h"
          granularity: "1m"
          
        # Cross-region replication
        cross_region:
          enabled: true
          regions: ["us-west-2", "us-east-1"]
          sync_frequency: "5m"
          
        # Multi-cluster setup
        multi_cluster:
          primary_cluster: "production"
          secondary_clusters: ["disaster-recovery", "staging"]
          failover_time: "15m"
      
      monitoring:
        backup_health_checks:
          frequency: "5m"
          alerts:
            - backup_failure
            - backup_delay
            - storage_full
        
        recovery_testing:
          frequency: "weekly"
          automated: true
          validation_queries: true
  
  recovery-scripts.sh: |
    #!/bin/bash
    set -euo pipefail
    
    # ClickHouse Disaster Recovery Scripts
    
    # Function to perform backup validation
    validate_backup() {
        local backup_path=$1
        echo "Validating backup at: $backup_path"
        
        # Check backup integrity
        clickhouse-backup list --config /etc/clickhouse-backup/config.yml
        
        # Verify backup completeness
        clickhouse-backup check $backup_path
        
        echo "Backup validation completed successfully"
    }
    
    # Function to restore from backup
    restore_from_backup() {
        local backup_name=$1
        local target_cluster=$2
        
        echo "Starting restore process..."
        echo "Backup: $backup_name"
        echo "Target cluster: $target_cluster"
        
        # Stop ClickHouse service
        kubectl scale statefulset clickhouse-cluster --replicas=0 -n data-science
        
        # Wait for pods to terminate
        kubectl wait --for=delete pod -l app.kubernetes.io/name=clickhouse -n data-science --timeout=300s
        
        # Restore data
        clickhouse-backup restore $backup_name --config /etc/clickhouse-backup/config.yml
        
        # Start ClickHouse service
        kubectl scale statefulset clickhouse-cluster --replicas=3 -n data-science
        
        # Wait for cluster to be ready
        kubectl wait --for=condition=ready pod -l app.kubernetes.io/name=clickhouse -n data-science --timeout=600s
        
        echo "Restore process completed successfully"
    }
    
    # Function to perform failover
    perform_failover() {
        local primary_cluster=$1
        local secondary_cluster=$2
        
        echo "Initiating failover from $primary_cluster to $secondary_cluster"
        
        # Update DNS records
        kubectl patch service clickhouse-cluster -n data-science -p '{"spec":{"selector":{"cluster":"'$secondary_cluster'"}}}'
        
        # Update application configurations
        kubectl patch configmap clickhouse-config -n data-science --patch '{"data":{"cluster":"'$secondary_cluster'"}}'
        
        # Restart applications
        kubectl rollout restart deployment -l app.kubernetes.io/part-of=data-platform -n data-science
        
        echo "Failover completed successfully"
    }
    
    # Function to test disaster recovery
    test_disaster_recovery() {
        echo "Starting disaster recovery test..."
        
        # Create test backup
        TEST_BACKUP="dr-test-$(date +%Y%m%d-%H%M%S)"
        clickhouse-backup create $TEST_BACKUP --config /etc/clickhouse-backup/config.yml
        
        # Validate backup
        validate_backup $TEST_BACKUP
        
        # Simulate restore (dry run)
        clickhouse-backup restore $TEST_BACKUP --dry-run --config /etc/clickhouse-backup/config.yml
        
        # Clean up test backup
        clickhouse-backup delete local $TEST_BACKUP --config /etc/clickhouse-backup/config.yml
        
        echo "Disaster recovery test completed successfully"
    }
    
    # Main execution
    case "${1:-}" in
        validate)
            validate_backup "${2:-}"
            ;;
        restore)
            restore_from_backup "${2:-}" "${3:-production}"
            ;;
        failover)
            perform_failover "${2:-production}" "${3:-disaster-recovery}"
            ;;
        test)
            test_disaster_recovery
            ;;
        *)
            echo "Usage: $0 {validate|restore|failover|test} [arguments...]"
            echo "  validate <backup_path>                    - Validate backup integrity"
            echo "  restore <backup_name> [target_cluster]   - Restore from backup"
            echo "  failover <primary> <secondary>           - Perform cluster failover"
            echo "  test                                      - Test disaster recovery procedures"
            exit 1
            ;;
    esac

  monitoring-queries.sql: |
    -- ClickHouse Disaster Recovery Monitoring Queries
    
    -- Check replication lag
    SELECT 
        database,
        table,
        replica_name,
        log_max_index - log_pointer as replication_lag,
        last_queue_update,
        absolute_delay
    FROM system.replicas
    WHERE is_leader = 0
    ORDER BY replication_lag DESC;
    
    -- Check backup status
    SELECT 
        backup_name,
        status,
        start_time,
        end_time,
        duration,
        size_compressed,
        files_count
    FROM system.backup_log
    WHERE start_time >= now() - INTERVAL 24 HOUR
    ORDER BY start_time DESC;
    
    -- Check cluster health
    SELECT 
        cluster,
        shard_num,
        replica_num,
        host_name,
        port,
        is_local,
        user,
        errors_count,
        slowdowns_count,
        estimated_recovery_time
    FROM system.clusters;
    
    -- Check disk usage
    SELECT 
        name,
        path,
        formatReadableSize(free_space) as free_space,
        formatReadableSize(total_space) as total_space,
        round(free_space / total_space * 100, 2) as free_space_percent
    FROM system.disks
    ORDER BY free_space_percent ASC;
---
# Backup Validation CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: clickhouse-backup-validation
  namespace: data-science
  labels:
    app.kubernetes.io/name: clickhouse-apps
    disaster-recovery.samcloud.online/type: "validation"
spec:
  schedule: "0 3 * * *"  # Daily at 3 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
          containers:
            - name: backup-validator
              image: altinity/clickhouse-backup:2.4.25
              command: ["/bin/sh"]
              args:
                - -c
                - |
                  echo "Starting backup validation..."
                  clickhouse-backup list
                  LATEST_BACKUP=$(clickhouse-backup list | grep -E '^[0-9]' | tail -1 | awk '{print $1}')
                  if [ -n "$LATEST_BACKUP" ]; then
                    echo "Validating latest backup: $LATEST_BACKUP"
                    clickhouse-backup check $LATEST_BACKUP
                    echo "Backup validation completed successfully"
                  else
                    echo "No backups found to validate"
                    exit 1
                  fi
              env:
                - name: CLICKHOUSE_HOST
                  value: "clickhouse-cluster.data-science.svc.cluster.local"
                - name: CLICKHOUSE_PORT
                  value: "9000"
              volumeMounts:
                - name: backup-config
                  mountPath: /etc/clickhouse-backup
                  readOnly: true
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 1Gi
          volumes:
            - name: backup-config
              configMap:
                name: clickhouse-backup-config
---
# Disaster Recovery Test CronJob
apiVersion: batch/v1
kind: CronJob
metadata:
  name: clickhouse-dr-test
  namespace: data-science
  labels:
    app.kubernetes.io/name: clickhouse-apps
    disaster-recovery.samcloud.online/type: "testing"
spec:
  schedule: "0 4 * * 0"  # Weekly on Sunday at 4 AM
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            fsGroup: 65534
          containers:
            - name: dr-tester
              image: altinity/clickhouse-backup:2.4.25
              command: ["/bin/sh"]
              args:
                - -c
                - |
                  echo "Starting disaster recovery test..."
                  TEST_BACKUP="dr-test-$(date +%Y%m%d-%H%M%S)"
                  
                  # Create test backup
                  clickhouse-backup create $TEST_BACKUP
                  
                  # Validate backup
                  clickhouse-backup check $TEST_BACKUP
                  
                  # Test restore (dry run)
                  clickhouse-backup restore $TEST_BACKUP --dry-run
                  
                  # Clean up
                  clickhouse-backup delete local $TEST_BACKUP
                  
                  echo "Disaster recovery test completed successfully"
              env:
                - name: CLICKHOUSE_HOST
                  value: "clickhouse-cluster.data-science.svc.cluster.local"
                - name: CLICKHOUSE_PORT
                  value: "9000"
              volumeMounts:
                - name: backup-config
                  mountPath: /etc/clickhouse-backup
                  readOnly: true
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: 1
                  memory: 2Gi
          volumes:
            - name: backup-config
              configMap:
                name: clickhouse-backup-config 