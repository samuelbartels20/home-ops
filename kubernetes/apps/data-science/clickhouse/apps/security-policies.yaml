---
# Pod Security Policy for ClickHouse Apps
apiVersion: policy/v1beta1
kind: PodSecurityPolicy
metadata:
  name: clickhouse-apps-restricted
  namespace: data-science
  labels:
    app.kubernetes.io/name: clickhouse-apps
    security.samcloud.online/level: "restricted"
    compliance.samcloud.online/frameworks: "gdpr,sox,pci-dss,iso-27001"
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  allowedCapabilities: []
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'
    - 'csi'
  hostNetwork: false
  hostIPC: false
  hostPID: false
  runAsUser:
    rule: 'MustRunAsNonRoot'
    ranges:
      - min: 101
        max: 65534
  runAsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 101
        max: 65534
  supplementalGroups:
    rule: 'MustRunAs'
    ranges:
      - min: 101
        max: 65534
  fsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 101
        max: 65534
  readOnlyRootFilesystem: true
  seLinux:
    rule: 'RunAsAny'
  seccompProfile:
    type: RuntimeDefault
  allowedProcMountTypes:
    - Default
  forbiddenSysctls:
    - '*'
---
# Security Context Constraints for OpenShift (if applicable)
apiVersion: security.openshift.io/v1
kind: SecurityContextConstraints
metadata:
  name: clickhouse-apps-restricted
  labels:
    app.kubernetes.io/name: clickhouse-apps
    security.samcloud.online/level: "restricted"
allowHostDirVolumePlugin: false
allowHostIPC: false
allowHostNetwork: false
allowHostPID: false
allowHostPorts: false
allowPrivilegedContainer: false
allowedCapabilities: []
defaultAddCapabilities: []
requiredDropCapabilities:
  - ALL
fsGroup:
  type: MustRunAs
  ranges:
    - min: 101
      max: 65534
readOnlyRootFilesystem: true
runAsUser:
  type: MustRunAsNonRoot
seLinuxContext:
  type: MustRunAs
supplementalGroups:
  type: MustRunAs
  ranges:
    - min: 101
      max: 65534
volumes:
  - configMap
  - downwardAPI
  - emptyDir
  - persistentVolumeClaim
  - projected
  - secret
  - csi
---
# Network Security Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickhouse-apps-security-netpol
  namespace: data-science
  labels:
    app.kubernetes.io/name: clickhouse-apps
    security.samcloud.online/level: "restricted"
    security.samcloud.online/type: "default-deny"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: data-platform
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow monitoring traffic
    - from:
        - namespaceSelector:
            matchLabels:
              name: observability
      ports:
        - protocol: TCP
          port: 7000
        - protocol: TCP
          port: 8080
        - protocol: TCP
          port: 9090
  egress:
    # Allow DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Allow NTP
    - to: []
      ports:
        - protocol: UDP
          port: 123
    # Allow HTTPS
    - to: []
      ports:
        - protocol: TCP
          port: 443
---
# Resource Quota for ClickHouse Apps
apiVersion: v1
kind: ResourceQuota
metadata:
  name: clickhouse-apps-quota
  namespace: data-science
  labels:
    app.kubernetes.io/name: clickhouse-apps
    resource-management.samcloud.online/type: "quota"
spec:
  hard:
    # Compute resources
    requests.cpu: "10"
    requests.memory: "20Gi"
    limits.cpu: "20"
    limits.memory: "40Gi"
    requests.ephemeral-storage: "50Gi"
    limits.ephemeral-storage: "100Gi"
    
    # Storage resources
    persistentvolumeclaims: "20"
    requests.storage: "500Gi"
    
    # Object counts
    pods: "50"
    services: "20"
    secrets: "50"
    configmaps: "50"
    
    # Networking
    services.loadbalancers: "5"
    services.nodeports: "10"
---
# Limit Range for ClickHouse Apps
apiVersion: v1
kind: LimitRange
metadata:
  name: clickhouse-apps-limits
  namespace: data-science
  labels:
    app.kubernetes.io/name: clickhouse-apps
    resource-management.samcloud.online/type: "limits"
spec:
  limits:
    # Default limits for containers
    - default:
        cpu: "2"
        memory: "4Gi"
        ephemeral-storage: "10Gi"
      defaultRequest:
        cpu: "100m"
        memory: "256Mi"
        ephemeral-storage: "1Gi"
      type: Container
    
    # Limits for PVCs
    - max:
        storage: "1Ti"
      min:
        storage: "1Gi"
      type: PersistentVolumeClaim
    
    # Pod limits
    - max:
        cpu: "8"
        memory: "16Gi"
        ephemeral-storage: "50Gi"
      min:
        cpu: "50m"
        memory: "128Mi"
        ephemeral-storage: "500Mi"
      type: Pod 