apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: clickhouse-operator
  namespace: data-science
spec:
  interval: 5m
  chart:
    spec:
      chart: clickhouse-operator
      version: 0.19.0
      sourceRef:
        kind: HelmRepository
        name: altinity-clickhouse
        namespace: flux-system
      interval: 1h
  install:
    remediation:
      retries: 3
    createNamespace: true
  upgrade:
    remediation:
      retries: 3
    force: false
  values:
    fullnameOverride: clickhouse-operator
    watchNamespaces:
      - data-science
    
    image:
      repository: altinity/clickhouse-operator
      tag: 0.25.1
      pullPolicy: IfNotPresent
    
    # Enhanced resource allocation
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
        ephemeral-storage: 1Gi
      limits:
        cpu: 1
        memory: 2Gi
        ephemeral-storage: 2Gi
    
    # Security configuration
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
    
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 65534
      runAsGroup: 65534
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault
    
    # Service account configuration
    serviceAccount:
      create: false
      name: clickhouse-operator
    
    # Enhanced metrics and monitoring
    metrics:
      enabled: true
      port: 8080
      serviceMonitor:
        enabled: true
        namespace: data-science
        additionalLabels:
          release: prometheus-operator
          monitoring.samcloud.online/level: "enhanced"
        interval: 30s
        scrapeTimeout: 10s
        metricRelabelings:
          - sourceLabels: [__name__]
            regex: 'clickhouse_operator_.*'
            action: keep
    
    # Webhook configuration
    webhook:
      enabled: true
      port: 9443
      certManager:
        enabled: true
        issuer: letsencrypt-prod
    
    # Performance and reliability
    nodeSelector:
      node-role.kubernetes.io/worker: "true"
    
    tolerations:
      - key: "node.samcloud.online/workload-type"
        operator: "Equal"
        value: "database"
        effect: "NoSchedule"
    
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: kubernetes.io/arch
                  operator: In
                  values: ["amd64"]
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node.samcloud.online/workload-type
                  operator: In
                  values: ["database", "data-intensive"]
    
    # Pod disruption budget
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    
    # Probes configuration
    livenessProbe:
      httpGet:
        path: /metrics
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    
    readinessProbe:
      httpGet:
        path: /metrics
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    
    # Enhanced configuration
    config:
      # Operator configuration
      clickhouse:
        configuration:
          users:
            profiles:
              default:
                max_memory_usage: "10000000000"
                use_uncompressed_cache: "0"
                load_balancing: "random"
                max_execution_time: "600"
              readonly:
                readonly: "1"
                max_memory_usage: "5000000000"
                max_execution_time: "300"
          
          settings:
            # Performance settings
            max_concurrent_queries: 200
            max_thread_pool_size: 20000
            max_connections: 1024
            
            # Memory settings
            max_server_memory_usage: 0.8
            max_server_memory_usage_to_ram_ratio: 0.8
            
            # Logging
            log_queries: 1
            log_query_threads: 1
            send_crash_reports: 0
            
            # Security
            max_table_size_to_drop: 1000000000000
            max_partition_size_to_drop: 1000000000000
