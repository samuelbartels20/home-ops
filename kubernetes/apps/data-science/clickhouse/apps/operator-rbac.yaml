---
# ServiceAccount for ClickHouse Operator
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clickhouse-operator
  namespace: data-science
  labels:
    app.kubernetes.io/name: clickhouse-operator
    security.samcloud.online/level: "restricted"
  annotations:
    samcloud.online/audit-logging: "enabled"
    samcloud.online/security-review: "2024-01-15"
automountServiceAccountToken: true
---
# ClusterRole for ClickHouse Operator
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: clickhouse-operator
  labels:
    app.kubernetes.io/name: clickhouse-operator
    security.samcloud.online/level: "restricted"
rules:
  # ClickHouse Custom Resources
  - apiGroups: ["clickhouse.altinity.com"]
    resources: ["*"]
    verbs: ["*"]
  
  # Core Kubernetes Resources (minimal required)
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "persistentvolumeclaims", "events", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  
  # Apps resources
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  
  # Policy resources for security
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  
  # Monitoring resources
  - apiGroups: ["monitoring.coreos.com"]
    resources: ["servicemonitors", "prometheusrules"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  
  # Networking resources
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  
  # Certificate management
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "issuers", "clusterissuers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  
  # Node information for scheduling
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]
  
  # Namespace management
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
---
# ClusterRoleBinding for ClickHouse Operator
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: clickhouse-operator
  labels:
    app.kubernetes.io/name: clickhouse-operator
    security.samcloud.online/level: "restricted"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: clickhouse-operator
subjects:
  - kind: ServiceAccount
    name: clickhouse-operator
    namespace: data-science
---
# Role for namespace-specific operations
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: clickhouse-operator-namespace
  namespace: data-science
  labels:
    app.kubernetes.io/name: clickhouse-operator
    security.samcloud.online/level: "restricted"
rules:
  # Enhanced permissions within the namespace
  - apiGroups: [""]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["apps"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["extensions"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["policy"]
    resources: ["*"]
    verbs: ["*"]
  - apiGroups: ["autoscaling"]
    resources: ["*"]
    verbs: ["*"]
---
# RoleBinding for namespace operations
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clickhouse-operator-namespace
  namespace: data-science
  labels:
    app.kubernetes.io/name: clickhouse-operator
    security.samcloud.online/level: "restricted"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: clickhouse-operator-namespace
subjects:
  - kind: ServiceAccount
    name: clickhouse-operator
    namespace: data-science 