---
# ClickHouse Disaster Recovery - Production Grade
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-disaster-recovery-plan
  namespace: data-science
  labels:
    app.kubernetes.io/name: clickhouse
    dr.samcloud.online/type: "disaster-recovery"
data:
  disaster-recovery-plan.yaml: |
    # ClickHouse Disaster Recovery Plan
    disaster_recovery:
      # Recovery Time Objectives (RTO)
      rto:
        critical_systems: "1_hour"
        important_systems: "4_hours"
        standard_systems: "8_hours"
      
      # Recovery Point Objectives (RPO)
      rpo:
        critical_data: "5_minutes"
        important_data: "15_minutes"
        standard_data: "1_hour"
      
      # Business Impact Analysis
      business_impact:
        critical:
          - "Real-time analytics dashboards"
          - "Financial reporting systems"
          - "Customer-facing applications"
          - "Compliance reporting"
        
        important:
          - "Historical data analysis"
          - "Business intelligence reports"
          - "Internal analytics"
        
        standard:
          - "Archive data"
          - "Development/test environments"
          - "Non-critical reporting"
      
      # Recovery Procedures
      recovery_procedures:
        # Automated recovery steps
        automated:
          - step: "Validate backup integrity"
            command: "clickhouse-backup verify"
            timeout: "10m"
          
          - step: "Restore from latest backup"
            command: "clickhouse-backup restore"
            timeout: "30m"
          
          - step: "Verify data consistency"
            command: "clickhouse-client --query 'SELECT count() FROM system.tables'"
            timeout: "5m"
          
          - step: "Start replication"
            command: "clickhouse-client --query 'SYSTEM START REPLICATED SENDS'"
            timeout: "2m"
        
        # Manual recovery steps
        manual:
          - step: "Assess damage scope"
            description: "Determine which shards/replicas are affected"
            estimated_time: "15m"
          
          - step: "Coordinate with stakeholders"
            description: "Notify business units of recovery timeline"
            estimated_time: "30m"
          
          - step: "Validate business continuity"
            description: "Ensure critical business processes can continue"
            estimated_time: "1h"
      
      # Communication Plan
      communication:
        escalation_matrix:
          level_1:
            - role: "SRE On-Call"
              contact: "sre-oncall@samcloud.online"
              response_time: "15m"
          
          level_2:
            - role: "Data Platform Lead"
              contact: "data-platform@samcloud.online"
              response_time: "30m"
          
          level_3:
            - role: "CTO"
              contact: "cto@samcloud.online"
              response_time: "1h"
        
        notification_channels:
          - type: "PagerDuty"
            priority: "P1"
            escalation_policy: "data-platform-critical"
          
          - type: "Slack"
            channel: "#incidents-data-platform"
            mention: "@here"
          
          - type: "Email"
            recipients: ["data-platform@samcloud.online", "cto@samcloud.online"]
---
# Enhanced Backup Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-backup-enhanced
  namespace: data-science
  labels:
    app.kubernetes.io/name: clickhouse
    backup.samcloud.online/type: "enhanced-backup"
data:
  backup-config.yaml: |
    # Enhanced ClickHouse Backup Configuration
    backup:
      # Backup strategies
      strategies:
        # Full backup strategy
        full:
          schedule: "0 2 * * 0"  # Weekly on Sunday at 2 AM
          retention: "30_days"
          compression: "zstd"
          encryption: "aes-256-gcm"
          verification: true
          parallel_jobs: 4
        
        # Incremental backup strategy
        incremental:
          schedule: "0 2 * * 1-6"  # Daily at 2 AM (Mon-Sat)
          retention: "7_days"
          compression: "zstd"
          encryption: "aes-256-gcm"
          verification: true
          parallel_jobs: 2
        
        # Continuous backup strategy
        continuous:
          schedule: "*/15 * * * *"  # Every 15 minutes
          retention: "24_hours"
          compression: "lz4"
          encryption: "aes-256-gcm"
          verification: false
          parallel_jobs: 1
      
      # Storage destinations
      destinations:
        # Primary storage (S3-compatible)
        primary:
          type: "s3"
          endpoint: "http://192.168.8.102:9000"
          bucket: "clickhouse-backups"
          region: "us-east-1"
          access_key: "${S3_ACCESS_KEY}"
          secret_key: "${S3_SECRET_KEY}"
          encryption: "sse-s3"
          lifecycle:
            transition_days: 30
            expiration_days: 90
        
        # Secondary storage (offsite)
        secondary:
          type: "s3"
          endpoint: "https://backup-secondary.samcloud.online"
          bucket: "clickhouse-backups-secondary"
          region: "us-west-2"
          access_key: "${S3_SECONDARY_ACCESS_KEY}"
          secret_key: "${S3_SECONDARY_SECRET_KEY}"
          encryption: "sse-s3"
          lifecycle:
            transition_days: 90
            expiration_days: 2555  # 7 years
        
        # Local storage (for quick recovery)
        local:
          type: "filesystem"
          path: "/var/lib/clickhouse/backup"
          retention: "7_days"
      
      # Backup verification
      verification:
        enabled: true
        schedule: "0 4 * * 0"  # Weekly verification
        methods:
          - type: "checksum"
            algorithm: "sha256"
          
          - type: "restore_test"
            schedule: "0 6 * * 0"  # Weekly restore test
            timeout: "2h"
            cleanup: true
          
          - type: "data_integrity"
            queries:
              - "SELECT count() FROM system.tables"
              - "SELECT count() FROM system.parts"
              - "SELECT count() FROM system.replicas"
      
      # Monitoring and alerting
      monitoring:
        metrics:
          - name: "backup_duration_seconds"
            type: "histogram"
            labels: ["strategy", "destination"]
          
          - name: "backup_size_bytes"
            type: "gauge"
            labels: ["strategy", "destination"]
          
          - name: "backup_success_total"
            type: "counter"
            labels: ["strategy", "destination"]
          
          - name: "backup_failure_total"
            type: "counter"
            labels: ["strategy", "destination", "error_type"]
        
        alerts:
          - name: "backup_failed"
            condition: "backup_failure_total > 0"
            severity: "critical"
            notification: "immediate"
          
          - name: "backup_duration_high"
            condition: "backup_duration_seconds > 3600"
            severity: "warning"
            notification: "delayed"
          
          - name: "backup_size_anomaly"
            condition: "backup_size_bytes > avg(backup_size_bytes[7d]) * 2"
            severity: "warning"
            notification: "delayed"
---
# Business Continuity Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-business-continuity
  namespace: data-science
  labels:
    app.kubernetes.io/name: clickhouse
    bcp.samcloud.online/type: "business-continuity"
data:
  business-continuity.yaml: |
    # ClickHouse Business Continuity Plan
    business_continuity:
      # Critical business functions
      critical_functions:
        - name: "Real-time Analytics"
          description: "Customer-facing analytics dashboards"
          rto: "1_hour"
          rpo: "5_minutes"
          priority: "P0"
        
        - name: "Financial Reporting"
          description: "Financial data processing and reporting"
          rto: "2_hours"
          rpo: "15_minutes"
          priority: "P1"
        
        - name: "Compliance Reporting"
          description: "Regulatory compliance data and reports"
          rto: "4_hours"
          rpo: "1_hour"
          priority: "P1"
      
      # Recovery procedures by priority
      recovery_procedures:
        p0_critical:
          - step: "Immediate failover to DR site"
            estimated_time: "15m"
            automation: "fully_automated"
          
          - step: "Validate data integrity"
            estimated_time: "30m"
            automation: "semi_automated"
          
          - step: "Notify stakeholders"
            estimated_time: "5m"
            automation: "automated"
        
        p1_important:
          - step: "Assess impact and scope"
            estimated_time: "30m"
            automation: "manual"
          
          - step: "Execute recovery plan"
            estimated_time: "2h"
            automation: "semi_automated"
          
          - step: "Validate business functions"
            estimated_time: "1h"
            automation: "manual"
        
        p2_standard:
          - step: "Schedule recovery window"
            estimated_time: "4h"
            automation: "manual"
          
          - step: "Execute standard recovery"
            estimated_time: "4h"
            automation: "semi_automated"
      
      # Communication and escalation
      communication:
        stakeholders:
          - role: "Business Stakeholders"
            contact: "business-continuity@samcloud.online"
            notification: "immediate"
          
          - role: "Technical Teams"
            contact: "data-platform@samcloud.online"
            notification: "immediate"
          
          - role: "Executive Leadership"
            contact: "executive-alerts@samcloud.online"
            notification: "within_1_hour"
        
        status_updates:
          frequency: "every_30_minutes"
          channels:
            - "Slack: #incidents-data-platform"
            - "Email: data-platform-status@samcloud.online"
            - "Status page: status.samcloud.online"
      
      # Testing and validation
      testing:
        schedule:
          - type: "Tabletop Exercise"
            frequency: "quarterly"
            participants: ["SRE", "Data Platform", "Business Stakeholders"]
          
          - type: "Technical Recovery Test"
            frequency: "monthly"
            participants: ["SRE", "Data Platform"]
          
          - type: "Full DR Test"
            frequency: "semi_annually"
            participants: ["All Teams"]
        
        success_criteria:
          - "RTO achieved within target"
          - "RPO achieved within target"
          - "Data integrity validated"
          - "Business functions operational"
          - "Performance within acceptable limits"
---
# Recovery Automation Scripts
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-recovery-scripts
  namespace: data-science
  labels:
    app.kubernetes.io/name: clickhouse
    automation.samcloud.online/type: "recovery-scripts"
data:
  recovery-scripts.sh: |
    #!/bin/bash
    # ClickHouse Recovery Automation Scripts
    
    set -euo pipefail
    
    # Configuration
    CLICKHOUSE_HOST="${CLICKHOUSE_HOST:-clickhouse-cluster.clickhouse.svc.cluster.local}"
    CLICKHOUSE_PORT="${CLICKHOUSE_PORT:-8123}"
    CLICKHOUSE_USER="${CLICKHOUSE_USER:-admin}"
    CLICKHOUSE_PASSWORD="${CLICKHOUSE_PASSWORD:-}"
    BACKUP_BUCKET="${BACKUP_BUCKET:-clickhouse-backups}"
    BACKUP_ENDPOINT="${BACKUP_ENDPOINT:-http://192.168.8.102:9000}"
    
    # Logging
    LOG_FILE="/var/log/clickhouse-recovery.log"
    
    log() {
        echo "$(date '+%Y-%m-%d %H:%M:%S') - $1" | tee -a "$LOG_FILE"
    }
    
    # Function: Validate backup integrity
    validate_backup() {
        local backup_name="$1"
        log "Validating backup: $backup_name"
        
        # Download backup metadata
        aws s3 cp "s3://$BACKUP_BUCKET/$backup_name/metadata.json" /tmp/metadata.json \
            --endpoint-url "$BACKUP_ENDPOINT"
        
        # Verify checksums
        local expected_checksum=$(jq -r '.checksum' /tmp/metadata.json)
        local actual_checksum=$(aws s3 cp "s3://$BACKUP_BUCKET/$backup_name/data.tar.gz" - \
            --endpoint-url "$BACKUP_ENDPOINT" | sha256sum | cut -d' ' -f1)
        
        if [[ "$expected_checksum" == "$actual_checksum" ]]; then
            log "Backup validation successful"
            return 0
        else
            log "Backup validation failed"
            return 1
        fi
    }
    
    # Function: Restore from backup
    restore_backup() {
        local backup_name="$1"
        log "Starting restore from backup: $backup_name"
        
        # Stop ClickHouse if running
        clickhouse-client --host="$CLICKHOUSE_HOST" --port="$CLICKHOUSE_PORT" \
            --user="$CLICKHOUSE_USER" --password="$CLICKHOUSE_PASSWORD" \
            --query="SYSTEM STOP MERGES" || true
        
        # Download and extract backup
        aws s3 cp "s3://$BACKUP_BUCKET/$backup_name/data.tar.gz" /tmp/backup.tar.gz \
            --endpoint-url "$BACKUP_ENDPOINT"
        
        tar -xzf /tmp/backup.tar.gz -C /var/lib/clickhouse/
        
        # Restart ClickHouse
        clickhouse-client --host="$CLICKHOUSE_HOST" --port="$CLICKHOUSE_PORT" \
            --user="$CLICKHOUSE_USER" --password="$CLICKHOUSE_PASSWORD" \
            --query="SYSTEM START MERGES" || true
        
        log "Restore completed successfully"
    }
    
    # Function: Verify data integrity
    verify_data_integrity() {
        log "Verifying data integrity"
        
        # Check system tables
        local table_count=$(clickhouse-client --host="$CLICKHOUSE_HOST" --port="$CLICKHOUSE_PORT" \
            --user="$CLICKHOUSE_USER" --password="$CLICKHOUSE_PASSWORD" \
            --query="SELECT count() FROM system.tables")
        
        if [[ "$table_count" -gt 0 ]]; then
            log "Data integrity verification successful: $table_count tables found"
            return 0
        else
            log "Data integrity verification failed: no tables found"
            return 1
        fi
    }
    
    # Function: Start replication
    start_replication() {
        log "Starting replication"
        
        clickhouse-client --host="$CLICKHOUSE_HOST" --port="$CLICKHOUSE_PORT" \
            --user="$CLICKHOUSE_USER" --password="$CLICKHOUSE_PASSWORD" \
            --query="SYSTEM START REPLICATED SENDS" || true
        
        clickhouse-client --host="$CLICKHOUSE_HOST" --port="$CLICKHOUSE_PORT" \
            --user="$CLICKHOUSE_USER" --password="$CLICKHOUSE_PASSWORD" \
            --query="SYSTEM START REPLICATED FETCHES" || true
        
        log "Replication started"
    }
    
    # Main recovery function
    main() {
        local backup_name="${1:-}"
        
        if [[ -z "$backup_name" ]]; then
            log "Error: Backup name not provided"
            exit 1
        fi
        
        log "Starting ClickHouse recovery process"
        
        # Step 1: Validate backup
        if ! validate_backup "$backup_name"; then
            log "Error: Backup validation failed"
            exit 1
        fi
        
        # Step 2: Restore from backup
        if ! restore_backup "$backup_name"; then
            log "Error: Backup restore failed"
            exit 1
        fi
        
        # Step 3: Verify data integrity
        if ! verify_data_integrity; then
            log "Error: Data integrity verification failed"
            exit 1
        fi
        
        # Step 4: Start replication
        start_replication
        
        log "ClickHouse recovery completed successfully"
    }
    
    # Execute main function with arguments
    main "$@" 