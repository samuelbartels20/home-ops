---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clickhouse-cluster
  namespace: data-science
  annotations:
    external-dns.alpha.kubernetes.io/target: "external.samcloud.online"

    # TLS and security
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"

    # Authentication via Authelia
    nginx.ingress.kubernetes.io/auth-url: "http://authelia.security.svc.cluster.local/api/verify"
    nginx.ingress.kubernetes.io/auth-signin: "https://auth.samcloud.online"
    nginx.ingress.kubernetes.io/auth-response-headers: "Remote-User,Remote-Name,Remote-Email,Remote-Groups"

    # Rate limiting
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"

    # Proxy settings for long-running queries
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"

    # Security headers
    nginx.ingress.kubernetes.io/server-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
spec:
  ingressClassName: external
  tls:
    - hosts:
        - &host "clickhouse.samcloud.online"
      secretName: clickhouse-server-tls
  rules:
    - host: *host
      http:
        paths:
          # HTTP interface for queries
          - path: /
            pathType: Prefix
            backend:
              service:
                name: clickhouse-cluster
                port:
                  number: 8123
---
# Internal ingress for cluster communication (no auth)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: clickhouse-cluster-internal
  namespace: clickhouse
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    # Allow larger payloads for bulk inserts
    nginx.ingress.kubernetes.io/proxy-body-size: "1g"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
spec:
  ingressClassName: internal
  rules:
    - host: "clickhouse-internal.samcloud.online"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: clickhouse-cluster
                port:
                  number: 8123