---
apiVersion: pod-security.kubernetes.io/v1
kind: PodSecurityPolicy
metadata:
  name: clickhouse-restricted
  namespace: data-science
  labels:
    app.kubernetes.io/name: clickhouse
    security.samcloud.online/level: "restricted"
    compliance.samcloud.online/frameworks: "gdpr,sox,pci-dss,iso-27001"
spec:
  privileged: false
  allowPrivilegeEscalation: false
  requiredDropCapabilities:
    - ALL
  volumes:
    - 'configMap'
    - 'emptyDir'
    - 'projected'
    - 'secret'
    - 'downwardAPI'
    - 'persistentVolumeClaim'
    - 'csi'
  hostNetwork: false
  hostIPC: false
  hostPID: false
  runAsUser:
    rule: 'MustRunAsNonRoot'
    ranges:
      - min: 101
        max: 101
  runAsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 101
        max: 101
  supplementalGroups:
    rule: 'MustRunAs'
    ranges:
      - min: 101
        max: 101
  fsGroup:
    rule: 'MustRunAs'
    ranges:
      - min: 101
        max: 101
  readOnlyRootFilesystem: false
  seLinux:
    rule: 'RunAsAny'
  seccompProfile:
    type: RuntimeDefault
  allowedProcMountTypes:
    - Default 