---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: clickhouse-cluster
  namespace: data-science

resources:
  - helmrelease.yaml
  - networkpolicy.yaml
  - prometheusrule.yaml
  - podmonitor.yaml
  - ingress.yaml
  - certificate.yaml
  - externalsecret.yaml
  - hyperscale-config.yaml
  - observability-enhanced.yaml
  - disaster-recovery.yaml
  - compliance-governance.yaml
  - performance-optimization.yaml
  # Security and RBAC resources
  - pod-security-policy.yaml
  - service-account.yaml
  - rbac-role.yaml
  - rbac-rolebinding.yaml
  - rbac-clusterrole.yaml
  - rbac-clusterrolebinding.yaml
  - pod-security-configuration.yaml
  - security-configmap.yaml
  - security-networkpolicy.yaml
  - pod-disruption-budget.yaml
  - resource-quota.yaml
  - limit-range.yaml

commonLabels:
  app.kubernetes.io/name: clickhouse
  app.kubernetes.io/instance: production
  app.kubernetes.io/version: "25.5"
  app.kubernetes.io/component: database
  app.kubernetes.io/part-of: data-platform
  app.kubernetes.io/managed-by: flux
  environment: production
  tier: data
  data-classification: restricted
  compliance-framework: gdpr,sox,pci-dss,iso-27001

commonAnnotations:
  samcloud.online/owner: "data-platform-team"
  samcloud.online/cost-center: "data-platform"
  samcloud.online/business-unit: "engineering"
  samcloud.online/backup-required: "true"
  samcloud.online/encryption-required: "true"
  samcloud.online/audit-logging: "enabled"
  samcloud.online/compliance-frameworks: "gdpr,sox,pci-dss,iso-27001"
  samcloud.online/data-retention: "7-years"
  samcloud.online/disaster-recovery: "enabled"
  samcloud.online/monitoring: "enhanced"
  samcloud.online/security-level: "restricted"
