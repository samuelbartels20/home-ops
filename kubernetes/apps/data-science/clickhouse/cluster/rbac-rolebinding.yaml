---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clickhouse-role-binding
  namespace: data-science
  labels:
    app.kubernetes.io/name: clickhouse
    security.samcloud.online/level: "restricted"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: clickhouse-role
subjects:
  - kind: ServiceAccount
    name: clickhouse-service-account
    namespace: data-science 