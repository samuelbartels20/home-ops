---
# Pod Disruption Budget for High Availability
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: clickhouse-pdb
  namespace: data-science
  labels:
    app.kubernetes.io/name: clickhouse
    security.samcloud.online/level: "restricted"
spec:
  minAvailable: 50%
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse 