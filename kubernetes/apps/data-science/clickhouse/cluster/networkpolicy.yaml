---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickhouse-cluster-netpol
  namespace: data-science
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from Superset
    - from:
        - namespaceSelector:
            matchLabels:
              name: data-science
          podSelector:
            matchLabels:
              app.kubernetes.io/name: superset
      ports:
        - protocol: TCP
          port: 8123
        - protocol: TCP
          port: 9440  # HTTPS port

    # Allow traffic from Grafana for monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - protocol: TCP
          port: 8123
        - protocol: TCP
          port: 9440

    # Allow inter-cluster communication
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: clickhouse
      ports:
        - protocol: TCP
          port: 9000  # Native protocol
        - protocol: TCP
          port: 9009  # Inter-server HTTP
        - protocol: TCP
          port: 9019  # Inter-server HTTPS

    # Allow Prometheus monitoring
    - from:
        - namespaceSelector:
            matchLabels:
              name: observability
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - protocol: TCP
          port: 9363  # Metrics port

    # Allow backup operations
    - from:
        - namespaceSelector:
            matchLabels:
              name: clickhouse
          podSelector:
            matchLabels:
              app: clickhouse-backup
      ports:
        - protocol: TCP
          port: 8123
        - protocol: TCP
          port: 9440

  egress:
    # Allow DNS resolution
    - to: []
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Allow NTP synchronization
    - to: []
      ports:
        - protocol: UDP
          port: 123

    # Allow S3 backup to MinIO/TrueNAS
    - to:
        - namespaceSelector:
            matchLabels:
              name: storage
      ports:
        - protocol: TCP
          port: 9000  # MinIO API
        - protocol: TCP
          port: 9001  # MinIO Console

    # Allow inter-cluster communication
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: clickhouse
      ports:
        - protocol: TCP
          port: 9000
        - protocol: TCP
          port: 9009
        - protocol: TCP
          port: 9019

    # Allow HTTPS for external integrations
    - to: []
      ports:
        - protocol: TCP
          port: 443
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: clickhouse-operator-netpol
  namespace: clickhouse
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: clickhouse-operator
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow Kubernetes API access
    - from: []
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow Kubernetes API access
    - to: []
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443

    # Allow DNS
    - to: []
      ports:
        - protocol: UDP
          port: 53