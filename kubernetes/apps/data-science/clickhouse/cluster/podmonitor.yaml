---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: clickhouse-cluster
  namespace: data-science
  labels:
    app.kubernetes.io/name: clickhouse
    release: prometheus-operator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  podMetricsEndpoints:
    - port: metrics
      interval: 30s
      path: /metrics
      scheme: http
      scrapeTimeout: 10s
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: 'clickhouse_.*'
          action: keep
        - sourceLabels: [job]
          targetLabel: cluster
          replacement: 'production'
    - port: http
      interval: 60s
      path: /
      scheme: http
      params:
        query: ['SELECT * FROM system.metrics FORMAT Prometheus']
      scrapeTimeout: 30s
      metricRelabelings:
        - sourceLabels: [__name__]
          regex: 'ClickHouse.*'
          action: keep
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: clickhouse-cluster
  namespace: data-science
  labels:
    app.kubernetes.io/name: clickhouse
    release: prometheus-operator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
      scheme: http
      scrapeTimeout: 10s
    - port: http
      interval: 60s
      path: /
      scheme: http
      params:
        query: ['SELECT * FROM system.asynchronous_metrics FORMAT Prometheus']
      scrapeTimeout: 30s