---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: clickhouse-cluster-alerts
  namespace: data-science
  labels:
    app.kubernetes.io/name: clickhouse
    release: prometheus-operator
spec:
  groups:
    - name: clickhouse.cluster
      interval: 30s
      rules:
        # High-level cluster health
        - alert: ClickHouseClusterDown
          expr: up{job="clickhouse-cluster"} == 0
          for: 1m
          labels:
            severity: critical
            service: clickhouse
          annotations:
            summary: "ClickHouse cluster is down"
            description: "ClickHouse cluster {{ $labels.instance }} has been down for more than 1 minute"

        - alert: ClickHouseClusterReplicaDown
          expr: count(up{job="clickhouse-cluster"} == 1) < 4  # Expecting 6 replicas (3 shards x 2 replicas)
          for: 2m
          labels:
            severity: warning
            service: clickhouse
          annotations:
            summary: "ClickHouse cluster has insufficient replicas"
            description: "Only {{ $value }} ClickHouse replicas are running, expected 6"

    - name: clickhouse.performance
      interval: 30s
      rules:
        # Query performance
        - alert: ClickHouseSlowQueries
          expr: increase(clickhouse_query_duration_seconds_total[5m]) > 100
          for: 5m
          labels:
            severity: warning
            service: clickhouse
          annotations:
            summary: "ClickHouse has slow queries"
            description: "ClickHouse instance {{ $labels.instance }} has {{ $value }} slow queries in the last 5 minutes"

        - alert: ClickHouseHighQueryLoad
          expr: clickhouse_query_total_concurrent > 50
          for: 3m
          labels:
            severity: warning
            service: clickhouse
          annotations:
            summary: "ClickHouse high concurrent query load"
            description: "ClickHouse instance {{ $labels.instance }} has {{ $value }} concurrent queries"

        # Memory alerts
        - alert: ClickHouseHighMemoryUsage
          expr: (clickhouse_memory_usage_bytes / clickhouse_memory_available_bytes) > 0.85
          for: 2m
          labels:
            severity: warning
            service: clickhouse
          annotations:
            summary: "ClickHouse high memory usage"
            description: "ClickHouse instance {{ $labels.instance }} memory usage is {{ $value | humanizePercentage }}"

        - alert: ClickHouseCriticalMemoryUsage
          expr: (clickhouse_memory_usage_bytes / clickhouse_memory_available_bytes) > 0.95
          for: 1m
          labels:
            severity: critical
            service: clickhouse
          annotations:
            summary: "ClickHouse critical memory usage"
            description: "ClickHouse instance {{ $labels.instance }} memory usage is {{ $value | humanizePercentage }}"

    - name: clickhouse.storage
      interval: 60s
      rules:
        # Disk space alerts
        - alert: ClickHouseDiskSpaceHigh
          expr: (clickhouse_disk_available_bytes / clickhouse_disk_total_bytes) < 0.15
          for: 5m
          labels:
            severity: warning
            service: clickhouse
          annotations:
            summary: "ClickHouse disk space running low"
            description: "ClickHouse instance {{ $labels.instance }} has less than 15% disk space available"

        - alert: ClickHouseDiskSpaceCritical
          expr: (clickhouse_disk_available_bytes / clickhouse_disk_total_bytes) < 0.05
          for: 2m
          labels:
            severity: critical
            service: clickhouse
          annotations:
            summary: "ClickHouse disk space critically low"
            description: "ClickHouse instance {{ $labels.instance }} has less than 5% disk space available"

        # Replication alerts
        - alert: ClickHouseReplicationLag
          expr: clickhouse_replica_queue_size > 100
          for: 5m
          labels:
            severity: warning
            service: clickhouse
          annotations:
            summary: "ClickHouse replication lag detected"
            description: "ClickHouse replica {{ $labels.instance }} has {{ $value }} items in replication queue"

    - name: clickhouse.errors
      interval: 30s
      rules:
        # Error rate alerts
        - alert: ClickHouseHighErrorRate
          expr: rate(clickhouse_query_errors_total[5m]) > 0.1
          for: 3m
          labels:
            severity: warning
            service: clickhouse
          annotations:
            summary: "ClickHouse high error rate"
            description: "ClickHouse instance {{ $labels.instance }} has {{ $value | humanizePercentage }} error rate"

        - alert: ClickHouseConnectionFailures
          expr: rate(clickhouse_connection_failures_total[5m]) > 0.05
          for: 2m
          labels:
            severity: warning
            service: clickhouse
          annotations:
            summary: "ClickHouse connection failures"
            description: "ClickHouse instance {{ $labels.instance }} has {{ $value }} connection failures per second"

        # Security alerts
        - alert: ClickHouseUnauthorizedAccess
          expr: rate(clickhouse_authentication_failures_total[5m]) > 0.1
          for: 1m
          labels:
            severity: critical
            service: clickhouse
          annotations:
            summary: "ClickHouse unauthorized access attempts"
            description: "ClickHouse instance {{ $labels.instance }} has {{ $value }} authentication failures per second"

    - name: clickhouse.backup
      interval: 3600s  # Check hourly
      rules:
        - alert: ClickHouseBackupFailed
          expr: increase(clickhouse_backup_failures_total[24h]) > 0
          for: 30m
          labels:
            severity: critical
            service: clickhouse
          annotations:
            summary: "ClickHouse backup failed"
            description: "ClickHouse backup has failed {{ $value }} times in the last 24 hours"

        - alert: ClickHouseBackupOld
          expr: time() - clickhouse_last_successful_backup_timestamp > 86400  # 24 hours
          for: 1h
          labels:
            severity: warning
            service: clickhouse
          annotations:
            summary: "ClickHouse backup is old"
            description: "ClickHouse last successful backup was {{ $value | humanizeDuration }} ago"

    - name: clickhouse.security
      interval: 60s
      rules:
        - alert: ClickHouseTLSCertificateExpiring
          expr: (clickhouse_tls_certificate_expiry_timestamp - time()) / 86400 < 30
          for: 1h
          labels:
            severity: warning
            service: clickhouse
          annotations:
            summary: "ClickHouse TLS certificate expiring"
            description: "ClickHouse TLS certificate expires in {{ $value }} days"

        - alert: ClickHouseTLSCertificateExpired
          expr: clickhouse_tls_certificate_expiry_timestamp < time()
          for: 1m
          labels:
            severity: critical
            service: clickhouse
          annotations:
            summary: "ClickHouse TLS certificate expired"
            description: "ClickHouse TLS certificate has expired"