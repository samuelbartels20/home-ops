---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app clickhouse-backup
  namespace: &namespace data-science
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: clickhouse-cluster
      namespace: *namespace
    - name: rook-ceph-cluster
      namespace: storage
  interval: 1h
  path: ./kubernetes/apps/data-science/clickhouse/backup/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false