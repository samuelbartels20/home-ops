---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-backup-scripts
  namespace: data-science
data:
  manual-backup.sh: |
    #!/bin/bash
    set -e

    BACKUP_NAME="manual-$(date +%Y-%m-%d-%H%M%S)"
    echo "Creating manual backup: $BACKUP_NAME"

    # Create local backup
    clickhouse-backup create "$BACKUP_NAME"

    # Upload to S3
    clickhouse-backup upload "$BACKUP_NAME"

    echo "Manual backup completed: $BACKUP_NAME"

  emergency-restore.sh: |
    #!/bin/bash
    set -e

    if [ -z "$1" ]; then
      echo "Usage: $0 <backup_name>"
      echo "Available backups:"
      clickhouse-backup list remote
      exit 1
    fi

    BACKUP_NAME="$1"
    echo "Starting emergency restore from backup: $BACKUP_NAME"

    # Download backup
    clickhouse-backup download "$BACKUP_NAME"

    # Stop ClickHouse gracefully (if needed)
    echo "Stopping ClickHouse..."
    # kubectl scale statefulset clickhouse-cluster --replicas=0

    # Restore data
    clickhouse-backup restore "$BACKUP_NAME"

    # Start ClickHouse
    echo "Starting ClickHouse..."
    # kubectl scale statefulset clickhouse-cluster --replicas=6

    echo "Emergency restore completed from: $BACKUP_NAME"

  # Backup verification script
  verify-backup.sh: |
    #!/bin/bash
    set -e

    if [ -z "$1" ]; then
      echo "Usage: $0 <backup_name>"
      echo "Available backups:"
      clickhouse-backup list remote
      exit 1
    fi

    BACKUP_NAME="$1"
    echo "Verifying backup: $BACKUP_NAME"

    # Download and verify
    clickhouse-backup download "$BACKUP_NAME"

    # Check backup metadata
    clickhouse-backup list local | grep "$BACKUP_NAME"

    # Clean up
    clickhouse-backup delete local "$BACKUP_NAME"

    echo "Backup verification successful: $BACKUP_NAME"

  # Database migration script
  migrate-database.sh: |
    #!/bin/bash
    set -e

    SOURCE_DB="$1"
    TARGET_DB="$2"

    if [ -z "$SOURCE_DB" ] || [ -z "$TARGET_DB" ]; then
      echo "Usage: $0 <source_database> <target_database>"
      exit 1
    fi

    echo "Migrating database from $SOURCE_DB to $TARGET_DB"

    # Create backup of specific database
    clickhouse-backup create "migration-$SOURCE_DB-$(date +%Y%m%d%H%M%S)" --tables "$SOURCE_DB.*"

    # Upload backup
    clickhouse-backup upload "migration-$SOURCE_DB-$(date +%Y%m%d%H%M%S)"

    echo "Database migration backup completed"

  # S3 bucket setup
  setup-s3-bucket.sh: |
    #!/bin/bash
    set -e

    echo "Setting up S3 bucket for ClickHouse backups..."

    # Install mc (MinIO client) if not present
    if ! command -v mc &> /dev/null; then
      wget https://dl.min.io/client/mc/release/linux-amd64/mc
      chmod +x mc
    fi

    # Configure MinIO connection
    mc alias set minio http://192.168.8.102:9000 $S3_ACCESS_KEY $S3_SECRET_KEY

    # Create bucket if it doesn't exist
    mc mb minio/clickhouse-backups --ignore-existing

    # Set lifecycle policy (optional)
    cat > lifecycle.json << EOF
    {
      "Rules": [
        {
          "ID": "clickhouse-backup-lifecycle",
          "Status": "Enabled",
          "Expiration": {
            "Days": 90
          }
        }
      ]
    }
    EOF

    mc ilm set minio/clickhouse-backups < lifecycle.json

    echo "S3 bucket setup completed"

  # Health check script
  health-check.sh: |
    #!/bin/bash

    echo "ClickHouse Backup Health Check"
    echo "=============================="

    # Check ClickHouse connectivity
    echo "1. Checking ClickHouse connectivity..."
    if clickhouse-client --host $CLICKHOUSE_HOST --port $CLICKHOUSE_PORT --user $CLICKHOUSE_USERNAME --password $CLICKHOUSE_PASSWORD --query "SELECT 1"; then
      echo "[PASS] ClickHouse connection successful"
    else
      echo "[FAIL] ClickHouse connection failed"
      exit 1
    fi

    # Check S3 connectivity
    echo "2. Checking S3 connectivity..."
    if clickhouse-backup list remote > /dev/null 2>&1; then
      echo "[PASS] S3 connection successful"
    else
      echo "[FAIL] S3 connection failed"
      exit 1
    fi

    # Check recent backups
    echo "3. Checking recent backups..."
    RECENT_BACKUPS=$(clickhouse-backup list remote | head -5)
    if [ -n "$RECENT_BACKUPS" ]; then
      echo "[PASS] Recent backups found:"
      echo "$RECENT_BACKUPS"
    else
      echo "[WARNING] No recent backups found"
    fi

    # Check disk space
    echo "4. Checking disk space..."
    df -h /var/lib/clickhouse-backup

    echo "Health check completed"