---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: superset-secrets
  namespace: data-science
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: superset-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Database connection for metadata storage (PostgreSQL)
        DATABASE_URL: "postgresql://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASS }}@postgres-lb.storage.svc.cluster.local:5432/superset"
        SQLALCHEMY_DATABASE_URI: "postgresql://{{ .POSTGRES_USER }}:{{ .POSTGRES_PASS }}@postgres-lb.storage.svc.cluster.local:5432/superset"

        # Superset secret key for sessions and security
        SECRET_KEY: "{{ .SUPERSET_SECRET_KEY }}"
        SUPERSET_SECRET_KEY: "{{ .SUPERSET_SECRET_KEY }}"

        # Admin user configuration
        ADMIN_USERNAME: "{{ .ADMIN_USERNAME }}"
        ADMIN_PASSWORD: "{{ .ADMIN_PASSWORD }}"
        ADMIN_EMAIL: "{{ .ADMIN_EMAIL }}"
        ADMIN_FIRSTNAME: "{{ .ADMIN_FIRSTNAME }}"
        ADMIN_LASTNAME: "{{ .ADMIN_LASTNAME }}"

        # ClickHouse connection credentials
        CLICKHOUSE_HOST: "clickhouse-cluster.clickhouse.svc.cluster.local"
        CLICKHOUSE_PORT: "8123"
        CLICKHOUSE_USER: "{{ .CLICKHOUSE_USER }}"
        CLICKHOUSE_PASSWORD: "{{ .CLICKHOUSE_PASS }}"
        CLICKHOUSE_DATABASE: "default"
        CLICKHOUSE_URL: "clickhouse://{{ .CLICKHOUSE_USER }}:{{ .CLICKHOUSE_PASS }}@clickhouse-cluster.clickhouse.svc.cluster.local:8123/default"

        # Druid connection credentials
        DRUID_HOST: "druid-router.data-science.svc.cluster.local"
        DRUID_PORT: "8888"
        DRUID_USER: "{{ .DRUID_USER }}"
        DRUID_PASSWORD: "{{ .DRUID_PASS }}"
        DRUID_URL: "druid://{{ .DRUID_USER }}:{{ .DRUID_PASS }}@druid-router.data-science.svc.cluster.local:8888/druid/v2/sql"

        # Redis configuration for caching and Celery
        REDIS_HOST: "dragonfly.storage.svc.cluster.local"
        REDIS_PORT: "6379"
        REDIS_DB_CACHE: "1"
        REDIS_DB_CELERY: "0"
        REDIS_PASSWORD: "{{ .REDIS_PASSWORD }}"
        REDIS_URL: "redis://dragonfly.storage.svc.cluster.local:6379/0"
        CACHE_REDIS_URL: "redis://dragonfly.storage.svc.cluster.local:6379/1"

        # LDAP/OAuth integration
        LDAP_BIND_USER: "uid=superset,ou=people,dc=home,dc=arpa"
        LDAP_BIND_PASSWORD: "{{ .LDAP_BIND_PASSWORD }}"
        LDAP_SEARCH_BASE: "ou=people,dc=home,dc=arpa"
        LDAP_USER_FILTER: "uid={0}"
        LDAP_ADMIN_GROUP: "cn=superset-admin,ou=groups,dc=home,dc=arpa"

        # OAuth2/OpenID Connect
        OAUTH_CLIENT_ID: "{{ .OAUTH_CLIENT_ID }}"
        OAUTH_CLIENT_SECRET: "{{ .OAUTH_CLIENT_SECRET }}"
        OAUTH_DISCOVERY_URL: "https://auth.samcloud.online/.well-known/openid_configuration"

        # SMTP configuration for alerts and notifications
        SMTP_HOST: "smtp-relay.security.svc.cluster.local"
        SMTP_PORT: "25"
        SMTP_STARTTLS: "false"
        SMTP_SSL: "false"
        SMTP_USER: ""
        SMTP_PASSWORD: ""
        SMTP_MAIL_FROM: "superset@samcloud.online"

        # S3 configuration for exports and file uploads
        S3_ENDPOINT: "http://minio.storage.svc.cluster.local:9000"
        S3_BUCKET: "superset-uploads"
        S3_ACCESS_KEY: "{{ .S3_ACCESS_KEY }}"
        S3_SECRET_KEY: "{{ .S3_SECRET_KEY }}"

        # Security and compliance
        CSP_DEFAULT_SRC: "'self' 'unsafe-inline' 'unsafe-eval' data: blob:"
        CSP_SCRIPT_SRC: "'self' 'unsafe-inline' 'unsafe-eval'"
        CSP_STYLE_SRC: "'self' 'unsafe-inline'"
        CSP_IMG_SRC: "'self' data: blob:"

        # Feature flags
        FEATURE_FLAGS: |
          {
            "DASHBOARD_NATIVE_FILTERS": true,
            "DASHBOARD_CROSS_FILTERS": true,
            "DASHBOARD_RBAC": true,
            "ENABLE_TEMPLATE_PROCESSING": true,
            "GENERIC_CHART_AXES": true,
            "DASHBOARD_CACHE": true,
            "REMOVE_SLICE_LEVEL_LABEL_COLORS": true,
            "SIP_38_VIZ_REARCHITECTURE": true,
            "TAGGING_SYSTEM": true,
            "ENABLE_ADVANCED_DATA_TYPES": true,
            "DRILL_TO_DETAIL": true,
            "DRILL_BY": true,
            "HORIZONTAL_FILTER_BAR": true,
            "ALERT_REPORTS": true
          }

        # TLS certificates
        TLS_CERT: "{{ .SUPERSET_TLS_CERT }}"
        TLS_KEY: "{{ .SUPERSET_TLS_KEY }}"
        CA_CERT: "{{ .SUPERSET_CA_CERT }}"

  dataFrom:
    - extract:
        key: superset
    - extract:
        key: cloudnative-pg
    - extract:
        key: clickhouse
    - extract:
        key: druid
    - extract:
        key: s3-credentials