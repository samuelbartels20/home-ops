---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: superset-server-tls
  namespace: data-science
spec:
  secretName: superset-server-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "superset.samcloud.online"
  dnsNames:
    - "superset.samcloud.online"
    - "superset.data-science.svc.cluster.local"
    - "localhost"
  ipAddresses:
    - "127.0.0.1"
  usages:
    - digital signature
    - key encipherment
    - server auth
    - client auth