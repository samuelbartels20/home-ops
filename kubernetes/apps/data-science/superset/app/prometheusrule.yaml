---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: superset-alerts
  namespace: data-science
  labels:
    app.kubernetes.io/name: superset
    release: prometheus-operator
spec:
  groups:
    - name: superset.availability
      rules:
        - alert: SupersetDown
          expr: up{job=~".*superset.*"} == 0
          for: 2m
          labels:
            severity: critical
            component: superset
          annotations:
            summary: "Superset is down"
            description: "Superset has been down for more than 2 minutes. BI platform is unavailable."

        - alert: SupersetWorkerDown
          expr: up{job=~".*superset-worker.*"} == 0
          for: 3m
          labels:
            severity: warning
            component: superset
            service: worker
          annotations:
            summary: "Superset worker is down"
            description: "Superset worker has been down for more than 3 minutes. Background tasks may be delayed."

        - alert: SupersetCeleryBeatDown
          expr: up{job=~".*superset-celery-beat.*"} == 0
          for: 3m
          labels:
            severity: warning
            component: superset
            service: celery-beat
          annotations:
            summary: "Superset Celery Beat is down"
            description: "Superset Celery Beat has been down for more than 3 minutes. Scheduled tasks are not running."

    - name: superset.performance
      rules:
        - alert: SupersetHighResponseTime
          expr: histogram_quantile(0.95, rate(superset_http_request_duration_seconds_bucket[5m])) > 5
          for: 5m
          labels:
            severity: warning
            component: superset
          annotations:
            summary: "High Superset response time"
            description: "95th percentile response time is {{ $value }}s for 5 minutes."

        - alert: SupersetHighErrorRate
          expr: |
            (
              rate(superset_http_requests_total{status=~"5.."}[5m])
              /
              rate(superset_http_requests_total[5m])
            ) * 100 > 5
          for: 3m
          labels:
            severity: warning
            component: superset
          annotations:
            summary: "High Superset error rate"
            description: "HTTP 5xx error rate is {{ $value | humanizePercentage }} over 5 minutes."

        - alert: SupersetDashboardLoadFailures
          expr: rate(superset_dashboard_load_failures_total[10m]) > 0.1
          for: 5m
          labels:
            severity: warning
            component: superset
          annotations:
            summary: "High dashboard load failures"
            description: "Dashboard load failure rate is {{ $value }} per second over 10 minutes."

        - alert: SupersetQueryTimeout
          expr: rate(superset_query_timeout_total[10m]) > 0.05
          for: 5m
          labels:
            severity: warning
            component: superset
          annotations:
            summary: "High query timeout rate"
            description: "Query timeout rate is {{ $value }} per second over 10 minutes."

    - name: superset.resources
      rules:
        - alert: SupersetHighMemoryUsage
          expr: |
            (
              container_memory_working_set_bytes{namespace="data-science", container=~".*superset.*"}
              /
              container_spec_memory_limit_bytes{namespace="data-science", container=~".*superset.*"}
            ) * 100 > 85
          for: 5m
          labels:
            severity: warning
            component: superset
          annotations:
            summary: "High memory usage in Superset"
            description: "Memory usage is {{ $value | humanizePercentage }} for {{ $labels.container }} container."

        - alert: SupersetHighCPUUsage
          expr: |
            (
              rate(container_cpu_usage_seconds_total{namespace="data-science", container=~".*superset.*"}[5m])
              /
              container_spec_cpu_quota{namespace="data-science", container=~".*superset.*"} * 100000
            ) * 100 > 80
          for: 10m
          labels:
            severity: warning
            component: superset
          annotations:
            summary: "High CPU usage in Superset"
            description: "CPU usage is {{ $value | humanizePercentage }} for {{ $labels.container }} container."

        - alert: SupersetGunicornWorkerIssues
          expr: superset_gunicorn_workers_active < superset_gunicorn_workers_total * 0.5
          for: 5m
          labels:
            severity: warning
            component: superset
          annotations:
            summary: "Superset Gunicorn worker issues"
            description: "Only {{ $value }} Gunicorn workers are active out of {{ superset_gunicorn_workers_total }}."

    - name: superset.database
      rules:
        - alert: SupersetDatabaseConnectionFailure
          expr: superset_database_connection_failures_total > 0
          for: 2m
          labels:
            severity: critical
            component: superset
          annotations:
            summary: "Superset database connection failure"
            description: "{{ $value }} database connection failures detected in 2 minutes."

        - alert: SupersetMetadataDBHighConnections
          expr: superset_metadata_db_connections_active > superset_metadata_db_connections_max * 0.8
          for: 5m
          labels:
            severity: warning
            component: superset
          annotations:
            summary: "High metadata database connections"
            description: "Active connections ({{ $value }}) are approaching the limit."

        - alert: SupersetSlowQueries
          expr: histogram_quantile(0.95, rate(superset_query_duration_seconds_bucket[5m])) > 60
          for: 5m
          labels:
            severity: warning
            component: superset
          annotations:
            summary: "Slow Superset queries"
            description: "95th percentile query duration is {{ $value }}s for 5 minutes."

    - name: superset.cache
      rules:
        - alert: SupersetCacheConnectionFailure
          expr: superset_cache_connection_failures_total > 0
          for: 2m
          labels:
            severity: warning
            component: superset
          annotations:
            summary: "Superset cache connection failure"
            description: "{{ $value }} cache connection failures detected in 2 minutes."

        - alert: SupersetLowCacheHitRate
          expr: |
            (
              rate(superset_cache_hits_total[10m])
              /
              (rate(superset_cache_hits_total[10m]) + rate(superset_cache_misses_total[10m]))
            ) * 100 < 70
          for: 10m
          labels:
            severity: warning
            component: superset
          annotations:
            summary: "Low Superset cache hit rate"
            description: "Cache hit rate is {{ $value | humanizePercentage }} over 10 minutes."

    - name: superset.celery
      rules:
        - alert: SupersetCeleryQueueBacklog
          expr: superset_celery_queue_length > 50
          for: 5m
          labels:
            severity: warning
            component: superset
            service: celery
          annotations:
            summary: "Superset Celery queue backlog"
            description: "Celery queue has {{ $value }} pending tasks for 5 minutes."

        - alert: SupersetCeleryTaskFailures
          expr: rate(superset_celery_task_failures_total[10m]) > 0.1
          for: 5m
          labels:
            severity: warning
            component: superset
            service: celery
          annotations:
            summary: "High Celery task failure rate"
            description: "Celery task failure rate is {{ $value }} per second over 10 minutes."

        - alert: SupersetCeleryWorkerIdle
          expr: superset_celery_workers_active == 0
          for: 10m
          labels:
            severity: warning
            component: superset
            service: celery
          annotations:
            summary: "No active Celery workers"
            description: "No Celery workers have been active for 10 minutes."

    - name: superset.security
      rules:
        - alert: SupersetAuthenticationFailures
          expr: rate(superset_authentication_failures_total[5m]) > 1
          for: 3m
          labels:
            severity: warning
            component: superset
            category: security
          annotations:
            summary: "High authentication failure rate"
            description: "Authentication failure rate is {{ $value }} per second over 5 minutes."

        - alert: SupersetUnauthorizedAccess
          expr: rate(superset_http_requests_total{status="403"}[5m]) > 0.5
          for: 3m
          labels:
            severity: warning
            component: superset
            category: security
          annotations:
            summary: "High unauthorized access attempts"
            description: "HTTP 403 rate is {{ $value }} per second over 5 minutes."

        - alert: SupersetSuspiciousActivity
          expr: rate(superset_sql_injection_attempts_total[5m]) > 0
          for: 1m
          labels:
            severity: critical
            component: superset
            category: security
          annotations:
            summary: "SQL injection attempts detected"
            description: "{{ $value }} SQL injection attempts detected per second over 5 minutes."

    - name: superset.alerts
      rules:
        - alert: SupersetAlertDeliveryFailure
          expr: rate(superset_alert_delivery_failures_total[10m]) > 0
          for: 5m
          labels:
            severity: warning
            component: superset
            service: alerts
          annotations:
            summary: "Superset alert delivery failures"
            description: "{{ $value }} alert delivery failures per second over 10 minutes."

        - alert: SupersetReportGenerationFailure
          expr: rate(superset_report_generation_failures_total[10m]) > 0
          for: 5m
          labels:
            severity: warning
            component: superset
            service: reports
          annotations:
            summary: "Superset report generation failures"
            description: "{{ $value }} report generation failures per second over 10 minutes."