---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app superset
  namespace: &namespace data-science
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: clickhouse-cluster
      namespace: clickhouse
    - name: cloudnative-pg
      namespace: storage
  interval: 30m
  path: ./kubernetes/apps/services/data-science/superset/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false