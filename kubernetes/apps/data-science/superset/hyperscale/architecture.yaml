---
# Hyperscale Superset for Big Tech Companies
apiVersion: v1
kind: ConfigMap
metadata:
  name: superset-architecture
  namespace: data-science
  labels:
    app.kubernetes.io/name: superset
    app.kubernetes.io/component: architecture
    app.kubernetes.io/part-of: data-science
data:
  architecture.yaml: |
    components:
      webserver:
        replicas: 5
        resources:
          limits:
            cpu: 4
            memory: 8Gi
          requests:
            cpu: 2
            memory: 4Gi

      worker:
        replicas: 10
        resources:
          limits:
            cpu: 8
            memory: 16Gi
          requests:
            cpu: 4
            memory: 8Gi

      scheduler:
        replicas: 3
        resources:
          limits:
            cpu: 2
            memory: 4Gi
          requests:
            cpu: 1
            memory: 2Gi

    database:
      type: postgresql
      version: "14"
      ha: true
      backup:
        enabled: true
        schedule: "0 2 * * *"
        retention: 30d

    redis:
      mode: cluster
      nodes: 6
      persistence: true

    security:
      authentication:
        type: oauth2
        provider: keycloak
      authorization:
        enabled: true
        backend: sql
      audit:
        enabled: true
        retention: 90d
      encryption:
        enabled: true
        algorithm: AES-256-GCM

  hyperscale-architecture.yaml: |
    # Superset Hyperscale Architecture
    # Supporting 10,000+ concurrent users, 15PB datasets

    # Multi-tier deployment strategy
    web_tier:
      # Geographic distribution
      regions:
        region_1:
          replicas: 50
          resources:
            cpu: "16"
            memory: "32Gi"
            storage: "1Ti"
          gunicorn_config:
            workers: 32
            worker_class: "gevent"
            worker_connections: 1000
            max_requests: 10000
            max_requests_jitter: 1000
            timeout: 300
            keepalive: 10
            preload_app: true

        region_2:
          replicas: 50
          resources:
            cpu: "16"
            memory: "32Gi"
            storage: "1Ti"

        region_3:
          replicas: 30
          resources:
            cpu: "16"
            memory: "32Gi"
            storage: "1Ti"

        region_4:
          replicas: 20
          resources:
            cpu: "16"
            memory: "32Gi"
            storage: "1Ti"

    # Dedicated processing tier for heavy analytics
    analytics_tier:
      sql_lab_workers:
        replicas: 100
        resources:
          cpu: "32"
          memory: "128Gi"
          storage: "5Ti"
        specialization: "sql_execution"
        queue_assignment: "sql_lab"

      dashboard_workers:
        replicas: 50
        resources:
          cpu: "16"
          memory: "64Gi"
          storage: "2Ti"
        specialization: "dashboard_rendering"
        queue_assignment: "dashboard"

      report_workers:
        replicas: 30
        resources:
          cpu: "24"
          memory: "96Gi"
          storage: "3Ti"
        specialization: "report_generation"
        queue_assignment: "reports"

    # Cache tier for performance
    cache_architecture:
      # L1: Redis Cluster for session and metadata
      redis_cluster:
        nodes: 12
        resources_per_node:
          cpu: "8"
          memory: "32Gi"
          storage: "1Ti"
        configuration:
          maxmemory: "28gb"
          maxmemory_policy: "allkeys-lru"
          cluster_enabled: true
          cluster_config_file: "nodes.conf"
          cluster_node_timeout: 15000
          appendonly: true
          save: "900 1 300 10 60 10000"

      # L2: Distributed cache for query results
      distributed_cache:
        type: "redis_sentinel"
        sentinels: 6
        redis_masters: 3
        resources_per_master:
          cpu: "16"
          memory: "64Gi"
          storage: "2Ti"
        cache_strategies:
          dashboard_cache_timeout: 86400  # 24 hours
          chart_cache_timeout: 3600      # 1 hour
          dataset_cache_timeout: 1800    # 30 minutes
          sql_lab_cache_timeout: 300     # 5 minutes

  performance-optimizations.yaml: |
    # Performance optimizations for 15PB datasets
    database_optimization:
      # Connection pooling per data source
      clickhouse_pool:
        pool_size: 100
        max_overflow: 200
        pool_timeout: 30
        pool_recycle: 3600
        pool_pre_ping: true
        engine_options:
          pool_reset_on_return: "commit"
          isolation_level: "READ_COMMITTED"

      druid_pool:
        pool_size: 50
        max_overflow: 100
        pool_timeout: 30
        pool_recycle: 3600

      postgres_pool:
        pool_size: 50
        max_overflow: 100
        pool_timeout: 30
        pool_recycle: 1800

    # Query optimization for large datasets
    query_optimization:
      # Async query execution
      async_queries:
        enabled: true
        global_async_queries: true
        redis_results_db: 2
        redis_results_key_prefix: "superset_async_query:"
        jwt_secret: "async-queries-secret"

      # Query result limits
      result_limits:
        default_limit: 50000
        max_limit: 1000000
        sql_lab_limit: 100000

      # Query timeout settings
      timeouts:
        sync_query_timeout: 300     # 5 minutes
        async_query_timeout: 3600   # 1 hour
        sql_lab_timeout: 1800       # 30 minutes
        celery_task_timeout: 7200   # 2 hours

    # Frontend optimizations
    frontend_optimization:
      # Chunk loading and code splitting
      webpack_config:
        optimization:
          splitChunks:
            chunks: "all"
            maxSize: 244000
            cacheGroups:
              vendor:
                test: "/node_modules/"
                name: "vendors"
                chunks: "all"
              common:
                minChunks: 2
                chunks: "all"
                enforce: true

      # Resource compression
      compression:
        enabled: true
        algorithm: "gzip"
        level: 6
        threshold: 1024

      # CDN configuration
      cdn:
        static_assets_url: "https://cdn.local"
        image_proxy_url: "https://imageproxy.local"

  security-hardening.yaml: |
    # Enterprise security for big tech scale
    authentication:
      # Multi-provider authentication
      providers:
        oidc:
          enabled: true
          provider_name: "Corporate SSO"
          client_id: "superset-production"
          discovery_url: "https://sso.local/.well-known/openid_configuration"
          scopes: ["openid", "profile", "email", "groups"]

        ldap:
          enabled: true
          server_uri: "ldaps://ldap.local:636"
          search_base: "ou=people,dc=local"
          bind_user_dn: "cn=superset,ou=service-accounts,dc=local"
          user_filter: "(uid={0})"
          group_filter: "(memberUid={0})"

        saml:
          enabled: true
          metadata_url: "https://sso.local/saml/metadata"
          attribute_mapping:
            email: "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/emailaddress"
            first_name: "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/givenname"
            last_name: "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/surname"

    authorization:
      # Role-based access control
      rbac:
        enabled: true
        roles:
          admin:
            permissions: ["all"]
            row_level_security: false

          analyst:
            permissions: ["dashboard_read", "chart_read", "dataset_read", "sql_lab"]
            row_level_security: true
            rls_filters:
              - table: "events"
                clause: "user_department = '{{current_user.department}}'"

          viewer:
            permissions: ["dashboard_read", "chart_read"]
            row_level_security: true

          data_scientist:
            permissions: ["dashboard_read", "chart_read", "dataset_read", "sql_lab", "chart_write"]
            row_level_security: false

    data_governance:
      # Data classification and compliance
      classification:
        pii_detection: true
        sensitive_data_masking: true
        data_lineage: true

      compliance:
        gdpr:
          enabled: true
          right_to_be_forgotten: true
          data_retention_policy: "7_years"

        sox:
          enabled: true
          audit_logging: "comprehensive"
          change_tracking: true

        hipaa:
          enabled: false

      # Query monitoring and auditing
      audit:
        query_logging: true
        access_logging: true
        data_export_tracking: true
        dashboard_view_tracking: true

  monitoring-alerting.yaml: |
    # Comprehensive monitoring for hyperscale deployment
    metrics:
      # Application metrics
      application:
        - name: "request_duration_seconds"
          type: "histogram"
          description: "HTTP request duration in seconds"
          buckets: [0.1, 0.5, 1.0, 5.0, 10.0, 30.0, 60.0]

        - name: "concurrent_users"
          type: "gauge"
          description: "Number of concurrent active users"

        - name: "query_execution_time"
          type: "histogram"
          description: "Database query execution time"
          buckets: [0.1, 1.0, 5.0, 10.0, 30.0, 60.0, 300.0]

        - name: "cache_hit_ratio"
          type: "gauge"
          description: "Cache hit ratio percentage"

        - name: "active_sql_lab_queries"
          type: "gauge"
          description: "Number of active SQL Lab queries"

      # Infrastructure metrics
      infrastructure:
        - name: "pod_memory_usage"
          type: "gauge"
          description: "Pod memory usage in bytes"

        - name: "pod_cpu_usage"
          type: "gauge"
          description: "Pod CPU usage percentage"

        - name: "database_connection_pool_size"
          type: "gauge"
          description: "Database connection pool utilization"

    # Alerting rules for production issues
    alerts:
      critical:
        - name: "SupersetServiceDown"
          condition: "up{job='superset'} == 0"
          duration: "1m"
          severity: "critical"

        - name: "HighErrorRate"
          condition: "rate(superset_http_requests_total{status=~'5..'}[5m]) > 0.1"
          duration: "2m"
          severity: "critical"

        - name: "DatabaseConnectionFailure"
          condition: "superset_database_connection_failures_total > 0"
          duration: "30s"
          severity: "critical"

      warning:
        - name: "HighResponseTime"
          condition: "histogram_quantile(0.95, rate(superset_request_duration_seconds_bucket[5m])) > 10"
          duration: "5m"
          severity: "warning"

        - name: "HighConcurrentUsers"
          condition: "superset_concurrent_users > 8000"
          duration: "10m"
          severity: "warning"

        - name: "LowCacheHitRate"
          condition: "superset_cache_hit_ratio < 0.7"
          duration: "15m"
          severity: "warning"