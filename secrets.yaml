


service:
  main:
    controller: main
    type: LoadBalancer
    annotations:
      prometheus.io/scrape: "true"
      prometheus.io/port: "9127"
      prometheus.io/path: "/metrics"
      # Cilium LoadBalancer annotations for bare metal
      io.cilium/lb-ipam-ips: "192.168.1.100"
      # HAProxy health check annotations
      haproxy.org/check: "true"
      haproxy.org/check-interval: "10s"
      haproxy.org/load-balance: "leastconn"
      haproxy.org/timeout-server: "3600s"
      # Cilium optimizations
      service.cilium.io/global: "true"
    ports:
      postgresql:
        port: 5432
        targetPort: 5432
        protocol: TCP
      admin:
        port: 6432
        targetPort: 6432
        protocol: TCP
      metrics:
        port: 9127
        targetPort: 9127
        protocol: TCP
    # Optimize for bare metal performance
    externalTrafficPolicy: Local
    sessionAffinity: ClientIP
    sessionAffinityConfig:
      clientIP:
        timeoutSeconds: 3600